<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PDF差替えツール</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1f1f1f;
      color: white;
      overflow: hidden;
      touch-action: manipulation;
    }

    .topbar {
      height: 60px;
      background: #2d2d2d;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #444;
    }

    .topbar button,
    .topbar input {
      height: 40px;
      border-radius: 10px;
      border: none;
      padding: 0 12px;
      font-size: 14px;
    }

    .topbar button {
      background: #3b82f6;
      color: white;
      font-weight: bold;
    }

    .container {
      display: flex;
      height: calc(100vh - 60px);
    }

    .panel {
      width: 50%;
      border-right: 1px solid #444;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-header {
      background: #303030;
      padding: 10px;
      border-bottom: 1px solid #444;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .thumbs {
      overflow-y: auto;
      flex: 1;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .page-card {
      background: #2b2b2b;
      border-radius: 14px;
      overflow: hidden;
      border: 3px solid transparent;
      position: relative;
      transition: 0.2s;
    }

    .page-card.selected {
      border-color: #3b82f6;
    }

    .page-card.changed {
      border-color: #ef4444;
    }

    .page-card canvas {
      width: 100%;
      display: block;
      background: white;
    }

    .page-number {
      padding: 8px;
      text-align: center;
      font-size: 13px;
    }

    .actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mini-btn {
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 11px;
    }

    .status {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 1000;
      display: none;
    }

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }

      .panel {
        width: 100%;
        height: 50%;
      }
    }
  </style>
</head>
<body>

<div class="topbar">
  <input type="file" id="leftFile" accept="application/pdf">
  <input type="file" id="rightFile" accept="application/pdf">

  <button onclick="replaceSelectedPages('leftToRight')">左→右 差替え</button>
  <button onclick="replaceSelectedPages('rightToLeft')">右→左 差替え</button>
  <button onclick="exportPdf()">PDF出力</button>
</div>

<div class="container">
  <div class="panel">
    <div class="panel-header">
      <span>左PDF（旧版）</span>
      <span id="leftInfo">未読込</span>
    </div>
    <div class="thumbs" id="leftThumbs"></div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>右PDF（新版）</span>
      <span id="rightInfo">未読込</span>
    </div>
    <div class="thumbs" id="rightThumbs"></div>
  </div>
</div>

<div class="status" id="status"></div>

<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

  const leftThumbs = document.getElementById('leftThumbs');
  const rightThumbs = document.getElementById('rightThumbs');

  let leftPdf = null;
  let rightPdf = null;

  let leftBytes = null;
  let rightBytes = null;

  let leftSelected = new Set();
  let rightSelected = new Set();

  document.getElementById('leftFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    leftBytes = await file.arrayBuffer();
    leftPdf = await pdfjsLib.getDocument({ data: leftBytes }).promise;

    document.getElementById('leftInfo').innerText = `${file.name} (${leftPdf.numPages}P)`;

    renderPdf(leftPdf, leftThumbs, 'left');
  });

  document.getElementById('rightFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    rightBytes = await file.arrayBuffer();
    rightPdf = await pdfjsLib.getDocument({ data: rightBytes }).promise;

    document.getElementById('rightInfo').innerText = `${file.name} (${rightPdf.numPages}P)`;

    renderPdf(rightPdf, rightThumbs, 'right');
  });

  async function renderPdf(pdf, container, side) {
    container.innerHTML = '';

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);

      const viewport = page.getViewport({ scale: 0.25 });

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({
        canvasContext: ctx,
        viewport
      }).promise;

      const card = document.createElement('div');
      card.className = 'page-card';

      card.innerHTML = `
        <div class="actions">
          <button class="mini-btn">P${i}</button>
        </div>
      `;

      card.appendChild(canvas);

      const num = document.createElement('div');
      num.className = 'page-number';
      num.innerText = `ページ ${i}`;

      card.appendChild(num);

      card.addEventListener('click', () => {
        card.classList.toggle('selected');

        if (side === 'left') {
          if (leftSelected.has(i)) {
            leftSelected.delete(i);
          } else {
            leftSelected.add(i);
          }
        } else {
          if (rightSelected.has(i)) {
            rightSelected.delete(i);
          } else {
            rightSelected.add(i);
          }
        }
      });

      container.appendChild(card);
    }
  }

  window.replaceSelectedPages = async function(direction) {
    if (!leftBytes || !rightBytes) {
      showStatus('左右のPDFを読み込んで下さい');
      return;
    }

    const leftDoc = await PDFLib.PDFDocument.load(leftBytes);
    const rightDoc = await PDFLib.PDFDocument.load(rightBytes);

    if (direction === 'leftToRight') {
      const pages = [...leftSelected];

      for (const pageNum of pages) {
        const copiedPages = await rightDoc.copyPages(leftDoc, [pageNum - 1]);
        const copiedPage = copiedPages[0];

        rightDoc.removePage(pageNum - 1);
        rightDoc.insertPage(pageNum - 1, copiedPage);
      }

      rightBytes = await rightDoc.save();
      rightPdf = await pdfjsLib.getDocument({ data: rightBytes }).promise;

      renderPdf(rightPdf, rightThumbs, 'right');

      showStatus('左→右 差替え完了');
    }

    if (direction === 'rightToLeft') {
      const pages = [...rightSelected];

      for (const pageNum of pages) {
        const copiedPages = await leftDoc.copyPages(rightDoc, [pageNum - 1]);
        const copiedPage = copiedPages[0];

        leftDoc.removePage(pageNum - 1);
        leftDoc.insertPage(pageNum - 1, copiedPage);
      }

      leftBytes = await leftDoc.save();
      leftPdf = await pdfjsLib.getDocument({ data: leftBytes }).promise;

      renderPdf(leftPdf, leftThumbs, 'left');

      showStatus('右→左 差替え完了');
    }
  }

  window.exportPdf = async function() {
    if (!rightBytes) {
      showStatus('右PDFがありません');
      return;
    }

    const blob = new Blob([rightBytes], {
      type: 'application/pdf'
    });

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `差替え後_${Date.now()}.pdf`;

    a.click();

    showStatus('PDFを書き出しました');
  }

  function showStatus(message) {
    const el = document.getElementById('status');

    el.innerText = message;
    el.style.display = 'block';

    clearTimeout(window.statusTimer);

    window.statusTimer = setTimeout(() => {
      el.style.display = 'none';
    }, 2000);
  }
</script>

</body>
</html>
