<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DXF View v1</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--sb-bg:#0f1318;--topbar-bg:#0f1318;
  --accent:#2ecc71;--accent-2:#f39c12;
  --text:#e0e0e0;--text-dim:#888;--border:#2a3040;
}
body{display:flex;flex-direction:column;width:100vw;height:100vh;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-size:14px}
.topbar{height:54px;min-height:54px;background:var(--topbar-bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;padding:0 10px;position:relative;z-index:10;flex-shrink:0}
.logo-block{display:flex;flex-direction:column;flex:1;min-width:0;padding:0 6px}
.lb-name{font-size:16px;font-weight:700;color:var(--accent);line-height:1.2;white-space:nowrap}
.lb-sub{font-size:10px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{width:44px;height:44px;border-radius:10px;flex-shrink:0;border:1px solid var(--border);
  background:transparent;color:var(--text);font-size:20px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tb-btn:active{background:rgba(255,255,255,.1)}
#settingsBtn{border-color:var(--accent);color:var(--accent);font-size:22px}
.tb-sep{width:1px;height:26px;background:var(--border);margin:0 3px;flex-shrink:0}
.tb-tool-btn{width:44px;height:44px;border-radius:9px;flex-shrink:0;border:1.5px solid transparent;background:transparent;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tb-tool-btn:active{background:rgba(255,255,255,.1)}
.tb-tool-btn.active{background:rgba(46,204,113,.15);border-color:var(--accent);color:var(--accent)}

.color-dot{width:22px;height:22px;border-radius:50%;display:block;border:2.5px solid rgba(255,255,255,.45)}
.stage{flex:1;position:relative;overflow:hidden;background:#000;min-height:0}
#cv,#ov{position:absolute;top:0;left:0;width:100%;height:100%}
#ov{pointer-events:all;cursor:crosshair;touch-action:none}
#noDrawingMsg{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;gap:14px}
#noDrawingMsg svg{opacity:.22}
.nd-text{color:#2e3f56;font-family:monospace;font-size:13px;letter-spacing:3px;font-weight:bold}
.btbar{display:none;position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  display:flex;align-items:stretch;gap:4px;
  background:rgba(10,14,20,.92);border:1px solid rgba(42,48,64,.9);border-radius:20px;
  padding:8px 10px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 4px 24px rgba(0,0,0,.55);z-index:100}
.btbar-group{display:flex;gap:2px}
.btbar-sep{width:1px;background:var(--border);margin:4px 6px;border-radius:1px}
.bt-btn{width:62px;height:52px;border-radius:13px;border:1.5px solid transparent;
  background:transparent;color:var(--text);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  -webkit-tap-highlight-color:transparent;flex-shrink:0}
.bt-btn:active{background:rgba(255,255,255,.12)}
.bt-btn.active{background:rgba(46,204,113,.15);border-color:var(--accent)}
.bt-icon{font-size:20px;line-height:1}
.bt-label{font-size:10px;color:var(--text-dim);line-height:1}
.bt-btn.active .bt-label,.bt-btn.active .bt-icon{color:var(--accent)}
.viewmemo{position:absolute;top:10px;right:10px;z-index:100;
  display:grid;grid-template-columns:auto auto;gap:4px}
.viewmemo button{height:38px;padding:0 12px;font-size:12px;border:1px solid var(--border);
  border-radius:8px;background:rgba(10,14,20,.88);color:var(--text);cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  -webkit-tap-highlight-color:transparent;white-space:nowrap}
.viewmemo .mem-btn{background:rgba(30,36,50,.75);color:#555;border-color:#333;font-weight:normal}
.viewmemo .show-btn{background:rgba(30,36,50,.75);color:#555;border-color:#333;font-weight:normal}
.viewmemo .mem-btn.vm-saved{background:rgba(243,156,18,.88);color:#000;border-color:var(--accent-2);font-weight:600;box-shadow:0 0 8px rgba(243,156,18,.35)}
.viewmemo .show-btn.vm-saved{background:rgba(46,204,113,.88);color:#000;border-color:var(--accent);font-weight:600;box-shadow:0 0 7px rgba(46,204,113,.3)}
.viewmemo .full-row{grid-column:1/-1;text-align:center}
#snap-hint{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.82);color:var(--accent);font-size:12px;
  padding:6px 14px;border-radius:8px;pointer-events:none;display:none}
#settingsOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:299}
body.settings-open #settingsOverlay{display:block}
#settingsPanel{position:fixed;left:0;top:0;bottom:0;width:300px;max-width:80vw;
  background:var(--sb-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;
  overflow-y:auto;z-index:300;transform:translateX(-110%);
  transition:transform .26s cubic-bezier(.4,0,.2,1)}
body.settings-open #settingsPanel{transform:translateX(0)}
.sp-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--sb-bg);z-index:1;flex-shrink:0}
.sp-title{font-size:17px;font-weight:600;color:var(--accent)}
.sp-close{width:36px;height:36px;border-radius:18px;border:1px solid var(--border);
  background:transparent;color:var(--text);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
#openFileBtnMain{display:flex;align-items:center;gap:12px;margin:14px 16px;padding:14px 16px;
  background:rgba(46,204,113,.08);border:1.5px solid var(--accent);border-radius:12px;
  color:var(--accent);font-size:15px;cursor:pointer;text-align:left;width:calc(100% - 32px);
  -webkit-tap-highlight-color:transparent}
#openFileBtnMain:active{background:rgba(46,204,113,.18)}
.sp-file-icon{font-size:26px;flex-shrink:0}
.sp-section{padding:12px 16px;border-top:1px solid var(--border)}
.sp-label{font-size:11px;color:var(--text-dim);margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.sp-row{display:flex;gap:8px;align-items:center}
.sp-toggle-btn{flex:1;padding:10px;border-radius:9px;font-size:14px;border:1.5px solid var(--border);
  background:transparent;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
.sp-toggle-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(46,204,113,.1)}
.sp-input{width:100%;padding:10px 12px;border-radius:9px;font-size:16px;
  background:#1a1f26;border:1px solid var(--border);color:var(--text)}
.sp-page-btn{width:44px;height:44px;border-radius:9px;font-size:18px;
  border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
.sp-page-info{flex:1;text-align:center;color:var(--text-dim);font-size:15px}
.sp-action-btn{width:100%;padding:12px;border-radius:9px;font-size:14px;
  border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;text-align:center;
  -webkit-tap-highlight-color:transparent}
.sp-action-btn:active{background:rgba(255,255,255,.07)}
.sp-danger-btn{width:100%;padding:12px;border-radius:9px;font-size:14px;font-weight:600;
  border:1.5px solid #c0392b;background:rgba(192,57,43,.1);color:#e74c3c;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.sp-danger-btn:active{background:rgba(192,57,43,.22)}
#ver-label{font-size:11px;color:var(--text-dim);text-align:center;padding:16px;margin-top:auto}
#colorOverlay{display:none;position:fixed;z-index:400;top:62px;right:10px;
  background:var(--sb-bg);border:1px solid var(--border);border-radius:16px;
  padding:16px;min-width:200px;box-shadow:0 8px 32px rgba(0,0,0,.65);flex-direction:column;gap:14px}
#colorOverlay.open{display:flex}
.co-label{font-size:11px;color:var(--text-dim);margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.co-colors{display:flex;gap:8px}
.color-btn{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.color-btn.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.co-lw{display:flex;gap:8px}
.lw-btn{flex:1;height:44px;border-radius:9px;font-size:15px;font-weight:600;
  border:1.5px solid var(--border);background:transparent;color:var(--text);cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.lw-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(46,204,113,.1)}
#layerModal{display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.7);align-items:center;justify-content:center}
#layerModal.open{display:flex}
.modal-box{background:var(--sb-bg);border:1px solid var(--border);border-radius:16px;
  padding:20px;min-width:300px;max-width:460px;max-height:80vh;display:flex;flex-direction:column;gap:10px}
.modal-box h3{color:var(--accent);font-size:16px}
#layerList{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px}
.layer-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.layer-row input[type=checkbox]{accent-color:var(--accent);width:20px;height:20px}
.layer-color-box{width:16px;height:16px;border-radius:3px;border:1px solid #555;flex-shrink:0}
.modal-close-btn{padding:12px;border-radius:9px;font-size:15px;
  border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
@media (max-width:768px){.bt-btn{width:54px;height:50px}.lb-sub{display:none}}
@supports (padding-bottom:env(safe-area-inset-bottom)){
  .btbar{bottom:calc(22px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>

<div class="topbar">
  <button class="tb-btn" id="settingsBtn" title="設定">☰</button>
  <div class="logo-block">
    <span class="lb-name">DXF_View</span>
    <span class="lb-sub">DXF / PDF をブラウザで閲覧</span>
  </div>
  <div class="tb-sep"></div>
  <button class="tb-tool-btn tool-btn active" data-tool="sketch" title="スケッチ">✏</button>
  <button class="tb-tool-btn tool-btn" data-tool="dx" title="水平寸法"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="4" x2="2" y2="16"/><line x1="18" y1="4" x2="18" y2="16"/><line x1="2" y1="10" x2="18" y2="10"/><polyline points="6,7 2,10 6,13"/><polyline points="14,7 18,10 14,13"/></svg></button>
  <button class="tb-tool-btn tool-btn" data-tool="dy" title="垂直寸法"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="2" x2="16" y2="2"/><line x1="4" y1="18" x2="16" y2="18"/><line x1="10" y1="2" x2="10" y2="18"/><polyline points="7,6 10,2 13,6"/><polyline points="7,14 10,18 13,14"/></svg></button>
  <button class="tb-tool-btn tool-btn" data-tool="diag" title="斜め寸法"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="16" x2="16" y2="4"/><polyline points="4,10 4,16 10,16"/><polyline points="10,4 16,4 16,10"/></svg></button>
  <button class="tb-tool-btn tool-btn" data-tool="eraser" title="消しゴム"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="16" height="9" rx="2"/><rect x="2" y="7" width="8" height="9" rx="2" fill="currentColor" fill-opacity="0.25" stroke="none"/><line x1="10" y1="7" x2="10" y2="16"/><line x1="2" y1="16" x2="18" y2="16" stroke-opacity="0.5"/></svg></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="undoBtn" title="戻す（2本指タップでも可）" style="font-size:18px">↩</button>
  <button class="tb-btn" id="colorIndicatorBtn" title="カラー・線幅">
    <span class="color-dot" id="colorDot" style="background:#f00"></span>
  </button>
  <button class="tb-btn" id="savePDFBtn" title="PDF保存" style="font-size:17px">💾</button>
  <button class="tb-btn" id="fullscreenBtn" title="全画面" style="font-size:18px">⛶</button>
</div>

<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <canvas id="ov"></canvas>
  <div id="noDrawingMsg">
    <svg width="72" height="68" viewBox="0 0 72 68" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="4" width="68" height="46" rx="3" stroke="#4a6080" stroke-width="2.5"/>
      <line x1="2" y1="19" x2="70" y2="19" stroke="#4a6080" stroke-width="1.5"/>
      <line x1="2" y1="34" x2="70" y2="34" stroke="#4a6080" stroke-width="1.5"/>
      <line x1="20" y1="4" x2="20" y2="50" stroke="#4a6080" stroke-width="1.5"/>
      <line x1="38" y1="4" x2="38" y2="50" stroke="#4a6080" stroke-width="1.5"/>
      <line x1="56" y1="4" x2="56" y2="50" stroke="#4a6080" stroke-width="1.5"/>
      <rect x="27" y="50" width="18" height="8" fill="#4a6080"/>
      <rect x="17" y="58" width="38" height="6" rx="2" fill="#4a6080"/>
    </svg>
    <span class="nd-text">NO DRAWING LOADED</span>
  </div>
  <div class="viewmemo" id="viewmemo">
    <button class="full-row" id="fitBtn">全体</button>
    <button class="mem-btn" data-vi="0">記憶</button><button class="show-btn" data-vs="0">表示</button>
    <button class="mem-btn" data-vi="1">記憶</button><button class="show-btn" data-vs="1">表示</button>
    <button class="mem-btn" data-vi="2">記憶</button><button class="show-btn" data-vs="2">表示</button>
  </div>
  <div id="snap-hint"></div>
</div>

<div id="settingsOverlay"></div>
<div id="settingsPanel">
  <div class="sp-header">
    <span class="sp-title">設定</span>
    <button class="sp-close" id="settingsClose">✕</button>
  </div>
  <button id="openFileBtnMain">
    <span class="sp-file-icon">📂</span>
    <span>ファイルを開く<br><small style="font-size:12px;opacity:.7">DXF / PDF 対応</small></span>
  </button>
  <div class="sp-section">
    <div class="sp-label">白・黒画面</div>
    <div class="sp-row">
      <button class="sp-toggle-btn active" id="bwBlack">■ 黒</button>
      <button class="sp-toggle-btn" id="bwWhite">□ 白</button>
    </div>
  </div>
  <div class="sp-section">
    <div class="sp-label">縮尺分母</div>
    <input type="number" id="scaleDenom" value="1" min="1" class="sp-input">
  </div>
  <div class="sp-section" id="pdfPageCtrl" style="display:none">
    <div class="sp-label">ページ</div>
    <div class="sp-row">
      <button id="prevPage" class="sp-page-btn">◀</button>
      <span id="pageInfo" class="sp-page-info">1/1</span>
      <button id="nextPage" class="sp-page-btn">▶</button>
    </div>
  </div>
  <div class="sp-section">
    <button id="layerBtn" class="sp-action-btn">レイヤ設定</button>
  </div>
  <div class="sp-section">
    <div class="sp-label">DXF情報</div>
    <div class="info-box" id="infoBox" style="font-size:12px;color:#888;background:#0a0c10;border:1px solid #2a3040;border-radius:8px;padding:8px;min-height:44px;line-height:1.6">ファイルを開いてください</div>
  </div>
  <div class="sp-section" style="display:flex;flex-direction:column;gap:8px">
    <button id="rangeAreaPDFBtn" class="sp-action-btn">範囲PDF保存</button>
    <button id="clearBtn" class="sp-danger-btn">全消去</button>
  </div>
  <div id="ver-label">DXF_View V0_08</div>
</div>

<div id="colorOverlay">
  <div>
    <div class="co-label">カラー</div>
    <div class="co-colors">
      <button class="color-btn active" data-color="255,0,0" style="background:#f00" title="赤"></button>
      <button class="color-btn" data-color="255,140,0" style="background:#f80" title="橙"></button>
      <button class="color-btn" data-color="0,200,0" style="background:#0c8" title="緑"></button>
      <button class="color-btn" data-color="0,120,255" style="background:#08f" title="青"></button>
      <button class="color-btn" data-color="255,0,180" style="background:#f0b" title="ピンク"></button>
    </div>
  </div>
  <div>
    <div class="co-label">線幅</div>
    <div class="co-lw">
      <button class="lw-btn active" data-lw="1">細</button>
      <button class="lw-btn" data-lw="2.5">中</button>
      <button class="lw-btn" data-lw="5">太</button>
    </div>
  </div>
</div>

<div id="layerModal">
  <div class="modal-box">
    <h3>レイヤ設定</h3>
    <div id="layerList"></div>
    <button class="modal-close-btn" id="layerClose">閉じる</button>
  </div>
</div>

<input type="file" id="file" hidden>

<script>
// =========================================================
// PDF.js worker
// =========================================================
if(typeof pdfjsLib!=='undefined'){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// =========================================================
// グローバル状態
// =========================================================
const cv=document.getElementById('cv');
const ov=document.getElementById('ov');
const stage=document.getElementById('stage');
const ctx=cv.getContext('2d');
const octx=ov.getContext('2d');

let doc=null;
let currentFileName='';
let tx=0,ty=0,scale=1;
let bwMode=false;
let scaleDenom=1;
let currentTool='sketch';
let currentColor={r:255,g:0,b:0};
let currentLW=1;
let dims=[];
let strokes=[];
let images=[];
let savedViews=[null,null,null];
let hiddenLayers=new Set();
let pdfDoc=null,pdfPageNum=1;
let pdfImage=null;
let snapPt=null;
let dimState={pts:[]};
let sketching=false,sketchPts=[];
let eraserPos=null;
let selectedImage=null;
let dragImageStart=null;
let rafId=null;
let needDraw=false,needOverlay=false;
let isPen=false;
let mouseDown=false,lastMX=0,lastMY=0,panning=false;
let pinchDist=null,pinchMid=null;
const ERASER_RADIUS_PX=20;

// =========================================================
// ACI カラーテーブル
// =========================================================
function aci(n){
  if(n<=0||n===256) return {r:255,g:255,b:255};
  const t=[null,[255,0,0],[255,255,0],[0,255,0],[0,255,255],[0,0,255],[255,0,255],[255,255,255],[128,128,128],[192,192,192]];
  if(n>=1&&n<=9&&t[n]) return {r:t[n][0],g:t[n][1],b:t[n][2]};
  if(n>=250&&n<=255){const gs=[51,102,153,204,228,255];const g=gs[n-250];return {r:g,g:g,b:g};}
  const hi=Math.floor((n-10)/10);
  const lo=(n-10)%10;
  const hue=(hi*30)%360;
  const sat=lo<5?1.0-lo*0.15:0.25+(lo-5)*0.15;
  const val=lo<5?1.0:1.0-(lo-5)*0.1;
  return hsvToRgb(hue,sat,val);
}
function hsvToRgb(h,s,v){
  const i=Math.floor(h/60)%6;
  const f=h/60-Math.floor(h/60);
  const p=v*(1-s),q=v*(1-f*s),t2=v*(1-(1-f)*s);
  let r,g,b;
  if(i===0){r=v;g=t2;b=p}else if(i===1){r=q;g=v;b=p}
  else if(i===2){r=p;g=v;b=t2}else if(i===3){r=p;g=q;b=v}
  else if(i===4){r=t2;g=p;b=v}else{r=v;g=p;b=q}
  return {r:Math.round(r*255),g:Math.round(g*255),b:Math.round(b*255)};
}

// =========================================================
// DXF パーサ
// =========================================================
function decodeDXF(buf){
  const head=new Uint8Array(buf,0,Math.min(20,buf.byteLength));
  if(head[0]===65&&head[1]===117&&head[2]===116)
    throw new Error('バイナリDXF形式は非対応です。ASCII DXFで保存してください。');
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){}
  return new TextDecoder('shift_jis').decode(buf);
}

function parseDXF(buf){
  const text=decodeDXF(buf);
  const lines=text.split(/\r?\n/);
  const P=[];
  for(let i=0;i<lines.length-1;i+=2){
    const code=parseInt(lines[i].trim());
    if(!isNaN(code)) P.push([code,lines[i+1].trimEnd()]);
  }

  const out={
    ver:'',sen:[],enko:[],ten:[],moji:[],solid:[],sunpou:[],
    usedLayers:{},header:{},layerMap:{},ltypeMap:{},blockMap:{}
  };

  let si=0;
  function findSection(name){
    for(let i=0;i<P.length-1;i++){
      if(P[i][0]===0&&P[i][1]==='SECTION'&&P[i+1][0]===2&&P[i+1][1]===name) return i+2;
    }
    return -1;
  }

  // HEADER
  const hsi=findSection('HEADER');
  if(hsi>=0){
    si=hsi;
    let curVar='';
    while(si<P.length){
      const[c,v]=P[si++];
      if(c===0&&v==='ENDSEC') break;
      if(c===9) curVar=v;
      else if(curVar==='$INSUNITS'&&c===70) out.header.insunits=parseInt(v);
      else if(curVar==='$DIMSCALE'&&c===40) out.header.dimscale=parseFloat(v);
      else if(curVar==='$ACADVER'&&c===1) out.ver=v;
    }
  }

  // TABLES
  const tsi=findSection('TABLES');
  if(tsi>=0){
    si=tsi;
    while(si<P.length){
      const[c,v]=P[si];
      if(c===0&&v==='ENDSEC') break;
      if(c===0&&v==='LAYER'){
        si++;
        let lname='',lcolor=7,lltype='CONTINUOUS';
        while(si<P.length){
          const[lc,lv]=P[si];
          if(lc===0) break;
          si++;
          if(lc===2) lname=lv;
          else if(lc===62) lcolor=parseInt(lv);
          else if(lc===6) lltype=lv.toUpperCase();
        }
        out.layerMap[lname]={color:Math.abs(lcolor),ltype:lltype,visible:lcolor>=0};
      } else if(c===0&&v==='LTYPE'){
        si++;
        let ltname='';const pat=[];
        while(si<P.length){
          const[lc,lv]=P[si];
          if(lc===0) break;
          si++;
          if(lc===2) ltname=lv;
          else if(lc===49) pat.push(Math.abs(parseFloat(lv)));
        }
        out.ltypeMap[ltname.toUpperCase()]=pat;
      } else si++;
    }
  }

  // BLOCKS
  const bsi=findSection('BLOCKS');
  if(bsi>=0){
    si=bsi;
    let curBlock=null;
    while(si<P.length){
      const[c,v]=P[si];
      if(c===0&&v==='ENDSEC') break;
      if(c===0&&v==='BLOCK'){
        si++;
        let bname='',bx=0,by=0;
        while(si<P.length){
          const[bc,bv]=P[si];
          if(bc===0) break;
          si++;
          if(bc===2) bname=bv;
          else if(bc===10) bx=parseFloat(bv)||0;
          else if(bc===20) by=parseFloat(bv)||0;
        }
        curBlock={name:bname,ox:bx,oy:by,ents:[]};
        out.blockMap[bname]=curBlock;
      } else if(c===0&&v==='ENDBLK'){
        si++;curBlock=null;
      } else if(c===0&&curBlock){
        const r=convertOne(P,si,out.layerMap,out.ltypeMap,out.blockMap,0);
        curBlock.ents.push(...r);
        si=r._nextSi||si+1;
      } else si++;
    }
  }

  // ENTITIES
  const esi=findSection('ENTITIES');
  if(esi>=0){
    si=esi;
    while(si<P.length){
      const[c,v]=P[si];
      if(c===0&&v==='ENDSEC') break;
      if(c===0&&v==='POLYLINE'){
        si++;
        let plyLayer='0',plyColor=7,plyLtype='',plyLw=0.25,plyClosed=false;
        while(si<P.length){
          const[pc,pv]=P[si];
          if(pc===0) break;
          si++;
          if(pc===8) plyLayer=pv;
          else if(pc===62) plyColor=parseInt(pv);
          else if(pc===6) plyLtype=pv;
          else if(pc===70) plyClosed=!!(parseInt(pv)&1);
          else if(pc===370) plyLw=parseInt(pv)>0?parseInt(pv)/100:0.25;
        }
        const plyColorR=aci(Math.abs(plyColor));
        const plyDash=resolveDash({ltype:plyLtype,layer:plyLayer},out.layerMap,out.ltypeMap);
        const verts=[];
        while(si<P.length){
          const[vc,vv]=P[si];
          if(vc===0&&vv==='SEQEND'){si++;break;}
          if(vc===0&&vv==='VERTEX'){
            si++;
            let vx=0,vy=0,vbulge=0;
            while(si<P.length){
              const[vvc,vvv]=P[si];
              if(vvc===0) break;
              si++;
              if(vvc===10) vx=parseFloat(vvv)||0;
              else if(vvc===20) vy=parseFloat(vvv)||0;
              else if(vvc===42) vbulge=parseFloat(vvv)||0;
            }
            verts.push({x:vx,y:vy,bulge:vbulge});
          } else si++;
        }
        for(let vi=0;vi<verts.length-1;vi++){
          const p1=verts[vi],p2=verts[vi+1];
          if(Math.abs(p1.bulge)>1e-6){
            const sp=arcSegPts(p1.x,p1.y,p2.x,p2.y,p1.bulge);
            for(let j=0;j<sp.length-1;j++)
              out.sen.push({type:'sen',x1:sp[j].x,y1:sp[j].y,x2:sp[j+1].x,y2:sp[j+1].y,color:plyColorR,dash:plyDash,layer:plyLayer,lw:plyLw});
          } else {
            out.sen.push({type:'sen',x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,color:plyColorR,dash:plyDash,layer:plyLayer,lw:plyLw});
          }
        }
        if(plyClosed&&verts.length>1){
          const p1=verts[verts.length-1],p2=verts[0];
          out.sen.push({type:'sen',x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,color:plyColorR,dash:plyDash,layer:plyLayer,lw:plyLw});
        }
      } else if(c===0){
        const r=convertOne(P,si,out.layerMap,out.ltypeMap,out.blockMap,0);
        r.forEach(e=>{
          if(e.type==='sen') out.sen.push(e);
          else if(e.type==='enko') out.enko.push(e);
          else if(e.type==='ten') out.ten.push(e);
          else if(e.type==='moji') out.moji.push(e);
          else if(e.type==='solid') out.solid.push(e);
        });
        si=r._nextSi||si+1;
      } else si++;
    }
  }

  [...out.sen,...out.enko,...out.ten,...out.moji,...out.solid].forEach(e=>{
    if(e.layer) out.usedLayers[e.layer]=true;
  });
  return out;
}

function resolveColor(attrs,layerMap){
  if(attrs.truecolor!==undefined){
    const c=attrs.truecolor;
    return {r:(c>>16)&0xff,g:(c>>8)&0xff,b:c&0xff};
  }
  const ac=attrs.aciColor;
  if(ac!==undefined&&ac!==256&&ac!==0) return aci(Math.abs(ac));
  if(ac===0) return {r:255,g:255,b:255};
  const ly=attrs.layer||'0';
  const linfo=layerMap[ly];
  if(linfo) return aci(linfo.color||7);
  return {r:255,g:255,b:255};
}

function resolveDash(attrs,layerMap,ltypeMap){
  let lt=(attrs.ltype||'').toUpperCase();
  if(!lt||lt==='BYLAYER'){
    const linfo=layerMap[attrs.layer||'0'];
    lt=linfo?(linfo.ltype||'CONTINUOUS'):'CONTINUOUS';
  }
  if(lt==='CONTINUOUS'||lt==='') return [];
  if(lt==='HIDDEN'||lt==='DASHED') return [8,4];
  if(lt==='CENTER') return [16,4,4,4];
  if(lt==='DASHDOT') return [12,4,2,4];
  if(lt==='PHANTOM') return [20,4,4,4,4,4];
  if(lt==='DOT') return [2,4];
  if(ltypeMap&&ltypeMap[lt]&&ltypeMap[lt].length>0) return ltypeMap[lt];
  return [];
}

function arcSegPts(x1,y1,x2,y2,bulge){
  const d=Math.sqrt((x2-x1)**2+(y2-y1)**2);
  if(d<1e-10) return [{x:x1,y:y1},{x:x2,y:y2}];
  const r=d*(1+bulge*bulge)/(4*Math.abs(bulge));
  const midx=(x1+x2)/2,midy=(y1+y2)/2;
  const nx=-(y2-y1)/d,ny=(x2-x1)/d;
  const s=(r-(d/2)*(bulge*bulge-1)/(2*bulge))/d;
  const cx=midx+nx*s*Math.sign(bulge)*(d/2);
  const cy=midy+ny*s*Math.sign(bulge)*(d/2);
  const a1=Math.atan2(y1-cy,x1-cx);
  const a2=Math.atan2(y2-cy,x2-cx);
  const segs=Math.max(8,Math.round(Math.abs(bulge)*20));
  let da=a2-a1;
  if(bulge>0&&da<0) da+=2*Math.PI;
  if(bulge<0&&da>0) da-=2*Math.PI;
  const pts=[];
  for(let i=0;i<=segs;i++){
    const a=a1+da*i/segs;
    pts.push({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)});
  }
  return pts;
}

function convertOne(P,si,layerMap,ltypeMap,blockMap,depth){
  const result=[];
  result._nextSi=si;
  if(si>=P.length) return result;
  const type=P[si][1];si++;
  const attrs={};const extras=[];
  while(si<P.length){
    const[c,v]=P[si];
    if(c===0) break;
    si++;
    if(c===8) attrs.layer=v;
    else if(c===6) attrs.ltype=v;
    else if(c===62) attrs.aciColor=parseInt(v);
    else if(c===420) attrs.truecolor=parseInt(v);
    else if(c===370) attrs.lw=parseInt(v);
    else extras.push([c,v]);
  }
  result._nextSi=si;
  const color=resolveColor(attrs,layerMap);
  const dash=resolveDash(attrs,layerMap,ltypeMap);
  const layer=attrs.layer||'0';
  const lw=attrs.lw&&attrs.lw>0?attrs.lw/100:0.25;
  function gv(code,def){for(const[c,v]of extras)if(c===code)return v;return def!==undefined?def:null;}
  function gf(code,def=0){const v=gv(code,null);return v!==null?(parseFloat(v)||def):def;}
  function gi(code,def=0){const v=gv(code,null);return v!==null?(parseInt(v)||def):def;}

  if(type==='LINE'){
    result.push({type:'sen',x1:gf(10),y1:gf(20),x2:gf(11),y2:gf(21),color,dash,layer,lw});
  } else if(type==='CIRCLE'){
    const cx=gf(10),cy=gf(20),r=gf(40);
    result.push({type:'enko',cx,cy,r,a1:0,a2:360,color,dash,layer,lw,tilt:0,rx:r,ry:r});
  } else if(type==='ARC'){
    result.push({type:'enko',cx:gf(10),cy:gf(20),r:gf(40),a1:gf(50),a2:gf(51),color,dash,layer,lw,tilt:0,rx:gf(40),ry:gf(40)});
  } else if(type==='ELLIPSE'){
    const cx=gf(10),cy=gf(20),mx=gf(11),my=gf(21);
    const ratio=gf(40,1);
    const rx=Math.sqrt(mx*mx+my*my);
    const ry=rx*ratio;
    const tilt=Math.atan2(my,mx)*180/Math.PI;
    const a1=gf(41)*180/Math.PI,a2r=gf(42);
    const a2=a2r?a2r*180/Math.PI:360;
    result.push({type:'enko',cx,cy,r:rx,a1,a2,color,dash,layer,lw,tilt,rx,ry});
  } else if(type==='POINT'){
    result.push({type:'ten',x:gf(10),y:gf(20),color,layer});
  } else if(type==='TEXT'||type==='ATTRIB'){
    result.push({type:'moji',x:gf(10),y:gf(20),text:gv(1,'')||'',h:gf(40,1),angle:gf(50,0),color,layer,widthFactor:gf(41,1)||1});
  } else if(type==='MTEXT'){
    let txt=gv(1,'')||'';
    txt=txt.replace(/\\[pP]/g,'\n').replace(/\{\\[^;]+;/g,'').replace(/\}/g,'').replace(/\\[A-Za-z][^;]*;/g,'').replace(/%%[cCdDpP]/g,'');
    result.push({type:'moji',x:gf(10),y:gf(20),text:txt,h:gf(40,1),angle:0,color,layer,widthFactor:1});
  } else if(type==='SOLID'||type==='TRACE'){
    const pts=[{x:gf(10),y:gf(20)},{x:gf(11),y:gf(21)},{x:gf(13),y:gf(23)},{x:gf(12),y:gf(22)}];
    result.push({type:'solid',pts,color,layer});
  } else if(type==='3DFACE'){
    const pts=[{x:gf(10),y:gf(20)},{x:gf(11),y:gf(21)},{x:gf(12),y:gf(22)},{x:gf(13),y:gf(23)}];
    result.push({type:'solid',pts,color,layer});
  } else if(type==='LWPOLYLINE'){
    const closed=gi(70,0)&1;
    const pts2=[];
    for(const[c,v]of extras){
      if(c===10) pts2.push({x:parseFloat(v)||0,y:0,bulge:0});
      else if(c===20&&pts2.length>0) pts2[pts2.length-1].y=parseFloat(v)||0;
      else if(c===42&&pts2.length>0) pts2[pts2.length-1].bulge=parseFloat(v)||0;
    }
    const n=pts2.length;
    for(let i=0;i<n-1;i++){
      const p1=pts2[i],p2=pts2[i+1];
      if(Math.abs(p1.bulge)>1e-6){
        const sp=arcSegPts(p1.x,p1.y,p2.x,p2.y,p1.bulge);
        for(let j=0;j<sp.length-1;j++)
          result.push({type:'sen',x1:sp[j].x,y1:sp[j].y,x2:sp[j+1].x,y2:sp[j+1].y,color,dash,layer,lw});
      } else {
        result.push({type:'sen',x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,color,dash,layer,lw});
      }
    }
    if(closed&&n>1){
      const p1=pts2[n-1],p2=pts2[0];
      if(Math.abs(p1.bulge)>1e-6){
        const sp=arcSegPts(p1.x,p1.y,p2.x,p2.y,p1.bulge);
        for(let j=0;j<sp.length-1;j++)
          result.push({type:'sen',x1:sp[j].x,y1:sp[j].y,x2:sp[j+1].x,y2:sp[j+1].y,color,dash,layer,lw});
      } else {
        result.push({type:'sen',x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,color,dash,layer,lw});
      }
    }
  } else if(type==='SPLINE'){
    const cpts=[];
    for(let i=0;i<extras.length-1;i++){
      if(extras[i][0]===10&&extras[i+1][0]===20)
        cpts.push({x:parseFloat(extras[i][1])||0,y:parseFloat(extras[i+1][1])||0});
    }
    for(let i=0;i<cpts.length-1;i++)
      result.push({type:'sen',x1:cpts[i].x,y1:cpts[i].y,x2:cpts[i+1].x,y2:cpts[i+1].y,color,dash,layer,lw});
  } else if(type==='LEADER'){
    const lpts=[];
    for(let i=0;i<extras.length-1;i++){
      if(extras[i][0]===10&&extras[i+1][0]===20)
        lpts.push({x:parseFloat(extras[i][1])||0,y:parseFloat(extras[i+1][1])||0});
    }
    for(let i=0;i<lpts.length-1;i++)
      result.push({type:'sen',x1:lpts[i].x,y1:lpts[i].y,x2:lpts[i+1].x,y2:lpts[i+1].y,color,dash,layer,lw});
  } else if(type==='INSERT'){
    if(depth<12){
      const bname=gv(2,'')||'';
      const ix=gf(10),iy=gf(20);
      const sx=gf(41,1)||1,sy=gf(42,1)||1;
      const rot=gf(50,0)*Math.PI/180;
      const block=blockMap[bname];
      if(block){
        const cos=Math.cos(rot),sin=Math.sin(rot);
        function transform(x,y){
          const lx=x-block.ox,ly=y-block.oy;
          return {x:ix+lx*sx*cos-ly*sy*sin,y:iy+lx*sx*sin+ly*sy*cos};
        }
        for(const e of block.ents){
          const ne=JSON.parse(JSON.stringify(e));
          if(ne.type==='sen'){
            const p1=transform(ne.x1,ne.y1),p2=transform(ne.x2,ne.y2);
            ne.x1=p1.x;ne.y1=p1.y;ne.x2=p2.x;ne.y2=p2.y;
          } else if(ne.type==='enko'){
            const p=transform(ne.cx,ne.cy);
            ne.cx=p.x;ne.cy=p.y;ne.rx*=sx;ne.ry*=sy;ne.r*=sx;ne.tilt+=rot*180/Math.PI;
          } else if(ne.type==='ten'||ne.type==='moji'){
            const p=transform(ne.x,ne.y);ne.x=p.x;ne.y=p.y;
          } else if(ne.type==='solid'){
            ne.pts=ne.pts.map(pt=>{const p=transform(pt.x,pt.y);return{x:p.x,y:p.y};});
          }
          result.push(ne);
        }
      }
    }
  } else if(type==='DIMENSION'){
    const bname=gv(2,'')||'';
    if(bname&&blockMap[bname]&&depth<12){
      for(const e of blockMap[bname].ents) result.push(JSON.parse(JSON.stringify(e)));
    }
  }
  return result;
}

// =========================================================
// ワールド <-> スクリーン変換
// =========================================================
function w2s(x,y){return [x*scale+tx,-y*scale+ty];}
function s2w(sx,sy){return [(sx-tx)/scale,-(sy-ty)/scale];}
function zoomAt(cx,cy,factor){tx=(tx-cx)*factor+cx;ty=(ty-cy)*factor+cy;scale*=factor;}

function rgbCss(c,darkBg){
  if(bwMode) return '#000';
  if(darkBg&&c.r<20&&c.g<20&&c.b<20) return '#ffffff';
  if(!darkBg&&c.r>235&&c.g>235&&c.b>235) return '#000000';
  return `rgb(${c.r},${c.g},${c.b})`;
}

// =========================================================
// BBox & Fit
// =========================================================
function computeBBox(){
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  function exp(x,y){if(x<minx)minx=x;if(y<miny)miny=y;if(x>maxx)maxx=x;if(y>maxy)maxy=y;}
  if(doc){
    for(const e of doc.sen){exp(e.x1,e.y1);exp(e.x2,e.y2);}
    for(const e of doc.enko){exp(e.cx-e.rx,e.cy-e.ry);exp(e.cx+e.rx,e.cy+e.ry);}
    for(const e of doc.ten){exp(e.x,e.y);}
    for(const e of doc.moji){exp(e.x,e.y);}
    for(const e of doc.solid){for(const p of e.pts)exp(p.x,p.y);}
  }
  if(pdfImage){exp(pdfImage.wx,pdfImage.wy);exp(pdfImage.wx+pdfImage.ww,pdfImage.wy-pdfImage.wh);}
  for(const img of images){exp(img.wx,img.wy);exp(img.wx+img.ww,img.wy-img.wh);}
  if(!isFinite(minx)) return {minx:0,miny:0,maxx:cv.width,maxy:cv.height};
  return {minx,miny,maxx,maxy};
}

function fit(){
  const bb=computeBBox();
  const W=cv.width,H=cv.height;
  const dw=bb.maxx-bb.minx,dh=bb.maxy-bb.miny;
  if(dw<1e-10||dh<1e-10){scale=1;tx=W/2;ty=H/2;return;}
  const s=Math.min(W*0.9/dw,H*0.9/dh);
  scale=s;
  tx=W/2-((bb.minx+bb.maxx)/2)*s;
  ty=H/2+((bb.miny+bb.maxy)/2)*s;
}

// =========================================================
// 描画
// =========================================================
function scheduleDraw(){needDraw=true;needOverlay=true;if(!rafId)rafId=requestAnimationFrame(rafLoop);}
function scheduleOverlay(){needOverlay=true;if(!rafId)rafId=requestAnimationFrame(rafLoop);}
function rafLoop(){
  rafId=null;
  if(needDraw){draw();needDraw=false;}
  if(needOverlay){drawOverlay();needOverlay=false;}
}

function draw(){
  const W=cv.width,H=cv.height;
  const darkBg=!bwMode;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=bwMode?'#ffffff':'#1e2430';
  ctx.fillRect(0,0,W,H);
  if(!doc&&!pdfImage) return;
  if(pdfImage){
    const[sx,sy]=w2s(pdfImage.wx,pdfImage.wy);
    ctx.drawImage(pdfImage.img,sx,sy,pdfImage.ww*scale,pdfImage.wh*scale);
  }
  if(!doc) return;
  // Solids
  for(const e of doc.solid){
    if(hiddenLayers.has(e.layer)) continue;
    const pts=e.pts.filter(p=>isFinite(p.x)&&isFinite(p.y));
    if(pts.length<3) continue;
    ctx.beginPath();
    const[sx0,sy0]=w2s(pts[0].x,pts[0].y);ctx.moveTo(sx0,sy0);
    for(let i=1;i<pts.length;i++){const[sx,sy]=w2s(pts[i].x,pts[i].y);ctx.lineTo(sx,sy);}
    ctx.closePath();
    ctx.fillStyle=bwMode?'#cccccc':rgbCss(e.color,darkBg);ctx.fill();
  }
  // Lines
  for(const e of doc.sen){
    if(hiddenLayers.has(e.layer)) continue;
    const[sx1,sy1]=w2s(e.x1,e.y1);const[sx2,sy2]=w2s(e.x2,e.y2);
    ctx.beginPath();
    ctx.strokeStyle=bwMode?'#000000':rgbCss(e.color,darkBg);
    ctx.lineWidth=Math.max(0.5,e.lw*scale);
    ctx.setLineDash(e.dash&&e.dash.length>0?e.dash.map(d=>d*scale):[]);
    ctx.moveTo(sx1,sy1);ctx.lineTo(sx2,sy2);ctx.stroke();
  }
  // Arcs
  for(const e of doc.enko){
    if(hiddenLayers.has(e.layer)) continue;
    ctx.beginPath();
    ctx.strokeStyle=bwMode?'#000000':rgbCss(e.color,darkBg);
    ctx.lineWidth=Math.max(0.5,e.lw*scale);
    ctx.setLineDash(e.dash&&e.dash.length>0?e.dash.map(d=>d*scale):[]);
    drawArc(ctx,e);ctx.stroke();
  }
  ctx.setLineDash([]);
  // Points
  for(const e of doc.ten){
    if(hiddenLayers.has(e.layer)) continue;
    const[sx,sy]=w2s(e.x,e.y);
    ctx.beginPath();ctx.arc(sx,sy,3,0,Math.PI*2);
    ctx.fillStyle=bwMode?'#000000':rgbCss(e.color,darkBg);ctx.fill();
  }
  // Text
  for(const e of doc.moji){
    if(hiddenLayers.has(e.layer)) continue;
    drawText(ctx,e,darkBg);
  }
}

function drawArc(ctx,e){
  const[sx,sy]=w2s(e.cx,e.cy);
  if(Math.abs(e.tilt)<0.01&&Math.abs(e.rx-e.ry)<0.01){
    const rs=e.r*scale;
    if(Math.abs(e.a2-e.a1-360)<0.01||(e.a1===0&&e.a2===360)){
      ctx.arc(sx,sy,rs,0,Math.PI*2);
    } else {
      const a1=e.a1*Math.PI/180,a2=e.a2*Math.PI/180;
      ctx.arc(sx,sy,rs,-a1,-a2,e.a1>e.a2);
    }
  } else {
    ctx.save();ctx.translate(sx,sy);ctx.rotate(-e.tilt*Math.PI/180);
    const rx=e.rx*scale,ry=e.ry*scale;
    let a1=e.a1*Math.PI/180,a2=e.a2*Math.PI/180;
    if(Math.abs(e.a2-e.a1-360)<0.01) a2=a1+Math.PI*2;
    ctx.ellipse(0,0,rx,ry,0,-a1,-a2,a1>a2);
    ctx.restore();
  }
}

function drawText(ctx,e,darkBg){
  if(!e.text||!e.text.trim()) return;
  const[sx,sy]=w2s(e.x,e.y);
  const fs=Math.max(6,e.h*scale);
  ctx.save();
  ctx.translate(sx,sy);ctx.rotate(-e.angle*Math.PI/180);
  if(e.widthFactor&&Math.abs(e.widthFactor-1)>0.01) ctx.scale(e.widthFactor,1);
  ctx.font=`${fs}px sans-serif`;
  ctx.fillStyle=bwMode?'#000000':rgbCss(e.color,darkBg);
  ctx.textBaseline='alphabetic';
  const lines=e.text.split('\n');
  for(let i=0;i<lines.length;i++) ctx.fillText(lines[i],0,-fs*i);
  ctx.restore();
}

function drawOverlay(){
  const W=ov.width,H=ov.height;
  octx.clearRect(0,0,W,H);
  // Images
  for(const img of images){
    const[sx,sy]=w2s(img.wx,img.wy);
    octx.drawImage(img.img,sx,sy,img.ww*scale,img.wh*scale);
    if(img===selectedImage){
      octx.strokeStyle='#2ecc71';octx.lineWidth=2;octx.setLineDash([4,4]);
      octx.strokeRect(sx,sy,img.ww*scale,img.wh*scale);
      octx.setLineDash([]);
      const hw=8;
      [[sx,sy],[sx+img.ww*scale,sy],[sx,sy+img.wh*scale],[sx+img.ww*scale,sy+img.wh*scale]].forEach(([hx,hy])=>{
        octx.fillStyle='#f39c12';octx.fillRect(hx-hw/2,hy-hw/2,hw,hw);
      });
    }
  }
  // Dims
  for(const d of dims) drawDimEntity(octx,d);
  // Strokes
  for(const s of strokes){
    if(s.pts.length<2) continue;
    octx.beginPath();
    const[sx0,sy0]=w2s(s.pts[0].x,s.pts[0].y);octx.moveTo(sx0,sy0);
    for(let i=1;i<s.pts.length;i++){const[sx,sy]=w2s(s.pts[i].x,s.pts[i].y);octx.lineTo(sx,sy);}
    octx.strokeStyle=`rgb(${s.color.r},${s.color.g},${s.color.b})`;
    octx.lineWidth=s.lw*scale;octx.lineJoin='round';octx.lineCap='round';octx.setLineDash([]);octx.stroke();
  }
  // Current sketch
  if(sketching&&sketchPts.length>1){
    octx.beginPath();
    const[sx0,sy0]=w2s(sketchPts[0].x,sketchPts[0].y);octx.moveTo(sx0,sy0);
    for(let i=1;i<sketchPts.length;i++){const[sx,sy]=w2s(sketchPts[i].x,sketchPts[i].y);octx.lineTo(sx,sy);}
    octx.strokeStyle=`rgb(${currentColor.r},${currentColor.g},${currentColor.b})`;
    octx.lineWidth=currentLW;octx.lineJoin='round';octx.lineCap='round';octx.setLineDash([]);octx.stroke();
  }
  // Dim guide
  if((currentTool==='dx'||currentTool==='dy'||currentTool==='diag')&&dimState.pts.length>0){
    octx.strokeStyle='#2ecc71';octx.lineWidth=1;octx.setLineDash([4,4]);
    for(let i=0;i<dimState.pts.length-1;i++){
      const[sx1,sy1]=w2s(dimState.pts[i].x,dimState.pts[i].y);
      const[sx2,sy2]=w2s(dimState.pts[i+1].x,dimState.pts[i+1].y);
      octx.beginPath();octx.moveTo(sx1,sy1);octx.lineTo(sx2,sy2);octx.stroke();
    }
    octx.setLineDash([]);
    for(const p of dimState.pts){
      const[sx,sy]=w2s(p.x,p.y);
      octx.beginPath();octx.arc(sx,sy,5,0,Math.PI*2);octx.fillStyle='#2ecc71';octx.fill();
    }
  }
  // Snap indicator (タイプ別マーカー)
  if(snapPt){
    const[sx,sy]=w2s(snapPt.x,snapPt.y);
    const STC={
      int:{col:'#ffee00',lbl:'交点'},
      end:{col:'#00ff88',lbl:'端点'},
      cen:{col:'#00d4ff',lbl:'中心'},
      mid:{col:'#ff9900',lbl:'中点'},
    };
    const sc=STC[snapPt.type]||{col:'#f39c12',lbl:''};
    octx.strokeStyle=sc.col;octx.fillStyle=sc.col;
    octx.lineWidth=2;octx.setLineDash([]);
    if(snapPt.type==='int'){
      // 交点: X + 中心点
      octx.beginPath();
      octx.moveTo(sx-10,sy-10);octx.lineTo(sx+10,sy+10);
      octx.moveTo(sx+10,sy-10);octx.lineTo(sx-10,sy+10);
      octx.stroke();
      octx.beginPath();octx.arc(sx,sy,3,0,Math.PI*2);octx.fill();
    } else if(snapPt.type==='end'){
      // 端点: 正方形 + クロスヘア
      octx.strokeRect(sx-7,sy-7,14,14);
      octx.beginPath();
      octx.moveTo(sx-12,sy);octx.lineTo(sx+12,sy);
      octx.moveTo(sx,sy-12);octx.lineTo(sx,sy+12);
      octx.stroke();
    } else if(snapPt.type==='cen'){
      // 中心: 円 + 内点 + クロスヘア
      octx.beginPath();octx.arc(sx,sy,9,0,Math.PI*2);octx.stroke();
      octx.beginPath();octx.arc(sx,sy,3,0,Math.PI*2);octx.fill();
      octx.beginPath();
      octx.moveTo(sx-13,sy);octx.lineTo(sx+13,sy);
      octx.moveTo(sx,sy-13);octx.lineTo(sx,sy+13);
      octx.stroke();
    } else if(snapPt.type==='mid'){
      // 中点: ひし形
      octx.beginPath();
      octx.moveTo(sx,sy-10);octx.lineTo(sx+10,sy);
      octx.lineTo(sx,sy+10);octx.lineTo(sx-10,sy);
      octx.closePath();octx.stroke();
    } else {
      octx.beginPath();octx.arc(sx,sy,8,0,Math.PI*2);octx.stroke();
      octx.beginPath();
      octx.moveTo(sx-11,sy);octx.lineTo(sx+11,sy);
      octx.moveTo(sx,sy-11);octx.lineTo(sx,sy+11);
      octx.stroke();
    }
    // ラベル
    if(sc.lbl){
      octx.font='bold 11px sans-serif';
      const tw=octx.measureText(sc.lbl).width;
      octx.fillStyle='rgba(0,0,0,0.72)';
      octx.fillRect(sx+15,sy-19,tw+8,17);
      octx.fillStyle=sc.col;
      octx.textAlign='left';octx.textBaseline='bottom';
      octx.fillText(sc.lbl,sx+19,sy-4);
    }
  }
  // Eraser
  if(eraserPos&&currentTool==='eraser'){
    const[sx,sy]=w2s(eraserPos.x,eraserPos.y);
    octx.strokeStyle='rgba(255,100,100,0.7)';octx.lineWidth=2;
    octx.beginPath();octx.arc(sx,sy,ERASER_RADIUS_PX,0,Math.PI*2);octx.stroke();
  }
}

function drawDimEntity(ctx,d){
  ctx.strokeStyle=d.color||'#f39c12';ctx.fillStyle=d.color||'#f39c12';
  ctx.lineWidth=1.5;ctx.setLineDash([]);
  for(const l of d.lines){
    const[sx1,sy1]=w2s(l.x1,l.y1);const[sx2,sy2]=w2s(l.x2,l.y2);
    ctx.beginPath();ctx.moveTo(sx1,sy1);ctx.lineTo(sx2,sy2);ctx.stroke();
  }
  for(const a of d.arrows){
    const[sx,sy]=w2s(a.x,a.y);
    ctx.save();ctx.translate(sx,sy);ctx.rotate(a.angle);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-10,4);ctx.lineTo(-10,-4);ctx.closePath();ctx.fill();ctx.restore();
  }
  if(d.text){
    const[sx,sy]=w2s(d.tx,d.ty);
    ctx.save();ctx.translate(sx,sy);ctx.rotate(d.tangle||0);
    ctx.font='bold 13px sans-serif';ctx.fillStyle=d.color||'#f39c12';
    ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(d.text,0,0);ctx.restore();
  }
}

// =========================================================
// スナップ (優先度付き: 交点>端点>中心>中点)
// =========================================================
function lineIntersect(x1,y1,x2,y2,x3,y3,x4,y4){
  const d=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  if(Math.abs(d)<1e-10) return null;
  const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/d;
  const u=-((x1-x2)*(y1-y3)-(y1-y2)*(x1-x3))/d;
  if(t>=-0.001&&t<=1.001&&u>=-0.001&&u<=1.001)
    return{x:x1+t*(x2-x1),y:y1+t*(y2-y1)};
  return null;
}
function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
  if(len2<1e-12) return Math.hypot(px-x1,py-y1);
  const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/len2));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function snapAt(wx,wy){
  if(!doc) return null;
  const sr=24/scale;   // 判定半径（画面24px相当）
  // 優先度ボーナス: スコア=距離-ボーナス → 低いほど優先
  // 交点は同距離なら必ず端点より優先、端点は中心より優先
  const BN={int:sr*0.55,end:sr*0.35,cen:sr*0.20,mid:sr*0.05};
  let best=null,bestScore=sr;
  function check(x,y,type){
    if(!isFinite(x)||!isFinite(y)) return;
    const d=Math.hypot(x-wx,y-wy);
    if(d>sr) return;
    const score=d-(BN[type]||0);
    if(score<bestScore){bestScore=score;best={x,y,type};}
  }
  // ─ 端点（端部・コーナー）
  for(const e of doc.sen){
    if(hiddenLayers.has(e.layer)) continue;
    check(e.x1,e.y1,'end');check(e.x2,e.y2,'end');
  }
  for(const e of doc.enko){
    if(hiddenLayers.has(e.layer)) continue;
    check(e.cx+e.r*Math.cos(e.a1*Math.PI/180),e.cy+e.r*Math.sin(e.a1*Math.PI/180),'end');
    check(e.cx+e.r*Math.cos(e.a2*Math.PI/180),e.cy+e.r*Math.sin(e.a2*Math.PI/180),'end');
  }
  // ─ 中心
  for(const e of doc.enko){
    if(hiddenLayers.has(e.layer)) continue;
    check(e.cx,e.cy,'cen');
  }
  // ─ 中点
  for(const e of doc.sen){
    if(hiddenLayers.has(e.layer)) continue;
    check((e.x1+e.x2)/2,(e.y1+e.y2)/2,'mid');
  }
  for(const e of doc.enko){
    if(hiddenLayers.has(e.layer)) continue;
    const am=(e.a1+e.a2)/2;
    check(e.cx+e.r*Math.cos(am*Math.PI/180),e.cy+e.r*Math.sin(am*Math.PI/180),'mid');
  }
  // ─ 交点: カーソル付近の線分のみに限定して高速化
  const near=doc.sen.filter(e=>!hiddenLayers.has(e.layer)&&distToSeg(wx,wy,e.x1,e.y1,e.x2,e.y2)<sr*1.5);
  const lim=Math.min(near.length,120);
  outer:for(let i=0;i<lim;i++){
    for(let j=i+1;j<lim;j++){
      const a=near[i],b=near[j];
      const ix=lineIntersect(a.x1,a.y1,a.x2,a.y2,b.x1,b.y1,b.x2,b.y2);
      if(ix) check(ix.x,ix.y,'int');
      if(bestScore<-sr*0.2) break outer; // 非常に良い交点が見つかれば打ち切り
    }
  }
  return best;
}

// =========================================================
// 寸法構築
// =========================================================
function buildDim(p1,p2,pArrow,type){
  const sd=parseFloat(document.getElementById('scaleDenom').value)||1;
  const lines=[],arrows=[];
  let text='',tx2=0,ty2=0,tangle=0;
  if(type==='dx'){
    const y=pArrow.y;
    lines.push({x1:p1.x,y1:p1.y,x2:p1.x,y2:y});
    lines.push({x1:p2.x,y1:p2.y,x2:p2.x,y2:y});
    lines.push({x1:p1.x,y1:y,x2:p2.x,y2:y});
    text=formatDim(Math.abs(p2.x-p1.x)/sd);
    const dir=p2.x>p1.x?0:Math.PI;
    arrows.push({x:p1.x,y,angle:Math.PI-dir});arrows.push({x:p2.x,y,angle:-dir});
    tx2=(p1.x+p2.x)/2;ty2=y;tangle=0;
  } else if(type==='dy'){
    const x=pArrow.x;
    lines.push({x1:p1.x,y1:p1.y,x2:x,y2:p1.y});
    lines.push({x1:p2.x,y1:p2.y,x2:x,y2:p2.y});
    lines.push({x1:x,y1:p1.y,x2:x,y2:p2.y});
    text=formatDim(Math.abs(p2.y-p1.y)/sd);
    const dir=p2.y>p1.y?Math.PI/2:-Math.PI/2;
    arrows.push({x,y:p1.y,angle:-dir+Math.PI});arrows.push({x,y:p2.y,angle:-dir});
    tx2=x;ty2=(p1.y+p2.y)/2;tangle=-Math.PI/2;
  } else {
    const dx=p2.x-p1.x,dy=p2.y-p1.y;
    text=formatDim(Math.hypot(dx,dy)/sd);
    const ang=Math.atan2(dy,dx);
    lines.push({x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y});
    arrows.push({x:p1.x,y:p1.y,angle:Math.PI+ang});arrows.push({x:p2.x,y:p2.y,angle:ang});
    tx2=(p1.x+p2.x)/2;ty2=(p1.y+p2.y)/2;tangle=-ang;
  }
  return {lines,arrows,text,tx:tx2,ty:ty2,tangle,color:'#f39c12'};
}

function formatDim(d){
  if(d>=100) return Math.round(d)+'';
  if(d>=10) return d.toFixed(1);
  return d.toFixed(2);
}

async function renderPdfPage(n){

  const page=await pdfDoc.getPage(n);
  const vp=page.getViewport({scale:3});
  const offscreen=document.createElement('canvas');
  offscreen.width=vp.width;offscreen.height=vp.height;
  await page.render({canvasContext:offscreen.getContext('2d'),viewport:vp}).promise;
  pdfImage={img:offscreen,wx:0,wy:vp.height/3,ww:vp.width/3,wh:vp.height/3};
  fit();scheduleDraw();
}

async function savePDF(){
  const tmp=document.createElement('canvas');
  tmp.width=cv.width;tmp.height=cv.height;
  const tctx=tmp.getContext('2d');
  tctx.drawImage(cv,0,0);tctx.drawImage(ov,0,0);
  const jpeg=tmp.toDataURL('image/jpeg',0.92).split(',')[1];
  const pdf=buildPDF(jpeg,tmp.width,tmp.height);
  const fname=(currentFileName||'dxf_view').replace(/\.[^.]+$/,'')
    +'_'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'.pdf';
  if(window.showSaveFilePicker){
    try{
      const fh=await showSaveFilePicker({suggestedName:fname,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});
      const w=await fh.createWritable();await w.write(pdf);await w.close();return;
    }catch(e){}
  }
  const blob=new Blob([pdf],{type:'application/pdf'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();
}

function buildPDF(jpegB64,pw,ph){
  const a4w=595,a4h=842;
  let iw=a4w,ih=Math.round(ph/pw*a4w);
  if(ih>a4h){ih=a4h;iw=Math.round(pw/ph*a4h);}
  const ox=Math.round((a4w-iw)/2),oy=Math.round((a4h-ih)/2);
  const imgData=atob(jpegB64);
  const imgBytes=new Uint8Array(imgData.length);
  for(let i=0;i<imgData.length;i++) imgBytes[i]=imgData.charCodeAt(i);
  const enc=new TextEncoder();
  function str(s){return enc.encode(s);}
  function concat(...arrs){let len=0;arrs.forEach(a=>len+=a.length);const r=new Uint8Array(len);let off=0;arrs.forEach(a=>{r.set(a,off);off+=a.length;});return r;}
  const stream=`q ${iw} 0 0 ${ih} ${ox} ${oy} cm /Im1 Do Q`;
  const objs=[
    `1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n`,
    `2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n`,
    `3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${a4w} ${a4h}] /Contents 4 0 R /Resources << /XObject << /Im1 5 0 R >> >> >>\nendobj\n`,
    `4 0 obj\n<< /Length ${stream.length} >>\nstream\n${stream}\nendstream\nendobj\n`,
  ];
  const imgHdr=`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgBytes.length} >>\nstream\n`;
  const imgFtr=`\nendstream\nendobj\n`;
  const chunks=[str('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n')];
  let pos=chunks[0].length;
  const xref=[];
  for(let i=0;i<objs.length;i++){xref.push(pos);const s=str(objs[i]);chunks.push(s);pos+=s.length;}
  // Image object
  xref.push(pos);
  const hdr=str(imgHdr);const ftr=str(imgFtr);
  chunks.push(hdr);pos+=hdr.length;chunks.push(imgBytes);pos+=imgBytes.length;chunks.push(ftr);pos+=ftr.length;
  const xrefPos=pos;
  let xrefStr=`xref\n0 6\n0000000000 65535 f \n`;
  for(const o of xref) xrefStr+=o.toString().padStart(10,'0')+' 00000 n \n';
  xrefStr+=`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`;
  chunks.push(str(xrefStr));
  return concat(...chunks);
}

function getPos(e){const r=ov.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}

function handlePointerDown(sx,sy,isPenInput){
  const[wx,wy]=s2w(sx,sy);
  // 寸法ツール: ペン入力のみ（指は touchstart でパン処理済み）
  if(currentTool==='dx'||currentTool==='dy'||currentTool==='diag'){
    const snap=snapAt(wx,wy);const pt=snap||{x:wx,y:wy};
    dimState.pts.push(pt);
    const need=currentTool==='diag'?2:3;
    if(dimState.pts.length>=need){
      const[p1,p2,p3]=dimState.pts;
      dims.push(buildDim(p1,p2,p3||p2,currentTool));
      dimState={pts:[]};
    }
    scheduleOverlay();return;
  }
  // 消しゴム
  if(currentTool==='eraser'){
    eraserPos={x:wx,y:wy};eraseAt(wx,wy);scheduleOverlay();return;
  }
  // スケッチ: ペンは常に描画（マウス時はsketchツール時のみ）
  if(isPenInput||currentTool==='sketch'){
    sketchPts=[{x:wx,y:wy}];sketching=true;scheduleOverlay();return;
  }
  // 画像選択
  if(currentTool==='select'){
    selectedImage=null;
    for(const img of images){
      const[isx,isy]=w2s(img.wx,img.wy);
      if(Math.abs(sx-isx-img.ww*scale/2)<20&&Math.abs(sy-isy-img.wh*scale/2)<20){
        selectedImage=img;dragImageStart={sx,sy,iwx:img.wx,iwy:img.wy};scheduleOverlay();return;
      }
    }
  }
  // 指でパン
  if(!isPenInput){panning=true;}
}

function handlePointerMove(sx,sy,isPenInput){
  const[wx,wy]=s2w(sx,sy);
  // 寸法ツール: ペン・指どちらでもスナップ更新
  if(currentTool==='dx'||currentTool==='dy'||currentTool==='diag'){
    snapPt=snapAt(wx,wy);scheduleOverlay();return;
  }
  snapPt=null;
  // 消しゴム
  if(currentTool==='eraser'){
    eraserPos={x:wx,y:wy};if(mouseDown)eraseAt(wx,wy);scheduleOverlay();return;
  }
  // スケッチ描画
  if(isPenInput||currentTool==='sketch'){
    if(sketching){sketchPts.push({x:wx,y:wy});scheduleOverlay();}return;
  }
  // パン
  if(panning){tx+=sx-lastMX;ty+=sy-lastMY;scheduleDraw();}
  if(selectedImage&&dragImageStart){
    const[nwx,nwy]=s2w(sx,sy);const[owx,owy]=s2w(dragImageStart.sx,dragImageStart.sy);
    selectedImage.wx=dragImageStart.iwx+(nwx-owx);selectedImage.wy=dragImageStart.iwy+(nwy-owy);
    scheduleOverlay();
  }
}

function handlePointerUp(sx,sy,isPenInput){
  if(currentTool==='eraser'){eraserPos=null;scheduleOverlay();return;}
  if(isPenInput||currentTool==='sketch'){
    if(sketching&&sketchPts.length>1){
      strokes.push({pts:[...sketchPts],color:{...currentColor},lw:currentLW/scale});
      sketching=false;sketchPts=[];scheduleOverlay();
    }return;
  }
  panning=false;dragImageStart=null;selectedImage=null;
}

function eraseAt(wx,wy){
  const r=ERASER_RADIUS_PX/scale;
  strokes=strokes.filter(s=>!s.pts.some(p=>Math.hypot(p.x-wx,p.y-wy)<r));
  dims=dims.filter(d=>Math.hypot(d.tx-wx,d.ty-wy)>=r);
}

function resizeCanvas(){
  const r=stage.getBoundingClientRect();
  cv.width=r.width;cv.height=r.height;
  ov.width=r.width;ov.height=r.height;
  scheduleDraw();
}

// マウス
ov.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  mouseDown=true;const p=getPos(e);lastMX=p.x;lastMY=p.y;
  handlePointerDown(p.x,p.y,false);
});
window.addEventListener('mousemove',e=>{
  const p=getPos(e);
  handlePointerMove(p.x,p.y,false);
  lastMX=p.x;lastMY=p.y;
});
window.addEventListener('mouseup',e=>{
  if(!mouseDown)return;mouseDown=false;
  const p=getPos(e);handlePointerUp(p.x,p.y,false);
});
ov.addEventListener('wheel',e=>{
  e.preventDefault();
  const p=getPos(e);zoomAt(p.x,p.y,e.deltaY<0?1.15:1/1.15);scheduleDraw();
},{passive:false});

// タッチ (ペン/指 完全分離設計)
ov.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=ov.getBoundingClientRect();
  const all=Array.from(e.touches);
  const styli=all.filter(t=>t.touchType==='stylus');
  const fingers=all.filter(t=>t.touchType!=='stylus');
  if(styli.length>0){
    // Apple Pencil: ペン入力を優先、指は無視（パームリジェクション）
    if(!isPen||!mouseDown){
      const t=styli[0];
      const sx=t.clientX-r.left,sy=t.clientY-r.top;
      isPen=true;mouseDown=true;lastMX=sx;lastMY=sy;
      panning=false;
      handlePointerDown(sx,sy,true);
    }
  } else if(fingers.length>=2){
    // 2本指: ピンチズーム+パン
    if(sketching){sketching=false;sketchPts=[];}
    mouseDown=false;panning=false;
    const t0=fingers[0],t1=fingers[1];
    const x0=t0.clientX-r.left,y0=t0.clientY-r.top;
    const x1=t1.clientX-r.left,y1=t1.clientY-r.top;
    pinchDist=Math.hypot(x1-x0,y1-y0);
    pinchMid={x:(x0+x1)/2,y:(y0+y1)/2};
  } else if(fingers.length===1){
    // 指1本: パンのみ（描画しない）
    if(sketching){sketching=false;sketchPts=[];}
    const t=fingers[0];
    const sx=t.clientX-r.left,sy=t.clientY-r.top;
    isPen=false;mouseDown=true;lastMX=sx;lastMY=sy;
    panning=true;
  }
},{passive:false});

ov.addEventListener('touchmove',e=>{
  e.preventDefault();
  const r=ov.getBoundingClientRect();
  const all=Array.from(e.touches);
  const styli=all.filter(t=>t.touchType==='stylus');
  const fingers=all.filter(t=>t.touchType!=='stylus');
  if(styli.length>0&&mouseDown&&isPen){
    // Apple Pencil移動: ツール操作
    const t=styli[0];
    const sx=t.clientX-r.left,sy=t.clientY-r.top;
    handlePointerMove(sx,sy,true);lastMX=sx;lastMY=sy;
  } else if(fingers.length>=2&&pinchDist!==null){
    // 2本指: 正確なパン+ピンチ（世界座標ピボット）
    const t0=fingers[0],t1=fingers[1];
    const x0=t0.clientX-r.left,y0=t0.clientY-r.top;
    const x1=t1.clientX-r.left,y1=t1.clientY-r.top;
    const dist=Math.hypot(x1-x0,y1-y0);
    const mid={x:(x0+x1)/2,y:(y0+y1)/2};
    // 旧中点の世界座標を新しい中点スクリーン位置に移動（パン+ズーム統合）
    const[wx,wy]=s2w(pinchMid.x,pinchMid.y);
    if(pinchDist>5){
      const f=dist/pinchDist;
      if(f>0.5&&f<2.0) scale*=f;
    }
    tx=mid.x-wx*scale;ty=mid.y+wy*scale;
    pinchDist=dist;pinchMid=mid;scheduleDraw();
  } else if(fingers.length===1&&mouseDown&&panning){
    // 1本指パン
    const t=fingers[0];
    const sx=t.clientX-r.left,sy=t.clientY-r.top;
    tx+=sx-lastMX;ty+=sy-lastMY;scheduleDraw();
    lastMX=sx;lastMY=sy;
  }
},{passive:false});

ov.addEventListener('touchend',e=>{
  e.preventDefault();
  const r=ov.getBoundingClientRect();
  const remaining=Array.from(e.touches);
  const changed=Array.from(e.changedTouches);
  const remFing=remaining.filter(t=>t.touchType!=='stylus');
  const liftedStylus=changed.filter(t=>t.touchType==='stylus');
  // Apple Pencilが離れた
  if(liftedStylus.length>0&&isPen&&mouseDown){
    handlePointerUp(lastMX,lastMY,true);
    mouseDown=false;isPen=false;
    if(remFing.length>=2){
      const t0=remFing[0],t1=remFing[1];
      const x0=t0.clientX-r.left,y0=t0.clientY-r.top;
      const x1=t1.clientX-r.left,y1=t1.clientY-r.top;
      pinchDist=Math.hypot(x1-x0,y1-y0);
      pinchMid={x:(x0+x1)/2,y:(y0+y1)/2};
    } else if(remFing.length===1){
      const t=remFing[0];
      const sx=t.clientX-r.left,sy=t.clientY-r.top;
      mouseDown=true;lastMX=sx;lastMY=sy;panning=true;
    }
    return;
  }
  // 全タッチ終了
  if(remaining.length===0){
    if(!isPen){panning=false;mouseDown=false;}
    pinchDist=null;pinchMid=null;return;
  }
  // 2本指→1本指への移行
  if(remFing.length===1&&pinchDist!==null&&!isPen){
    pinchDist=null;pinchMid=null;
    const t=remFing[0];
    const sx=t.clientX-r.left,sy=t.clientY-r.top;
    mouseDown=true;lastMX=sx;lastMY=sy;panning=true;
  }
},{passive:false});

    await loadPDF(buf);{const nd2=document.getElementById('noDrawingMsg');if(nd2)nd2.style.display='none';}
  } else {
    try{
      doc=parseDXF(buf);
      hiddenLayers.clear();strokes=[];dims=[];images=[];savedViews=[null,null,null];[0,1,2].forEach(i=>updateViewmemoState(i));
      buildLayerModal();detectScale();fit();scheduleDraw();showInfo();{const _nd=document.getElementById('noDrawingMsg');if(_nd)_nd.style.display='none';}{const _nd=document.getElementById('noDrawingMsg');if(_nd)_nd.style.display='none';}
    }catch(err){alert('ファイルを開けません: '+err.message);}

});

function updateViewmemoState(i){
  const mb=document.querySelector('.mem-btn[data-vi="'+i+'"]');
  const sb=document.querySelector('.show-btn[data-vs="'+i+'"]');
  if(mb) mb.classList.toggle('vm-saved',!!savedViews[i]);
  if(sb) sb.classList.toggle('vm-saved',!!savedViews[i]);
}
document.querySelectorAll('.mem-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const i=parseInt(btn.dataset.vi);savedViews[i]={tx,ty,scale};
    updateViewmemoState(i);
    btn.style.transform='scale(.88)';setTimeout(()=>{btn.style.transform='';},180);
  });
});
document.querySelectorAll('.show-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{

    if(savedViews[i]){({tx,ty,scale}=savedViews[i]);scheduleDraw();}
  });
});

});

// ダブルタップ → 全体表示
let _dtCount=0,_dtTimer=0;
ov.addEventListener('touchend',function(e){
  if(e.changedTouches.length===1&&e.touches.length===0){
    if(e.changedTouches[0].touchType==='stylus')return;
    _dtCount++;
    if(_dtCount===1){_dtTimer=setTimeout(function(){_dtCount=0;},350);}
    else if(_dtCount>=2){clearTimeout(_dtTimer);_dtCount=0;fit();scheduleDraw();}
  }
},{passive:false});
// 2本指パンと競合するため2本指タップUndoは廃止 → ↩ボタンで操作
// viewmemo初期状態
[0,1,2].forEach(i=>updateViewmemoState(i));

resizeCanvas();scheduleDraw();
