<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鉄骨図面ビューア - 修正版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg: #1e2228; --pan: #262c34; --acc: #f07800; --tx: #ffffff; --brd: #4a5a6a;
}
body { background: var(--bg); color: var(--tx); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

/* ヘッダー：スクロール可能にしてボタンが消えないように改善 */
#hdr { background: var(--pan); border-bottom: 2px solid var(--acc); flex-shrink: 0; }
.hr { display: flex; align-items: center; gap: 6px; padding: 6px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
.hr::-webkit-scrollbar { height: 4px; }
.hr::-webkit-scrollbar-thumb { background: var(--brd); }

.btn { 
  padding: 8px 12px; background: #3a424b; border: 1px solid var(--brd); color: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; flex-shrink: 0;
}
.btn.on { background: var(--acc); border-color: var(--acc); }

#ca { flex: 1; position: relative; background: #444; overflow: hidden; touch-action: none; }
#cw { position: absolute; transform-origin: 0 0; background: #fff; }
canvas { position: absolute; top: 0; left: 0; }

/* サブウィンドウのスタイル */
.swn { position: fixed; z-index: 1000; background: #fff; border: 2px solid var(--acc); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.swn-tb { height: 30px; background: var(--pan); display: flex; justify-content: space-between; align-items: center; padding: 0 10px; cursor: move; }
</style>
</head>
<body>

<div id="hdr">
  <div class="hr">
    <button class="btn" onclick="document.getElementById('fi').click()">📂 開く</button>
    <input type="file" id="fi" style="display:none" accept=".pdf">
    <button class="btn" onclick="changePage(-1)">◀</button>
    <span id="pgn_disp">1 / 1</span>
    <button class="btn" onclick="changePage(1)">▶</button>
    <button class="btn" onclick="zoom(0.8)">－</button>
    <button class="btn" onclick="zoom(1.2)">＋</button>
  </div>
  <div class="hr">
    <button class="btn on" id="btn-pen" onclick="setTool('pen')">✏️ ペン</button>
    <button class="btn" id="btn-eraser" onclick="setTool('eraser')"> eraser</button>
    <button class="btn" id="btn-subwin" onclick="setTool('subwin')" style="border: 2px solid #00d4ff;">🗔 サブ窓</button>
    <button class="btn" onclick="clearDraw()">全消去</button>
  </div>
</div>

<div id="ca">
  <div id="cw" style="display:none">
    <canvas id="pdfCvs"></canvas>
    <canvas id="drawCvs"></canvas>
    <canvas id="tempCvs"></canvas>
  </div>
</div>

<script>
// 基本設定と状態管理
let pdfDoc = null, pageNum = 1, scale = 1.0, currentTool = 'pen';
const ca = document.getElementById('ca'), cw = document.getElementById('cw');
const pdfCvs = document.getElementById('pdfCvs'), drawCvs = document.getElementById('drawCvs'), tempCvs = document.getElementById('tempCvs');

// ツール切り替え
function setTool(t) {
  currentTool = t;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('on'));
  document.getElementById('btn-' + t)?.classList.add('on');
  if(t === 'subwin') alert("図面上の拡大したい範囲を指で囲ってください");
}

// ファイル読み込み
document.getElementById('fi').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const data = await file.arrayBuffer();
  pdfDoc = await pdfjsLib.getDocument({data}).promise;
  renderPage(1);
};

async function renderPage(num) {
  pageNum = num;
  const page = await pdfDoc.getPage(num);
  const vp = page.getViewport({scale});
  [pdfCvs, drawCvs, tempCvs].forEach(c => { c.width = vp.width; c.height = vp.height; });
  cw.style.width = vp.width + 'px'; cw.style.height = vp.height + 'px';
  cw.style.display = 'block';
  await page.render({canvasContext: pdfCvs.getContext('2d'), viewport: vp}).promise;
  document.getElementById('pgn_disp').textContent = `${num} / ${pdfDoc.numPages}`;
}

// ズーム・ページ移動
function zoom(f) { scale *= f; renderPage(pageNum); }
function changePage(d) { if(pdfDoc && pageNum+d > 0 && pageNum+d <= pdfDoc.numPages) renderPage(pageNum+d); }
function clearDraw() { drawCvs.getContext('2d').clearRect(0,0,drawCvs.width,drawCvs.height); }

// 描画・サブ窓ロジック (簡易版)
let isDown = false, x1, y1;
ca.onpointerdown = (e) => {
  isDown = true;
  const r = cw.getBoundingClientRect();
  x1 = (e.clientX - r.left) / scale; y1 = (e.clientY - r.top) / scale;
};
ca.onpointermove = (e) => {
  if(!isDown) return;
  const r = cw.getBoundingClientRect();
  const x2 = (e.clientX - r.left) / scale, y2 = (e.clientY - r.top) / scale;
  const ctx = currentTool === 'pen' ? drawCvs.getContext('2d') : tempCvs.getContext('2d');
  
  if(currentTool === 'pen') {
    ctx.lineTo(x2, y2); ctx.stroke();
  } else if(currentTool === 'subwin') {
    const tctx = tempCvs.getContext('2d');
    tctx.clearRect(0,0,tempCvs.width,tempCvs.height);
    tctx.strokeStyle = '#00d4ff'; tctx.strokeRect(x1, y1, x2-x1, y2-y1);
  }
};
ca.onpointerup = (e) => { isDown = false; tempCvs.getContext('2d').clearRect(0,0,tempCvs.width,tempCvs.height); };
</script>
</body>
</html>
