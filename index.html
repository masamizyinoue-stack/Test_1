<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鉄骨図面ビューア</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg:#1a1c1e; --panel:#23262a; --panel2:#2c3036; --border:#3a3f47;
  --accent:#f07800; --accent2:#ffa040; --text:#e8eaed; --text2:#9aa0aa;
  --danger:#e05050; --blue:#4a9eda; --green:#4caf7d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;height:100dvh;}

/* ===== SHARED TOOLBAR ===== */
#toolbar{
  height:56px;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;padding:0 10px;flex-shrink:0;
  overflow-x:auto;z-index:100;
}
#toolbar::-webkit-scrollbar{display:none;}
.app-title{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em;
  text-transform:uppercase;padding-right:10px;border-right:1px solid var(--border);white-space:nowrap;}
.spacer{flex:1;min-width:4px;}
.tb-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:7px 11px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:4px;-webkit-user-select:none;user-select:none;flex-shrink:0;transition:background .15s;}
.tb-btn:active{background:var(--border);}
.tb-btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.tb-btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.tb-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}

/* ===== SUB TOOLBAR ===== */
#subtoolbar{
  height:50px;background:var(--panel);border-bottom:2px solid var(--border);
  display:flex;align-items:center;gap:5px;padding:0 10px;flex-shrink:0;overflow-x:auto;
}
#subtoolbar::-webkit-scrollbar{display:none;}
.tool-btn{background:transparent;border:2px solid transparent;color:var(--text2);
  padding:4px 8px;border-radius:8px;font-size:18px;cursor:pointer;flex-shrink:0;
  -webkit-user-select:none;user-select:none;display:flex;align-items:center;justify-content:center;
  min-width:40px;min-height:36px;transition:all .15s;}
.tool-btn.active{background:var(--panel2);border-color:var(--accent);color:var(--accent);}
.tool-sep{width:1px;height:24px;background:var(--border);flex-shrink:0;margin:0 2px;}
.color-swatch{width:24px;height:24px;border-radius:50%;border:3px solid transparent;
  cursor:pointer;flex-shrink:0;transition:transform .15s,border-color .15s;}
.color-swatch.active{border-color:#fff;transform:scale(1.25);}
.slider-group{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.slider-label{font-size:11px;color:var(--text2);white-space:nowrap;}
#stroke-slider{-webkit-appearance:none;width:80px;height:4px;background:var(--border);border-radius:2px;cursor:pointer;flex-shrink:0;}
#stroke-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;}
#stroke-val{font-size:13px;font-weight:700;color:var(--accent);width:22px;text-align:center;flex-shrink:0;}

/* ===== PANE CONTAINER ===== */
#pane-container{flex:1;display:flex;overflow:hidden;}
.pane{display:flex;flex-direction:column;flex:1;border-right:1px solid var(--border);overflow:hidden;}
.pane:last-child{border-right:none;}
.pane.active-pane{outline:2px solid var(--accent);outline-offset:-2px;}

/* PANE HEADER */
.pane-header{
  height:44px;background:var(--panel2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:5px;padding:0 8px;flex-shrink:0;overflow-x:auto;
}
.pane-header::-webkit-scrollbar{display:none;}
.pane-filename{font-size:11px;color:var(--text2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.ph-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:5px 9px;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap;
  -webkit-user-select:none;user-select:none;flex-shrink:0;display:flex;align-items:center;}
.ph-btn:active{background:var(--border);}
.page-num-input{background:var(--panel);border:1px solid var(--border);color:var(--text);
  width:36px;text-align:center;padding:4px 2px;border-radius:5px;font-size:12px;flex-shrink:0;}
.page-num-input:focus{outline:none;border-color:var(--accent);}
.total-pages-label{font-size:12px;color:var(--text2);white-space:nowrap;flex-shrink:0;}
.zoom-label{font-size:12px;color:var(--accent);font-weight:700;flex-shrink:0;min-width:40px;text-align:center;}

/* CANVAS AREA */
.canvas-area{
  flex:1;overflow:auto;background:#111;text-align:center;padding:16px;position:relative;
  -webkit-overflow-scrolling:touch;
}
.canvas-area::-webkit-scrollbar{width:5px;height:5px;}
.canvas-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.canvas-wrapper{display:inline-block;vertical-align:top;position:relative;
  box-shadow:0 4px 40px #000a;will-change:transform;transform-origin:top left;}
.pdf-canvas{display:block;}
.draw-canvas{position:absolute;top:0;left:0;touch-action:none;}

/* DROP ZONE */
.drop-zone{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:10;
}
.drop-zone .dz-icon{font-size:50px;opacity:.35;}
.drop-zone .dz-msg{font-size:16px;color:var(--text2);font-weight:600;}
.drop-zone .dz-sub{font-size:12px;color:var(--text2);opacity:.6;}
.dz-open-btn{background:var(--accent);color:#fff;border:none;padding:13px 28px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}

/* ===== CALCULATOR ===== */
#calculator{
  display:none;position:fixed;bottom:70px;right:16px;z-index:400;
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:14px;width:260px;box-shadow:0 8px 40px #000c;
  user-select:none;-webkit-user-select:none;
}
#calculator.show{display:block;}
#calc-display{background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;margin-bottom:10px;text-align:right;}
#calc-expr{font-size:11px;color:var(--text2);min-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#calc-result{font-size:26px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.calc-btn{padding:13px 0;border-radius:9px;border:none;font-size:15px;font-weight:600;cursor:pointer;
  transition:background .1s;-webkit-user-select:none;}
.calc-btn:active{opacity:.75;}
.calc-num{background:var(--panel2);color:var(--text);}
.calc-op{background:#3a4050;color:var(--accent);}
.calc-eq{background:var(--accent);color:#fff;}
.calc-fn{background:#2a3040;color:var(--text2);}
.calc-wide{grid-column:span 2;}
#calc-close-btn{position:absolute;top:10px;right:12px;background:transparent;border:none;
  color:var(--text2);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:6px;}
#calc-close-btn:active{background:var(--border);}

/* TEXT INPUT */
#text-input-overlay{display:none;position:fixed;inset:0;z-index:500;background:#000a;align-items:center;justify-content:center;}
#text-input-overlay.show{display:flex;}
#text-popup{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;width:300px;display:flex;flex-direction:column;gap:10px;}
#text-popup h3{font-size:13px;color:var(--text2);}
#text-input-field{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;padding:9px 11px;resize:vertical;min-height:60px;font-family:inherit;}
#text-input-field:focus{outline:none;border-color:var(--accent);}
.popup-btns{display:flex;gap:8px;justify-content:flex-end;}
.popup-btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;}
#text-cancel-btn{background:var(--panel2);color:var(--text2);}
#text-ok-btn{background:var(--accent);color:#fff;}

/* LOADING / TOAST */
#loading{display:none;position:fixed;inset:0;z-index:600;background:#000b;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
#loading.show{display:flex;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-size:13px;color:var(--text);opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;}
</style>
</head>
<body>

<!-- ===== SHARED TOOLBAR ===== -->
<div id="toolbar">
  <span class="app-title">⚙ 鉄骨図面</span>
  <div class="spacer"></div>
  <button class="tb-btn" onclick="getAP().undo()">↩ 戻す</button>
  <button class="tb-btn danger" onclick="getAP().clear()">🗑 消去</button>
  <button class="tb-btn accent" onclick="getAP().saveImage()">💾 保存</button>
  <button class="tb-btn" id="calc-toggle-btn" onclick="toggleCalc()" title="計算機">🧮 計算機</button>
  <button class="tb-btn" id="split-btn" onclick="toggleSplit()" title="2分割">⊟ 分割</button>
</div>

<!-- ===== SUB TOOLBAR ===== -->
<div id="subtoolbar">
  <button class="tool-btn" id="tool-move"      onclick="setTool('move')"      title="移動">🖐</button>
  <div class="tool-sep"></div>
  <button class="tool-btn active" id="tool-pen" onclick="setTool('pen')"      title="ペン">✏️</button>
  <button class="tool-btn" id="tool-marker"     onclick="setTool('marker')"   title="マーカー">🖊</button>
  <button class="tool-btn" id="tool-highlight"  onclick="setTool('highlight')" title="蛍光ペン">
    <svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="8" width="14" height="7" rx="2" fill="#ffe033" opacity=".85"/><rect x="5" y="2" width="8" height="9" rx="1" fill="#ffd000"/><line x1="9" y1="2" x2="9" y2="15" stroke="#cc9000" stroke-width="1"/></svg>
  </button>
  <button class="tool-btn" id="tool-arrow"      onclick="setTool('arrow')"    title="矢印">➡️</button>
  <button class="tool-btn" id="tool-rect"       onclick="setTool('rect')"     title="四角">⬜</button>
  <button class="tool-btn" id="tool-circle"     onclick="setTool('circle')"   title="円">⭕</button>
  <button class="tool-btn" id="tool-text"       onclick="setTool('text')"     title="文字">T</button>
  <button class="tool-btn" id="tool-eraser"     onclick="setTool('eraser')"   title="消しゴム">
    <svg width="20" height="18" viewBox="0 0 20 18" fill="none">
      <rect x="1" y="5" width="18" height="11" rx="2.5" fill="#ff9999" stroke="#cc4444" stroke-width="1.5"/>
      <rect x="1" y="10" width="8" height="6" rx="2" fill="#ffdddd"/>
      <line x1="9" y1="5" x2="9" y2="16" stroke="#cc4444" stroke-width="1.5"/>
    </svg>
  </button>
  <div class="tool-sep"></div>
  <div class="color-swatch active" style="background:#f07800" data-color="#f07800" onclick="setColor(this)"></div>
  <div class="color-swatch" style="background:#e03030" data-color="#e03030" onclick="setColor(this)"></div>
  <div class="color-swatch" style="background:#30a0e0" data-color="#30a0e0" onclick="setColor(this)"></div>
  <div class="color-swatch" style="background:#30c060" data-color="#30c060" onclick="setColor(this)"></div>
  <div class="color-swatch" style="background:#ffe033" data-color="#ffe033" onclick="setColor(this)"></div>
  <div class="color-swatch" style="background:#ffffff" data-color="#ffffff" onclick="setColor(this)"></div>
  <div class="color-swatch" style="background:#000;border:2px solid #555" data-color="#000000" onclick="setColor(this)"></div>
  <div class="tool-sep"></div>
  <div class="slider-group">
    <span class="slider-label">太さ</span>
    <input type="range" id="stroke-slider" min="1" max="20" value="3"
      oninput="strokeSize=+this.value; document.getElementById('stroke-val').textContent=this.value">
    <span id="stroke-val">3</span>
  </div>
</div>

<!-- ===== PANE CONTAINER ===== -->
<div id="pane-container">
  <!-- PANE 0 -->
  <div class="pane active-pane" id="pane0">
    <div class="pane-header">
      <input type="file" id="file-input-0" accept="application/pdf" style="display:none">
      <span class="pane-filename">未選択</span>
      <button class="ph-btn" onclick="document.getElementById('file-input-0').click()">📂</button>
      <button class="ph-btn" onclick="panes[0].changePage(-1)">◀</button>
      <input class="page-num-input" type="number" min="1" value="1" onchange="panes[0].jumpPage(+this.value)">
      <span class="total-pages-label">/ <span class="total-pages">0</span></span>
      <button class="ph-btn" onclick="panes[0].changePage(1)">▶</button>
      <span class="zoom-label">--</span>
      <button class="ph-btn" onclick="panes[0].fitPage()" title="全体表示">⊡</button>
      <button class="ph-btn" onclick="panes[0].zoomBy(1.25)">＋</button>
      <button class="ph-btn" onclick="panes[0].zoomBy(0.8)">－</button>
    </div>
    <div class="canvas-area">
      <div class="drop-zone">
        <div class="dz-icon">📄</div>
        <div class="dz-msg">PDFを開いてください</div>
        <div class="dz-sub">タップして選択・ドラッグ＆ドロップ</div>
        <button class="dz-open-btn" onclick="document.getElementById('file-input-0').click()">📂 PDFを開く</button>
      </div>
      <div class="canvas-wrapper" style="display:none">
        <canvas class="pdf-canvas"></canvas>
        <canvas class="draw-canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- PANE 1 -->
  <div class="pane" id="pane1" style="display:none">
    <div class="pane-header">
      <input type="file" id="file-input-1" accept="application/pdf" style="display:none">
      <span class="pane-filename">未選択</span>
      <button class="ph-btn" onclick="document.getElementById('file-input-1').click()">📂</button>
      <button class="ph-btn" onclick="panes[1].changePage(-1)">◀</button>
      <input class="page-num-input" type="number" min="1" value="1" onchange="panes[1].jumpPage(+this.value)">
      <span class="total-pages-label">/ <span class="total-pages">0</span></span>
      <button class="ph-btn" onclick="panes[1].changePage(1)">▶</button>
      <span class="zoom-label">--</span>
      <button class="ph-btn" onclick="panes[1].fitPage()" title="全体表示">⊡</button>
      <button class="ph-btn" onclick="panes[1].zoomBy(1.25)">＋</button>
      <button class="ph-btn" onclick="panes[1].zoomBy(0.8)">－</button>
    </div>
    <div class="canvas-area">
      <div class="drop-zone">
        <div class="dz-icon">📄</div>
        <div class="dz-msg">PDFを開いてください</div>
        <div class="dz-sub">タップして選択・ドラッグ＆ドロップ</div>
        <button class="dz-open-btn" onclick="document.getElementById('file-input-1').click()">📂 PDFを開く</button>
      </div>
      <div class="canvas-wrapper" style="display:none">
        <canvas class="pdf-canvas"></canvas>
        <canvas class="draw-canvas"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- ===== CALCULATOR ===== -->
<div id="calculator">
  <button id="calc-close-btn" onclick="toggleCalc()">✕</button>
  <div id="calc-display">
    <div id="calc-expr"></div>
    <div id="calc-result">0</div>
  </div>
  <div class="calc-grid">
    <button class="calc-btn calc-fn" onclick="calcFn('C')">C</button>
    <button class="calc-btn calc-fn" onclick="calcFn('±')">±</button>
    <button class="calc-btn calc-fn" onclick="calcFn('%')">%</button>
    <button class="calc-btn calc-op" onclick="calcOp('/')">÷</button>

    <button class="calc-btn calc-num" onclick="calcNum('7')">7</button>
    <button class="calc-btn calc-num" onclick="calcNum('8')">8</button>
    <button class="calc-btn calc-num" onclick="calcNum('9')">9</button>
    <button class="calc-btn calc-op" onclick="calcOp('*')">×</button>

    <button class="calc-btn calc-num" onclick="calcNum('4')">4</button>
    <button class="calc-btn calc-num" onclick="calcNum('5')">5</button>
    <button class="calc-btn calc-num" onclick="calcNum('6')">6</button>
    <button class="calc-btn calc-op" onclick="calcOp('-')">−</button>

    <button class="calc-btn calc-num" onclick="calcNum('1')">1</button>
    <button class="calc-btn calc-num" onclick="calcNum('2')">2</button>
    <button class="calc-btn calc-num" onclick="calcNum('3')">3</button>
    <button class="calc-btn calc-op" onclick="calcOp('+')">＋</button>

    <button class="calc-btn calc-num calc-wide" onclick="calcNum('0')">0</button>
    <button class="calc-btn calc-num" onclick="calcNum('.')">.</button>
    <button class="calc-btn calc-eq" onclick="calcEqual()">=</button>
  </div>
</div>

<!-- TEXT INPUT OVERLAY -->
<div id="text-input-overlay">
  <div id="text-popup">
    <h3>テキスト入力</h3>
    <textarea id="text-input-field" placeholder="テキストを入力..."></textarea>
    <div class="popup-btns">
      <button class="popup-btn" id="text-cancel-btn" onclick="cancelText()">キャンセル</button>
      <button class="popup-btn" id="text-ok-btn" onclick="confirmText()">確定</button>
    </div>
  </div>
</div>

<div id="loading"><div class="spinner"></div><span>読み込み中...</span></div>
<div id="toast"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ===== GLOBAL STATE =====
let currentTool = 'pen';
let strokeColor  = '#f07800';
let strokeSize   = 3;
let activePaneId = 0;
let splitMode    = false;
let textPendingPane = null, textPendingX = 0, textPendingY = 0;
const panes = [];

// ===== PANE CLASS =====
class Pane {
  constructor(id) {
    this.id = id;
    this.pdfDoc = null;
    this.currentPage = 1;
    this.totalPages  = 0;
    this.scale = 1.0;
    this.strokes = {};
    this.currentStroke = null;
    this.isDrawing = false;
    this.lastX = 0; this.lastY = 0;
    this.pinch = null;
    this.panState = null;

    const el = document.getElementById('pane' + id);
    this.el       = el;
    this.area     = el.querySelector('.canvas-area');
    this.wrapper  = el.querySelector('.canvas-wrapper');
    this.pdfCanvas  = el.querySelector('.pdf-canvas');
    this.drawCanvas = el.querySelector('.draw-canvas');
    this.pdfCtx  = this.pdfCanvas.getContext('2d');
    this.drawCtx = this.drawCanvas.getContext('2d');
    this.pageNumInput  = el.querySelector('.page-num-input');
    this.totalPagesEl  = el.querySelector('.total-pages');
    this.zoomLabelEl   = el.querySelector('.zoom-label');
    this.fileNameEl    = el.querySelector('.pane-filename');
    this.dropZone      = el.querySelector('.drop-zone');

    this._setupEvents();
  }

  _setupEvents() {
    const dc = this.drawCanvas;
    dc.addEventListener('touchstart', e => this._onTS(e), { passive: false });
    dc.addEventListener('touchmove',  e => this._onTM(e), { passive: false });
    dc.addEventListener('touchend',   e => this._onTE(e));
    dc.addEventListener('mousedown',  e => { setActivePane(this.id); this._startDraw(e); });
    dc.addEventListener('mousemove',  e => { if (this.isDrawing) this._moveDraw(e); });
    dc.addEventListener('mouseup',    e => this._endDraw(e));
    this.el.addEventListener('pointerdown', () => setActivePane(this.id), { capture: true });
    this.area.addEventListener('dragover', e => e.preventDefault());
    this.area.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) this.loadPDF(f); });
  }

  // ===== TOUCH DISPATCHER =====
  _onTS(e) {
    if (!this.pdfDoc) return;
    setActivePane(this.id);
    e.preventDefault();
    if (e.touches.length >= 2) {
      // 2本指: ピンチズーム
      this.isDrawing = false; this.currentStroke = null;
      this._startPinch(e.touches);
    } else if (currentTool === 'move') {
      this._startPan(e.touches[0]);
    } else {
      this._startDraw(e);
    }
  }
  _onTM(e) {
    e.preventDefault();
    if (e.touches.length >= 2 && this.pinch) { this._movePinch(e.touches); return; }
    if (this.panState) { this._movePan(e.touches[0]); return; }
    if (this.isDrawing) this._moveDraw(e);
  }
  _onTE(e) {
    if (this.pinch && e.touches.length < 2) { this._endPinch(); return; }
    if (this.panState && e.touches.length === 0) { this.panState = null; return; }
    if (this.isDrawing) this._endDraw(e);
  }

  // ===== PINCH ZOOM (center-point correct) =====
  _dist(t) {
    const dx = t[1].clientX - t[0].clientX, dy = t[1].clientY - t[0].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  _mid(t) {
    return { x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 };
  }

  _startPinch(touches) {
    const mid    = this._mid(touches);
    const aRect  = this.area.getBoundingClientRect();
    const wRect  = this.wrapper.getBoundingClientRect();
    this.pinch = {
      startDist: this._dist(touches),
      startScale: this.scale,
      // ピンチ中心のキャンバス座標 (CSS px, CSS transformなし)
      cpx: mid.x - wRect.left,
      cpy: mid.y - wRect.top,
      // ピンチ中心のエリア内座標
      vpx: mid.x - aRect.left,
      vpy: mid.y - aRect.top,
      // 開始時のスクロール位置
      sl0: this.area.scrollLeft,
      st0: this.area.scrollTop,
      // 開始時の指の中心
      mid0: mid,
      targetScale: this.scale,
    };
  }

  _movePinch(touches) {
    const p = this.pinch;
    const dist = this._dist(touches);
    const cssRatio = dist / p.startDist;
    p.targetScale = Math.max(0.2, Math.min(6, p.startScale * cssRatio));

    // ① CSS transformでリアルタイムプレビュー（ピンチ中心を固定）
    this.wrapper.style.transformOrigin = `${p.cpx}px ${p.cpy}px`;
    this.wrapper.style.transform = `scale(${cssRatio})`;

    // ② 2本指の平行移動分をスクロールで補正
    const mid = this._mid(touches);
    this.area.scrollLeft = p.sl0 - (mid.x - p.mid0.x);
    this.area.scrollTop  = p.st0 - (mid.y - p.mid0.y);

    this.zoomLabelEl.textContent = Math.round(p.targetScale * 100) + '%';
  }

  _endPinch() {
    if (!this.pinch) return;
    const p = this.pinch;
    const ts = p.targetScale;
    this.wrapper.style.transform = '';
    this.pinch = null;

    // スケール変更後の高品質再レンダリング + スクロール位置補正
    const oldScale = this.scale;
    this.scale = ts;
    this._renderPage(this.currentPage, false).then(() => {
      // ピンチ中心点が同じ画面位置になるようスクロール調整
      const ratio = ts / oldScale;
      const aW = this.area.clientWidth, aH = this.area.clientHeight;
      const cW = this.pdfCanvas.width,  cH = this.pdfCanvas.height;
      const wL = Math.max(16, (aW - cW) / 2);
      const wT = Math.max(16, (aH - cH) / 2);
      this.area.scrollLeft = Math.max(0, wL + p.cpx * ratio - p.vpx);
      this.area.scrollTop  = Math.max(0, wT + p.cpy * ratio - p.vpy);
      this.zoomLabelEl.textContent = Math.round(ts * 100) + '%';
    });
  }

  // ===== PAN (移動ツール) =====
  _startPan(t) {
    this.panState = { x0: t.clientX, y0: t.clientY, sl0: this.area.scrollLeft, st0: this.area.scrollTop };
  }
  _movePan(t) {
    if (!this.panState) return;
    this.area.scrollLeft = this.panState.sl0 - (t.clientX - this.panState.x0);
    this.area.scrollTop  = this.panState.st0 - (t.clientY - this.panState.y0);
  }

  // ===== DRAWING =====
  _pos(e, idx=0) {
    const rect = this.drawCanvas.getBoundingClientRect();
    const sx = this.drawCanvas.width / rect.width, sy = this.drawCanvas.height / rect.height;
    const src = e.touches ? e.touches[idx] : e;
    return { x: (src.clientX - rect.left) * sx, y: (src.clientY - rect.top) * sy };
  }

  _startDraw(e) {
    const pos = this._pos(e);
    if (currentTool === 'text') {
      textPendingPane = this; textPendingX = pos.x; textPendingY = pos.y;
      document.getElementById('text-input-field').value = '';
      document.getElementById('text-input-overlay').classList.add('show');
      return;
    }
    if (currentTool === 'move') return;
    this.isDrawing = true; this.lastX = pos.x; this.lastY = pos.y;
    if (['pen','marker','highlight','eraser'].includes(currentTool)) {
      this.currentStroke = { type: currentTool, points: [[pos.x, pos.y]], color: strokeColor, size: strokeSize };
    } else {
      this.currentStroke = { type: currentTool, x1:pos.x, y1:pos.y, x2:pos.x, y2:pos.y, color: strokeColor, size: strokeSize };
    }
  }

  _moveDraw(e) {
    if (!this.currentStroke) return;
    const pos = this._pos(e);
    const s = this.currentStroke, ctx = this.drawCtx;
    if (['pen','marker','highlight','eraser'].includes(s.type)) {
      s.points.push([pos.x, pos.y]);
      ctx.save();
      if (s.type === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = s.size * 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = s.type==='highlight' ? 0.38 : s.type==='marker' ? 0.7 : 1.0;
        ctx.strokeStyle = s.color;
        ctx.lineWidth   = s.type==='highlight' ? Math.max(s.size * 4, 16) : s.size;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      }
      ctx.beginPath(); ctx.moveTo(this.lastX, this.lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
      ctx.restore();
      this.lastX = pos.x; this.lastY = pos.y;
    } else {
      s.x2 = pos.x; s.y2 = pos.y;
      this._redraw(); this._drawOne(s, ctx);
    }
  }

  _endDraw(e) {
    if (!this.isDrawing || !this.currentStroke) { this.isDrawing = false; return; }
    this.isDrawing = false;
    if (!this.strokes[this.currentPage]) this.strokes[this.currentPage] = [];
    const s = this.currentStroke;
    this.strokes[this.currentPage].push({ ...s, points: s.points ? [...s.points] : undefined });
    this.currentStroke = null;
    this._redraw();
  }

  _drawOne(s, ctx) {
    ctx.save();
    if (s.type === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = s.size * 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); s.points.forEach((p,i) => i===0?ctx.moveTo(...p):ctx.lineTo(...p)); ctx.stroke();
    } else if (['pen','marker','highlight'].includes(s.type)) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = s.type==='highlight' ? 0.38 : s.type==='marker' ? 0.7 : 1.0;
      ctx.strokeStyle = s.color;
      ctx.lineWidth   = s.type==='highlight' ? Math.max(s.size*4,16) : s.size;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); s.points.forEach((p,i) => i===0?ctx.moveTo(...p):ctx.lineTo(...p)); ctx.stroke();
    } else if (s.type === 'text') {
      ctx.fillStyle = s.color;
      ctx.font = `bold ${s.size*6}px 'Helvetica Neue',Arial,sans-serif`;
      s.text.split('\n').forEach((l,i) => ctx.fillText(l, s.x, s.y + i*s.size*7));
    } else {
      ctx.strokeStyle = s.color; ctx.lineWidth = s.size; ctx.lineCap = 'round';
      if (s.type==='rect') ctx.strokeRect(s.x1,s.y1,s.x2-s.x1,s.y2-s.y1);
      else if (s.type==='circle') {
        const rx=(s.x2-s.x1)/2, ry=(s.y2-s.y1)/2;
        ctx.beginPath(); ctx.ellipse(s.x1+rx,s.y1+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2); ctx.stroke();
      } else if (s.type==='arrow') {
        const hl=Math.max(s.size*4,14), ang=Math.atan2(s.y2-s.y1,s.x2-s.x1);
        ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(s.x2,s.y2); ctx.lineTo(s.x2-hl*Math.cos(ang-Math.PI/6),s.y2-hl*Math.sin(ang-Math.PI/6));
        ctx.moveTo(s.x2,s.y2); ctx.lineTo(s.x2-hl*Math.cos(ang+Math.PI/6),s.y2-hl*Math.sin(ang+Math.PI/6));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  _redraw() {
    this.drawCtx.clearRect(0, 0, this.drawCanvas.width, this.drawCanvas.height);
    (this.strokes[this.currentPage] || []).forEach(s => this._drawOne(s, this.drawCtx));
  }

  // ===== PDF LOAD / RENDER =====
  async loadPDF(file) {
    showLoading(true);
    try {
      this.pdfDoc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      this.totalPages = this.pdfDoc.numPages;
      this.totalPagesEl.textContent = this.totalPages;
      this.fileNameEl.textContent = file.name;
      this.currentPage = 1; this.strokes = {};
      this.dropZone.style.display  = 'none';
      this.wrapper.style.display   = 'inline-block';
      await this._renderPage(1);
      await this.fitPage();
    } catch(err) { showToast('読み込みに失敗しました'); console.error(err); }
    showLoading(false);
  }

  async _renderPage(num, resetTransform=true) {
    if (!this.pdfDoc) return;
    if (resetTransform) this.wrapper.style.transform = '';
    const page = await this.pdfDoc.getPage(num);
    const vp = page.getViewport({ scale: this.scale });
    this.pdfCanvas.width = this.drawCanvas.width  = vp.width;
    this.pdfCanvas.height = this.drawCanvas.height = vp.height;
    await page.render({ canvasContext: this.pdfCtx, viewport: vp }).promise;
    this._redraw();
    this.pageNumInput.value = num;
    this.zoomLabelEl.textContent = Math.round(this.scale * 100) + '%';
  }

  async changePage(d) {
    if (!this.pdfDoc) return;
    const n = this.currentPage + d;
    if (n < 1 || n > this.totalPages) return;
    this.currentPage = n; await this._renderPage(n);
  }
  async jumpPage(v) {
    if (!this.pdfDoc) return;
    this.currentPage = Math.max(1, Math.min(this.totalPages, v||1));
    await this._renderPage(this.currentPage);
  }
  async setZoom(z) {
    this.scale = Math.max(0.2, Math.min(6, z));
    if (this.pdfDoc) await this._renderPage(this.currentPage);
  }
  async zoomBy(ratio) { await this.setZoom(this.scale * ratio); }
  async fitPage() {
    if (!this.pdfDoc) return;
    const page = await this.pdfDoc.getPage(this.currentPage);
    const vp = page.getViewport({ scale: 1 });
    const s = Math.min((this.area.clientWidth - 32) / vp.width, (this.area.clientHeight - 32) / vp.height);
    await this.setZoom(Math.max(0.2, s));
  }

  undo() {
    const arr = this.strokes[this.currentPage];
    if (!arr || !arr.length) { showToast('元に戻す操作がありません'); return; }
    arr.pop(); this._redraw();
  }
  clear() {
    if (!confirm('このページの書き込みを全て消去しますか？')) return;
    this.strokes[this.currentPage] = []; this._redraw();
  }
  saveImage() {
    if (!this.pdfDoc) { showToast('PDFが開かれていません'); return; }
    const m = document.createElement('canvas');
    m.width = this.pdfCanvas.width; m.height = this.pdfCanvas.height;
    const c = m.getContext('2d');
    c.drawImage(this.pdfCanvas, 0, 0); c.drawImage(this.drawCanvas, 0, 0);
    const a = document.createElement('a');
    a.download = `図面_p${this.currentPage}_${new Date().toISOString().slice(0,10)}.png`;
    a.href = m.toDataURL('image/png'); a.click();
    showToast('PNG保存しました');
  }
}

// ===== INIT PANES =====
panes.push(new Pane(0));
panes.push(new Pane(1));

document.getElementById('file-input-0').addEventListener('change', e => {
  const f = e.target.files[0]; if (f) panes[0].loadPDF(f); e.target.value='';
});
document.getElementById('file-input-1').addEventListener('change', e => {
  const f = e.target.files[0]; if (f) panes[1].loadPDF(f); e.target.value='';
});

// ===== ACTIVE PANE =====
function getAP() { return panes[activePaneId]; }
function setActivePane(id) {
  if (activePaneId === id) return;
  activePaneId = id;
  panes.forEach((p, i) => p.el.classList.toggle('active-pane', i === id));
}

// ===== TOOL / COLOR =====
function setTool(t) {
  currentTool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tool-' + t)?.classList.add('active');
}
function setColor(el) {
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active'); strokeColor = el.dataset.color;
}

// ===== SPLIT MODE =====
function toggleSplit() {
  splitMode = !splitMode;
  const p1 = document.getElementById('pane1');
  const btn = document.getElementById('split-btn');
  p1.style.display = splitMode ? '' : 'none';
  btn.classList.toggle('on', splitMode);
  btn.textContent = splitMode ? '⊠ 分割中' : '⊟ 分割';
  // 両ペインをリフィット
  panes.forEach(p => { if (p.pdfDoc) p.fitPage(); });
}

// ===== TEXT INPUT =====
function cancelText() { document.getElementById('text-input-overlay').classList.remove('show'); }
function confirmText() {
  const txt = document.getElementById('text-input-field').value.trim();
  if (txt && textPendingPane) {
    const p = textPendingPane;
    if (!p.strokes[p.currentPage]) p.strokes[p.currentPage] = [];
    p.strokes[p.currentPage].push({ type:'text', text:txt, x:textPendingX, y:textPendingY, color:strokeColor, size:Math.max(strokeSize,2) });
    p._redraw();
  }
  cancelText();
}
document.getElementById('text-input-field').addEventListener('keydown', e => {
  if (e.key==='Enter' && e.ctrlKey) confirmText();
  if (e.key==='Escape') cancelText();
});

// ===== CALCULATOR =====
let calcExpr = '', calcOperand = '', calcOperator = '', calcJustEq = false;
function updateCalcDisplay() {
  document.getElementById('calc-expr').textContent   = calcExpr;
  document.getElementById('calc-result').textContent = calcOperand || '0';
}
function calcNum(n) {
  if (calcJustEq) { calcOperand=''; calcExpr=''; calcJustEq=false; }
  if (n==='.' && calcOperand.includes('.')) return;
  calcOperand += n;
  updateCalcDisplay();
}
function calcOp(op) {
  calcJustEq = false;
  if (calcOperand !== '' && calcOperator !== '') {
    const a = parseFloat(calcExpr.split(/[+\-×÷*\/]/)[0].trim());
    const b = parseFloat(calcOperand);
    let r = a;
    if (calcOperator==='+') r=a+b; else if (calcOperator==='-') r=a-b;
    else if (calcOperator==='*') r=a*b; else if (calcOperator==='/') r= b!==0?a/b:0;
    calcOperand = String(+r.toFixed(10));
  }
  calcExpr = (calcOperand||'0') + ' ' + {'+':'＋','-':'−','*':'×','/':'÷'}[op] + ' ';
  calcOperator = op; calcOperand = '';
  updateCalcDisplay();
}
function calcEqual() {
  if (!calcOperator || calcOperand==='') return;
  const parts = calcExpr.trim().split(' ');
  const a = parseFloat(parts[0]), b = parseFloat(calcOperand);
  let r = a;
  if (calcOperator==='+') r=a+b; else if (calcOperator==='-') r=a-b;
  else if (calcOperator==='*') r=a*b; else if (calcOperator==='/') r= b!==0?a/b:0;
  const rs = String(+r.toFixed(10));
  calcExpr = calcExpr + calcOperand + ' =';
  calcOperand = rs; calcOperator = ''; calcJustEq = true;
  updateCalcDisplay();
}
function calcFn(fn) {
  if (fn==='C') { calcExpr=''; calcOperand=''; calcOperator=''; calcJustEq=false; }
  else if (fn==='±') { if (calcOperand) calcOperand = String(-parseFloat(calcOperand)); }
  else if (fn==='%') { if (calcOperand) calcOperand = String(parseFloat(calcOperand)/100); }
  updateCalcDisplay();
}
function toggleCalc() {
  const el = document.getElementById('calculator');
  el.classList.toggle('show');
  document.getElementById('calc-toggle-btn').classList.toggle('on', el.classList.contains('show'));
}
// 計算機ドラッグ
(function(){
  const el = document.getElementById('calculator');
  let dragging=false, ox=0, oy=0, ex=0, ey=0;
  el.addEventListener('touchstart', e => {
    if (e.target.classList.contains('calc-btn') || e.target.id==='calc-close-btn') return;
    e.preventDefault();
    dragging=true; ox=e.touches[0].clientX; oy=e.touches[0].clientY;
    const r=el.getBoundingClientRect(); ex=r.left; ey=r.top;
  },{passive:false});
  el.addEventListener('touchmove', e => {
    if (!dragging) return; e.preventDefault();
    const dx=e.touches[0].clientX-ox, dy=e.touches[0].clientY-oy;
    el.style.left=(ex+dx)+'px'; el.style.top=(ey+dy)+'px';
    el.style.bottom='auto'; el.style.right='auto';
  },{passive:false});
  el.addEventListener('touchend', () => dragging=false);
  el.addEventListener('mousedown', e => {
    if (e.target.classList.contains('calc-btn') || e.target.id==='calc-close-btn') return;
    dragging=true; ox=e.clientX; oy=e.clientY;
    const r=el.getBoundingClientRect(); ex=r.left; ey=r.top;
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    el.style.left=(ex+e.clientX-ox)+'px'; el.style.top=(ey+e.clientY-oy)+'px';
    el.style.bottom='auto'; el.style.right='auto';
  });
  document.addEventListener('mouseup', () => dragging=false);
})();

// ===== HELPERS =====
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
function showLoading(v) { document.getElementById('loading').classList.toggle('show', v); }
