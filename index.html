<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>M_Viewer v1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#1e2228;--pan:#262c34;--pan2:#2e363f;--brd:#4a5a6a;--acc:#f07800;--tx:#fff;--tx2:#c8d8e4;--red:#c02020}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:'Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none;-webkit-user-select:none}
#hdr{flex-shrink:0;background:var(--pan);border-bottom:2px solid var(--acc);overflow:hidden}
.hr{height:38px;display:flex;align-items:center;gap:5px;padding:0 7px;overflow-x:auto;-webkit-overflow-scrolling:touch;overflow-y:hidden}
.hr:first-child{border-bottom:1px solid var(--brd)}
.hr::-webkit-scrollbar{display:none}
.logo{font-size:12px;font-weight:800;color:var(--acc);padding-right:6px;border-right:2px solid var(--brd);white-space:nowrap;flex-shrink:0}
.vs{width:2px;height:24px;background:var(--brd);flex-shrink:0;margin:0 3px}
.sp{flex:1}
.btn{height:32px;padding:0 9px;border:1.5px solid var(--brd);background:var(--pan2);color:var(--tx);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:4px;-webkit-user-select:none;transition:background .1s}
.btn:active{background:var(--brd)}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.rd{background:var(--red);border-color:var(--red);color:#fff}
.pgni{width:32px;text-align:center;background:var(--pan2);border:1.5px solid var(--brd);color:var(--tx);border-radius:5px;font-size:12px;padding:2px 0;flex-shrink:0}
.pgni:focus{outline:none;border-color:var(--acc)}
.pgtot{font-size:11px;color:var(--tx2);white-space:nowrap;flex-shrink:0}
.zlbl{font-size:12px;font-weight:700;color:var(--acc);min-width:38px;text-align:center;flex-shrink:0}
#fnlbl{font-size:11px;color:#fff;font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.csw{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer;flex-shrink:0;transition:transform .1s}
.csw.on{border-color:#fff;transform:scale(1.25)}
.szlbl{font-size:11px;color:var(--tx2);flex-shrink:0}
.sz-val{font-size:13px;font-weight:700;color:var(--acc);min-width:22px;text-align:center;flex-shrink:0;cursor:pointer;padding:2px 6px;border:1.5px solid var(--brd);border-radius:5px;background:var(--pan2)}
.pkw{position:relative;flex-shrink:0}
.pkp{position:fixed;background:var(--pan);border:1.5px solid var(--brd);border-radius:9px;padding:5px;z-index:300;box-shadow:0 4px 20px #0008;display:none;flex-direction:column;gap:3px;min-width:120px}
.pkp.on{display:flex}
.pkp button{height:38px;padding:0 12px;background:var(--pan2);border:1.5px solid var(--brd);color:var(--tx);border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;text-align:left}
.pkp button:active,.pkp button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#szp{display:none;position:fixed;z-index:350;background:var(--pan);border:1.5px solid var(--brd);border-radius:11px;padding:12px 14px;box-shadow:0 4px 20px #0008;width:250px}
#szp.on{display:block}
#szp-title{font-size:12px;color:var(--tx2);font-weight:700;margin-bottom:9px;display:block}
.szp-row{display:flex;align-items:center;gap:7px;margin-bottom:9px}
#sz-rng{-webkit-appearance:none;flex:1;height:8px;background:var(--brd);border-radius:4px;cursor:pointer}
#sz-rng::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--acc);cursor:pointer;border:2px solid #fff}
#sz-n{width:42px;text-align:center;background:var(--pan2);border:1.5px solid var(--brd);color:var(--tx);border-radius:5px;font-size:13px;font-weight:700;padding:4px}
#sz-n:focus{outline:none;border-color:var(--acc)}
#szp-prev{height:42px;background:var(--pan2);border-radius:7px;margin-bottom:9px;display:flex;align-items:center;justify-content:center}
.szp-btns{display:flex;gap:7px}
.szp-ok{flex:1;height:38px;background:var(--acc);color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
.szp-cancel{height:38px;padding:0 12px;background:var(--pan2);color:var(--tx2);border:1.5px solid var(--brd);border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
#ca{flex:1;overflow:hidden;position:relative;min-height:0;touch-action:none;background:#444;overscroll-behavior:none}
#cw{position:absolute;top:0;left:0;transform-origin:0 0;background:#fff}
#pdfCvs{display:block}
#annCvs,#ovlCvs{position:absolute;top:0;left:0}
#ovlCvs{pointer-events:none}
#dz{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;background:var(--bg)}
.dzi{font-size:48px;opacity:.4}
.dzm{font-size:16px;color:var(--tx);font-weight:700}
.dzs{font-size:11px;color:var(--tx2);text-align:center;padding:0 18px;line-height:1.8}
.dzb{background:var(--acc);color:#fff;border:none;padding:13px 28px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer}
#home{position:absolute;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.home-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 12px;flex-shrink:0;border-bottom:1px solid var(--brd)}
.home-title{font-size:18px;font-weight:700;color:var(--tx)}
.home-open-btn{background:var(--acc);color:#fff;border:none;padding:10px 22px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation}
.home-open-btn:active{opacity:.8}
.home-section{font-size:11px;font-weight:700;color:var(--tx2);padding:14px 18px 6px;flex-shrink:0;text-transform:uppercase;letter-spacing:.05em}
#home-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:6px 18px 20px;align-content:start}
.home-card{background:var(--pan);border:1.5px solid var(--brd);border-radius:10px;padding:12px 10px 8px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:4px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.home-card:active{border-color:var(--acc);background:var(--pan2)}
.home-card-icon{font-size:26px;line-height:1;margin-bottom:2px}
.home-card-name{font-size:11px;font-weight:700;color:var(--tx);word-break:break-all;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.home-card-date{font-size:10px;color:var(--tx2);margin-top:auto;padding-top:4px}
.home-card-del{position:absolute;top:5px;right:5px;background:transparent;border:none;color:var(--tx2);font-size:14px;cursor:pointer;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.home-card-del:active{background:var(--red);color:#fff}
#home-empty{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;padding:60px 20px}
.home-empty-icon{font-size:52px;opacity:.25}
.home-empty-msg{font-size:13px;color:var(--tx2);text-align:center;line-height:1.8}
.home-drop-hint{font-size:11px;color:var(--tx2);text-align:center;padding:10px 18px;border:1.5px dashed var(--brd);border-radius:10px;margin:0 18px 18px;flex-shrink:0}
#selbtn{display:none;position:fixed;z-index:150;background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 10px #0005}
@keyframes swn-appear{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.swn{position:fixed;z-index:200;background:var(--pan);border:2.5px solid var(--acc);border-radius:11px;box-shadow:0 6px 28px #000b;display:flex;flex-direction:column;min-width:170px;min-height:170px;overflow:hidden;touch-action:none}
.swn-appearing{animation:swn-appear .15s ease-out both}
@keyframes swn-stripe{to{background-position:22px 22px}}
.swn-loading .swn-body::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:10;background:repeating-linear-gradient(-45deg,transparent 0 8px,rgba(255,255,255,.06) 8px 16px);background-size:22px 22px;background-position:0 0;animation:swn-stripe .7s linear infinite}
.swn-tb{height:30px;background:var(--pan2);display:flex;align-items:center;justify-content:space-between;padding:0 8px;cursor:grab;flex-shrink:0;border-bottom:1.5px solid var(--brd)}
.swn-tb span{font-size:11px;font-weight:800;color:var(--acc)}
.swn-close{background:transparent;border:none;color:var(--tx2);font-size:16px;cursor:pointer;padding:2px 5px;border-radius:4px}
.swn-body{flex:1;overflow:hidden;position:relative;background:#fff}
.swn-cvs{position:absolute;top:0;left:0;transform-origin:0 0}
.swn-zl{position:absolute;bottom:3px;left:5px;font-size:10px;color:var(--acc);pointer-events:none;font-weight:800;text-shadow:0 0 4px #000,0 0 4px #000}
.swn-rz{position:absolute;bottom:0;right:0;width:22px;height:22px;cursor:se-resize;background:linear-gradient(135deg,transparent 50%,var(--acc) 50%);border-radius:0 0 8px 0}
.swn-rz-sw{position:absolute;bottom:0;left:0;width:22px;height:22px;cursor:sw-resize;background:linear-gradient(225deg,transparent 50%,var(--acc) 50%);border-radius:0 0 0 8px}
.swn-rz-nw{position:absolute;top:30px;left:0;width:22px;height:22px;cursor:nw-resize;background:linear-gradient(315deg,transparent 50%,var(--acc) 50%);border-radius:8px 0 0 0}
#pgrov{display:none;position:fixed;inset:0;z-index:500;background:#0009;align-items:center;justify-content:center}
#pgrov.on{display:flex}
#pgrpop{background:var(--pan);border:1.5px solid var(--brd);border-radius:13px;padding:16px;width:300px;display:flex;flex-direction:column;gap:9px}
#pgrpop h3{font-size:13px;color:var(--tx2)}
#pgrfld{background:var(--bg);border:1.5px solid var(--brd);border-radius:7px;color:var(--tx);font-size:15px;padding:8px;font-family:inherit;user-select:text;-webkit-user-select:text}
#pgrfld:focus{outline:none;border-color:var(--acc)}
.pgr-qrow{display:flex;gap:6px}
.pgr-q{flex:1;height:32px;border-radius:6px;border:1.5px solid var(--brd);background:var(--pan2);color:var(--tx2);font-size:11px;cursor:pointer;font-weight:600}
.pgr-q:active{background:var(--brd)}
#bk-confirm-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);align-items:center;justify-content:center}
#bk-confirm-overlay.open{display:flex}
#bk-confirm-box{background:var(--pan);border:1.5px solid var(--brd);border-radius:14px;padding:22px 20px 18px;max-width:340px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.6)}
#bk-confirm-box .bk-icon{font-size:28px;margin-bottom:8px}
#bk-confirm-box .bk-title{font-size:14px;font-weight:800;color:var(--tx);margin-bottom:6px}
#bk-confirm-box .bk-sub{font-size:12px;color:var(--tx2);margin-bottom:18px;line-height:1.5}
#bk-confirm-box .bk-warn{color:#ffaa44;font-size:12px;font-weight:700;margin-bottom:14px}
#bk-confirm-box .bk-btns{display:flex;flex-direction:column;gap:8px}
#bk-confirm-box .bk-btns button{width:100%;height:38px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid var(--brd);background:var(--pan2);color:var(--tx)}
#bk-confirm-box .bk-btns .bk-do-backup{background:var(--acc);border-color:var(--acc);color:#fff}
#bk-confirm-box .bk-btns .bk-cancel{color:var(--tx2)}
#tabbar{flex-shrink:0;display:flex;align-items:stretch;min-height:30px;background:var(--pan2);border-bottom:1.5px solid var(--brd);overflow-x:auto;-webkit-overflow-scrolling:touch}
#tabbar::-webkit-scrollbar{display:none}
.shtab{display:flex;align-items:center;gap:4px;padding:0 6px 0 10px;min-width:72px;max-width:152px;background:var(--pan2);color:var(--tx2);border-right:1px solid var(--brd);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;user-select:none;-webkit-user-select:none;transition:background .1s}
.shtab:hover{background:var(--brd);color:var(--tx)}
.shtab.active{background:var(--bg);color:var(--tx);box-shadow:inset 0 -2px 0 var(--acc)}
.shtab-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.shtab-x{flex-shrink:0;background:none;border:none;color:var(--tx2);cursor:pointer;font-size:12px;padding:1px 3px;border-radius:3px;line-height:1}
.shtab-x:hover{background:var(--red);color:#fff}
.shtab-add{padding:0 13px;background:none;border:none;color:var(--tx2);font-size:20px;cursor:pointer;flex-shrink:0;align-self:center;margin-left:auto}
.shtab-add:hover{color:var(--acc)}
#calc{display:none;position:fixed;z-index:400;background:var(--pan);border:1.5px solid var(--brd);border-radius:13px;width:290px;box-shadow:0 8px 36px #000a;bottom:20px;right:16px}
#calc.on{display:block}
#ctb{padding:6px 12px 4px;display:flex;align-items:center;justify-content:space-between;cursor:grab;border-bottom:1px solid var(--brd)}
#ctb span{font-size:13px;font-weight:700;color:var(--tx2)}
#cclose{background:var(--pan2);border:1.5px solid var(--brd);color:var(--tx);font-size:12px;cursor:pointer;padding:3px 10px;border-radius:5px;font-weight:700}
#cclose:active{background:var(--acc);color:#fff}
#chist{max-height:66px;overflow-y:auto;padding:2px 10px;border-bottom:1px solid var(--brd)}
.chi{font-size:11px;color:var(--tx2);text-align:right;padding:2px 0}
#cdsp{padding:5px 12px;text-align:right;border-bottom:1px solid var(--brd)}
#cexpr{font-size:11px;color:var(--tx2);min-height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cval{font-size:26px;font-weight:700;color:var(--tx)}
#cdecrow{display:flex;align-items:center;gap:5px;padding:3px 10px;border-bottom:1px solid var(--brd)}
#cdecrow label{font-size:11px;color:var(--tx2)}
#cdec{width:34px;text-align:center;background:var(--pan2);border:1px solid var(--brd);color:var(--tx);border-radius:4px;font-size:12px;padding:2px}
#cbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.cb{height:50px;border-radius:9px;font-size:22px;font-weight:700;cursor:pointer;-webkit-user-select:none;transition:opacity .1s;border:2px solid}
.cb:active{opacity:.6}
.cbn{background:var(--pan2);color:var(--tx);border-color:#4a5a6a}
.cbo{background:#243040;color:#ffa040;border-color:#3a5070}
.cbeq{background:var(--acc);color:#fff;border-color:#c06000}
.cbf{background:#1e2530;color:var(--tx2);font-size:16px;border-color:#3a4a58}
.cbw{grid-column:span 2}
.cbrs{grid-row:span 2}
#txov{display:none;position:fixed;inset:0;z-index:500;background:#0009;align-items:center;justify-content:center}
#txov.on{display:flex}
#txpop{background:var(--pan);border:1.5px solid var(--brd);border-radius:13px;padding:16px;width:300px;display:flex;flex-direction:column;gap:9px}
#txpop h3{font-size:13px;color:var(--tx2)}
#txfld{background:var(--bg);border:1.5px solid var(--brd);border-radius:7px;color:var(--tx);font-size:16px;padding:9px;resize:vertical;min-height:60px;font-family:inherit;user-select:text;-webkit-user-select:text}
#txfld:focus{outline:none;border-color:var(--acc)}
.txbtns{display:flex;gap:7px;justify-content:flex-end}
.txb{padding:9px 16px;border-radius:7px;border:none;cursor:pointer;font-size:14px;font-weight:700}
#loading{display:none;position:fixed;inset:0;z-index:600;background:#000a;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#loading.on{display:flex}
.spin{width:34px;height:34px;border:3px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--pan);border:1.5px solid var(--brd);border-radius:9px;padding:8px 16px;font-size:13px;color:var(--tx);opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;white-space:nowrap}
#toast.on{opacity:1}
@media(pointer:coarse){.hr{height:46px;gap:6px;padding:0 9px;padding-left:max(9px,env(safe-area-inset-left));padding-right:max(9px,env(safe-area-inset-right));overflow-y:hidden}.btn{height:38px;padding:0 11px;font-size:12px;border-radius:9px}.csw{width:32px;height:32px;border-width:3px}.vs{height:28px;margin:0 4px}.pgni{width:38px;font-size:13px;height:32px;padding:3px 0}.pgtot{font-size:12px}.zlbl{font-size:13px;min-width:40px}#fnlbl{font-size:12px;max-width:180px}.pkp button{height:42px;font-size:12px}}
@media(pointer:coarse) and (orientation:landscape){.hr{height:42px;gap:5px;padding:0 8px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}.btn{height:35px;padding:0 10px;font-size:12px;border-radius:8px}.csw{width:30px;height:30px}.vs{height:26px;margin:0 3px}.pgni{height:30px;font-size:12px}}
@media(pointer:coarse) and (max-width:600px){.hr{height:40px;gap:4px;padding:0 6px;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}.btn{height:34px;padding:0 8px;font-size:11px;border-radius:8px}.csw{width:28px;height:28px}.vs{height:22px;margin:0 2px}.logo{font-size:11px;padding-right:4px}#fnlbl{max-width:80px;font-size:10px}.pgni{width:32px;height:28px;font-size:12px}}
@media(pointer:coarse) and (max-width:430px){.hr{height:36px;gap:3px}.btn{height:28px;padding:0 5px;font-size:10px;border-radius:7px}.csw{width:22px;height:22px}.logo{display:none}#fnlbl{max-width:60px}}
</style>
</head>
<body>
<div id="bk-confirm-overlay">
  <div id="bk-confirm-box">
    <div class="bk-icon" id="bk-icon">⚠️</div>
    <div class="bk-title" id="bk-title">バックアップを作成しますか？</div>
    <div class="bk-warn" id="bk-warn"></div>
    <div class="bk-sub" id="bk-sub"></div>
    <div class="bk-btns">
      <button class="bk-do-backup" id="bk-do-backup">💾 バックアップして閉じる</button>
      <button class="bk-do-close" id="bk-do-close">閉じる（バックアップしない）</button>
      <button class="bk-cancel" id="bk-cancel">キャンセル</button>
    </div>
  </div>
</div>
<div id="hdr">
  <div class="hr">
    <span class="logo">M_Viewer <span style="font-size:10px">v1</span></span>
    <input type="file" id="fileInput" accept="application/pdf" style="display:none">
    <span id="fnlbl">ファイル未選択</span>
    <div class="vs"></div>
    <button class="btn" id="btn-undo">↩ 戻す</button>
    <button class="btn on" id="btn-save">📤 PDF出力</button>
    <button class="btn" id="btn-backup" title="ZIP バックアップ">💾 バックアップ</button>
    <button class="btn" id="btn-restore" title="ZIP から復元">📂 復元</button>
    <input type="file" id="restoreInput" accept=".zip" style="display:none">
    <button class="btn" id="calcbtn">🧮 計算機</button>
    <div class="sp"></div>
    <button class="btn" id="btn-home">⌂ ホーム</button>
    <button class="btn rd" id="btn-close">✕ 閉じる</button>
  </div>
  <div class="hr">
    <button class="btn" id="btn-prev">◀</button>
    <input id="pgn" class="pgni" type="number" min="1" value="1">
    <span class="pgtot">/<span id="tpn">0</span></span>
    <button class="btn" id="btn-next">▶</button>
    <span id="zlbl" class="zlbl">--</span>
    <button class="btn" id="btn-fit">全体</button>
    <div style="width:30px;flex-shrink:0"></div>
    <button class="btn on" id="t-pen">✏️ ペン</button>
    <button class="btn" id="t-hl">蛍光ペン</button>
    <div class="pkw">
      <button class="btn" id="t-shape">図形▾</button>

'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ============================================================
   定数
   ============================================================ */
const MAX_CANVAS=3600,MAX_SCALE=8,SAVE_DELAY=1200,PDF_MAX_DPR=1.5;
const MAX_SUBWIN=5,MAX_STROKES_PER_PAGE=500;
const SW_COLORS=['#f07800','#00a0ff','#00c060','#ff40a0','#c0c000'];
const SW_FILLS=['rgba(240,120,0,.12)','rgba(0,160,255,.12)','rgba(0,200,80,.12)','rgba(255,80,160,.12)','rgba(200,200,0,.12)'];
const PEN_COLORS=[{id:'sw0',c:'#cc2020'},{id:'sw1',c:'#1a1a1a'},{id:'sw2',c:'#1a55cc'},{id:'sw3',c:'#108030'}];
const HL_COLORS=[{id:'sw0',c:'#ffd700'},{id:'sw1',c:'#50c040'},{id:'sw2',c:'#ff69b4'},{id:'sw3',c:'#40d4e8'}];
const TOOL_DEFAULT_SIZES={pen:3,hl:3,eraser:20,text:3,arrow:2,rect:2,circle:2,line:2};

/* ============================================================
   Module: Logger
   責務: 構造化ログ / 性能計測 / 機能フラグ
   ============================================================ */
const Logger=(() => {
  let _debug=true;
  const _flags=new Map();
  const _lvl={debug:0,info:1,warn:2,error:3};
  let _min=0;
  function _log(lv,...a){
    if(_lvl[lv]<_min)return;
    const ts=performance.now().toFixed(1);
    console[lv](`[${ts}ms]`,...a);
  }
  return {
    debug:(...a)=>_debug&&_log('debug',...a),
    info:(...a)=>_log('info',...a),
    warn:(...a)=>_log('warn',...a),
    error:(...a)=>_log('error',...a),
    perf(label,fn){const t=performance.now();const r=fn();_debug&&console.debug(`[PERF]${label}:${(performance.now()-t).toFixed(1)}ms`);return r;},
    setLevel(l){_min=_lvl[l]??0;},
    setDebug(v){_debug=v;},
    /* 機能フラグ: DBG互換 */
    flags:{
      subWindowUpdate:true,redraw:true,pdfRender:true,raf:true,
      wheelZoom:true,touchMove:true,annotationDraw:true,overlay:true
    },
    off(k){this.flags[k]=false;console.log(`%c[DBG]"${k}"STOPPED`,'color:red;font-weight:bold');},
    on(k){this.flags[k]=true;console.log(`%c[DBG]"${k}"ON`,'color:green;font-weight:bold');},
    reset(){Object.keys(this.flags).forEach(k=>this.flags[k]=true);console.log('[DBG]ALL ON');},
    status(){console.table(this.flags);}
  };
})();
window.DBG=Logger; // 後方互換

/* ============================================================
   Module: EventBus
   責務: モジュール間疎結合通信
   ============================================================ */
const EventBus=(() => {
  const _m=new Map();
  function on(ev,fn){if(!_m.has(ev))_m.set(ev,new Set());_m.get(ev).add(fn);return()=>off(ev,fn);}
  function off(ev,fn){_m.get(ev)?.delete(fn);}
  function once(ev,fn){const w=(d)=>{fn(d);off(ev,w);};return on(ev,w);}
  function emit(ev,data){const s=_m.get(ev);if(!s?.size)return;for(const fn of s){try{fn(data);}catch(e){Logger.error(`[EventBus]${ev}:`,e);}}}
  return{on,off,once,emit};
})();

/* ============================================================
   Module: Utils
   責務: throttle/debounce/geometry
   ============================================================ */
const Utils=(() => {
  function throttle(fn,ms){let last=0,tid=null;return(...a)=>{const now=Date.now();const rem=ms-(now-last);if(rem<=0){clearTimeout(tid);last=now;fn(...a);}else{clearTimeout(tid);tid=setTimeout(()=>{last=Date.now();fn(...a);},rem);}};  }
  function debounce(fn,ms){let tid=null;return(...a)=>{clearTimeout(tid);tid=setTimeout(()=>fn(...a),ms);};}
  function safeKey(s){return s.replace(/[^a-zA-Z0-9._-]/g,'_').substring(0,100);}
  /* 点からセグメントへの最短距離 */
  function distPtSeg(px,py,ax,ay,bx,by){
    const dx=bx-ax,dy=by-ay,len2=dx*dx+dy*dy;
    if(len2===0)return Math.hypot(px-ax,py-ay);
    const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/len2));
    return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
  }
  function ptInPoly(px,py,poly){
    let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const[xi,yi]=poly[i],[xj,yj]=poly[j];
      if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))inside=!inside;
    }
    return inside;
  }
  function strokeBBox(s){
    if(!s||s.type==='eraser')return null;
    if(s.points){const xs=s.points.map(p=>p[0]),ys=s.points.map(p=>p[1]);return{x1:Math.min(...xs),y1:Math.min(...ys),x2:Math.max(...xs),y2:Math.max(...ys)};}
    if(s.type==='text')return{x1:s.x-2,y1:s.y-s.size*8,x2:s.x+s.size*4*(s.text?.length||1),y2:s.y+4};
    return{x1:Math.min(s.x1,s.x2),y1:Math.min(s.y1,s.y2),x2:Math.max(s.x1,s.x2),y2:Math.max(s.y1,s.y2)};
  }
  function isPalmContact(t){
    if(!t)return false;
    if(t.touchType==='stylus'||t.pointerType==='pen')return false;
    const rx=t.radiusX||t.width/2||0,ry=t.radiusY||t.height/2||0;
    if(!rx&&!ry)return false;
    return rx>25||ry>25;
  }
  function pruneEraserStrokes(strks){
    const r={};
    for(const[pg,arr]of Object.entries(strks||{})){
      const f=(arr||[]).filter(s=>s.type!=='eraser');
      if(f.length)r[pg]=f;
    }
    return r;
  }
  function cloneStrokes(strks){
    return typeof structuredClone==='function'?structuredClone(strks):JSON.parse(JSON.stringify(strks));
  }
  return{throttle,debounce,safeKey,distPtSeg,ptInPoly,strokeBBox,isPalmContact,pruneEraserStrokes,cloneStrokes};
})();

/* ============================================================
   Module: IDBStore
   責務: IndexedDB 保存キュー + ジャーナル + transaction.oncomplete保証
   設計: 保存キューに積んで _flush() が1トランザクションで一括書き込み
         同キーは最新値が勝つ（マージ）
         ジャーナル: journal:pending → 書込 → journal:done
         クラッシュ回復: 起動時に journal:pending 残存を検出 → resume:prv を試みる
   ============================================================ */
const IDBStore=(() => {
  const DB_NAME='MViewerV2',DB_VER=1,ST='d';
  let _db=null;
  const _queue=[];  // Array<Map<key,value>>
  let _flushing=false;
  let _pendingSave=false;
  let _isSaving=false; // 後方互換

  async function _open(){
    if(_db)return _db;
    return _db=await new Promise((res,rej)=>{
      const req=indexedDB.open(DB_NAME,DB_VER);
      req.onupgradeneeded=e=>e.target.result.createObjectStore(ST);
      req.onsuccess=e=>res(e.target.result);
      req.onerror=e=>rej(e.target.error);
    });
  }

  async function _doWrite(pairs){
    const db=await _open();
    return new Promise((res,rej)=>{
      const tx=db.transaction(ST,'readwrite');
      const st=tx.objectStore(ST);
      for(const[k,v]of pairs){
        if(v===null||v===undefined)st.delete(k);
        else st.put(v,k);
      }
      tx.oncomplete=res;
      tx.onerror=e=>rej(e.target.error);
      tx.onabort=()=>rej(new Error('IDB tx aborted'));
    });
  }

  async function _flush(){
    if(_flushing||_queue.length===0)return;
    _flushing=true;
    /* マージ: 同キーは最後の値が勝つ */
    const merged=new Map();
    for(const batch of _queue)for(const[k,v]of batch)merged.set(k,v);
    _queue.length=0;
    try{
      await _doWrite([...merged]);
      Logger.debug('[IDB] flushed',merged.size,'keys');
    }catch(e){
      Logger.warn('[IDB] flush failed, requeue',e);
      _queue.unshift(merged); /* 失敗時は先頭に戻す */
    }
    _flushing=false;
    if(_queue.length>0)setTimeout(_flush,30);
  }

  /* 非同期キュー書き込み（通常の自動保存） */
  function enqueue(pairs){
    _queue.push(new Map(pairs));
    setTimeout(_flush,0);
  }

  /* 同期的に即書き込み（pagehide/visibilitychange用） */
  async function saveNow(pairs){
    try{await _doWrite(pairs);}
    catch(e){Logger.warn('[IDB] saveNow failed',e);}
  }

  async function get(key){
    try{
      const db=await _open();
      return await new Promise(res=>{
        const q=db.transaction(ST,'readonly').objectStore(ST).get(key);
        q.onsuccess=e=>res(e.target.result??null);
        q.onerror=()=>res(null);
      });
    }catch{return null;}
  }

  /* 起動時にDB接続をウォームアップ */
  function warmup(){_open().catch(()=>{});}

  return{enqueue,saveNow,get,warmup,
    get isSaving(){return _flushing;},
    get pendingSave(){return _queue.length>0;}
  };
})();

/* ============================================================
   Module: AutoSave
   責務: 保存ライフサイクル管理
   設計:
     schedSave()    → 1200ms debounce
     immediateSave()→ 即時（endDraw後）
     emergencySave()→ pagehide/visibilitychange/blur/freeze
   ============================================================ */
const AutoSave=(() => {
  let _timer=null;
  let _bkDirty=false;
  const INST_ID=(() => {
    const KEY='mv_iid2';
    let id=sessionStorage.getItem(KEY);
    if(!id){id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);sessionStorage.setItem(KEY,id);}
    return id;
  })();
  const K_LAST='last:'+INST_ID;
  const K_BK_LAT='bk:lat:'+INST_ID;

  function _buildData(getState){
    const s=getState();
    if(!s.pdfDoc||!s.origBuf)return null;
    const clean=Utils.pruneEraserStrokes(s.strokes);
    return{
      buf:null,docId:s.docId,file:s.fileName,
      strokes:Utils.cloneStrokes(clean),
      page:s.currentPage,scale:s.scale,panX:s.panX,panY:s.panY,
      subWinStates:s.subWinStates,ts:Date.now()
    };
  }

  function _lsBackup(data){
    try{localStorage.setItem('mv_lsbk2',JSON.stringify({file:data.file,page:data.page,strokes:data.strokes,ts:data.ts}));}catch(_){}
  }

  function _saveKeys(data){
    return[
      [K_LAST,data],
      ['f:'+Utils.safeKey(data.file),data],
      ['resume:last',data],
      ['resume:fname',data.file]
    ];
  }

  function schedSave(getState){
    _bkDirty=true;
    clearTimeout(_timer);
    _timer=setTimeout(async()=>{
      const data=_buildData(getState);
      if(!data)return;
      Logger.info('[AutoSave] sched start ts='+data.ts);
      IDBStore.enqueue(_saveKeys(data));
      IDBStore.enqueue([['resume:prv',data]]);
      /* 検証: resume:last を読み返してts確認 */
      setTimeout(async()=>{
        const v=await IDBStore.get('resume:last').catch(()=>null);
        if(!v||v.ts<data.ts){
          Logger.warn('[AutoSave] verify failed → re-enqueue');
          IDBStore.enqueue(_saveKeys(data));
        }else{
          Logger.info('[AutoSave] verify OK ts='+data.ts);
        }
      },2000);
    },SAVE_DELAY);
  }

  function immediateSave(getState){
    const data=_buildData(getState);
    if(!data)return;
    _lsBackup(data);
    Logger.info('[AutoSave] immediate ts='+data.ts);
    IDBStore.enqueue(_saveKeys(data));
  }

  function emergencySave(getState){
    const data=_buildData(getState);
    if(!data)return;
    _lsBackup(data);
    Logger.info('[AutoSave] emergency ts='+data.ts);
    IDBStore.saveNow(_saveKeys(data)).catch(()=>{});
  }

  function isValid(s){
    if(!s||typeof s!=='object')return false;
    if(typeof s.file!=='string'||!s.file)return false;
    if(typeof s.ts==='number'&&Date.now()-s.ts>30*24*60*60*1000)return false;
    return true;
  }

  function markDirty(){_bkDirty=true;}
  function clearDirty(){_bkDirty=false;}
  function isDirty(){return _bkDirty;}

  return{schedSave,immediateSave,emergencySave,isValid,markDirty,clearDirty,isDirty,
    get instId(){return INST_ID;}};
})();

/* 60秒周期バックグラウンド保存 */
setInterval(()=>EventBus.emit('autosave:periodic'),60000);

/* ============================================================
   Module: DocMgr
   責務: ドキュメント一覧管理（IDB doclist / doc:{id}）
   ============================================================ */
const DocMgr=(() => {
  let _docId=null;
  function _newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  async function _getList(){return(await IDBStore.get('doclist'))||[];}
  async function _setList(list){IDBStore.enqueue([['doclist',list]]);}

  async function open(name,pdfBytes,strokes,currentPage){
    try{
      const list=await _getList();
      let entry=list.find(e=>e.name===name);
      const now=Date.now();
      if(!entry){
        entry={id:_newId(),name,createdAt:now,updatedAt:now,pages:0,byteSize:pdfBytes?.byteLength||0};
        list.unshift(entry);
      }else{entry.updatedAt=now;entry.byteSize=pdfBytes?.byteLength||entry.byteSize;}
      _docId=entry.id;
      await _setList(list);
      IDBStore.enqueue([['doc:'+_docId,{
        id:_docId,name,createdAt:entry.createdAt,updatedAt:now,
        originalPdfBytes:pdfBytes?pdfBytes.slice(0):null,
        strokes:strokes||{},currentPage:currentPage||1
      }]]);
    }catch(e){Logger.warn('[DocMgr.open]',e);}
    return _docId;
  }

  async function updateStrokes(strokes,currentPage){
    if(!_docId)return;
    try{
      const doc=await IDBStore.get('doc:'+_docId);
      if(!doc)return;
      doc.strokes=strokes;doc.currentPage=currentPage||doc.currentPage;doc.updatedAt=Date.now();
      IDBStore.enqueue([['doc:'+_docId,doc]]);
      const list=await _getList();
      const entry=list.find(e=>e.id===_docId);
      if(entry){entry.updatedAt=doc.updatedAt;_setList(list);}
    }catch(e){Logger.warn('[DocMgr.updateStrokes]',e);}
  }

  async function findByName(name){
    const list=await _getList();
    const entry=list.find(e=>e.name===name);
    if(!entry)return null;
    return IDBStore.get('doc:'+entry.id);
  }

  async function list(){
    const list=await _getList();
    return[...list].sort((a,b)=>b.updatedAt-a.updatedAt);
  }
  async function get(id){return IDBStore.get('doc:'+id);}
  async function remove(id){
    IDBStore.enqueue([['doc:'+id,null]]);
    const list=await _getList();
    await _setList(list.filter(e=>e.id!==id));
    if(_docId===id)_docId=null;
  }
  function setId(id){if(id)_docId=id;}
  function reset(){_docId=null;}
  return{open,updateStrokes,findByName,list,get,remove,setId,reset,get currentId(){return _docId;}};
})();

/* ============================================================
   Module: DrawUtil
   責務: ストローク描画アルゴリズム（Main + SubWin 共通）
   ============================================================ */
const DrawUtil=(() => {
  function drawStroke(s,ctx,sc){
    ctx.save();
    const lw=s.size*sc/3;
    if(s.type==='eraser'){
      ctx.globalCompositeOperation='destination-out';
      ctx.lineWidth=lw*4;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();
      s.points.forEach((p,i)=>i?ctx.lineTo(p[0]*sc,p[1]*sc):ctx.moveTo(p[0]*sc,p[1]*sc));
      ctx.stroke();
    }else if(s.type==='pen'||s.type==='hl'){
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=s.type==='hl'?0.38:1;
      ctx.strokeStyle=s.color;
      ctx.lineWidth=s.type==='hl'?Math.max(lw*4,5*sc/3):lw;
      ctx.lineCap='round';ctx.lineJoin='round';
      const pts=s.points;
      if(pts&&pts.length){
        ctx.beginPath();ctx.moveTo(pts[0][0]*sc,pts[0][1]*sc);
        for(let i=1;i<pts.length-1;i++){
          const mx=(pts[i][0]+pts[i+1][0])/2*sc,my=(pts[i][1]+pts[i+1][1])/2*sc;
          ctx.quadraticCurveTo(pts[i][0]*sc,pts[i][1]*sc,mx,my);
        }
        if(pts.length>1)ctx.lineTo(pts[pts.length-1][0]*sc,pts[pts.length-1][1]*sc);
        ctx.stroke();
      }
    }else if(s.type==='text'){
      ctx.fillStyle=s.color;
      ctx.font=`bold ${Math.round(s.size*6*sc)}px 'Helvetica Neue',Arial,sans-serif`;
      s.text.split('\n').forEach((line,i)=>ctx.fillText(line,s.x*sc,s.y*sc+i*s.size*7*sc));
    }else{
      ctx.strokeStyle=s.color;ctx.lineWidth=lw;ctx.lineCap='round';
      const[x1,y1,x2,y2]=[s.x1*sc,s.y1*sc,s.x2*sc,s.y2*sc];
      if(s.type==='rect'){ctx.strokeRect(x1,y1,x2-x1,y2-y1);}
      else if(s.type==='circle'){const rx=(x2-x1)/2,ry=(y2-y1)/2;ctx.beginPath();ctx.ellipse(x1+rx,y1+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);ctx.stroke();}
      else if(s.type==='line'){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
      else if(s.type==='arrow'){
        const hl=Math.max(lw*4,12*sc),ang=Math.atan2(y2-y1,x2-x1);
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(ang-Math.PI/6),y2-hl*Math.sin(ang-Math.PI/6));
        ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(ang+Math.PI/6),y2-hl*Math.sin(ang+Math.PI/6));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawAnnotations(ctx,strks,sc){
    if(!strks?.length)return;
    strks.forEach(s=>drawStroke(s,ctx,sc));
  }

  function drawLivePen(ctx,s,sc){
    ctx.save();
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=s.type==='hl'?0.38:1;
    ctx.strokeStyle=s.color;
    ctx.lineWidth=s.type==='hl'?Math.max(s.size*4,5)*sc/3:s.size*sc/3;
    ctx.lineCap='round';ctx.lineJoin='round';
    const pts=s.points;
    if(pts.length>=3){
      const pp=pts[pts.length-3],cp=pts[pts.length-2],cur=pts[pts.length-1];
      const pmx=(pp[0]+cp[0])/2*sc,pmy=(pp[1]+cp[1])/2*sc;
      const cmx=(cp[0]+cur[0])/2*sc,cmy=(cp[1]+cur[1])/2*sc;
      ctx.beginPath();ctx.moveTo(pmx,pmy);ctx.quadraticCurveTo(cp[0]*sc,cp[1]*sc,cmx,cmy);ctx.stroke();
    }else if(pts.length===2){
      const p=pts[0],q=pts[1];ctx.beginPath();ctx.moveTo(p[0]*sc,p[1]*sc);ctx.lineTo(q[0]*sc,q[1]*sc);ctx.stroke();
    }
    ctx.restore();
  }

  function drawEraserCursor(ctx,p,s,sc,invEZ){
    ctx.save();
    ctx.strokeStyle='#888';ctx.lineWidth=Math.max(1,1.5*invEZ);
    ctx.setLineDash([4*invEZ,2*invEZ]);
    ctx.beginPath();ctx.arc(p.x*sc,p.y*sc,s.size*2*sc/3,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }

  /* 消しゴム: ペン点からセグメントへの距離で部分削除 */
  function _distPtSeg(px,py,ax,ay,bx,by){return Utils.distPtSeg(px,py,ax,ay,bx,by);}

  function applyEraser(penStroke,erPts,hitR){
    if(!penStroke.points?.length||erPts.length===0)return[penStroke];
    const ptHits=(px,py)=>{
      if(Math.hypot(px-erPts[0][0],py-erPts[0][1])<hitR)return true;
      for(let i=1;i<erPts.length;i++){
        if(_distPtSeg(px,py,erPts[i-1][0],erPts[i-1][1],erPts[i][0],erPts[i][1])<hitR)return true;
      }
      return false;
    };
    const kept=penStroke.points.map(pp=>ptHits(pp[0],pp[1])?null:pp);
    for(let j=1;j<kept.length;j++){
      if(kept[j-1]===null||kept[j]===null)continue;
      const[ax,ay]=kept[j-1],[bx,by]=kept[j];
      if(ptHits((ax+bx)/2,(ay+by)/2)){kept[j-1]=null;kept[j]=null;continue;}
      if(Math.hypot(bx-ax,by-ay)>hitR*2){
        if(ptHits(ax*.75+bx*.25,ay*.75+by*.25)||ptHits(ax*.25+bx*.75,ay*.25+by*.75)){kept[j-1]=null;kept[j]=null;}
      }
    }
    const result=[];let seg=[];
    for(const p of kept){
      if(p!==null){seg.push(p);}
      else{if(seg.length>=2)result.push({...penStroke,points:[...seg]});seg=[];}
    }
    if(seg.length>=2)result.push({...penStroke,points:[...seg]});
    return result;
  }

  function applyEraserAll(stroke,erPts,hitR){
    if(stroke.type==='text')return[stroke];
    if((stroke.type==='pen'||stroke.type==='hl')&&stroke.points?.length)return applyEraser(stroke,erPts,hitR);
    const bb=Utils.strokeBBox(stroke);if(!bb)return[stroke];
    for(let i=0;i<erPts.length;i++){
      const[ex,ey]=erPts[i];
      if(ex>=bb.x1-hitR&&ex<=bb.x2+hitR&&ey>=bb.y1-hitR&&ey<=bb.y2+hitR)return[];
      if(i>0){
        const cx=(bb.x1+bb.x2)/2,cy=(bb.y1+bb.y2)/2;
        const reach=hitR+Math.hypot(bb.x2-bb.x1,bb.y2-bb.y1)/2;
        if(_distPtSeg(cx,cy,erPts[i-1][0],erPts[i-1][1],ex,ey)<reach)return[];
      }
    }
    return[stroke];
  }

  /* PDF回転補正 */
  function rotateCanvas(src,jsPage,pw,ph,rs){
    const rot=jsPage.rotate||0;if(!rot)return src;
    const dc=document.createElement('canvas');
    dc.width=Math.round(pw*rs);dc.height=Math.round(ph*rs);
    const ctx=dc.getContext('2d');
    if(rot===90){ctx.translate(0,ph*rs);ctx.rotate(-Math.PI/2);}
    else if(rot===180){ctx.translate(pw*rs,ph*rs);ctx.rotate(Math.PI);}
    else if(rot===270){ctx.translate(pw*rs,0);ctx.rotate(Math.PI/2);}
    ctx.drawImage(src,0,0);return dc;
  }

  return{drawStroke,drawAnnotations,drawLivePen,drawEraserCursor,applyEraser,applyEraserAll,rotateCanvas};
})();

/* ============================================================
   Module: SubWinManager
   責務: サブ窓ライフサイクル + グローバルイベント1本化
   設計: document に touchmove/touchend/mousemove/mouseup を1本ずつ
         アクティブなサブ窓の onMove/onEnd コールバックに委譲
   ============================================================ */
const SubWinManager=(() => {
  const _wins=[];
  let _zBase=200;
  /* グローバルシングルトン: ドラッグ/リサイズ中のコールバック */
  const _active={onMove:null,onEnd:null};

  /* document に1本だけイベントを登録（初期化時に1回だけ実行） */
  document.addEventListener('touchmove',e=>{
    if(_active.onMove){if(e.cancelable)e.preventDefault();_active.onMove(e);}
  },{passive:false});
  document.addEventListener('touchend',e=>{if(_active.onEnd)_active.onEnd(e);},{passive:true});
  document.addEventListener('mousemove',e=>{if(_active.onMove)_active.onMove(e);},{passive:true});
  document.addEventListener('mouseup',e=>{if(_active.onEnd)_active.onEnd(e);},{passive:true});

  function setActive(onMove,onEnd){_active.onMove=onMove;_active.onEnd=onEnd;}
  function clearActive(){_active.onMove=null;_active.onEnd=null;}
  function nextZ(){return++_zBase;}
  function add(sw){_wins.push(sw);}
  function remove(sw){const i=_wins.indexOf(sw);if(i>=0)_wins.splice(i,1);}
  function getAll(){return[..._wins];}
  function count(){return _wins.length;}
  function updateAll(strokes,pageNum){
    if(!Logger.flags.subWindowUpdate)return;
    _wins.forEach(sw=>sw.update(strokes,pageNum));
  }
  function closeAll(){[..._wins].forEach(sw=>sw.close());}
  function snapAll(){
    return _wins.map(sw=>({
      pageNum:sw.pageNum,offX:sw.offX,offY:sw.offY,
      innerScale:sw.innerScale,
      winW:sw.el.clientWidth||sw.winW,winH:sw.el.clientHeight||sw.winH,
      left:sw.el.style.left,top:sw.el.style.top,
      rW:(sw.cvs.width||400)/sw.innerScale,rH:(sw.cvs.height||300)/sw.innerScale
    }));
  }
  function freezeAll(){const st=snapAll();closeAll();return st;}
  function thawAll(states,pdfDoc,strokes){
    if(!states||!pdfDoc)return;
    states.forEach(s=>{
      if(_wins.length>=MAX_SUBWIN)return;
      const region={x1:s.offX,y1:s.offY,x2:s.offX+(s.rW||200),y2:s.offY+(s.rH||200)};
      const sx=parseFloat(s.left)||80,sy=parseFloat(s.top)||80;
      const sw=new SubWin(pdfDoc,strokes,s.pageNum,region,sx,sy,s.innerScale);
      if(s.winW&&s.winH){sw.winW=s.winW;sw.winH=s.winH;sw.el.style.width=s.winW+'px';sw.el.style.height=s.winH+'px';}
    });
  }
  return{setActive,clearActive,nextZ,add,remove,getAll,count,updateAll,closeAll,snapAll,freezeAll,thawAll};
})();

/* ============================================================
   Class: SubWin
   責務: 1つのサブウィンドウの描画・入力・ドラッグ・リサイズ
   ============================================================ */
class SubWin{
  constructor(pdfDoc,strokes,pageNum,region,screenX,screenY,initScale){
    this.pdfDoc=pdfDoc;this.strokes=strokes;this.pageNum=pageNum;
    this.innerScale=Math.max(.2,Math.min(8,initScale||1));
    this.offX=region.x1;this.offY=region.y1;
    const rW=region.x2-region.x1,rH=region.y2-region.y1;
    this.winW=Math.max(180,Math.round(rW*this.innerScale)+4);
    this.winH=Math.max(160,Math.round(rH*this.innerScale)+30);
    this.sx=Math.max(4,Math.min(window.innerWidth-this.winW-10,screenX));
    this.sy=Math.max(4,Math.min(window.innerHeight-this.winH-10,screenY));
    this.pinch=null;this.panSt=null;this.curStroke=null;this.isDrawing=false;
    this.lastX=0;this.lastY=0;this.selPath=[];this.selectedIdx=[];
    this._renderVer=0;this._pdfCache=null;this._pdfCacheSc=0;this._pdfCachePg=0;
    this._annCvs=null;this._annDirty=true;this._cleanups=[];this._drawRafId=null;
    const idx=SubWinManager.count();
    this.swColor=SW_COLORS[idx%MAX_SUBWIN];this.swFill=SW_FILLS[idx%MAX_SUBWIN];
    this._build();
    SubWinManager.add(this);
    requestAnimationFrame(()=>this.render());
  }

  _build(){
    const el=document.createElement('div');
    el.className='swn';
    el.style.cssText=`left:${this.sx}px;top:${this.sy}px;width:${this.winW}px;height:${this.winH}px;z-index:${SubWinManager.nextZ()};border-color:${this.swColor}`;
    const n=SubWinManager.count()+1;
    el.innerHTML=`<div class="swn-tb"><span>🔍 サブ窓${n}</span><button class="swn-close">✕</button></div>
<div class="swn-body"><canvas class="swn-cvs"></canvas><canvas class="swn-sel" style="position:absolute;top:0;left:0;pointer-events:none;z-index:5"></canvas><span class="swn-zl"></span></div>
<div class="swn-rz"></div><div class="swn-rz-sw"></div><div class="swn-rz-nw"></div>`;
    el.classList.add('swn-appearing','swn-loading');
    this.el=el;
    this.body=el.querySelector('.swn-body');
    this.cvs=el.querySelector('.swn-cvs');
    this.ctx=this.cvs.getContext('2d');
    this.selCvs=el.querySelector('.swn-sel');
    this.selCtx=this.selCvs.getContext('2d');
    this.zlEl=el.querySelector('.swn-zl');
    el.querySelector('.swn-close').addEventListener('pointerdown',e=>{e.stopPropagation();this.close();});
    el.addEventListener('pointerdown',()=>{el.style.zIndex=SubWinManager.nextZ();},{capture:true,passive:true});
    this._bindDrag(el.querySelector('.swn-tb'));
    this._bindResize(el.querySelector('.swn-rz'),'se');
    this._bindResize(el.querySelector('.swn-rz-sw'),'sw');
    this._bindResize(el.querySelector('.swn-rz-nw'),'nw');
    this._bindInput();
    document.body.appendChild(el);
  }

  _bodyRect(){return this.body.getBoundingClientRect();}
  _toDocPos(t){const r=this._bodyRect();return{x:(t.clientX-r.left)/this.innerScale+this.offX,y:(t.clientY-r.top)/this.innerScale+this.offY};}
  _updateTransform(){
    this.cvs.style.transform=`translate(${-this.offX*this.innerScale}px,${-this.offY*this.innerScale}px)`;
    EventBus.emit('subwin:transform');
  }

  async render(){
    if(!this.pdfDoc)return;
    const ver=++this._renderVer;
    const sc=this.innerScale;
    const page=await this.pdfDoc.getPage(this.pageNum);
    const vp=page.getViewport({scale:sc});
    if(!this._pdfCache||this._pdfCacheSc!==sc||this._pdfCachePg!==this.pageNum){
      const off=document.createElement('canvas');
      off.width=vp.width;off.height=vp.height;
      const c=off.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,vp.width,vp.height);
      await page.render({canvasContext:c,viewport:vp}).promise;
      this._pdfCache=off;this._pdfCacheSc=sc;this._pdfCachePg=this.pageNum;
    }
    if(this._annDirty||!this._annCvs||this._annCvs.width!==vp.width||this._annCvs.height!==vp.height){
      if(!this._annCvs)this._annCvs=document.createElement('canvas');
      this._annCvs.width=vp.width;this._annCvs.height=vp.height;
      const ac=this._annCvs.getContext('2d');ac.clearRect(0,0,vp.width,vp.height);
      DrawUtil.drawAnnotations(ac,this.strokes[this.pageNum]||[],sc);
      this._annDirty=false;
    }
    if(ver!==this._renderVer)return;
    this.cvs.width=vp.width;this.cvs.height=vp.height;
    this.cvs.style.width=vp.width+'px';this.cvs.style.height=vp.height+'px';
    this.ctx.clearRect(0,0,vp.width,vp.height);
    this.ctx.drawImage(this._pdfCache,0,0);
    this.ctx.drawImage(this._annCvs,0,0);
    this._updateTransform();
    this.zlEl.textContent=Math.round(sc*100)+'%';
    this.el?.classList.remove('swn-loading');
  }

  _bindInput(){
    const cv=this.cvs;
    const isStylus=t=>(t.touchType==='stylus'||t.pointerType==='pen'||t.touchType==null);
    cv.addEventListener('touchstart',e=>{
      e.preventDefault();e.stopPropagation();
      if(e.touches.length>=2){
        const hasSt=Array.from(e.touches).some(t=>isStylus(t));
        if(hasSt||this.isDrawing)return;
        this.panSt=null;this._startPinch(e.touches);return;
      }
      const t=e.touches[0];
      if(Utils.isPalmContact(t))return;
      const needPen=['pen','hl'].includes(App.currentTool);
      if((needPen&&!isStylus(t))||App.currentTool==='sub'){this._startPan(t);return;}
      this._startDraw(t);
    },{passive:false});
    cv.addEventListener('touchmove',e=>{
      e.preventDefault();e.stopPropagation();
      if(e.touches.length>=2&&this.pinch){this._movePinch(e.touches);return;}
      if(this.panSt){this._movePan(e.touches[0]);return;}
      if(this.isDrawing)this._moveDraw(e.touches[0]);
    },{passive:false});
    cv.addEventListener('touchend',e=>{
      e.stopPropagation();
      if(this.pinch&&e.touches.length<2){this._endPinch();return;}
      if(this.panSt){this.panSt=null;return;}
      if(this.isDrawing)this._endDraw();
    });
    cv.addEventListener('wheel',e=>{
      e.preventDefault();e.stopPropagation();
      const r=e.deltaY<0?1.15:.87;
      const br=this._bodyRect(),bx=e.clientX-br.left,by=e.clientY-br.top;
      const pdfX=bx/this.innerScale+this.offX,pdfY=by/this.innerScale+this.offY;
      const ns=Math.max(.2,Math.min(8,this.innerScale*r));
      this.offX=pdfX-bx/ns;this.offY=pdfY-by/ns;
      this.innerScale=ns;this._pdfCache=null;this.render();
    },{passive:false});
  }

  _pinchDist(t){const dx=t[1].clientX-t[0].clientX,dy=t[1].clientY-t[0].clientY;return Math.sqrt(dx*dx+dy*dy);}
  _pinchMid(t){return{x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2};}
  _startPinch(t){const m=this._pinchMid(t),br=this._bodyRect(),bx=m.x-br.left,by=m.y-br.top;this.pinch={d0:this._pinchDist(t),s0:this.innerScale,pdfX:bx/this.innerScale+this.offX,pdfY:by/this.innerScale+this.offY};}
  _movePinch(t){const p=this.pinch,r=this._pinchDist(t)/p.d0,m=this._pinchMid(t),br=this._bodyRect();p.lastMx=m.x-br.left;p.lastMy=m.y-br.top;p.target=Math.max(.2,Math.min(8,p.s0*r));const tx=p.lastMx-p.pdfX*p.target,ty=p.lastMy-p.pdfY*p.target,cssR=p.target/p.s0;this.cvs.style.transformOrigin='0 0';this.cvs.style.transform=`translate(${tx}px,${ty}px) scale(${cssR})`;this.zlEl.textContent=Math.round(p.target*100)+'%';}
  _endPinch(){if(!this.pinch)return;const p=this.pinch;this.pinch=null;this.innerScale=p.target;if(p.lastMx!==undefined){this.offX=p.pdfX-p.lastMx/p.target;this.offY=p.pdfY-p.lastMy/p.target;}this.cvs.style.transform='';this._pdfCache=null;this.render();}
  _startPan(t){this.panSt={x0:t.clientX,y0:t.clientY,ox0:this.offX,oy0:this.offY};}
  _movePan(t){if(!this.panSt)return;this.offX=this.panSt.ox0-(t.clientX-this.panSt.x0)/this.innerScale;this.offY=this.panSt.oy0-(t.clientY-this.panSt.y0)/this.innerScale;this._updateTransform();}

  _startDraw(t){
    const p=this._toDocPos(t);
    if(App.currentTool==='text'){App._textAt(p.x,p.y);return;}
    if(App.currentTool==='select'){
      if(this.selectedIdx.length>0){
        const bb=this._selBBox();
        if(bb&&p.x>=bb.x1-10&&p.x<=bb.x2+10&&p.y>=bb.y1-10&&p.y<=bb.y2+10){this.isDrawing=true;this.lastX=p.x;this.lastY=p.y;return;}
        this._clearSel();
      }
      this.selPath=[{x:p.x,y:p.y}];this.isDrawing=true;return;
    }
    this.isDrawing=true;this.lastX=p.x;this.lastY=p.y;
    const tool=App.currentTool==='shape'?App.currentShape:App.currentTool;
    this.curStroke=['pen','hl','eraser'].includes(tool)
      ?{type:tool,points:[[p.x,p.y]],color:App.strokeColor,size:App.strokeSize}
      :{type:tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y,color:App.strokeColor,size:App.strokeSize};
  }
  _moveDraw(t){
    if(App.currentTool==='select'&&this.isDrawing){
      const p=this._toDocPos(t);
      if(this.selectedIdx.length>0&&!this.selPath.length){this._moveSel(p.x-this.lastX,p.y-this.lastY);this.lastX=p.x;this.lastY=p.y;this.render();this._drawSelOv();return;}
      this.selPath.push({x:p.x,y:p.y});this._drawSelPreview();return;
    }
    if(!this.curStroke)return;
    const p=this._toDocPos(t),s=this.curStroke,sc=this.innerScale;
    if(['pen','hl'].includes(s.type)){s.points.push([p.x,p.y]);DrawUtil.drawLivePen(this.ctx,s,sc);this.lastX=p.x;this.lastY=p.y;}
    else if(s.type==='eraser'){
      s.points.push([p.x,p.y]);this.lastX=p.x;this.lastY=p.y;
      const br=this._bodyRect();
      this.selCvs.width=Math.round(br.width);this.selCvs.height=Math.round(br.height);
      this.selCtx.clearRect(0,0,this.selCvs.width,this.selCvs.height);
      DrawUtil.drawEraserCursor(this.selCtx,{x:(p.x-this.offX),y:(p.y-this.offY)},s,sc,1);
    }else{
      s.x2=p.x;s.y2=p.y;
      cancelAnimationFrame(this._drawRafId);
      this._drawRafId=requestAnimationFrame(()=>this.render());
    }
  }
  _endDraw(){
    if(App.currentTool==='select'&&this.isDrawing){
      this.isDrawing=false;
      if(this.selectedIdx.length>0&&!this.selPath.length){this.render();this._drawSelOv();EventBus.emit('stroke:added');return;}
      this._finishSel();return;
    }
    if(!this.isDrawing||!this.curStroke){this.isDrawing=false;return;}
    this.isDrawing=false;
    if(!this.strokes[this.pageNum])this.strokes[this.pageNum]=[];
    const s=this.curStroke;
    if(s.type==='eraser'){
      const r=(s.size||20)*2/3;
      this.strokes[this.pageNum]=this.strokes[this.pageNum].flatMap(st=>DrawUtil.applyEraserAll(st,s.points||[],r));
    }else{
      if(this.strokes[this.pageNum].length>=MAX_STROKES_PER_PAGE)this.strokes[this.pageNum].shift();
      this.strokes[this.pageNum].push({...s,points:s.points?[...s.points]:undefined});
    }
    this.curStroke=null;this._annDirty=true;
    if(this.selCvs)this.selCtx.clearRect(0,0,this.selCvs.width,this.selCvs.height);
    this.render();EventBus.emit('stroke:added');
  }

  _bindDrag(handle){
    let dragging=false,ox=0,oy=0,ex=0,ey=0;
    const onStart=e=>{
      if(e.target.closest('.swn-close'))return;
      dragging=true;const s=e.touches?e.touches[0]:e;ox=s.clientX;oy=s.clientY;
      const r=this.el.getBoundingClientRect();ex=r.left;ey=r.top;e.preventDefault();
      SubWinManager.setActive(onMove,onEnd);
    };
    const onMove=e=>{
      if(!dragging)return;const s=e.touches?e.touches[0]:e;
      const vw=window.innerWidth,ew=this.el.offsetWidth||200;
      const newL=Math.max(0,Math.min(vw-ew,ex+s.clientX-ox));
      const newT=Math.max(0,Math.min(window.innerHeight-30,ey+s.clientY-oy));
      this.el.style.left=newL+'px';this.el.style.top=newT+'px';
    };
    const onEnd=()=>{dragging=false;SubWinManager.clearActive();};
    handle.addEventListener('touchstart',onStart,{passive:false});
    handle.addEventListener('mousedown',onStart);
    this._cleanups.push(()=>{if(dragging){dragging=false;SubWinManager.clearActive();}});
  }

  _bindResize(handle,corner){
    let dragging=false,ox=0,oy=0,w0=0,h0=0,lx0=0,ty0=0,initSc=1;
    const onStart=e=>{
      dragging=true;const s=e.touches?e.touches[0]:e;ox=s.clientX;oy=s.clientY;
      const r=this.el.getBoundingClientRect();w0=r.width;h0=r.height;lx0=r.left;ty0=r.top;
      initSc=this.innerScale;e.stopPropagation();e.preventDefault();
      SubWinManager.setActive(onMove,onEnd);
    };
    const onMove=e=>{
      if(!dragging)return;const s=e.touches?e.touches[0]:e;
      const dx=s.clientX-ox,dy=s.clientY-oy;let nW=w0,nH=h0;
      if(corner==='se'){nW=Math.max(180,w0+dx);nH=Math.max(160,h0+dy);}
      else if(corner==='sw'){nW=Math.max(180,w0-dx);nH=Math.max(160,h0+dy);this.el.style.left=(lx0+w0-nW)+'px';}
      else if(corner==='nw'){nW=Math.max(180,w0-dx);nH=Math.max(160,h0-dy);this.el.style.left=(lx0+w0-nW)+'px';this.el.style.top=(ty0+h0-nH)+'px';}
      const k=Math.max(.1,(nW-4)/Math.max(1,w0-4));
      this.winW=nW;this.winH=nH;this.el.style.width=nW+'px';this.el.style.height=nH+'px';
      this.innerScale=Math.max(.2,Math.min(8,initSc*k));
      this._pdfCache=null;clearTimeout(this._resizeTimer);
      this._resizeTimer=setTimeout(()=>this.render(),60);
    };
    const onEnd=()=>{dragging=false;SubWinManager.clearActive();};
    handle.addEventListener('touchstart',onStart,{passive:false});
    handle.addEventListener('mousedown',onStart);
  }

  _selBBox(){
    const arr=this.strokes[this.pageNum]||[];
    const bbs=this.selectedIdx.map(i=>Utils.strokeBBox(arr[i])).filter(Boolean);
    if(!bbs.length)return null;
    return{x1:Math.min(...bbs.map(b=>b.x1)),y1:Math.min(...bbs.map(b=>b.y1)),x2:Math.max(...bbs.map(b=>b.x2)),y2:Math.max(...bbs.map(b=>b.y2))};
  }
  _finishSel(){
    const arr=this.strokes[this.pageNum]||[];
    if(App.selMode==='lasso'&&this.selPath.length>=3){
      const poly=this.selPath.map(p=>[p.x,p.y]);
      this.selectedIdx=arr.reduce((a,s,i)=>{const bb=Utils.strokeBBox(s);if(!bb)return a;if(Utils.ptInPoly((bb.x1+bb.x2)/2,(bb.y1+bb.y2)/2,poly))a.push(i);return a;},[]);
    }else if(this.selPath.length>=2){
      const xs=this.selPath.map(p=>p.x),ys=this.selPath.map(p=>p.y);
      const rx1=Math.min(...xs),ry1=Math.min(...ys),rx2=Math.max(...xs),ry2=Math.max(...ys);
      this.selectedIdx=arr.reduce((a,s,i)=>{const bb=Utils.strokeBBox(s);if(!bb)return a;if(!(bb.x2<rx1||bb.x1>rx2||bb.y2<ry1||bb.y1>ry2))a.push(i);return a;},[]);
    }
    this.selPath=[];
    if(this.selCvs)this.selCtx.clearRect(0,0,this.selCvs.width,this.selCvs.height);
    this._drawSelOv();
    if(this.selectedIdx.length>0){
      App._activeSelSubWin=this;
      document.getElementById('selbtn').style.display='block';
      this._positionSelBtn();
    }
  }
  _drawSelPreview(){
    if(!this.selPath.length)return;
    const br=this._bodyRect();
    this.selCvs.width=Math.round(br.width);this.selCvs.height=Math.round(br.height);
    this.selCtx.clearRect(0,0,this.selCvs.width,this.selCvs.height);
    this.selCtx.save();
    this.selCtx.strokeStyle='#4488ff';this.selCtx.lineWidth=2;this.selCtx.setLineDash([6,4]);
    const sc=this.innerScale;
    if(App.selMode==='lasso'){
      this.selCtx.beginPath();
      this.selPath.forEach((p,i)=>{const bx=(p.x-this.offX)*sc,by=(p.y-this.offY)*sc;i?this.selCtx.lineTo(bx,by):this.selCtx.moveTo(bx,by);});
      this.selCtx.stroke();
    }else{
      const p0=this.selPath[0],p1=this.selPath[this.selPath.length-1];
      this.selCtx.strokeRect((Math.min(p0.x,p1.x)-this.offX)*sc,(Math.min(p0.y,p1.y)-this.offY)*sc,Math.abs(p1.x-p0.x)*sc,Math.abs(p1.y-p0.y)*sc);
    }
    this.selCtx.restore();
  }
  _drawSelOv(){
    const br=this._bodyRect();
    this.selCvs.width=Math.round(br.width);this.selCvs.height=Math.round(br.height);
    this.selCtx.clearRect(0,0,this.selCvs.width,this.selCvs.height);
    if(!this.selectedIdx.length)return;
    const arr=this.strokes[this.pageNum]||[],sc=this.innerScale;
    this.selCtx.save();this.selCtx.strokeStyle='#4488ff';this.selCtx.lineWidth=2;this.selCtx.setLineDash([6,3]);
    this.selectedIdx.forEach(i=>{
      const bb=Utils.strokeBBox(arr[i]);if(!bb)return;
      this.selCtx.strokeRect((bb.x1-this.offX)*sc-4,(bb.y1-this.offY)*sc-4,(bb.x2-bb.x1)*sc+8,(bb.y2-bb.y1)*sc+8);
    });
    this.selCtx.restore();
    this._positionSelBtn();
  }
  _positionSelBtn(){
    const bb=this._selBBox();if(!bb)return;
    const br=this._bodyRect(),sc=this.innerScale,btn=document.getElementById('selbtn');
    btn.style.left=Math.max(0,br.left+(bb.x1-this.offX)*sc-4)+'px';
    btn.style.top=Math.max(0,br.top+(bb.y2-this.offY)*sc+6)+'px';
  }
  _moveSel(dx,dy){
    const arr=this.strokes[this.pageNum]||[];
    this.selectedIdx.forEach(i=>{const s=arr[i];if(!s)return;if(s.points)s.points=s.points.map(p=>[p[0]+dx,p[1]+dy]);if(s.x1!==undefined){s.x1+=dx;s.y1+=dy;s.x2+=dx;s.y2+=dy;}if(s.type==='text'){s.x+=dx;s.y+=dy;}});
  }
  _clearSel(){
    this.selectedIdx=[];this.selPath=[];
    if(this.selCvs)this.selCtx.clearRect(0,0,this.selCvs.width,this.selCvs.height);
    document.getElementById('selbtn').style.display='none';
    if(App._activeSelSubWin===this)App._activeSelSubWin=null;
  }
  deleteSelected(){
    if(!this.selectedIdx.length)return;
    this.strokes[this.pageNum]=(this.strokes[this.pageNum]||[]).filter((_,i)=>!this.selectedIdx.includes(i));
    this.selectedIdx=[];this._annDirty=true;
    if(this.selCvs)this.selCtx.clearRect(0,0,this.selCvs.width,this.selCvs.height);
    document.getElementById('selbtn').style.display='none';
    if(App._activeSelSubWin===this)App._activeSelSubWin=null;
    this.render();EventBus.emit('stroke:added');
  }
  update(strokes,pageNum){
    if(!Logger.flags.subWindowUpdate)return;
    this.strokes=strokes;this._annDirty=true;
    if(pageNum!==undefined&&pageNum!==this.pageNum){this.pageNum=pageNum;this._pdfCache=null;}
    this.render();
  }
  close(){
    this._cleanups.forEach(fn=>fn());this._cleanups=[];
    document.body.removeChild(this.el);
    SubWinManager.remove(this);
    this.pdfDoc=null;this.strokes=null;
    EventBus.emit('subwin:transform');
  }
}

/* ============================================================
   Module: App (メインコントローラー)
   責務: PDF描画・座標変換・入力ハンドリング・ツール管理・タブ連携
   ============================================================ */
const App=(() => {
  /* DOM */
  const caEl=document.getElementById('ca');
  const cwEl=document.getElementById('cw');
  const pdfCvs=document.getElementById('pdfCvs');
  const annCvs=document.getElementById('annCvs');
  const ovlCvs=document.getElementById('ovlCvs');
  const pdfCtx=pdfCvs.getContext('2d');
  const annCtx=annCvs.getContext('2d');
  const ovlCtx=ovlCvs.getContext('2d');

  /* 状態 */
  let pdfDoc=null,origBuf=null,fileName='';
  let curPage=1,totalPages=0,scale=1;
  let strokes={};
  let renderScale=1,cssExtraZoom=1;
  let curStroke=null,isDrawing=false,lastX=0,lastY=0;
  let pinch=null,panSt=null;
  let selectedIdx=[],selPath=[];
  let subRect=null;
  let renderVer=0;
  let panX=16,panY=16;
  let velHist=[],rafId=null;
  let _wheelTimer=null,_offscr=null;
  let _pdfLoadingLock=false;
  let _subCreating=false;
  let _fileHandle=null;
  let _postLoadFn=null;
  let _docId=null;
  let _txX=0,_txY=0;

  /* ツール状態 */
  let _activeTool='pen',_activeShape='arrow',_selMode='rect';
  let _strokeColor='#cc2020',_strokeSize=3;
  const _toolSizes={...TOOL_DEFAULT_SIZES};
  const _penColors={pen:'#cc2020',hl:'#ffd700'};

  /* 選択コンテキスト */
  let _activeSelSubWin=null;

  /* ページキャッシュ */
  const _pageCache=new Map();

  /* --- Transform --- */
  function _updateTransform(){
    cwEl.style.transformOrigin='0 0';
    cwEl.style.transform=Math.abs(cssExtraZoom-1)>0.0005
      ?`translate(${panX}px,${panY}px) scale(${cssExtraZoom})`
      :`translate(${panX}px,${panY}px)`;
  }
  function _visualW(){return(parseFloat(pdfCvs.style.width)||pdfCvs.width)*cssExtraZoom;}
  function _visualH(){return(parseFloat(pdfCvs.style.height)||pdfCvs.height)*cssExtraZoom;}
  function _clampPan(){
    const m=60,aW=caEl.clientWidth||1,aH=caEl.clientHeight||1;
    panX=Math.max(-(_visualW()-m),Math.min(aW-m,panX));
    panY=Math.max(-(_visualH()-m),Math.min(aH-m,panY));
  }
  function _centerCanvas(){
    const aW=caEl.clientWidth||1,aH=caEl.clientHeight||1;
    panX=Math.max(16,(aW-_visualW())/2);panY=Math.max(16,(aH-_visualH())/2);
    _updateTransform();
  }
  function _cancelInertia(){cancelAnimationFrame(rafId);rafId=null;}

  /* --- 座標変換 --- */
  function _getDocPos(src){
    const r=caEl.getBoundingClientRect();
    return{x:(src.clientX-r.left-panX)/scale,y:(src.clientY-r.top-panY)/scale};
  }
  function _isOnCanvas(src){
    const r=caEl.getBoundingClientRect();
    const rx=src.clientX-r.left-panX,ry=src.clientY-r.top-panY;
    return rx>=-20&&rx<=_visualW()+20&&ry>=-20&&ry<=_visualH()+20;
  }

  /* --- サブ窓オーバーレイ --- */
  function _drawSubOverlays(){
    if(!pdfDoc||!SubWinManager.count())return;
    const sc=renderScale,invEZ=1/cssExtraZoom;
    SubWinManager.getAll().forEach(sw=>{
      const br=sw.body.getBoundingClientRect();if(!br.width||!br.height)return;
      const rX1=sw.offX*sc,rY1=sw.offY*sc;
      const rW=(br.width/sw.innerScale)*sc,rH=(br.height/sw.innerScale)*sc;
      ovlCtx.save();
      ovlCtx.fillStyle=sw.swFill||'rgba(240,120,0,.12)';ovlCtx.fillRect(rX1,rY1,rW,rH);
      ovlCtx.strokeStyle=sw.swColor||'#f07800';ovlCtx.lineWidth=2*invEZ;ovlCtx.setLineDash([8*invEZ,4*invEZ]);
      ovlCtx.strokeRect(rX1,rY1,rW,rH);ovlCtx.restore();
    });
  }

  /* --- redraw (アノテーション再描画) --- */
  function redraw(){
    if(!Logger.flags.redraw)return;
    annCtx.clearRect(0,0,annCvs.width,annCvs.height);
    if(Logger.flags.annotationDraw)DrawUtil.drawAnnotations(annCtx,strokes[curPage]||[],renderScale);
    if(Logger.flags.overlay)_drawSelOv();
  }

  /* --- renderPage --- */
  async function renderPage(num){
    if(!Logger.flags.pdfRender)return;
    if(!pdfDoc)return;
    const ver=++renderVer;
    let page=_pageCache.get(num);
    if(!page){page=await pdfDoc.getPage(num);_pageCache.set(num,page);}
    const vp1=page.getViewport({scale:1});
    const maxDim=Math.max(vp1.width,vp1.height);
    renderScale=Math.min(scale,MAX_CANVAS/maxDim);
    cssExtraZoom=scale/renderScale;
    const vp=page.getViewport({scale:renderScale});
    const dpr=Math.min(window.devicePixelRatio||1,PDF_MAX_DPR);
    const hiRS=Math.min(renderScale*dpr,(4096-4)/maxDim);
    const hiVP=page.getViewport({scale:hiRS});
    if(!_offscr||_offscr.width!==hiVP.width||_offscr.height!==hiVP.height){
      _offscr=document.createElement('canvas');_offscr.width=hiVP.width;_offscr.height=hiVP.height;
    }
    const offCtx=_offscr.getContext('2d');
    offCtx.fillStyle='#fff';offCtx.fillRect(0,0,hiVP.width,hiVP.height);
    await page.render({canvasContext:offCtx,viewport:hiVP}).promise;
    if(ver!==renderVer)return;
    pdfCvs.width=hiVP.width;pdfCvs.height=hiVP.height;
    pdfCvs.style.width=vp.width+'px';pdfCvs.style.height=vp.height+'px';
    [annCvs,ovlCvs].forEach(c=>{c.width=vp.width;c.height=vp.height;});
    pdfCtx.drawImage(_offscr,0,0);
    redraw();_clearSel();_clampPan();
    requestAnimationFrame(()=>{_clampPan();_updateTransform();});
    document.getElementById('pgn').value=num;
    document.getElementById('zlbl').textContent=Math.round(scale*100)+'%';
  }

  /* --- 選択 --- */
  function _selBBox(){
    const arr=strokes[curPage]||[];
    const bbs=selectedIdx.map(i=>Utils.strokeBBox(arr[i])).filter(Boolean);
    if(!bbs.length)return null;
    return{x1:Math.min(...bbs.map(b=>b.x1)),y1:Math.min(...bbs.map(b=>b.y1)),x2:Math.max(...bbs.map(b=>b.x2)),y2:Math.max(...bbs.map(b=>b.y2))};
  }
  function _finishSel(){
    const arr=strokes[curPage]||[];
    if(_selMode==='rect'&&selPath.length>=2){
      const xs=selPath.map(p=>p.x),ys=selPath.map(p=>p.y);
      const rx1=Math.min(...xs),ry1=Math.min(...ys),rx2=Math.max(...xs),ry2=Math.max(...ys);
      selectedIdx=arr.reduce((a,s,i)=>{const bb=Utils.strokeBBox(s);if(!bb)return a;if(!(bb.x2<rx1||bb.x1>rx2||bb.y2<ry1||bb.y1>ry2))a.push(i);return a;},[]);
    }else if(_selMode==='lasso'&&selPath.length>=3){
      const poly=selPath.map(p=>[p.x,p.y]);
      selectedIdx=arr.reduce((a,s,i)=>{const bb=Utils.strokeBBox(s);if(!bb)return a;if(Utils.ptInPoly((bb.x1+bb.x2)/2,(bb.y1+bb.y2)/2,poly))a.push(i);return a;},[]);
    }
    selPath=[];ovlCtx.clearRect(0,0,ovlCvs.width,ovlCvs.height);
    _drawSelOv();
    document.getElementById('selbtn').style.display=selectedIdx.length?'block':'none';
  }
  function _drawSelPreview(){
    ovlCtx.clearRect(0,0,ovlCvs.width,ovlCvs.height);_drawSubOverlays();if(!selPath.length)return;
    const sc=renderScale,invEZ=1/cssExtraZoom;
    ovlCtx.save();ovlCtx.strokeStyle='#4488ff';ovlCtx.lineWidth=2*invEZ;ovlCtx.setLineDash([6*invEZ,4*invEZ]);
    if(_selMode==='rect'){
      const p0=selPath[0],p1=selPath[selPath.length-1];
      ovlCtx.strokeRect(Math.min(p0.x,p1.x)*sc,Math.min(p0.y,p1.y)*sc,Math.abs(p1.x-p0.x)*sc,Math.abs(p1.y-p0.y)*sc);
    }else{
      ovlCtx.beginPath();selPath.forEach((p,i)=>i?ovlCtx.lineTo(p.x*sc,p.y*sc):ovlCtx.moveTo(p.x*sc,p.y*sc));ovlCtx.stroke();
    }
    ovlCtx.restore();
  }
  function _drawSelOv(){
    ovlCtx.clearRect(0,0,ovlCvs.width,ovlCvs.height);_drawSubOverlays();
    if(!selectedIdx.length)return;
    const arr=strokes[curPage]||[],sc=renderScale,invEZ=1/cssExtraZoom;
    ovlCtx.save();ovlCtx.strokeStyle='#4488ff';ovlCtx.lineWidth=2*invEZ;ovlCtx.setLineDash([6*invEZ,3*invEZ]);
    selectedIdx.forEach(i=>{const bb=Utils.strokeBBox(arr[i]);if(!bb)return;ovlCtx.strokeRect(bb.x1*sc-4*invEZ,bb.y1*sc-4*invEZ,(bb.x2-bb.x1)*sc+8*invEZ,(bb.y2-bb.y1)*sc+8*invEZ);});
    ovlCtx.restore();
    const bb=_selBBox();
    if(bb){const wr=cwEl.getBoundingClientRect(),btn=document.getElementById('selbtn');btn.style.left=Math.max(0,wr.left+bb.x1*scale-4)+'px';btn.style.top=Math.max(0,wr.top+bb.y2*scale+6)+'px';}
  }
  function _moveSel(dx,dy){
    const arr=strokes[curPage]||[];
    selectedIdx.forEach(i=>{const s=arr[i];if(!s)return;if(s.points)s.points=s.points.map(p=>[p[0]+dx,p[1]+dy]);if(s.x1!==undefined){s.x1+=dx;s.y1+=dy;s.x2+=dx;s.y2+=dy;}if(s.type==='text'){s.x+=dx;s.y+=dy;}});
  }
  function _clearSel(){
    selectedIdx=[];selPath=[];
    ovlCtx.clearRect(0,0,ovlCvs.width,ovlCvs.height);_drawSubOverlays();
    document.getElementById('selbtn').style.display='none';
  }

  /* --- タッチハンドラ --- */
  caEl.addEventListener('touchstart',e=>{
    if(!pdfDoc)return;e.preventDefault();_cancelInertia();
    if(e.touches.length>=2){
      const hasSt=Array.from(e.touches).some(t=>t.touchType==='stylus');
      if(hasSt||isDrawing)return;
      isDrawing=false;curStroke=null;panSt=null;_startPinch(e.touches);return;
    }
    const t=e.touches[0];
    if(Utils.isPalmContact(t))return;
    if(!_isOnCanvas(t)){_startPan(t);return;}
    const needPen=['pen','hl'].includes(_activeTool);
    if(needPen&&t.touchType!=='stylus'){_startPan(t);return;}
    _startDraw(e);
  },{passive:false});
  caEl.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(!Logger.flags.touchMove)return;
    if(e.touches.length>=2&&pinch){_movePinch(e.touches);return;}
    const t=e.touches[0];
    if(panSt){_movePan(t);return;}
    if(isDrawing)_moveDraw(e);
  },{passive:false});
  caEl.addEventListener('touchend',e=>{
    if(pinch&&e.touches.length<2){_endPinch();return;}
    if(panSt){_endPan(e.changedTouches[0]);return;}
    if(isDrawing)_endDraw(e);
  });
  caEl.addEventListener('mousedown',e=>{if(pdfDoc){_cancelInertia();_startDraw(e);}});
  caEl.addEventListener('mousemove',e=>{if(isDrawing)_moveDraw(e);else if(panSt)_movePan(e);});
  caEl.addEventListener('mouseup',e=>{if(isDrawing)_endDraw(e);else if(panSt)_endPan(e);});
  caEl.addEventListener('wheel',e=>{
    if(!Logger.flags.wheelZoom){e.preventDefault();return;}
    if(!pdfDoc)return;e.preventDefault();
    const r=e.deltaY<0?1.15:.87;
    const cr=caEl.getBoundingClientRect();
    const vx=e.clientX-cr.left,vy=e.clientY-cr.top;
    const pdfX=(vx-panX)/scale,pdfY=(vy-panY)/scale;
    scale=Math.max(.2,Math.min(MAX_SCALE,scale*r));
    panX=vx-pdfX*scale;panY=vy-pdfY*scale;_clampPan();
    const pEZ=scale/renderScale;
    cwEl.style.transformOrigin='0 0';cwEl.style.transform=`translate(${panX}px,${panY}px) scale(${pEZ})`;
    document.getElementById('zlbl').textContent=Math.round(scale*100)+'%';
    clearTimeout(_wheelTimer);_wheelTimer=setTimeout(()=>renderPage(curPage),150);
  },{passive:false});

  /* --- ピンチ --- */
  function _pinchDist(t){const dx=t[1].clientX-t[0].clientX,dy=t[1].clientY-t[0].clientY;return Math.sqrt(dx*dx+dy*dy);}
  function _pinchMid(t){return{x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2};}
  function _startPinch(t){const m=_pinchMid(t),cr=caEl.getBoundingClientRect(),bx=m.x-cr.left,by=m.y-cr.top;pinch={d0:_pinchDist(t),s0:scale,target:scale,pdfX:(bx-panX)/scale,pdfY:(by-panY)/scale};}
  function _movePinch(t){
    const p=pinch,r=_pinchDist(t)/p.d0,m=_pinchMid(t),cr=caEl.getBoundingClientRect();
    const M1x=m.x-cr.left,M1y=m.y-cr.top;
    p.target=Math.max(.2,Math.min(MAX_SCALE,p.s0*r));
    panX=M1x-p.pdfX*p.target;panY=M1y-p.pdfY*p.target;
    const pEZ=p.target/renderScale;
    cwEl.style.transformOrigin='0 0';cwEl.style.transform=`translate(${panX}px,${panY}px) scale(${pEZ})`;
    document.getElementById('zlbl').textContent=Math.round(p.target*100)+'%';
  }
  function _endPinch(){if(!pinch)return;scale=pinch.target;pinch=null;renderPage(curPage);}

  /* --- パン + 慣性 --- */
  function _startPan(t){panSt={x0:t.clientX,y0:t.clientY,px0:panX,py0:panY};velHist=[];}
  function _movePan(t){
    if(!panSt)return;
    velHist.push({x:t.clientX,y:t.clientY,tm:Date.now()});if(velHist.length>6)velHist.shift();
    panX=panSt.px0+(t.clientX-panSt.x0);panY=panSt.py0+(t.clientY-panSt.y0);
    _clampPan();_updateTransform();
  }
  function _endPan(t){
    if(!panSt)return;panSt=null;
    if(velHist.length>=2){
      const n=velHist[velHist.length-1],f=velHist[0],dt=Math.max(1,n.tm-f.tm);
      let vx=(n.x-f.x)/dt*14,vy=(n.y-f.y)/dt*14;
      const step=()=>{
        if(!Logger.flags.raf)return;
        if(Math.abs(vx)<.4&&Math.abs(vy)<.4)return;
        panX+=vx;panY+=vy;_clampPan();_updateTransform();
        vx*=.9;vy*=.9;rafId=requestAnimationFrame(step);
      };
      rafId=requestAnimationFrame(step);
    }
  }

  /* --- 描画 --- */
  function _startDraw(e){
    const t=e.touches?e.touches[0]:e;
    const p=_getDocPos(t);
    if(_activeTool==='text'){_textAt(p.x,p.y);return;}
    if(_activeTool==='select'){
      if(selectedIdx.length>0){
        const bb=_selBBox();
        if(bb&&p.x>=bb.x1-10/scale&&p.x<=bb.x2+10/scale&&p.y>=bb.y1-10/scale&&p.y<=bb.y2+10/scale){isDrawing=true;lastX=p.x;lastY=p.y;return;}
        else _clearSel();
      }
      selPath=[{x:p.x,y:p.y}];isDrawing=true;return;
    }
    if(_activeTool==='sub'){
      subRect={x1:p.x,y1:p.y,x2:p.x,y2:p.y};isDrawing=true;return;
    }
    isDrawing=true;lastX=p.x;lastY=p.y;
    const tool=_activeTool==='shape'?_activeShape:_activeTool;
    curStroke=['pen','hl','eraser'].includes(tool)
      ?{type:tool,points:[[p.x,p.y]],color:_strokeColor,size:_strokeSize}
      :{type:tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y,color:_strokeColor,size:_strokeSize};
  }
  function _moveDraw(e){
    const t=e.touches?e.touches[0]:e;
    const p=_getDocPos(t);
    const sc=renderScale,invEZ=1/cssExtraZoom;
    if(_activeTool==='select'){
      if(selectedIdx.length>0&&!selPath.length){_moveSel(p.x-lastX,p.y-lastY);lastX=p.x;lastY=p.y;redraw();_drawSelOv();return;}
      selPath.push({x:p.x,y:p.y});_drawSelPreview();return;
    }
    if(_activeTool==='sub'&&subRect){
      subRect.x2=p.x;subRect.y2=p.y;
      ovlCtx.clearRect(0,0,ovlCvs.width,ovlCvs.height);
      ovlCtx.save();ovlCtx.strokeStyle='#f07800';ovlCtx.lineWidth=2*invEZ;ovlCtx.setLineDash([8*invEZ,4*invEZ]);
      ovlCtx.strokeRect(subRect.x1*sc,subRect.y1*sc,(subRect.x2-subRect.x1)*sc,(subRect.y2-subRect.y1)*sc);
      ovlCtx.fillStyle='rgba(240,120,0,.08)';ovlCtx.fillRect(subRect.x1*sc,subRect.y1*sc,(subRect.x2-subRect.x1)*sc,(subRect.y2-subRect.y1)*sc);
      ovlCtx.restore();return;
    }
    if(!curStroke)return;
    const s=curStroke;
    if(['pen','hl'].includes(s.type)){s.points.push([p.x,p.y]);DrawUtil.drawLivePen(annCtx,s,sc);lastX=p.x;lastY=p.y;}
    else if(s.type==='eraser'){
      s.points.push([p.x,p.y]);lastX=p.x;lastY=p.y;
      ovlCtx.clearRect(0,0,ovlCvs.width,ovlCvs.height);_drawSubOverlays();
      DrawUtil.drawEraserCursor(ovlCtx,p,s,sc,invEZ);
    }else{
      s.x2=p.x;s.y2=p.y;
      ovlCtx.clearRect(0,0,ovlCvs.width,ovlCvs.height);_drawSubOverlays();
      DrawUtil.drawStroke(s,ovlCtx,sc);
    }
  }
  function _endDraw(e){
    isDrawing=false;
    if(_activeTool==='select'){
      if(selectedIdx.length>0&&!selPath.length){_drawSelOv();EventBus.emit('stroke:added');return;}
      _finishSel();return;
    }
    if(_activeTool==='sub'&&subRect){
      const r={x1:Math.min(subRect.x1,subRect.x2),y1:Math.min(subRect.y1,subRect.y2),x2:Math.max(subRect.x1,subRect.x2),y2:Math.max(subRect.y1,subRect.y2)};
      if((r.x2-r.x1)>10/scale&&(r.y2-r.y1)>10/scale){
        if(SubWinManager.count()>=MAX_SUBWIN){showToast(`サブ窓は最大${MAX_SUBWIN}つです`);}
        else if(!_subCreating){
          _subCreating=true;setTimeout(()=>{_subCreating=false;},400);
          const cr=caEl.getBoundingClientRect();
          const sx=cr.left+panX+r.x1*scale,sy=cr.top+panY+r.y1*scale;
          new SubWin(pdfDoc,strokes,curPage,r,sx,sy,scale);
        }
      }
      subRect=null;ovlCtx.clearRect(0,0,ovlCvs.width,ovlCvs.height);
      setTool('pen');return;
    }
    if(curStroke?.type==='eraser'){
      const er=curStroke,r=(er.size||20)*2/3;
      strokes[curPage]=(strokes[curPage]||[]).flatMap(s=>DrawUtil.applyEraserAll(s,er.points||[],r));
      curStroke=null;ovlCtx.clearRect(0,0,ovlCvs.width,ovlCvs.height);
      redraw();_drawSelOv();SubWinManager.updateAll(strokes,curPage);
      EventBus.emit('stroke:added');return;
    }
    if(!curStroke)return;
    if(!strokes[curPage])strokes[curPage]=[];
    if(strokes[curPage].length>=MAX_STROKES_PER_PAGE){strokes[curPage].shift();showToast('⚠️ ストローク上限に達しました');}
    strokes[curPage].push({...curStroke,points:curStroke.points?[...curStroke.points]:undefined});
    curStroke=null;redraw();SubWinManager.updateAll(strokes,curPage);
    EventBus.emit('stroke:added');
  }

  function _textAt(x,y){_txX=x;_txY=y;document.getElementById('txfld').value='';document.getElementById('txov').classList.add('on');}

  /* --- ページ操作 --- */
  async function gotoPage(d,abs=false){
    if(!pdfDoc)return;
    const n=abs?Math.max(1,Math.min(totalPages,d)):curPage+d;
    if(n<1||n>totalPages)return;
    curPage=n;await renderPage(n);
    SubWinManager.updateAll(strokes,n);EventBus.emit('stroke:added');
  }
  async function fit(){
    if(!pdfDoc)return;
    const page=await pdfDoc.getPage(curPage);
    const vp=page.getViewport({scale:1});
    const aW=caEl.clientWidth||1,aH=caEl.clientHeight||1;
    scale=Math.max(.2,Math.min((aW-32)/vp.width,(aH-32)/vp.height));
    await renderPage(curPage);_centerCanvas();
  }
  function undo(){
    const a=strokes[curPage];
    if(!a||!a.length){showToast('操作がありません');return;}
    a.pop();redraw();SubWinManager.updateAll(strokes,curPage);EventBus.emit('stroke:added');
  }
  function deleteSelected(){
    if(_activeSelSubWin){_activeSelSubWin.deleteSelected();return;}
    if(!selectedIdx.length)return;
    strokes[curPage]=(strokes[curPage]||[]).filter((_,i)=>!selectedIdx.includes(i));
    _clearSel();redraw();SubWinManager.updateAll(strokes,curPage);EventBus.emit('stroke:added');
  }

  /* --- ツール設定 --- */
  function setTool(tool){
    _activeTool=tool;
    if(tool==='shape')_strokeColor=_penColors.pen;
    else if(tool==='hl')_strokeColor=_penColors.hl;
    else if(tool==='pen')_strokeColor=_penColors.pen;
    _strokeSize=_toolSizes[tool==='shape'?_activeShape:tool]||3;
    _updateToolUI();
  }
  function setShape(shape){_activeShape=shape;_strokeSize=_toolSizes[shape]||2;_updateToolUI();}
  function setColor(c){
    _strokeColor=c;
    if(_activeTool==='hl')_penColors.hl=c;else _penColors.pen=c;
  }
  function setSize(sz){
    _strokeSize=sz;
    const k=_activeTool==='shape'?_activeShape:_activeTool;
    _toolSizes[k]=sz;
    document.getElementById('sz-v').textContent=sz;
  }
  function _updateToolUI(){
    ['pen','hl','eraser','text','select','sub'].forEach(t=>{
      const btn=document.getElementById('t-'+t);if(btn)btn.classList.toggle('on',_activeTool===t);
    });
    document.getElementById('t-shape')?.classList.toggle('on',_activeTool==='shape');
    document.getElementById('sz-v').textContent=_strokeSize;
  }

  /* --- PDF読込 --- */
  async function loadPDF(file,buf){
    if(_pdfLoadingLock){Logger.warn('[App] loadPDF: 読込中のため無視');return;}
    _pdfLoadingLock=true;showLoading(true);
    try{
      origBuf=buf||await file.arrayBuffer();
      fileName=file.name;
      document.getElementById('fnlbl').textContent=fileName;
      pdfDoc=await pdfjsLib.getDocument({data:origBuf.slice(0)}).promise;
      totalPages=pdfDoc.numPages;
      document.getElementById('tpn').textContent=totalPages;
      curPage=1;panX=16;panY=16;scale=1;renderScale=1;cssExtraZoom=1;
      _pageCache.clear();SubWinManager.closeAll();
      document.getElementById('dz').style.display='none';
      _hideHome();cwEl.style.display='block';
      /* 書き込みデータ復元: IDB → 新規 */
      const saved=await IDBStore.get('f:'+Utils.safeKey(file.name));
      strokes=Utils.pruneEraserStrokes(saved?.strokes||{});
      await renderPage(1);await fit();
      if(saved?.strokes&&Object.keys(saved.strokes).length>0)showToast('📝 書き込みデータを復元しました');
      /* DocMgr登録 */
      _docId=await DocMgr.open(file.name,origBuf,strokes,1);
      IDBStore.enqueue([['resume:buf:'+Utils.safeKey(file.name),origBuf]]);
      _postLoadFn?.();
      EventBus.emit('stroke:added');
    }catch(e){showToast('読み込みに失敗しました');Logger.error(e);}
    showLoading(false);_pdfLoadingLock=false;
  }

  async function closeFile(){
    if(pdfDoc&&!confirm('閉じますか？（保存済みデータは残ります）'))return;
    pdfDoc=null;origBuf=null;fileName='';curPage=1;totalPages=0;strokes={};_docId=null;
    [pdfCvs,annCvs,ovlCvs].forEach(c=>{c.width=1;c.height=1;});
    cwEl.style.display='none';
    _showHome();
    document.getElementById('fnlbl').textContent='ファイル未選択';
    document.getElementById('tpn').textContent='0';
    document.getElementById('zlbl').textContent='--';
    SubWinManager.closeAll();_fileHandle=null;renderScale=1;cssExtraZoom=1;
    DocMgr.reset();
  }

  /* --- 起動時復元 --- */
  async function restore(saved){
    origBuf=saved.buf;fileName=saved.file;
