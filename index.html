    document.getElementById('fnlbl').textContent=fileName;
    pdfDoc=await pdfjsLib.getDocument({data:saved.buf.slice(0)}).promise;
    totalPages=pdfDoc.numPages;
    document.getElementById('tpn').textContent=totalPages;
    strokes=Utils.pruneEraserStrokes(saved.strokes||{});
    if(saved.docId){_docId=saved.docId;DocMgr.setId(saved.docId);}
    curPage=saved.page||1;scale=saved.scale||1;renderScale=1;cssExtraZoom=1;
    document.getElementById('dz').style.display='none';
    cwEl.style.display='block';
    await renderPage(curPage);
    if(saved.panX!=null&&saved.panY!=null){panX=saved.panX;panY=saved.panY;_clampPan();_updateTransform();}
    else _centerCanvas();
    if(saved.subWinStates?.length)SubWinManager.thawAll(saved.subWinStates,pdfDoc,strokes);
  }

  /* --- ホーム画面 --- */
  function _showHome(){
    document.getElementById('home').style.display='flex';
    document.getElementById('dz').style.display='none';
    _renderHomeList();
  }
  function _hideHome(){document.getElementById('home').style.display='none';}
  function showHome(){if(!pdfDoc)_showHome();}

  async function _renderHomeList(){
    const listEl=document.getElementById('home-list');
    const emptyEl=document.getElementById('home-empty');
    listEl.innerHTML='';
    const docs=await DocMgr.list();
    if(!docs.length){emptyEl.style.display='flex';listEl.style.display='none';return;}
    emptyEl.style.display='none';listEl.style.display='grid';
    docs.forEach(doc=>{
      const card=document.createElement('div');card.className='home-card';
      const dt=new Date(doc.updatedAt).toLocaleDateString('ja-JP');
      card.innerHTML=`<div class="home-card-icon">📄</div><div class="home-card-name">${doc.name}</div><div class="home-card-date">${dt}</div><button class="home-card-del" title="削除">✕</button>`;
      card.addEventListener('click',async e=>{
        if(e.target.classList.contains('home-card-del'))return;
        const fullDoc=await DocMgr.get(doc.id);
        if(!fullDoc?.originalPdfBytes){showToast('PDFデータが見つかりません');return;}
        const f=new File([fullDoc.originalPdfBytes],doc.name,{type:'application/pdf'});
        _hideHome();await loadPDF(f,fullDoc.originalPdfBytes);
        if(fullDoc.strokes)strokes=Utils.pruneEraserStrokes(fullDoc.strokes);
        if(fullDoc.currentPage)await gotoPage(fullDoc.currentPage,true);
        redraw();
      });
      card.querySelector('.home-card-del').addEventListener('click',async e=>{
        e.stopPropagation();
        if(!confirm(`「${doc.name}」の書き込みデータを削除しますか？`))return;
        await DocMgr.remove(doc.id);_renderHomeList();
      });
      listEl.appendChild(card);
    });
  }

  /* --- PDF出力 --- */
  async function exportPDF(pageNums){
    if(!pdfDoc||!origBuf){showToast('PDFが開かれていません');return;}
    showLoading(true);
    try{
      const {PDFDocument,rgb,LineCapStyle}=PDFLib;
      const srcDoc=await PDFDocument.load(origBuf);
      const outDoc=await PDFDocument.create();
      for(const pg of pageNums){
        if(pg<1||pg>totalPages)continue;
        const[copiedPage]=await outDoc.copyPages(srcDoc,[pg-1]);
        outDoc.addPage(copiedPage);
        const page=copiedPage;
        const{width,height}=page.getSize();
        const pdfPage=await pdfDoc.getPage(pg);
        const vp1=pdfPage.getViewport({scale:1});
        const sc=width/vp1.width;
        const pgStrokes=strokes[pg]||[];
        for(const s of pgStrokes){
          if(s.type==='pen'||s.type==='hl'){
            if(!s.points?.length)continue;
            const alpha=s.type==='hl'?.38:1;
            const c=_hexToRgb(s.color);
            const lw=s.size*sc/3;
            for(let i=1;i<s.points.length;i++){
              page.drawLine({start:{x:s.points[i-1][0]*sc,y:height-s.points[i-1][1]*sc},end:{x:s.points[i][0]*sc,y:height-s.points[i][1]*sc},thickness:s.type==='hl'?Math.max(lw*4,5*sc/3):lw,color:rgb(c.r/255,c.g/255,c.b/255),opacity:alpha,lineCap:LineCapStyle.Round});
            }
          }else if(s.type==='text'){
            const c=_hexToRgb(s.color);
            page.drawText(s.text||'',{x:s.x*sc,y:height-s.y*sc,size:s.size*6*sc,color:rgb(c.r/255,c.g/255,c.b/255)});
          }else if(['rect','circle','line','arrow'].includes(s.type)){
            const c=_hexToRgb(s.color);const lw=s.size*sc/3;
            if(s.type==='rect'){page.drawRectangle({x:Math.min(s.x1,s.x2)*sc,y:height-Math.max(s.y1,s.y2)*sc,width:Math.abs(s.x2-s.x1)*sc,height:Math.abs(s.y2-s.y1)*sc,borderColor:rgb(c.r/255,c.g/255,c.b/255),borderWidth:lw});}
            else if(s.type==='line'||s.type==='arrow'){
              page.drawLine({start:{x:s.x1*sc,y:height-s.y1*sc},end:{x:s.x2*sc,y:height-s.y2*sc},thickness:lw,color:rgb(c.r/255,c.g/255,c.b/255)});
              if(s.type==='arrow'){const hl=Math.max(lw*4,12*sc),ang=Math.atan2(-(s.y2-s.y1),(s.x2-s.x1));const x2=s.x2*sc,y2=height-s.y2*sc;page.drawLine({start:{x:x2,y:y2},end:{x:x2-hl*Math.cos(ang-Math.PI/6),y:y2+hl*Math.sin(ang-Math.PI/6)},thickness:lw,color:rgb(c.r/255,c.g/255,c.b/255)});page.drawLine({start:{x:x2,y:y2},end:{x:x2-hl*Math.cos(ang+Math.PI/6),y:y2+hl*Math.sin(ang+Math.PI/6)},thickness:lw,color:rgb(c.r/255,c.g/255,c.b/255)});}
            }
          }
        }
      }
      const bytes=await outDoc.save();
      const blob=new Blob([bytes],{type:'application/pdf'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download=(fileName.replace(/\.pdf$/i,'')||'output')+'_注釈付.pdf';
      a.click();URL.revokeObjectURL(a.href);
      showToast('📤 PDF出力完了');
    }catch(e){showToast('PDF出力に失敗しました');Logger.error(e);}
    showLoading(false);
  }

  function _hexToRgb(hex){const r=parseInt(hex.slice(1,3),16)||0,g=parseInt(hex.slice(3,5),16)||0,b=parseInt(hex.slice(5,7),16)||0;return{r,g,b};}

  /* --- バックアップ / 復元 --- */
  async function downloadBackup(){
    if(!pdfDoc||!origBuf){showToast('PDFが開かれていません');return;}
    showLoading(true);
    try{
      const zip=new JSZip();
      zip.file(fileName,origBuf);
      zip.file('strokes.json',JSON.stringify(strokes));
      zip.file('meta.json',JSON.stringify({fileName,curPage,scale,panX,panY,version:'v1',ts:Date.now()}));
      const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download=(fileName.replace(/\.pdf$/i,'')||'backup')+'_backup.zip';
      a.click();URL.revokeObjectURL(a.href);
      AutoSave.clearDirty();showToast('💾 バックアップ完了');
    }catch(e){showToast('バックアップに失敗しました');Logger.error(e);}
    showLoading(false);
  }

  async function restoreFromZip(file){
    showLoading(true);
    try{
      const zip=await JSZip.loadAsync(await file.arrayBuffer());
      let pdfFile=null,strokesData=null,meta=null;
      zip.forEach((path,f)=>{if(path.endsWith('.pdf'))pdfFile=f;if(path==='strokes.json')strokesData=f;if(path==='meta.json')meta=f;});
      if(!pdfFile){showToast('ZIP内にPDFが見つかりません');showLoading(false);return;}
      const pdfBuf=await pdfFile.async('arraybuffer');
      const fn=pdfFile.name;
      const metaData=meta?JSON.parse(await meta.async('string')):null;
      const strkData=strokesData?JSON.parse(await strokesData.async('string')):{};
      const f=new File([pdfBuf],metaData?.fileName||fn,{type:'application/pdf'});
      await loadPDF(f,pdfBuf);
      strokes=Utils.pruneEraserStrokes(strkData);
      if(metaData?.curPage)await gotoPage(metaData.curPage,true);
      if(metaData?.scale){scale=metaData.scale;await renderPage(curPage);}
      redraw();showToast('📂 復元完了');
    }catch(e){showToast('復元に失敗しました');Logger.error(e);}
    showLoading(false);
  }

  /* --- タブ状態保存/復元 --- */
  function saveState(){return{pdfDoc,origBuf,fileName,curPage,totalPages,scale,renderScale,cssExtraZoom,panX,panY,strokes,docId:_docId};}
  async function loadState(sh){
    pdfDoc=sh.pdfDoc;origBuf=sh.origBuf;fileName=sh.fileName||'';curPage=sh.curPage||1;
    totalPages=sh.totalPages||0;scale=sh.scale||1;renderScale=sh.renderScale||1;cssExtraZoom=sh.cssExtraZoom||1;
    panX=sh.panX??16;panY=sh.panY??16;strokes=sh.strokes||{};_docId=sh.docId||null;
    _pageCache.clear();selectedIdx=[];selPath=[];
    document.getElementById('fnlbl').textContent=fileName||'ファイル未選択';
    document.getElementById('tpn').textContent=totalPages||'0';
    document.getElementById('pgn').value=curPage;
    if(pdfDoc){document.getElementById('dz').style.display='none';cwEl.style.display='block';await renderPage(curPage);}
    else{_showHome();cwEl.style.display='none';document.getElementById('zlbl').textContent='--';[pdfCvs,annCvs,ovlCvs].forEach(c=>{c.width=1;c.height=1;});}
  }

  /* --- 自動保存ゲッター --- */
  function _getState(){
    return{pdfDoc,origBuf,fileName,currentPage:curPage,scale,panX,panY,strokes,docId:_docId,subWinStates:SubWinManager.snapAll()};
  }

  /* EventBus経由で保存トリガー */
  EventBus.on('stroke:added',()=>{AutoSave.immediateSave(_getState);AutoSave.schedSave(_getState);DocMgr.updateStrokes(Utils.pruneEraserStrokes(strokes),curPage).catch(()=>{});});
  EventBus.on('autosave:periodic',()=>{if(pdfDoc)AutoSave.schedSave(_getState);});

  /* ライフサイクルイベント */
  ['visibilitychange','pagehide','freeze'].forEach(ev=>{
    const target=ev==='visibilitychange'?document:window;
    target.addEventListener(ev,()=>{
      if((ev==='visibilitychange'&&document.visibilityState!=='hidden')||(!pdfDoc))return;
      Logger.info('[AutoSave]',ev,'発火');
      AutoSave.emergencySave(_getState);
    });
  });
  window.addEventListener('blur',()=>{if(pdfDoc)AutoSave.immediateSave(_getState);});
  window.addEventListener('beforeunload',()=>{if(pdfDoc)AutoSave.emergencySave(_getState);});

  return{
    gotoPage,fit,undo,deleteSelected,closeFile,redraw,loadPDF,
    saveState,loadState,restore,showHome,downloadBackup,restoreFromZip,exportPDF,
    setTool,setShape,setColor,setSize,
    get currentTool(){return _activeTool;},
    get currentShape(){return _activeShape;},
    get selMode(){return _selMode;},
    set selMode(v){_selMode=v;},
    get strokeColor(){return _strokeColor;},
    get strokeSize(){return _strokeSize;},
    get pdfDoc(){return pdfDoc;},
    get origBuf(){return origBuf;},
    get fileName(){return fileName;},
    get strokes(){return strokes;},
    get currentPage(){return curPage;},
    get totalPages(){return totalPages;},
    get scale(){return scale;},
    get panX(){return panX;},
    get panY(){return panY;},
    get docId(){return _docId;},
    _activeSelSubWin:null,
    _textAt,
    _showHome,_hideHome,
    setFileHandle(fh){_fileHandle=fh;},
    setPostLoad(fn){_postLoadFn=fn;}
  };
})();

/* ============================================================
   タブ管理 (SheetManager)
   ============================================================ */
const MAX_SHEETS=8;
let _sheets=[],_sheetIdx=0,_sheetSeq=0;
function _emptySheet(){return{id:++_sheetSeq,pdfDoc:null,origBuf:null,fileName:'(新規)',curPage:1,totalPages:0,scale:1,renderScale:1,cssExtraZoom:1,panX:16,panY:16,strokes:{},subWinStates:[],docId:null};}
_sheets.push(_emptySheet());

function _sheetSync(){if(!_sheets[_sheetIdx])return;Object.assign(_sheets[_sheetIdx],App.saveState());_renderTabBar();}
function _renderTabBar(){
  const bar=document.getElementById('tabbar');if(!bar)return;
  bar.innerHTML='';
  _sheets.forEach((sh,i)=>{
    const div=document.createElement('div');div.className='shtab'+(i===_sheetIdx?' active':'');
    const raw=sh.fileName==='(新規)'?'(新規)':sh.fileName.replace(/\.pdf$/i,'');
    const label=raw.length>16?raw.slice(0,15)+'…':raw;
    div.innerHTML=`<span class="shtab-nm" title="${sh.fileName}">📄 ${label}</span><button class="shtab-x" title="閉じる">✕</button>`;
    div.addEventListener('click',e=>{if(!e.target.classList.contains('shtab-x'))switchToSheet(i);});
    div.querySelector('.shtab-x').addEventListener('click',async e=>{
      e.stopPropagation();const sh2=_sheets[i];
      if(!sh2?.pdfDoc){closeSheetAt(i);return;}
      const result=await _confirmClose(sh2.fileName);
      if(result==='cancel')return;
      if(result==='backup'){if(i!==_sheetIdx)await switchToSheet(i);await _backupThenClose(()=>closeSheetAt(i));return;}
      closeSheetAt(i);
    });
    bar.appendChild(div);
  });
  const add=document.createElement('button');add.className='shtab-add';add.title='新タブ';add.textContent='＋';
  add.addEventListener('click',()=>addSheet());bar.appendChild(add);
}
async function switchToSheet(idx){
  if(idx===_sheetIdx||idx<0||idx>=_sheets.length){_renderTabBar();return;}
  showLoading(true);
  _sheets[_sheetIdx].subWinStates=SubWinManager.freezeAll();
  Object.assign(_sheets[_sheetIdx],App.saveState());
  _sheetIdx=idx;const sh=_sheets[_sheetIdx];
  await App.loadState(sh);
  SubWinManager.thawAll(sh.subWinStates,sh.pdfDoc,App.strokes);
  _renderTabBar();showLoading(false);
}
async function addSheet(){
  if(_sheets.length>=MAX_SHEETS){showToast(`タブは最大${MAX_SHEETS}つです`);return;}
  _sheets[_sheetIdx].subWinStates=SubWinManager.freezeAll();
  Object.assign(_sheets[_sheetIdx],App.saveState());
  SubWinManager.thawAll(_sheets[_sheetIdx].subWinStates,_sheets[_sheetIdx].pdfDoc,App.strokes);
  const sh=_emptySheet();_sheets.push(sh);_sheetIdx=_sheets.length-1;
  await App.loadState(sh);_renderTabBar();
  document.getElementById('fileInput').click();
}
async function closeSheetAt(idx){
  showLoading(true);
  if(idx===_sheetIdx)_sheets[_sheetIdx].subWinStates=SubWinManager.freezeAll();
  if(_sheets[idx].pdfDoc){try{_sheets[idx].pdfDoc.destroy();}catch(_){}_sheets[idx].pdfDoc=null;}
  if(_sheets.length===1){_sheets[0]=_emptySheet();_sheetIdx=0;await App.loadState(_sheets[0]);}
  else{
    _sheets.splice(idx,1);
    if(_sheetIdx>=_sheets.length)_sheetIdx=_sheets.length-1;
    else if(idx<_sheetIdx)_sheetIdx--;
    await App.loadState(_sheets[_sheetIdx]);
    SubWinManager.thawAll(_sheets[_sheetIdx].subWinStates||[],_sheets[_sheetIdx].pdfDoc,App.strokes);
  }
  _renderTabBar();showLoading(false);
}
App.setPostLoad(()=>{_sheetSync();});

/* ============================================================
   バックアップ確認ダイアログ
   ============================================================ */
let _confirmPending=false;
function _confirmClose(fname,closeLbl='閉じる（バックアップしない）'){
  return new Promise(res=>{
    if(_confirmPending){res('cancel');return;}_confirmPending=true;
    const ov=document.getElementById('bk-confirm-overlay');
    document.getElementById('bk-title').textContent='バックアップを作成しますか？';
    document.getElementById('bk-warn').textContent=AutoSave.isDirty()?'⚠️ 未バックアップの変更があります':'';
    document.getElementById('bk-sub').textContent=`「${fname}」を閉じます`;
    document.getElementById('bk-do-close').textContent=closeLbl;
    ov.classList.add('open');
    const cleanup=r=>{ov.classList.remove('open');_confirmPending=false;res(r);};
    document.getElementById('bk-do-backup').onclick=()=>cleanup('backup');
    document.getElementById('bk-do-close').onclick=()=>cleanup('close');
    document.getElementById('bk-cancel').onclick=()=>cleanup('cancel');
  });
}
async function _backupThenClose(closeFn){await App.downloadBackup();await closeFn();}

/* ============================================================
   UI: ツールバーバインド
   ============================================================ */
function _initToolbar(){
  /* ファイル操作 */
  document.getElementById('fileInput').addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f){e.target.value='';return;}
    if(App.pdfDoc){const r=await _confirmClose(App.fileName,'読み込む（バックアップしない）');if(r==='cancel'){e.target.value='';return;}if(r==='backup'){await _backupThenClose(async()=>await App.loadPDF(f));e.target.value='';return;}}
    await App.loadPDF(f);e.target.value='';
  });
  document.getElementById('dz-open').addEventListener('click',()=>openFile());
  document.getElementById('home-open').addEventListener('click',()=>openFile());
  document.getElementById('btn-close').addEventListener('click',()=>App.closeFile());
  document.getElementById('btn-home').addEventListener('click',()=>App.showHome());
  document.getElementById('btn-undo').addEventListener('click',()=>App.undo());
  document.getElementById('btn-save').addEventListener('click',()=>{document.getElementById('pgrov').classList.add('on');document.getElementById('pgrfld').value='';});
  document.getElementById('btn-backup').addEventListener('click',()=>App.downloadBackup());
  document.getElementById('btn-restore').addEventListener('click',()=>document.getElementById('restoreInput').click());
  document.getElementById('restoreInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f){e.target.value='';return;}await App.restoreFromZip(f);e.target.value='';});

  /* ページ操作 */
  document.getElementById('btn-prev').addEventListener('click',()=>App.gotoPage(-1));
  document.getElementById('btn-next').addEventListener('click',()=>App.gotoPage(1));
  document.getElementById('btn-fit').addEventListener('click',()=>App.fit());
  document.getElementById('pgn').addEventListener('change',e=>App.gotoPage(parseInt(e.target.value)||1,true));

  /* ツール */
  ['pen','hl','eraser','text','sub'].forEach(t=>{
    document.getElementById('t-'+t)?.addEventListener('click',()=>{App.setTool(t);closePickers();});
  });
  /* 図形ドロップダウン */
  document.getElementById('t-shape').addEventListener('click',e=>{
    const pop=document.getElementById('shapepop');pop.classList.toggle('on');
    if(pop.classList.contains('on')){const r=e.currentTarget.getBoundingClientRect();pop.style.left=r.left+'px';pop.style.top=(r.bottom+2)+'px';}
    e.stopPropagation();
  });
  document.querySelectorAll('#shapepop button[data-shape]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const sh=btn.dataset.shape;App.setTool('shape');App.setShape(sh);
      document.querySelectorAll('#shapepop button').forEach(b=>b.classList.toggle('on',b.dataset.shape===sh));
      document.getElementById('shapepop').classList.remove('on');
    });
  });
  /* 選択ドロップダウン */
  document.getElementById('t-select').addEventListener('click',e=>{
    const pop=document.getElementById('selpop');pop.classList.toggle('on');
    if(pop.classList.contains('on')){const r=e.currentTarget.getBoundingClientRect();pop.style.left=r.left+'px';pop.style.top=(r.bottom+2)+'px';}
    App.setTool('select');e.stopPropagation();
  });
  document.querySelectorAll('#selpop button[data-selmode]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      App.selMode=btn.dataset.selmode;
      document.querySelectorAll('#selpop button').forEach(b=>b.classList.toggle('on',b.dataset.selmode===App.selMode));
      document.getElementById('selpop').classList.remove('on');
    });
  });

  /* カラースウォッチ */
  const PEN_C=[{id:'sw0',c:'#cc2020'},{id:'sw1',c:'#1a1a1a'},{id:'sw2',c:'#1a55cc'},{id:'sw3',c:'#108030'}];
  const HL_C=[{id:'sw0',c:'#ffd700'},{id:'sw1',c:'#50c040'},{id:'sw2',c:'#ff69b4'},{id:'sw3',c:'#40d4e8'}];
  function _updateSwatches(){
    const colors=App.currentTool==='hl'?HL_C:PEN_C;
    colors.forEach(({id,c})=>{
      const el=document.getElementById(id);if(!el)return;
      el.style.background=c;el.dataset.c=c;
      el.classList.toggle('on',c===App.strokeColor);
    });
  }
  document.querySelectorAll('.csw').forEach(sw=>{
    sw.addEventListener('click',()=>{
      App.setColor(sw.dataset.c);
      document.querySelectorAll('.csw').forEach(s=>s.classList.toggle('on',s.dataset.c===sw.dataset.c));
    });
  });
  EventBus.on('stroke:added',()=>{_updateSwatches();});

  /* 太さパネル */
  document.getElementById('sz-v').addEventListener('click',e=>{
    const p=document.getElementById('szp');
    if(p.classList.contains('on')){p.classList.remove('on');return;}
    p.classList.add('on');
    const r=e.target.getBoundingClientRect();p.style.left=Math.min(r.left,window.innerWidth-260)+'px';p.style.top=(r.bottom+4)+'px';
    const cur=App.strokeSize;document.getElementById('sz-rng').value=cur;document.getElementById('sz-n').value=cur;_prevSize(cur);
  });
  document.getElementById('sz-rng').addEventListener('input',e=>{const v=+e.target.value;document.getElementById('sz-n').value=v;_prevSize(v);});
  document.getElementById('sz-n').addEventListener('input',e=>{const v=Math.max(1,Math.min(40,+e.target.value));document.getElementById('sz-rng').value=v;_prevSize(v);});
  document.getElementById('szp-ok').addEventListener('click',()=>{App.setSize(+document.getElementById('sz-n').value);document.getElementById('szp').classList.remove('on');});
  document.getElementById('szp-cancel').addEventListener('click',()=>document.getElementById('szp').classList.remove('on'));
  function _prevSize(v){
    const cvs=document.getElementById('szp-cvs'),ctx=cvs.getContext('2d');
    ctx.clearRect(0,0,cvs.width,cvs.height);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cvs.width,cvs.height);
    ctx.beginPath();ctx.arc(cvs.width/2,cvs.height/2,Math.min(v*1.5,18),0,Math.PI*2);
    ctx.fillStyle=App.strokeColor||'#cc2020';ctx.fill();
  }

  /* 選択削除 */
  document.getElementById('selbtn').addEventListener('click',()=>App.deleteSelected());

  /* PDF出力ダイアログ */
  document.getElementById('pgr-cur').addEventListener('click',()=>document.getElementById('pgrfld').value=String(App.currentPage));
  document.getElementById('pgr-all').addEventListener('click',()=>document.getElementById('pgrfld').value='1-'+App.totalPages);
  document.getElementById('pgrCancel').addEventListener('click',()=>document.getElementById('pgrov').classList.remove('on'));
  document.getElementById('pgrConfirm').addEventListener('click',()=>{
    const fld=document.getElementById('pgrfld').value.trim();
    const pages=_parsePageRange(fld,App.totalPages);
    document.getElementById('pgrov').classList.remove('on');
    if(pages.length)App.exportPDF(pages);
    else showToast('ページ指定が無効です');
  });

  /* テキスト入力 */
  document.getElementById('txConfirm').addEventListener('click',_confirmText);
  document.getElementById('txCancel').addEventListener('click',()=>document.getElementById('txov').classList.remove('on'));
  document.getElementById('txfld').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))_confirmText();});
  function _confirmText(){
    const txt=document.getElementById('txfld').value.trim();
    document.getElementById('txov').classList.remove('on');
    if(!txt||!App.pdfDoc)return;
    if(!App.strokes[App.currentPage])App.strokes[App.currentPage]=[];
    App.strokes[App.currentPage].push({type:'text',x:App._textAt._lastX||0,y:App._textAt._lastY||0,text:txt,color:App.strokeColor,size:App.strokeSize});
    App.redraw();SubWinManager.updateAll(App.strokes,App.currentPage);
    EventBus.emit('stroke:added');
  }
  /* テキスト座標をグローバルへ保存 */
  const _origTextAt=App._textAt;
  App._textAt=function(x,y){App._textAt._lastX=x;App._textAt._lastY=y;_origTextAt(x,y);};
  App._textAt._lastX=0;App._textAt._lastY=0;

  /* ドラッグ&ドロップ */
  const caEl=document.getElementById('ca');
  caEl.addEventListener('dragover',e=>e.preventDefault());
  caEl.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)App.loadPDF(f);});
  const homeEl=document.getElementById('home');
  homeEl.addEventListener('dragover',e=>e.preventDefault());
  homeEl.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f){App._hideHome();App.loadPDF(f);}});

  /* ピッカー外クリックで閉じる */
  document.addEventListener('click',()=>closePickers());
}

function closePickers(){['shapepop','selpop','szp'].forEach(id=>{document.getElementById(id)?.classList.remove('on');});}
function openFile(){document.getElementById('fileInput').click();}

function _parsePageRange(str,total){
  const pages=new Set();
  str.split(',').forEach(s=>{
    s=s.trim();
    if(s.includes('-')){const[a,b]=s.split('-').map(Number);for(let i=Math.max(1,a);i<=Math.min(total,b);i++)pages.add(i);}
    else{const n=parseInt(s);if(n>=1&&n<=total)pages.add(n);}
  });
  return[...pages].sort((a,b)=>a-b);
}

/* ============================================================
   UI: 計算機
   ============================================================ */
function _initCalculator(){
  let cExpr='',cVal='0',cDec=1;
  const histEl=document.getElementById('chist');
  const exprEl=document.getElementById('cexpr');
  const valEl=document.getElementById('cval');
  const decEl=document.getElementById('cdec');

  function _disp(){exprEl.textContent=cExpr;valEl.textContent=cVal;}
  function _eval(){try{let r=Function('"use strict";return ('+cExpr+')')();const d=+decEl.value;cVal=isFinite(r)?parseFloat(r.toFixed(d)).toString():'エラー';}catch{cVal='エラー';}}

  document.getElementById('calcbtn').addEventListener('click',()=>{document.getElementById('calc').classList.toggle('on');});
  document.getElementById('cclose').addEventListener('click',()=>document.getElementById('calc').classList.remove('on'));

  document.querySelectorAll('.cb').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const num=btn.dataset.cnum,op=btn.dataset.cop,fn=btn.dataset.cfn;
      if(num!==undefined){cExpr+=num;}
      else if(op){cExpr+=op;}
      else if(fn){
        if(fn==='C'){cExpr='';cVal='0';}
        else if(fn==='⌫'){cExpr=cExpr.slice(0,-1);if(!cExpr)cVal='0';}
        else if(fn==='±'){if(cVal.startsWith('-'))cVal=cVal.slice(1);else cVal='-'+cVal;cExpr=cVal;}
        else if(fn==='%'){cExpr+='/100';}
        else if(fn==='sqrt'){cExpr='Math.sqrt('+cExpr+')';}
        else if(fn==='sq'){cExpr='('+cExpr+')**2';}
        else if(fn==='='){
          _eval();
          const hi=document.createElement('div');hi.className='chi';hi.textContent=cExpr+' = '+cVal;histEl.appendChild(hi);histEl.scrollTop=histEl.scrollHeight;
          const addToExpr=document.createElement('div');addToExpr.className='chi';addToExpr.style.display='none';histEl.appendChild(addToExpr);
          cExpr='';
        }
      }
      if(fn!=='='&&fn!=='C')_eval();
      _disp();
    });
  });

  /* 計算機ドラッグ */
  const ctb=document.getElementById('ctb');
  let cdrag=false,cdx=0,cdy=0;
  ctb.addEventListener('mousedown',e=>{cdrag=true;const r=document.getElementById('calc').getBoundingClientRect();cdx=e.clientX-r.left;cdy=e.clientY-r.top;});
  document.addEventListener('mousemove',e=>{if(!cdrag)return;const calc=document.getElementById('calc');calc.style.left=(e.clientX-cdx)+'px';calc.style.top=(e.clientY-cdy)+'px';calc.style.right='auto';calc.style.bottom='auto';});
  document.addEventListener('mouseup',()=>{cdrag=false;});
}

/* ============================================================
   共通 UI ヘルパー
   ============================================================ */
let _toastTimer=null;
function showToast(msg,dur=2200){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');
  clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>el.classList.remove('on'),dur);
}
function showLoading(v){document.getElementById('loading').classList.toggle('on',v);}

/* ============================================================
   起動時復元
   ============================================================ */
(async()=>{
  IDBStore.warmup();
  _renderTabBar();
  _initToolbar();
  _initCalculator();

  /* 安全タイムアウト: 6秒後に強制解除 */
  const _safety=setTimeout(()=>{showLoading(false);App._showHome();Logger.warn('[起動] restore タイムアウト');},6000);

  let saved=null;
  try{
    const INST_ID=AutoSave.instId;
    saved=await IDBStore.get('last:'+INST_ID);
    if(!AutoSave.isValid(saved)){
      saved=await IDBStore.get('resume:last').catch(()=>null);
      if(!AutoSave.isValid(saved)){saved=await IDBStore.get('resume:prv').catch(()=>null);}
    }
    if(!AutoSave.isValid(saved)){
      const fname=await IDBStore.get('resume:fname').catch(()=>null);
      if(fname&&typeof fname==='string'){const fd=await IDBStore.get('f:'+Utils.safeKey(fname)).catch(()=>null);if(AutoSave.isValid(fd))saved=fd;}
    }
  }catch(e){Logger.error('[起動] IDB読み込み失敗:',e);}

  /* バイナリ補完 */
  if(saved&&!saved.buf&&saved.file){
    try{
      let doc=null;
      if(saved.docId)doc=await IDBStore.get('doc:'+saved.docId).catch(()=>null);
      if(!doc?.originalPdfBytes){doc=await DocMgr.findByName(saved.file).catch(()=>null);}
      if(doc?.originalPdfBytes)saved={...saved,buf:new Uint8Array(doc.originalPdfBytes)};
      if(!saved.buf){const rb=await IDBStore.get('resume:buf:'+Utils.safeKey(saved.file)).catch(()=>null);if(rb)saved={...saved,buf:rb instanceof Uint8Array?rb:new Uint8Array(rb)};}
    }catch(_){}
  }

  /* localStorage同期バックアップ補完 */
  if(saved?.buf){
    try{
      const lsbk=JSON.parse(localStorage.getItem('mv_lsbk2')||'null');
      if(lsbk&&lsbk.file===saved.file&&typeof lsbk.ts==='number'&&lsbk.ts>(saved.ts||0)&&lsbk.strokes){saved={...saved,strokes:lsbk.strokes,page:lsbk.page||saved.page};Logger.info('[起動] localStorage補完 ts='+lsbk.ts);}
    }catch(_){}
  }

  if(!saved?.buf){clearTimeout(_safety);App._showHome();return;}

  showLoading(true);
  try{
    await Promise.race([App.restore(saved),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),5000))]);
    _sheetSync();showToast('前回の状態を復元しました');
  }catch(e){Logger.error('[起動] restore 失敗:',e);App._showHome();}
  finally{clearTimeout(_safety);showLoading(false);}
})();
</script>
