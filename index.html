<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鉄骨図面ビューア</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#0e1012;--pan:#191c20;--pan2:#22262d;--brd:#374048;
  --acc:#f07800;--tx:#dde2ea;--tx2:#6a7480;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--tx);font-family:'Helvetica Neue',Arial,sans-serif;
  display:flex;flex-direction:column;height:100dvh;user-select:none;-webkit-user-select:none;}

/* ===== HEADER 2行 ===== */
#hdr{flex-shrink:0;background:var(--pan);border-bottom:2px solid var(--acc);}
.hr{height:42px;display:flex;align-items:center;gap:3px;padding:0 6px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;}
.hr:first-child{border-bottom:1px solid var(--brd);}
.hr::-webkit-scrollbar{display:none;}
.logo{font-size:13px;font-weight:800;color:var(--acc);padding-right:8px;
  border-right:2px solid var(--brd);white-space:nowrap;flex-shrink:0;}
.vs{width:1.5px;height:26px;background:var(--brd);flex-shrink:0;margin:0 3px;}
.btn{height:34px;padding:0 9px;border:1.5px solid var(--brd);background:var(--pan2);
  color:var(--tx);border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;
  white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:3px;
  -webkit-user-select:none;transition:background .1s;}
.btn:active{background:var(--brd);}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.btn.rd{background:#7a1818;border-color:#7a1818;color:#fff;}
.pgni{width:34px;text-align:center;background:var(--pan2);border:1.5px solid var(--brd);
  color:var(--tx);border-radius:6px;font-size:12px;padding:3px 0;flex-shrink:0;}
.pgni:focus{outline:none;border-color:var(--acc);}
.pgtot{font-size:11px;color:var(--tx2);white-space:nowrap;flex-shrink:0;}
.zlbl{font-size:12px;font-weight:700;color:var(--acc);min-width:38px;text-align:center;flex-shrink:0;}
.csw{width:24px;height:24px;border-radius:50%;border:3px solid transparent;
  cursor:pointer;flex-shrink:0;transition:transform .1s;}
.csw.on{border-color:#fff;transform:scale(1.22);}
.szlbl{font-size:11px;color:var(--tx2);flex-shrink:0;}
.szni{width:38px;text-align:center;background:var(--pan2);border:1.5px solid var(--brd);
  color:var(--tx);border-radius:6px;font-size:13px;font-weight:700;padding:3px;flex-shrink:0;}
.szni:focus{outline:none;border-color:var(--acc);}
/* ピッカー */
.pkw{position:relative;flex-shrink:0;}
.pkp{position:fixed;background:var(--pan);border:1.5px solid var(--brd);border-radius:10px;
  padding:5px;z-index:300;box-shadow:0 4px 20px #000d;display:none;flex-direction:column;gap:4px;min-width:130px;}
.pkp.on{display:flex;}
.pkp button{height:38px;padding:0 12px;background:var(--pan2);border:1.5px solid var(--brd);
  color:var(--tx);border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;text-align:left;
  -webkit-user-select:none;}
.pkp button:active,.pkp button.on{background:var(--acc);border-color:var(--acc);color:#fff;}

/* ===== CANVAS AREA ===== */
#ca{flex:1;overflow:hidden;background:#060809;position:relative;min-height:0;
  /* ★ touch-action:none + overflow:hidden でCSS transformパン */
  touch-action:none;}
#cw{position:absolute;top:0;left:0;transform-origin:0 0;}
#pdfcvs{display:block;}
#drawcvs,#selcvs{position:absolute;top:0;left:0;}
#selcvs{pointer-events:none;}
/* ドロップゾーン */
#dz{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:10;}
.dzi{font-size:46px;opacity:.3;}.dzm{font-size:15px;color:var(--tx2);font-weight:700;}
.dzs{font-size:11px;color:var(--tx2);opacity:.5;}
.dzb{background:var(--acc);color:#fff;border:none;padding:12px 28px;border-radius:11px;
  font-size:15px;font-weight:700;cursor:pointer;}
/* 選択削除ボタン */
#selbtn{display:none;position:fixed;z-index:150;background:#7a1818;color:#fff;
  border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;}

/* ===== サブウインドウ ===== */
.swn{position:fixed;z-index:200;background:var(--pan);border:2.5px solid var(--acc);
  border-radius:12px;box-shadow:0 8px 32px #000c;display:flex;flex-direction:column;
  min-width:160px;min-height:160px;overflow:hidden;}
.swn-tb{height:30px;background:var(--pan2);display:flex;align-items:center;
  justify-content:space-between;padding:0 8px;cursor:grab;flex-shrink:0;border-bottom:1px solid var(--brd);}
.swn-tb span{font-size:11px;font-weight:700;color:var(--acc);}
.swn-close{background:transparent;border:none;color:var(--tx2);font-size:16px;cursor:pointer;
  padding:2px 6px;border-radius:4px;}
.swn-body{flex:1;overflow:hidden;position:relative;background:#050607;}
.swn-cvs{position:absolute;top:0;left:0;touch-action:none;transform-origin:0 0;}
.swn-zl{position:absolute;bottom:3px;left:5px;font-size:10px;color:var(--acc);
  pointer-events:none;font-weight:700;text-shadow:0 0 4px #000;}
.swn-rz{position:absolute;bottom:0;right:0;width:20px;height:20px;cursor:se-resize;
  background:linear-gradient(135deg,transparent 50%,var(--acc) 50%);border-radius:0 0 9px 0;}

/* ===== 計算機 ===== */
#calc{display:none;position:fixed;z-index:400;background:var(--pan);
  border:1.5px solid var(--brd);border-radius:14px;width:290px;
  box-shadow:0 8px 40px #000a;bottom:20px;right:16px;}
#calc.on{display:block;}
#ctb{padding:7px 12px 4px;display:flex;align-items:center;justify-content:space-between;
  cursor:grab;border-bottom:1px solid var(--brd);}
#ctb span{font-size:13px;font-weight:700;color:var(--tx2);}
#cclose{background:var(--pan2);border:1.5px solid var(--brd);color:var(--tx);font-size:14px;
  cursor:pointer;padding:3px 10px;border-radius:6px;-webkit-user-select:none;}
#cclose:active{background:var(--acc);color:#fff;}
#chist{max-height:72px;overflow-y:auto;padding:2px 10px;border-bottom:1px solid var(--brd);}
#chist::-webkit-scrollbar{width:3px;}
.chi{font-size:11px;color:var(--tx2);text-align:right;padding:1px 0;}
#cdsp{padding:6px 12px;text-align:right;border-bottom:1px solid var(--brd);}
#cexpr{font-size:11px;color:var(--tx2);min-height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#cval{font-size:26px;font-weight:700;color:var(--tx);}
#cdecrow{display:flex;align-items:center;gap:6px;padding:3px 10px;border-bottom:1px solid var(--brd);}
#cdecrow label{font-size:11px;color:var(--tx2);}
#cdec{width:36px;text-align:center;background:var(--pan2);border:1px solid var(--brd);
  color:var(--tx);border-radius:5px;font-size:12px;padding:2px;}
#cbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:9px;}
/* ★ ボタン枠をはっきり見せる */
.cb{height:50px;border-radius:9px;font-size:22px;font-weight:700;cursor:pointer;
  -webkit-user-select:none;transition:opacity .1s;
  border:2px solid transparent;}
.cb:active{opacity:.65;}
.cbn{background:var(--pan2);color:var(--tx);border-color:#3a4250;}
.cbo{background:#252d38;color:#ffa040;border-color:#3a5070;}
.cbeq{background:var(--acc);color:#fff;border-color:#c06000;}
.cbf{background:#161a20;color:var(--tx2);font-size:17px;border-color:#2a3038;}
.cbw{grid-column:span 2;}
.cbrs{grid-row:span 2;}

/* テキスト入力 */
#txov{display:none;position:fixed;inset:0;z-index:500;background:#0009;
  align-items:center;justify-content:center;}
#txov.on{display:flex;}
#txpop{background:var(--pan);border:1.5px solid var(--brd);border-radius:14px;
  padding:16px;width:300px;display:flex;flex-direction:column;gap:10px;}
#txpop h3{font-size:13px;color:var(--tx2);}
#txfld{background:var(--bg);border:1.5px solid var(--brd);border-radius:8px;color:var(--tx);
  font-size:16px;padding:9px 11px;resize:vertical;min-height:60px;font-family:inherit;
  user-select:text;-webkit-user-select:text;}
#txfld:focus{outline:none;border-color:var(--acc);}
.txbtns{display:flex;gap:8px;justify-content:flex-end;}
.txb{padding:9px 16px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:700;}

/* ローディング/トースト */
#loading{display:none;position:fixed;inset:0;z-index:600;background:#000a;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;}
#loading.on{display:flex;}
.spin{width:34px;height:34px;border:3px solid var(--brd);border-top-color:var(--acc);
  border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--pan);border:1.5px solid var(--brd);border-radius:10px;
  padding:8px 16px;font-size:13px;color:var(--tx);opacity:0;pointer-events:none;
  transition:opacity .3s;z-index:999;white-space:nowrap;}
#toast.on{opacity:1;}
@media print{
  #hdr,#calc,#selbtn,.swn{display:none!important;}
  body{background:#fff!important;}
  #ca{overflow:visible!important;position:static!important;}
  #cw{position:static!important;transform:none!important;box-shadow:none!important;}
}
</style>
</head>
<body>

<!-- ===== HEADER 行1 ===== -->
<div id="hdr">
<div class="hr">
  <span class="logo">⚙鉄骨</span>
  <input type="file" id="fi" accept="application/pdf" style="display:none">
  <button class="btn" onclick="openFile()">📂 開く</button>
  <div class="vs"></div>
  <button class="btn" onclick="A.pg(-1)" id="pgprev">◀</button>
  <input id="pgn" class="pgni" type="number" min="1" value="1" onchange="A.pg(+this.value,true)">
  <span class="pgtot">/<span id="tpn">0</span></span>
  <button class="btn" onclick="A.pg(1)" id="pgnext">▶</button>
  <div class="vs"></div>
  <button class="btn" onclick="A.zoomBy(0.8)">－</button>
  <span id="zlbl" class="zlbl">--</span>
  <button class="btn" onclick="A.zoomBy(1.25)">＋</button>
  <button class="btn" onclick="A.fit()">全体</button>
  <div class="vs"></div>
  <button class="btn" onclick="A.undo()">↩戻す</button>
  <button class="btn rd" onclick="A.clear()">消去</button>
  <div class="vs"></div>
  <button class="btn on" onclick="savePDF()">💾 保存</button>
  <button class="btn" onclick="savePDFAs()">📄 別名</button>
  <button class="btn" onclick="printPage()">🖨 印刷</button>
  <button class="btn" id="calcbtn" onclick="toggleCalc()">🧮 計算</button>
</div>
<!-- ===== HEADER 行2 ===== -->
<div class="hr">
  <button class="btn on" id="t-pen"    onclick="setTool('pen')">✏️ ペン</button>
  <button class="btn"    id="t-hl"     onclick="setTool('hl')">蛍光ペン</button>
  <div class="pkw" id="shapewrap">
    <button class="btn" id="t-shape" onclick="togglePk('shapepop',event)">図形▾</button>
    <div class="pkp" id="shapepop">
      <button onclick="pickShape('arrow')">→ 矢印</button>
      <button onclick="pickShape('rect')">□ 四角</button>
      <button onclick="pickShape('circle')">○ 円</button>
      <button onclick="pickShape('line')">/ 直線</button>
    </div>
  </div>
  <button class="btn" id="t-text"   onclick="setTool('text')">文字</button>
  <button class="btn" id="t-eraser" onclick="setTool('eraser')">消しゴム</button>
  <div class="pkw" id="selwrap">
    <button class="btn" id="t-select" onclick="togglePk('selpop',event)">選択▾</button>
    <div class="pkp" id="selpop">
      <button id="sel-rect"  class="on" onclick="setSelMode('rect')">□ 矩形選択</button>
      <button id="sel-lasso"           onclick="setSelMode('lasso')">〇 なげなわ</button>
    </div>
  </div>
  <button class="btn" id="t-sub" onclick="setTool('sub')">サブ窓</button>
  <div class="vs"></div>
  <div class="csw on"  style="background:#222;border:2px solid #888" data-c="#111111" onclick="setColor(this)"></div>
  <div class="csw" style="background:#cc2020" data-c="#cc2020" onclick="setColor(this)"></div>
  <div class="csw" style="background:#1a55cc" data-c="#1a55cc" onclick="setColor(this)"></div>
  <div class="csw" style="background:#108030" data-c="#108030" onclick="setColor(this)"></div>
  <div class="vs"></div>
  <span class="szlbl">太さ</span>
  <input type="number" id="szn" class="szni" min="1" max="30" value="3"
    onkeydown="if(event.key==='Enter'){applySize(this.value);this.blur();}">
  <button class="btn" onclick="applySize(document.getElementById('szn').value)"
    style="height:28px;padding:0 8px;font-size:13px;">✓</button>
</div>
</div>

<!-- ===== CANVAS ===== -->
<div id="ca">
  <div id="cw" style="display:none">
    <canvas id="pdfcvs"></canvas>
    <canvas id="drawcvs"></canvas>
    <canvas id="selcvs"></canvas>
  </div>
  <div id="dz">
    <div class="dzi">📄</div>
    <div class="dzm">PDFを開いてください</div>
    <div class="dzs">タップして選択 / ドラッグ＆ドロップ / 左右スワイプでページ送り</div>
    <button class="dzb" onclick="openFile()">📂 PDFを開く</button>
  </div>
</div>
<button id="selbtn" onclick="A.deleteSelected()">🗑 削除</button>

<!-- ===== 計算機 ===== -->
<div id="calc">
  <div id="ctb"><span>🧮 計算機</span><button id="cclose" onclick="toggleCalc()">✕ 閉じる</button></div>
  <div id="chist"></div>
  <div id="cdsp"><div id="cexpr"></div><div id="cval">0</div></div>
  <div id="cdecrow"><label>小数点以下</label><input type="number" id="cdec" min="0" max="10" value="1">桁</div>
  <div id="cbtns">
    <button class="cb cbf" onclick="cFn('C')">C</button>
    <button class="cb cbf" onclick="cSqrt()">√</button>
    <button class="cb cbf" onclick="cSq()">x²</button>
    <button class="cb cbo" onclick="cOp('/')">÷</button>
    <button class="cb cbf" onclick="cFn('⌫')">⌫</button>
    <button class="cb cbf" onclick="cFn('±')">±</button>
    <button class="cb cbf" onclick="cFn('%')">%</button>
    <button class="cb cbo" onclick="cOp('*')">×</button>
    <button class="cb cbn" onclick="cNum('7')">7</button>
    <button class="cb cbn" onclick="cNum('8')">8</button>
    <button class="cb cbn" onclick="cNum('9')">9</button>
    <button class="cb cbo" onclick="cOp('-')">−</button>
    <button class="cb cbn" onclick="cNum('4')">4</button>
    <button class="cb cbn" onclick="cNum('5')">5</button>
    <button class="cb cbn" onclick="cNum('6')">6</button>
    <button class="cb cbo" onclick="cOp('+')">＋</button>
    <button class="cb cbn" onclick="cNum('1')">1</button>
    <button class="cb cbn" onclick="cNum('2')">2</button>
    <button class="cb cbn" onclick="cNum('3')">3</button>
    <button class="cb cbeq cbrs" onclick="cEq()">=</button>
    <button class="cb cbn cbw" onclick="cNum('0')">0</button>
    <button class="cb cbn" onclick="cNum('.')">.</button>
  </div>
</div>

<!-- テキスト入力 -->
<div id="txov">
  <div id="txpop">
    <h3>テキスト入力 (Ctrl+Enter で確定)</h3>
    <textarea id="txfld" placeholder="テキストを入力…"></textarea>
    <div class="txbtns">
      <button class="txb" style="background:var(--pan2);color:var(--tx2);" onclick="cancelTx()">キャンセル</button>
      <button class="txb" style="background:var(--acc);color:#fff;" onclick="confirmTx()">確定</button>
    </div>
  </div>
</div>

<div id="loading"><div class="spin"></div><span style="font-size:13px">処理中…</span></div>
<div id="toast"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ============================================================
   グローバル
   ============================================================ */
let currentTool = 'pen', currentShape = 'arrow', selMode = 'rect';
let strokeColor = '#111111', strokeSize = 3;
let txX = 0, txY = 0;
const subWindows = [];
let _fileHandle = null; // File System Access API ハンドル

/* ============================================================
   IDB
   ============================================================ */
const IDB = {
  _db: null,
  async open() {
    if (this._db) return this._db;
    return this._db = await new Promise((res, rej) => {
      const r = indexedDB.open('TekkoV8', 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore('d');
      r.onsuccess = e => res(e.target.result);
      r.onerror = e => rej(e.target.error);
    });
  },
  async get(k) {
    try { const db = await this.open();
      return await new Promise(r => {
        const q = db.transaction('d','readonly').objectStore('d').get(k);
        q.onsuccess = e => r(e.target.result ?? null); q.onerror = () => r(null);
      }); } catch { return null; }
  },
  async set(k, v) {
    try { const db = await this.open();
      await new Promise((res, rej) => {
        const q = db.transaction('d','readwrite').objectStore('d').put(v, k);
        q.onsuccess = res; q.onerror = rej;
      }); } catch(e) { console.warn('IDB:', e); }
  }
};
let saveTimer;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!A.pdfDoc || !A.origBuf) return;
    await IDB.set('s', {
      buf: A.origBuf.slice(0), file: A.fileName,
      strokes: JSON.parse(JSON.stringify(A.strokes)),
      page: A.currentPage, scale: A.scale,
    });
  }, 1500);
}

/* ============================================================
   ストローク描画ユーティリティ
   ============================================================ */
function drawOne(s, ctx, sc) {
  ctx.save();
  if (s.type === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = s.size * 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    s.points.forEach((p, i) => i ? ctx.lineTo(p[0]*sc, p[1]*sc) : ctx.moveTo(p[0]*sc, p[1]*sc));
    ctx.stroke();
  } else if (['pen','hl'].includes(s.type)) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = s.type === 'hl' ? 0.38 : 1;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.type === 'hl' ? Math.max(s.size * 4, 14) : s.size;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    s.points.forEach((p, i) => i ? ctx.lineTo(p[0]*sc, p[1]*sc) : ctx.moveTo(p[0]*sc, p[1]*sc));
    ctx.stroke();
  } else if (s.type === 'text') {
    ctx.fillStyle = s.color;
    ctx.font = `bold ${Math.round(s.size * 6)}px 'Helvetica Neue',Arial,sans-serif`;
    s.text.split('\n').forEach((l, i) => ctx.fillText(l, s.x*sc, s.y*sc + i*s.size*7));
  } else {
    ctx.strokeStyle = s.color; ctx.lineWidth = s.size; ctx.lineCap = 'round';
    const [x1,y1,x2,y2] = [s.x1*sc, s.y1*sc, s.x2*sc, s.y2*sc];
    if (s.type === 'rect') ctx.strokeRect(x1, y1, x2-x1, y2-y1);
    else if (s.type === 'circle') {
      const rx=(x2-x1)/2, ry=(y2-y1)/2;
      ctx.beginPath(); ctx.ellipse(x1+rx, y1+ry, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI*2); ctx.stroke();
    } else if (s.type === 'line') {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    } else if (s.type === 'arrow') {
      const hl = Math.max(s.size*4, 12), ang = Math.atan2(y2-y1, x2-x1);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2,y2); ctx.lineTo(x2-hl*Math.cos(ang-Math.PI/6), y2-hl*Math.sin(ang-Math.PI/6));
      ctx.moveTo(x2,y2); ctx.lineTo(x2-hl*Math.cos(ang+Math.PI/6), y2-hl*Math.sin(ang+Math.PI/6));
      ctx.stroke();
    }
  }
  ctx.restore();
}
function strokeBBox(s) {
  if (!s || s.type === 'eraser') return null;
  if (s.points) {
    const xs = s.points.map(p=>p[0]), ys = s.points.map(p=>p[1]);
    return {x1:Math.min(...xs), y1:Math.min(...ys), x2:Math.max(...xs), y2:Math.max(...ys)};
  }
  if (s.type === 'text') return {x1:s.x-1, y1:s.y-s.size*8, x2:s.x+s.size*4*(s.text?.length||1), y2:s.y+2};

  }

    const aW=ca.clientWidth||1, aH=ca.clientHeight||1;

    const r = ca.getBoundingClientRect();

  }
  function onCanvas(src) {

    const s=curStroke;
    if (['pen','hl','eraser'].includes(s.type)) {
      s.points.push([p.x,p.y]);
      dctx.save();
      if (s.type==='eraser'){dctx.globalCompositeOperation='destination-out';dctx.lineWidth=s.size*4;dctx.lineCap='round';dctx.lineJoin='round';}
      else{dctx.globalCompositeOperation='source-over';dctx.globalAlpha=s.type==='hl'?0.38:1;
        dctx.strokeStyle=s.color;dctx.lineWidth=s.type==='hl'?Math.max(s.size*4,14):s.size;dctx.lineCap='round';dctx.lineJoin='round';}
      dctx.beginPath();dctx.moveTo(lastX*sc,lastY*sc);dctx.lineTo(p.x*sc,p.y*sc);dctx.stroke();
      dctx.restore(); lastX=p.x; lastY=p.y;
    } else { s.x2=p.x; s.y2=p.y; redraw(); drawOne(s,dctx,sc); }
  }
  function ed(e) {
    isDrawing=false;
    if (currentTool==='select') {
      if (selectedIdx.length>0&&!selPath.length){drawSelOverlay();scheduleSave();return;}
      finishSelect(); return;
    }
    if (currentTool==='sub'&&subRect) {
      const r={x1:Math.min(subRect.x1,subRect.x2),y1:Math.min(subRect.y1,subRect.y2),
               x2:Math.max(subRect.x1,subRect.x2),y2:Math.max(subRect.y1,subRect.y2)};
      if((r.x2-r.x1)>10/scale&&(r.y2-r.y1)>10/scale){
        if(subWindows.length>=2)showToast('サブウインドウは最大2つです');
        else subWindows.push(new SubWin(pdfDoc,strokes,currentPage,r));
      }
      subRect=null; sctx.clearRect(0,0,sc2.width,sc2.height); return;
    }
    if (!curStroke) return;
    if (!strokes[currentPage]) strokes[currentPage]=[];
    const s=curStroke;
    strokes[currentPage].push({...s,points:s.points?[...s.points]:undefined});
    curStroke=null; redraw();
    subWindows.forEach(sw=>sw.update(strokes,currentPage));
    scheduleSave();
  }

  /* ---- 選択 ---- */
  function finishSelect() {
    const arr=strokes[currentPage]||[];
    if (selMode==='rect'&&selPath.length>=2) {
      const xs=selPath.map(p=>p.x),ys=selPath.map(p=>p.y);
      const rx1=Math.min(...xs),ry1=Math.min(...ys),rx2=Math.max(...xs),ry2=Math.max(...ys);
      selectedIdx=arr.reduce((a,s,i)=>{const bb=strokeBBox(s);if(!bb)return a;
        if(!(bb.x2<rx1||bb.x1>rx2||bb.y2<ry1||bb.y1>ry2))a.push(i);return a;},[]);
    } else if (selMode==='lasso'&&selPath.length>=3) {
      const poly=selPath.map(p=>[p.x,p.y]);
      selectedIdx=arr.reduce((a,s,i)=>{const bb=strokeBBox(s);if(!bb)return a;
        if(ptInPoly((bb.x1+bb.x2)/2,(bb.y1+bb.y2)/2,poly))a.push(i);return a;},[]);
    }
    selPath=[]; sctx.clearRect(0,0,sc2.width,sc2.height);
    drawSelOverlay();
    document.getElementById('selbtn').style.display = selectedIdx.length ? 'block' : 'none';
  }
  function drawSelPreview() {
    sctx.clearRect(0,0,sc2.width,sc2.height);
    if (!selPath.length) return;
    sctx.save(); sctx.strokeStyle='#4488ff'; sctx.lineWidth=1.5;
    sctx.setLineDash(selMode==='rect'?[6,4]:[]);
    if (selMode==='rect') {
      const p0=selPath[0],p1=selPath[selPath.length-1];
      sctx.strokeRect(Math.min(p0.x,p1.x)*scale,Math.min(p0.y,p1.y)*scale,
        Math.abs(p1.x-p0.x)*scale,Math.abs(p1.y-p0.y)*scale);
    } else {
      sctx.beginPath(); selPath.forEach((p,i)=>i?sctx.lineTo(p.x*scale,p.y*scale):sctx.moveTo(p.x*scale,p.y*scale));
      sctx.stroke();
    }
    sctx.restore();
  }
  function selBBox() {
    const arr=strokes[currentPage]||[];
    const bbs=selectedIdx.map(i=>strokeBBox(arr[i])).filter(Boolean);
    if (!bbs.length) return null;
    return{x1:Math.min(...bbs.map(b=>b.x1)),y1:Math.min(...bbs.map(b=>b.y1)),
           x2:Math.max(...bbs.map(b=>b.x2)),y2:Math.max(...bbs.map(b=>b.y2))};
  }
  function moveSel(dx,dy) {
    const arr=strokes[currentPage]||[];
    selectedIdx.forEach(i=>{const s=arr[i];if(!s)return;
      if(s.points)s.points=s.points.map(p=>[p[0]+dx,p[1]+dy]);
      if(s.x1!==undefined){s.x1+=dx;s.y1+=dy;s.x2+=dx;s.y2+=dy;}
      if(s.type==='text'){s.x+=dx;s.y+=dy;}
    });
  }
  function clearSel() {
    selectedIdx=[]; selPath=[]; sctx.clearRect(0,0,sc2.width,sc2.height);
    document.getElementById('selbtn').style.display='none';
  }
  function drawSelOverlay() {
    sctx.clearRect(0,0,sc2.width,sc2.height);
    if (!selectedIdx.length) return;
    const arr=strokes[currentPage]||[];
    sctx.save(); sctx.strokeStyle='#4488ff'; sctx.lineWidth=2; sctx.setLineDash([6,3]);
    selectedIdx.forEach(i=>{
      const bb=strokeBBox(arr[i]); if(!bb)return;
      sctx.strokeRect(bb.x1*scale-4,bb.y1*scale-4,(bb.x2-bb.x1)*scale+8,(bb.y2-bb.y1)*scale+8);
    });
    sctx.restore();
    const bb=selBBox();
    if (bb) {
      const wr=cw.getBoundingClientRect();
      const btn=document.getElementById('selbtn');
      btn.style.left=Math.max(0,wr.left+bb.x1*scale-4)+'px';
      btn.style.top=Math.max(0,wr.top+bb.y2*scale+6)+'px';
    }
  }

  /* ---- 再描画 ---- */
  function redraw() {
    dctx.clearRect(0,0,dc.width,dc.height);
    (strokes[currentPage]||[]).forEach(s=>drawOne(s,dctx,scale));
  }

  /* ---- レンダリング ---- */
  async function renderPage(num) {
    if (!pdfDoc) return;
    const ver=++rv;
    const page=await pdfDoc.getPage(num);
    const vp=page.getViewport({scale});
    const off=document.createElement('canvas'); off.width=vp.width; off.height=vp.height;
    await page.render({canvasContext:off.getContext('2d'),viewport:vp}).promise;
    if (ver!==rv) return;
    // CSSトランスフォームをクリアしてからキャンバス更新
    cw.style.transform=''; cw.style.transformOrigin='';
    [pc,dc,sc2].forEach(c=>{c.width=vp.width;c.height=vp.height;});
    pctx.drawImage(off,0,0); redraw(); clearSel();
    document.getElementById('pgn').value=num;
    document.getElementById('zlbl').textContent=Math.round(scale*100)+'%';
    clampPan(); updateXform();
  }

  /* ---- ロード ---- */
  async function loadPDF(file, buf) {
    showLoading(true);
    try {
      origBuf = buf || await file.arrayBuffer(); fileName=file.name;
      pdfDoc=await pdfjsLib.getDocument({data:origBuf.slice(0)}).promise;
      totalPages=pdfDoc.numPages;
      document.getElementById('tpn').textContent=totalPages;
      currentPage=1; strokes={}; panX=16; panY=16;
      subWindows.slice().forEach(sw=>sw.close());
      document.getElementById('dz').style.display='none'; cw.style.display='block';
      await renderPage(1); await fit();
      scheduleSave();
    } catch(e){showToast('読み込みに失敗しました');console.error(e);}
    showLoading(false);
  }
  async function pg(d, abs=false) {
    if (!pdfDoc) return;
    const n=abs?Math.max(1,Math.min(totalPages,d)):currentPage+d;
    if (n<1||n>totalPages) return;
    currentPage=n; await renderPage(n);
    subWindows.forEach(sw=>sw.update(strokes,n)); scheduleSave();
  }
  async function zoomBy(r) {
    scale=Math.max(0.2,Math.min(6,scale*r));
    if (pdfDoc) await renderPage(currentPage);
  }
  async function fit() {
    if (!pdfDoc) return;
    const page=await pdfDoc.getPage(currentPage); const vp=page.getViewport({scale:1});
    const aW=ca.clientWidth||1, aH=ca.clientHeight||1;
    scale=Math.max(0.2,Math.min((aW-32)/vp.width,(aH-32)/vp.height));
    await renderPage(currentPage); centerCanvas();
  }
  function undo() {
    const a=strokes[currentPage]; if(!a||!a.length){showToast('操作がありません');return;}
    a.pop(); redraw(); subWindows.forEach(sw=>sw.update(strokes,currentPage)); scheduleSave();
  }
  function clear() {
    if(!confirm('このページの書き込みを全て消去しますか？'))return;
    strokes[currentPage]=[]; redraw(); subWindows.forEach(sw=>sw.update(strokes,currentPage)); scheduleSave();
  }
  function deleteSelected() {
    if (!selectedIdx.length) return;
    strokes[currentPage]=(strokes[currentPage]||[]).filter((_,i)=>!selectedIdx.includes(i));
    clearSel(); redraw(); subWindows.forEach(sw=>sw.update(strokes,currentPage)); scheduleSave();
    document.getElementById('selbtn').style.display='none';
  }

  // ファイル入力
  document.getElementById('fi').addEventListener('change', async e => {
    const f=e.target.files[0]; if(f)await loadPDF(f); e.target.value='';
  });
  ca.addEventListener('dragover',e=>e.preventDefault());
  ca.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)loadPDF(f);});

  return { pg, zoomBy, fit, undo, clear, deleteSelected, redraw, loadPDF,
    get pdfDoc(){return pdfDoc;}, get origBuf(){return origBuf;}, get fileName(){return fileName;},
    get strokes(){return strokes;}, get currentPage(){return currentPage;},
    get totalPages(){return totalPages;}, get scale(){return scale;},
    async restore(saved) {
      origBuf=saved.buf; fileName=saved.file;
      pdfDoc=await pdfjsLib.getDocument({data:saved.buf.slice(0)}).promise;
      totalPages=pdfDoc.numPages;
      document.getElementById('tpn').textContent=totalPages;
      strokes=saved.strokes||{}; currentPage=saved.page||1; scale=saved.scale||1;
      panX=16; panY=16;
      document.getElementById('dz').style.display='none'; cw.style.display='block';
      await renderPage(currentPage); centerCanvas();
    }
  };
})();

/* ============================================================
   ツール / カラー
   ============================================================ */
function setTool(t) {
  currentTool=t;
  document.querySelectorAll('[id^="t-"]').forEach(b=>b.classList.remove('on'));
  document.getElementById('t-'+t)?.classList.add('on'); closeAllPk();
}
function setColor(el) {
  document.querySelectorAll('.csw').forEach(s=>s.classList.remove('on'));
  el.classList.add('on'); strokeColor=el.dataset.c;
}
function applySize(v) {
  strokeSize=Math.max(1,Math.min(30,parseInt(v)||1));
  document.getElementById('szn').value=strokeSize;
}
function togglePk(id,e) {
  const pk=document.getElementById(id); const was=pk.classList.contains('on');
  closeAllPk();
  if (!was) {
    const b=e.currentTarget.getBoundingClientRect();
    pk.style.top=(b.bottom+4)+'px'; pk.style.left=b.left+'px'; pk.classList.add('on');
  }
}
function closeAllPk() { document.querySelectorAll('.pkp').forEach(p=>p.classList.remove('on')); }
function pickShape(s) {
  currentShape=s; currentTool='shape';
  const L={arrow:'矢印▾',rect:'四角▾',circle:'円▾',line:'直線▾'};
  document.getElementById('t-shape').textContent=L[s];
  document.querySelectorAll('[id^="t-"]').forEach(b=>b.classList.remove('on'));
  document.getElementById('t-shape').classList.add('on');
  document.querySelectorAll('#shapepop button').forEach(b=>b.classList.remove('on'));

}
function setSelMode(m) {
  selMode=m; currentTool='select';
  document.getElementById('sel-rect').classList.toggle('on',m==='rect');
  document.getElementById('sel-lasso').classList.toggle('on',m==='lasso');
  document.querySelectorAll('[id^="t-"]').forEach(b=>b.classList.remove('on'));
  document.getElementById('t-select').classList.add('on'); closeAllPk();
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.pkw'))closeAllPk();
});

/* テキスト */
function cancelTx(){document.getElementById('txov').classList.remove('on');}
function confirmTx(){
  const txt=document.getElementById('txfld').value.trim();
  if(txt){
    if(!A.strokes[A.currentPage])A.strokes[A.currentPage]=[];
    A.strokes[A.currentPage].push({type:'text',text:txt,x:txX,y:txY,color:strokeColor,size:Math.max(strokeSize,2)});
    A.redraw(); subWindows.forEach(sw=>sw.update(A.strokes,A.currentPage)); scheduleSave();
  }
  cancelTx();
}
document.getElementById('txfld').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.ctrlKey)confirmTx(); if(e.key==='Escape')cancelTx();
});

/* ============================================================
   PDF生成・保存
   ============================================================ */
async function generatePDFBlob() {
  if (!window.jspdf) throw new Error('jsPDFが読み込まれていません');
  const { jsPDF } = window.jspdf; const RS=2;
  const pg1=await A.pdfDoc.getPage(1); const vp1=pg1.getViewport({scale:1});
  const doc=new jsPDF({unit:'pt',format:[vp1.width,vp1.height],
    orientation:vp1.width>vp1.height?'l':'p'});
  for (let i=1; i<=A.totalPages; i++) {
    if (i>1) { const pgi=await A.pdfDoc.getPage(i); const vpi=pgi.getViewport({scale:1});
      doc.addPage([vpi.width,vpi.height],vpi.width>vpi.height?'l':'p'); }
    const page=await A.pdfDoc.getPage(i); const vp=page.getViewport({scale:RS});
    const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
    const ctx=c.getContext('2d');
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    (A.strokes[i]||[]).forEach(s=>drawOne(s,ctx,RS));
    doc.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,vp.width/RS,vp.height/RS);
  }
  return doc.output('blob');
}
async function tryWrite(blob, filename) {
  // File System Access API で上書き保存を試みる
  if (_fileHandle) {
    try {
      const w=await _fileHandle.createWritable(); await w.write(blob); await w.close();
      showToast('💾 上書き保存しました: '+filename); return;
    } catch(e) { console.warn('FSAPI write failed:', e); }
  }
  if (window.showSaveFilePicker) {
    try {
      const fh=await window.showSaveFilePicker({
        suggestedName:filename,
        types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]
      });
      _fileHandle=fh;
      const w=await fh.createWritable(); await w.write(blob); await w.close();
      showToast('💾 保存しました: '+filename); return;
    } catch(e) { if(e.name==='AbortError')return; }
  }
  // フォールバック: ダウンロード
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.download=filename; a.href=url; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  showToast('💾 ダウンロードしました: '+filename);
}
async function savePDF() {
  if (!A.pdfDoc) { showToast('PDFが開かれていません'); return; }
  showLoading(true);
  try { const blob=await generatePDFBlob(); await tryWrite(blob, A.fileName||'drawing.pdf'); }
  catch(e) { if(e.name!=='AbortError'){showToast('保存失敗: '+e.message);console.error(e);} }
  showLoading(false);
}
async function savePDFAs() {
  if (!A.pdfDoc) { showToast('PDFが開かれていません'); return; }
  const fname=prompt('ファイル名を入力', A.fileName||'drawing.pdf'); if(!fname)return;
  const fn=fname.endsWith('.pdf')?fname:fname+'.pdf';
  showLoading(true);
  try { const blob=await generatePDFBlob();
    // 別名保存: ハンドルをリセットして新ファイルとして保存
    const savedHandle=_fileHandle; _fileHandle=null;
    await tryWrite(blob, fn); if(!_fileHandle)_fileHandle=savedHandle;
  } catch(e) { showToast('保存失敗'); }
  showLoading(false);
}
function printPage(){ if(!A.pdfDoc){showToast('PDFが開かれていません');return;} window.print(); }

/* ============================================================
   計算機
   ============================================================ */
let ce='',cop='',cv='',cjeq=false; const chist=[];
function cDec(){return parseInt(document.getElementById('cdec').value)??1;}
function cDsp(){document.getElementById('cexpr').textContent=ce;document.getElementById('cval').textContent=cv||'0';}
function cNum(n){if(cjeq){cv='';ce='';cjeq=false;}if(n==='.'&&cv.includes('.'))return;cv+=n;cDsp();}
function cOp(op){cjeq=false;if(cv!==''&&cop!==''){
  const a=parseFloat(ce.split(/[÷×＋−+\-*/]/)[0])||0,b=parseFloat(cv)||0;let r=a;
  if(cop==='+')r=a+b;else if(cop==='-')r=a-b;else if(cop==='*')r=a*b;else if(cop==='/')r=b?a/b:0;
  cv=String(+r.toFixed(cDec()));}
  ce=(cv||'0')+{'+':'＋','-':'−','*':'×','/':'÷'}[op]; cop=op;cv='';cDsp();}
function cEq(){if(!cop||cv==='')return;
  const a=parseFloat(ce.split(/[÷×＋−]/)[0])||0,b=parseFloat(cv)||0;let r=a;
  if(cop==='+')r=a+b;else if(cop==='-')r=a-b;else if(cop==='*')r=a*b;else if(cop==='/')r=b?a/b:0;
  const rs=String(+r.toFixed(cDec()));
  chist.unshift(ce+cv+' = '+rs); if(chist.length>20)chist.pop();
  document.getElementById('chist').innerHTML=chist.map(h=>`<div class="chi">${h}</div>`).join('');
  ce=ce+cv+'=';cv=rs;cop='';cjeq=true;cDsp();}
function cFn(f){
  if(f==='C'){ce='';cv='';cop='';cjeq=false;}
  else if(f==='±'){if(cv)cv=String(-parseFloat(cv));}
  else if(f==='%'){if(cv)cv=String(parseFloat(cv)/100);}
  else if(f==='⌫'){cv=cv.length>1?cv.slice(0,-1):'';}
  cDsp();}
function cSqrt(){if(!cv)return;const v=parseFloat(cv);cv=v<0?'エラー':String(+Math.sqrt(v).toFixed(cDec()));cDsp();}
function cSq(){if(!cv)return;cv=String(+(parseFloat(cv)**2).toFixed(cDec()));cDsp();}
function toggleCalc(){
  const el=document.getElementById('calc');
  el.classList.toggle('on');
  document.getElementById('calcbtn').classList.toggle('on',el.classList.contains('on'));
}
// ★ 計算機ドラッグ: 閉じるボタンを除外
(()=>{
  const el=document.getElementById('calc'); let d=false,ox=0,oy=0,ex=0,ey=0;
  const st=e=>{
    if(e.target.closest('#cclose'))return; // ★ 閉じるボタン除外
    const src=e.touches?e.touches[0]:e; d=true;ox=src.clientX;oy=src.clientY;
    const r=el.getBoundingClientRect();ex=r.left;ey=r.top;
    if(e.cancelable)e.preventDefault(); e.stopPropagation();
  };
  const mv=e=>{if(!d)return;const src=e.touches?e.touches[0]:e;
    el.style.left=(ex+src.clientX-ox)+'px';el.style.top=(ey+src.clientY-oy)+'px';
    el.style.bottom='auto';el.style.right='auto';};
  const en=()=>d=false;
  document.getElementById('ctb').addEventListener('touchstart',st,{passive:false});
  document.getElementById('ctb').addEventListener('mousedown',st);
  document.addEventListener('touchmove',mv,{passive:true});document.addEventListener('mousemove',mv);
  document.addEventListener('touchend',en);document.addEventListener('mouseup',en);
})();

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800);}
function showLoading(v){document.getElementById('loading').classList.toggle('on',v);}
