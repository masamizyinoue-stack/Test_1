<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>鉄骨図面ビューア Refactor Core</title>
<style>
:root{
  --bg:#111418;
  --panel:#1b2027;
  --line:#313945;
  --accent:#f07800;
  --text:#dde3ea;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:sans-serif}
#topbar{
  height:56px;
  background:var(--panel);
  border-bottom:2px solid var(--accent);
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
}
button{
  height:38px;
  padding:0 12px;
  border:none;
  border-radius:8px;
  background:#28313b;
  color:white;
  cursor:pointer;
}
button.active{background:var(--accent)}
#viewer{
  position:relative;
  width:100%;
  height:calc(100vh - 56px);
  overflow:hidden;
  touch-action:none;
}
.layer{
  position:absolute;
  left:0;
  top:0;
  transform-origin:0 0;
}
#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#20252c;
  padding:10px 16px;
  border-radius:10px;
  opacity:0;
  transition:.2s;
}
#toast.show{opacity:1}
</style>
</head>
<body>

<div id="topbar">
  <input type="file" id="file" accept="application/pdf" hidden>
  <button onclick="openPDF()">📂 PDF</button>
  <button class="active" id="penBtn" onclick="setTool('pen')">✏️ ペン</button>
  <button id="eraserBtn" onclick="setTool('eraser')">🩹 消し</button>
  <button onclick="undoStroke()">↩ 戻す</button>
  <button onclick="clearPage()">🗑 消去</button>
  <span id="status">待機中</span>
</div>

<div id="viewer">
  <canvas id="pdfLayer" class="layer"></canvas>
  <canvas id="drawLayer" class="layer"></canvas>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* =========================================================
   Refactor Core
   ========================================================= */

const DPR = Math.min(window.devicePixelRatio || 1, 2);

const state = {
  pdf:null,
  page:1,
  scale:1,
  tool:'pen',
  strokes:{},
  currentStroke:null,
  drawing:false,
  renderPending:false,
  autosaveTimer:null,
  cache:new Map(),
  panX:0,
  panY:0,
};

const viewer = document.getElementById('viewer');
const pdfCanvas = document.getElementById('pdfLayer');
const drawCanvas = document.getElementById('drawLayer');
const pdfCtx = pdfCanvas.getContext('2d');
const drawCtx = drawCanvas.getContext('2d');

let cachedRect = null;

/* =========================================================
   Utility
   ========================================================= */

function updateRect(){
  cachedRect = viewer.getBoundingClientRect();
}

window.addEventListener('resize', updateRect);
updateRect();

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');

  clearTimeout(el._tm);
  el._tm = setTimeout(()=>{
    el.classList.remove('show');
  },2000);
}

function setStatus(t){
  document.getElementById('status').textContent = t;
}

/* =========================================================
   Tool
   ========================================================= */

function setTool(tool){
  state.tool = tool;

  document.querySelectorAll('#topbar button').forEach(b=>{
    b.classList.remove('active');
  });

  if(tool==='pen') penBtn.classList.add('active');
  if(tool==='eraser') eraserBtn.classList.add('active');
}

/* =========================================================
   PDF
   ========================================================= */

async function openPDF(){
  document.getElementById('file').click();
}

file.addEventListener('change', async e=>{
  const f = e.target.files[0];
  if(!f) return;

  setStatus('PDF読込中...');

  const buf = await f.arrayBuffer();

  state.pdf = await pdfjsLib.getDocument({data:buf}).promise;

  await renderPage(1);

  setStatus('読込完了');
  toast('PDFを読み込みました');
});

async function renderPage(pageNo){
  if(!state.pdf) return;

  state.page = pageNo;

  const cacheKey = pageNo + '_' + state.scale;

  if(state.cache.has(cacheKey)){
    const bmp = state.cache.get(cacheKey);

    pdfCanvas.width = bmp.width;
    pdfCanvas.height = bmp.height;

    pdfCtx.drawImage(bmp,0,0);

    resizeDrawLayer();
    requestRedraw();

    return;
  }

  const page = await state.pdf.getPage(pageNo);

  const viewport = page.getViewport({
    scale:state.scale * DPR
  });

  pdfCanvas.width = viewport.width;
  pdfCanvas.height = viewport.height;

  pdfCanvas.style.width = viewport.width / DPR + 'px';
  pdfCanvas.style.height = viewport.height / DPR + 'px';

  drawCanvas.width = viewport.width;
  drawCanvas.height = viewport.height;

  drawCanvas.style.width = pdfCanvas.style.width;
  drawCanvas.style.height = pdfCanvas.style.height;

  await page.render({
    canvasContext:pdfCtx,
    viewport
  }).promise;

  try{
    const bmp = await createImageBitmap(pdfCanvas);
    state.cache.set(cacheKey,bmp);
  }catch(err){
    console.warn(err);
  }

  requestRedraw();
}

function resizeDrawLayer(){
  drawCanvas.style.width = pdfCanvas.style.width;
  drawCanvas.style.height = pdfCanvas.style.height;
}

/* =========================================================
   Optimized Redraw
   ========================================================= */

function requestRedraw(){
  if(state.renderPending) return;

  state.renderPending = true;

  requestAnimationFrame(()=>{
    state.renderPending = false;
    redraw();
  });
}

function redraw(){
  drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);

  const arr = state.strokes[state.page] || [];

  arr.forEach(drawStroke);
}

function drawStroke(stroke){
  drawCtx.save();

  if(stroke.type==='eraser'){
    drawCtx.globalCompositeOperation = 'destination-out';
    drawCtx.lineWidth = 20 * DPR;
  }else{
    drawCtx.strokeStyle = '#ff6600';
    drawCtx.lineWidth = 3 * DPR;
  }

  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';

  drawCtx.beginPath();

  stroke.points.forEach((p,i)=>{
    if(i===0){
      drawCtx.moveTo(p[0],p[1]);
    }else{
      drawCtx.lineTo(p[0],p[1]);
    }
  });

  drawCtx.stroke();
  drawCtx.restore();
}

/* =========================================================
   Optimized Input
   ========================================================= */

let latestMoveEvent = null;
let movePending = false;

function getPos(e){
  const t = e.touches ? e.touches[0] : e;

  return {
    x:(t.clientX - cachedRect.left) * DPR,
    y:(t.clientY - cachedRect.top) * DPR
  };
}

function beginDraw(e){
  e.preventDefault();

  state.drawing = true;

  const p = getPos(e);

  state.currentStroke = {
    type:state.tool,
    points:[[p.x,p.y]]
  };
}

function moveDraw(e){
  if(!state.drawing) return;

  latestMoveEvent = e;

  if(movePending) return;

  movePending = true;

  requestAnimationFrame(()=>{
    movePending = false;

    if(!latestMoveEvent) return;

    processMove(latestMoveEvent);
  });
}

function processMove(e){
  const p = getPos(e);

  const points = state.currentStroke.points;
  const last = points[points.length - 1];

  const dx = p.x - last[0];
  const dy = p.y - last[1];

  /* 点間引きで軽量化 */
  if(dx*dx + dy*dy < 4) return;

  points.push([p.x,p.y]);

  requestRedraw();

  drawStroke(state.currentStroke);
}

function endDraw(){
  if(!state.drawing) return;

  state.drawing = false;

  if(!state.strokes[state.page]){
    state.strokes[state.page] = [];
  }

  state.strokes[state.page].push(state.currentStroke);

  state.currentStroke = null;

  scheduleAutosave();
}

/* =========================================================
   Autosave Debounce
   ========================================================= */

function scheduleAutosave(){
  clearTimeout(state.autosaveTimer);

  state.autosaveTimer = setTimeout(()=>{
    saveSession();
  },3000);
}

function saveSession(){
  try{
    localStorage.setItem('tekko_refactor_save', JSON.stringify({
      strokes:state.strokes,
      page:state.page
    }));

    console.log('autosave');
  }catch(err){
    console.warn(err);
  }
}

/* =========================================================
   Actions
   ========================================================= */

function undoStroke(){
  const arr = state.strokes[state.page];

  if(!arr || !arr.length) return;

  arr.pop();
  requestRedraw();
}

function clearPage(){
  state.strokes[state.page] = [];
  requestRedraw();
}

/* =========================================================
   Events
   ========================================================= */

viewer.addEventListener('touchstart', beginDraw,{passive:false});
viewer.addEventListener('touchmove', moveDraw,{passive:false});
viewer.addEventListener('touchend', endDraw);

viewer.addEventListener('mousedown', beginDraw);
viewer.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', endDraw);

/* =========================================================
   Startup
   ========================================================= */

/* =========================================================
   iPad Gesture Support
   ========================================================= */

let gestureMode = false;
let lastPinchDistance = 0;
let lastPanCenter = null;

function getTouchDistance(t1,t2){
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function getTouchCenter(t1,t2){
  return {
    x:(t1.clientX + t2.clientX)/2,
    y:(t1.clientY + t2.clientY)/2
  };
}

function applyTransform(){
  const tf = `translate(${state.panX}px,${state.panY}px) scale(${state.scale})`;

  pdfCanvas.style.transform = tf;
  drawCanvas.style.transform = tf;

  subWindows.forEach(sw=>sw.update());
}

viewer.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    gestureMode = true;

    lastPinchDistance = getTouchDistance(e.touches[0],e.touches[1]);
    lastPanCenter = getTouchCenter(e.touches[0],e.touches[1]);
  }
},{passive:false});

viewer.addEventListener('touchmove',e=>{
  if(e.touches.length!==2 || !gestureMode) return;

  e.preventDefault();

  const dist = getTouchDistance(e.touches[0],e.touches[1]);
  const center = getTouchCenter(e.touches[0],e.touches[1]);

  const scaleDelta = dist / lastPinchDistance;

  state.scale *= scaleDelta;

  state.scale = Math.max(0.5,Math.min(state.scale,5));

  state.panX += center.x - lastPanCenter.x;
  state.panY += center.y - lastPanCenter.y;

  lastPinchDistance = dist;
  lastPanCenter = center;

  applyTransform();
},{passive:false});

viewer.addEventListener('touchend',()=>{
  gestureMode = false;
});

/* =========================================================
   Sub Window
   ========================================================= */

const subWindows = [];

class SubWindow{
  constructor(){
    this.el = document.createElement('div');

    this.el.style.position = 'absolute';
    this.el.style.right = '20px';
    this.el.style.bottom = '20px';
    this.el.style.width = '260px';
    this.el.style.height = '180px';
    this.el.style.background = '#1d2228';
    this.el.style.border = '2px solid #f07800';
    this.el.style.borderRadius = '12px';
    this.el.style.overflow = 'hidden';
    this.el.style.zIndex = '999';
    this.el.style.touchAction = 'none';

    this.header = document.createElement('div');
    this.header.style.height = '34px';
    this.header.style.background = '#2a3139';
    this.header.style.display = 'flex';
    this.header.style.alignItems = 'center';
    this.header.style.justifyContent = 'space-between';
    this.header.style.padding = '0 10px';
    this.header.innerHTML = '<span>サブウインドウ</span>';

    this.closeBtn = document.createElement('button');
    this.closeBtn.textContent = '✕';
    this.closeBtn.style.height = '26px';
    this.closeBtn.onclick = ()=>this.close();

    this.header.appendChild(this.closeBtn);

    this.canvas = document.createElement('canvas');
    this.canvas.width = 260;
    this.canvas.height = 146;
    this.canvas.style.width = '100%';
    this.canvas.style.height = 'calc(100% - 34px)';

    this.ctx = this.canvas.getContext('2d');

    this.el.appendChild(this.header);
    this.el.appendChild(this.canvas);

    document.body.appendChild(this.el);

    this.enableDrag();
    this.update();
  }

  update(){
    this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);

    this.ctx.drawImage(pdfCanvas,0,0,this.canvas.width,this.canvas.height);
    this.ctx.drawImage(drawCanvas,0,0,this.canvas.width,this.canvas.height);
  }

  enableDrag(){
    let dragging = false;
    let sx=0;
    let sy=0;

    this.header.addEventListener('touchstart',e=>{
      dragging = true;

      sx = e.touches[0].clientX - this.el.offsetLeft;
      sy = e.touches[0].clientY - this.el.offsetTop;
    },{passive:true});

    window.addEventListener('touchmove',e=>{
      if(!dragging) return;

      this.el.style.left = (e.touches[0].clientX - sx)+'px';
      this.el.style.top = (e.touches[0].clientY - sy)+'px';
    },{passive:true});

    window.addEventListener('touchend',()=>{
      dragging = false;
    });
  }

  close(){
    this.canvas.width = 1;
    this.canvas.height = 1;

    this.el.remove();

    const i = subWindows.indexOf(this);
    if(i>=0) subWindows.splice(i,1);
  }
}

function createSubWindow(){
  const sw = new SubWindow();
  subWindows.push(sw);
}

const subBtn = document.createElement('button');
subBtn.textContent = '🪟 サブ窓';
subBtn.onclick = createSubWindow;
document.getElementById('topbar').appendChild(subBtn);

toast('Refactor Core 起動');
setStatus('準備完了');

</script>
</body>
</html>
