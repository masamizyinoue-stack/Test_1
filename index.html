/* ---- modules/core/storage/idb.js ---- */
/**
 * modules/core/storage/idb.js — IndexedDB 薄いラッパー
 * M_Viewer 再設計 Phase 7
 *
 * 責務:
 *   - IndexedDB の open / get / put / delete / getAll を Promise 化
 *   - transaction.oncomplete を必ず待つ（write 完了保証）
 *   - エラーは reject ではなく null/false で返し呼び出し元が判断
 *   - Safari の IDB 制限（プライベートブラウジング等）に対処
 *
 * 禁止:
 *   - 保存ロジック（DocumentSaveManager が行う）
 *   - Store への dispatch
 */


const log = createLogger('IDB');

const DB_NAME    = 'MViewer_v1';
const DB_VERSION = 1;

/** ストア名定数 */
const STORE = Object.freeze({
  SESSIONS:  'sessions',   // docId → SaveRecord
  BACKUPS:   'backups',    // docId → BackupRecord[]（世代管理）
});

/**
 * @typedef {Object} SaveRecord
 * @property {string}  docId
 * @property {string}  docName
 * @property {number}  pageCount
 * @property {Object}  pages       { [page]: Stroke[] }（消しゴムを除去済み）
 * @property {number}  savedAt     Date.now()
 * @property {string}  version     APP_VERSION
 * @property {number}  checksum    簡易整合性チェック値
 */

/**
 * @typedef {Object} BackupRecord
 * @property {string}  id          uid()
 * @property {string}  docId
 * @property {string}  docName
 * @property {number}  pageCount
 * @property {Object}  pages
 * @property {number}  savedAt
 * @property {string}  version
 */

/* ============================================================
   内部: DB 接続（シングルトン）
   ============================================================ */

/** @type {IDBDatabase | null} */
let _db = null;
/** @type {Promise<IDBDatabase> | null} */
let _opening = null;

/**
 * DB を開く（初回のみ実行、以降はキャッシュを返す）
 * @returns {Promise<IDBDatabase | null>}  Safari 制限時は null
 */
async function openDB() {
  if (_db) return _db;
  if (_opening) return _opening;

  _opening = new Promise((resolve) => {
    try {
      const req = indexedDB.open(DB_NAME, DB_VERSION);

      req.onupgradeneeded = e => {
        const db = e.target.result;
        // sessions ストア: docId をキー
        if (!db.objectStoreNames.contains(STORE.SESSIONS)) {
          db.createObjectStore(STORE.SESSIONS, { keyPath: 'docId' });
        }
        // backups ストア: id をキー + docId インデックス
        if (!db.objectStoreNames.contains(STORE.BACKUPS)) {
          const bs = db.createObjectStore(STORE.BACKUPS, { keyPath: 'id' });
          bs.createIndex('byDocId', 'docId', { unique: false });
        }
      };

      req.onsuccess = e => {
        _db = e.target.result;
        // 接続エラー検知
        _db.onerror = ev => log.warn('IDB error:', ev.target.error);
        _opening = null;
        log.info('opened');
        resolve(_db);
      };

      req.onerror = e => {
        log.warn('open failed:', e.target.error);
        _opening = null;
        resolve(null);
      };

      req.onblocked = () => {
        log.warn('IDB blocked — old tab open?');
      };
    } catch (e) {
      // Safari プライベートブラウジングで IndexedDB が使えない場合
      log.warn('IDB unavailable:', e.message);
      _opening = null;
      resolve(null);
    }
  });

  return _opening;
}

/** DB 接続をクローズ（テスト・リセット用） */
function closeDB() {
  if (_db) { _db.close(); _db = null; }
}

/* ============================================================
   公開 CRUD — transaction.oncomplete 保証版
   ============================================================ */

/**
 * レコードを取得
 * @param {string} storeName
 * @param {IDBValidKey} key
 * @returns {Promise<any | null>}
 */
async function idbGet(storeName, key) {
  const db = await openDB();
  if (!db) return null;
  return new Promise(resolve => {
    try {
      const tx  = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).get(key);
      req.onsuccess = () => resolve(req.result ?? null);
      req.onerror   = () => { log.warn('get error', req.error); resolve(null); };
    } catch (e) {
      log.warn('idbGet throw:', e.message);
      resolve(null);
    }
  });
}

/**
 * レコードを保存（transaction.oncomplete まで待つ）
 * @param {string} storeName
 * @param {object} record
 * @returns {Promise<boolean>}  成功: true / 失敗: false
 */
async function idbPut(storeName, record) {
  const db = await openDB();
  if (!db) return false;
  return new Promise(resolve => {
    try {
      const tx    = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req   = store.put(record);

      // ★ oncomplete = ディスク書き込み完了の保証
      tx.oncomplete = () => resolve(true);
      tx.onerror    = () => { log.warn('put tx error:', tx.error); resolve(false); };
      tx.onabort    = () => { log.warn('put tx abort'); resolve(false); };
      req.onerror   = () => { log.warn('put req error:', req.error); };
    } catch (e) {
      log.warn('idbPut throw:', e.message);
      resolve(false);
    }
  });
}

/**
 * レコードを削除
 * @param {string} storeName
 * @param {IDBValidKey} key
 * @returns {Promise<boolean>}
 */
async function idbDelete(storeName, key) {
  const db = await openDB();
  if (!db) return false;
  return new Promise(resolve => {
    try {
      const tx  = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(key);
      tx.oncomplete = () => resolve(true);
      tx.onerror    = () => resolve(false);
      tx.onabort    = () => resolve(false);
    } catch (e) {
      resolve(false);
    }
  });
}

/**
 * インデックスで複数レコードを取得
 * @param {string} storeName
 * @param {string} indexName
 * @param {IDBValidKey} value
 * @returns {Promise<any[]>}
 */
async function idbGetByIndex(storeName, indexName, value) {
  const db = await openDB();
  if (!db) return [];
  return new Promise(resolve => {
    try {
      const tx    = db.transaction(storeName, 'readonly');
      const idx   = tx.objectStore(storeName).index(indexName);
      const req   = idx.getAll(value);
      req.onsuccess = () => resolve(req.result ?? []);
      req.onerror   = () => resolve([]);
    } catch (e) {
      resolve([]);
    }
  });
}

/**
 * ストア内の全件数を取得
 * @param {string} storeName
 * @returns {Promise<number>}
 */
async function idbCount(storeName) {
  const db = await openDB();
  if (!db) return 0;
  return new Promise(resolve => {
    try {
      const tx  = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).count();
      req.onsuccess = () => resolve(req.result ?? 0);
      req.onerror   = () => resolve(0);
    } catch (e) {
      resolve(0);
    }
  });
}


/* ---- modules/core/storage/local.js ---- */
/**
 * modules/core/storage/local.js — localStorage 緊急セーブ層
 * M_Viewer 再設計 Phase 7
 *
 * 責務:
 *   - Safari 終了前 (pagehide) の同期書き込み
 *   - IDB 障害時のフォールバック読み取り
 *   - 5 MB 制限対策（ストローク数を超えたら古いページから切り捨て）
 *
 * 設計方針:
 *   - 同期 API (localStorage.setItem) のみ使用 → pagehide 内で安全
 *   - キーは LS_KEY = 'mv_session_<docId>'
 *   - 保存できなかった場合は warn を出して silent fail（例外を投げない）
 *
 * 禁止:
 *   - 非同期処理（IDB 呼び出し等）
 *   - Store への dispatch
 */


const log     = createLogger('LocalSave');
const PREFIX  = 'mv_session_';
const MAX_LEN = 4_500_000;   // 4.5 MB — localStorage 上限 5 MB の安全圏

/**
 * セッションデータを localStorage に同期保存
 * @param {string} docId
 * @param {object} record  SaveRecord 互換オブジェクト
 * @returns {boolean}  成功: true / 書き込み失敗: false
 */
function lsSave(docId, record) {
  if (!docId) return false;
  try {
    const json = JSON.stringify(record);
    if (json.length > MAX_LEN) {
      // サイズ超過 → ページ数の多い順から切り捨て
      const trimmed = _trimRecord(record, MAX_LEN);
      const trimJson = JSON.stringify(trimmed);
      localStorage.setItem(PREFIX + docId, trimJson);
      log.warn(`lsSave: trimmed ${json.length}→${trimJson.length} bytes`);
    } else {
      localStorage.setItem(PREFIX + docId, json);
    }
    return true;
  } catch (e) {
    // QuotaExceededError など
    log.warn('lsSave failed:', e.message);
    return false;
  }
}

/**
 * localStorage からセッションデータを読み込む
 * @param {string} docId
 * @returns {object | null}
 */
function lsLoad(docId) {
  if (!docId) return null;
  try {
    const json = localStorage.getItem(PREFIX + docId);
    if (!json) return null;
    return JSON.parse(json);
  } catch (e) {
    log.warn('lsLoad parse error:', e.message);
    return null;
  }
}

/**
 * localStorage のセッションデータを削除
 * @param {string} docId
 */
function lsRemove(docId) {
  if (!docId) return;
  try {
    localStorage.removeItem(PREFIX + docId);
  } catch (_) {}
}

/**
 * 全セッションキーを列挙して docId 一覧を返す
 * @returns {string[]}
 */
function lsListDocIds() {
  const ids = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k?.startsWith(PREFIX)) ids.push(k.slice(PREFIX.length));
    }
  } catch (_) {}
  return ids;
}

/* ============================================================
   内部: サイズ超過時のトリミング
   ============================================================ */

/**
 * record.pages のストローク数をサイズ制限内に収まるよう削減
 * 削減順: ページ番号の降順（後のページから切る）
 * @param {object} record
 * @param {number} maxLen
 * @returns {object}
 */
function _trimRecord(record, maxLen) {
  const pages = { ...record.pages };
  const pageNums = Object.keys(pages).map(Number).sort((a, b) => b - a);

  for (const p of pageNums) {
    // そのページのストロークを半分ずつ削る
    while (pages[p]?.length > 0) {
      pages[p] = pages[p].slice(0, Math.ceil(pages[p].length / 2));
      const test = JSON.stringify({ ...record, pages }).length;
      if (test <= maxLen) return { ...record, pages, _trimmed: true };
    }
    // ページごと削除
    delete pages[p];
    const test = JSON.stringify({ ...record, pages }).length;
    if (test <= maxLen) return { ...record, pages, _trimmed: true };
  }
  // 全削除しても収まらない（異常系）
  return { ...record, pages: {}, _trimmed: true };
}


/* ---- modules/core/storage/DocumentSaveManager.js ---- */
/**
 * modules/core/storage/DocumentSaveManager.js — 保存責任者（一元管理）
 * M_Viewer 再設計 Phase 7
 *
 * ★ 設計原則: アプリ内の全保存経路はここを唯一の入口とする ★
 *
 * 責務:
 *   - 自動保存（debounce SAVE_DELAY_MS）
 *   - 即時保存（saveNow: キューに割り込み）
 *   - 保存キュー（同時実行 1 本のみ・多重保存防止）
 *   - 2層保存: L1 localStorage（同期）→ L2 IndexedDB（oncomplete 保証）
 *   - 保存結果確認（IDB 読み戻しで一致を確認）
 *   - バックアップ（世代管理 MAX_BACKUPS 件）
 *   - 復元（IDB → localStorage の新しい方を採用・整合性確認）
 *   - pagehide 対応（Safari 終了前 L1 強制書き込み）
 *   - 障害時フォールバック（IDB 失敗 → L1 のみで継続）
 *
 * 禁止:
 *   - 呼び出し元（app.js 等）からの直接 IDB 操作
 *   - 保存中の多重 saveNow（キューで制御）
 *   - IndexedDB を唯一の信頼保存先として扱うこと
 *
 * 保存データ形式（SaveRecord）:
 *   {
 *     docId, docName, pageCount,
 *     pages: { [page:number]: Stroke[] },  // 消しゴムを除去済み
 *     savedAt, version, checksum
 *   }
 */


const log = createLogger('SaveMgr');

/** バックアップ世代数 */
const MAX_BACKUPS    = 5;
/** 自動保存デバウンス（ms） */
const SAVE_DELAY_MS  = LIMITS.SAVE_DELAY_MS ?? 1200;
/** IDB 書き込み後の読み戻し検証を行うか */
const VERIFY_WRITE   = true;

/* ============================================================
   DocumentSaveManager クラス
   ============================================================ */

class DocumentSaveManager {
  /** @type {number | null} debounce タイマー ID */
  #debounceId  = null;
  /** @type {boolean} 現在保存処理を実行中か */
  #saving      = false;
  /** @type {boolean} 保存要求が pending か（保存中に追加された場合） */
  #pending     = false;
  /** @type {boolean} 即時保存が要求されているか */
  #immediate   = false;
  /** pagehide リスナー（destroy 時に除去） */
  #pageHideFn  = null;
  /** visibilitychange リスナー */
  #visCgFn     = null;

  /* ---- 初期化 / 破棄 ---- */

  /**
   * 保存マネージャーを起動する（アプリ起動時に1回だけ呼ぶ）
   * - pagehide / visibilitychange リスナーを登録
   * - Store の annotation/document 変更を購読して自動保存をトリガー
   */
  init() {
    // Safari 終了前の強制保存（pagehide は iOS Safari で確実に発火）
    this.#pageHideFn = () => this.#onPageHide();
    window.addEventListener('pagehide', this.#pageHideFn, { passive: true });

    // バックグラウンド遷移時にも L1 同期書き込み（iOS PWA 対策）
    this.#visCgFn = () => {
      if (document.visibilityState === 'hidden') this.#onPageHide();
    };
    document.addEventListener('visibilitychange', this.#visCgFn, { passive: true });

    // Store の注釈変化を監視 → 自動保存キック（unsub を保存して destroy で除去）
    const unsubAnn   = Store.on('annotation',     () => this.#scheduleAutoSave());
    const unsubDirty = Store.on('document.dirty', ({ next }) => { if (next) this.#scheduleAutoSave(); });
    // pagehide/visibilitychange の unsub と同一配列で管理
    this._storeUnsubs = [unsubAnn, unsubDirty];

    log.info('initialized');
  }

  /** 破棄（ドキュメントクローズ / アプリ終了） */
  destroy() {
    this.#cancelDebounce();
    if (this.#pageHideFn) window.removeEventListener('pagehide', this.#pageHideFn);
    if (this.#visCgFn)    document.removeEventListener('visibilitychange', this.#visCgFn);
    this.#pageHideFn = null;
    this.#visCgFn    = null;
    // Store 購読を解除（ゾンビ保存・メモリリーク防止）
    if (this._storeUnsubs) {
      this._storeUnsubs.forEach(fn => fn?.());
      this._storeUnsubs = null;
    }
    log.info('destroyed');
  }

  /* ---- 公開 API ---- */

  /**
   * 即時保存（ページ切替・アプリ終了前など緊急時）
   * 現在保存中なら完了後すぐ再保存する
   * @returns {Promise<boolean>}
   */
  async saveNow() {
    this.#cancelDebounce();
    if (this.#saving) {
      this.#pending   = true;
      this.#immediate = true;
      // 保存完了を待って結果を返す
      return new Promise(resolve => {
        const check = setInterval(() => {
          if (!this.#saving) {
            clearInterval(check);
            resolve(true);
          }
        }, 50);
      });
    }
    return this.#runSave('immediate');
  }

  /**
   * アプリ起動時のセッション復元
   * IDB と localStorage の両方を確認し、新しい方を採用する
   * @returns {Promise<{ restored: boolean, docId?: string, record?: object }>}
   */
  async restore() {
    const docId = Store.get('document.id');
    if (!docId) {
      // 前回セッションを IDB から検索（最後に保存したセッション）
      return this.#restoreLastSession();
    }
    return this.#restoreForDoc(docId);
  }

  /**
   * バックアップを作成する（ユーザー操作による明示的バックアップ）
   * @returns {Promise<boolean>}
   */
  async backup() {
    const record = this.#buildRecord();
    if (!record) return false;
    return this.#saveBackup(record);
  }

  /**
   * ZIP バックアップのダウンロード（Phase 9 で実装）
   * ここでは JSON ダウンロードで代替
   * @returns {boolean}
   */
  downloadBackup() {
    const record = this.#buildRecord();
    if (!record) return false;
    try {
      const json = JSON.stringify(record, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `${record.docName}_backup_${_fmtTs(record.savedAt)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      log.info('download backup:', record.docName);
      return true;
    } catch (e) {
      log.warn('downloadBackup error:', e.message);
      return false;
    }
  }

  /**
   * バックアップ世代一覧を返す（UI 表示用）
   * @param {string} docId
   * @returns {Promise<BackupRecord[]>}
   */
  async listBackups(docId) {
    const id = docId ?? Store.get('document.id');
    if (!id) return [];
    return idbGetByIndex(STORE.BACKUPS, 'byDocId', id);
  }

  /**
   * 特定バックアップを復元する
   * @param {string} backupId  BackupRecord.id
   * @returns {Promise<boolean>}
   */
  async restoreFromBackup(backupId) {
    const rec = await idbGet(STORE.BACKUPS, backupId);
    if (!rec) { log.warn('backup not found:', backupId); return false; }
    return this.#applyRecord(rec);
  }

  /* ---- 内部: 自動保存スケジュール ---- */

  #scheduleAutoSave() {
    this.#cancelDebounce();
    this.#debounceId = setTimeout(() => {
      this.#debounceId = null;
      if (!this.#saving) {
        this.#runSave('auto').catch(e => log.warn('auto save error:', e));
      } else {
        this.#pending = true;
      }
    }, SAVE_DELAY_MS);
  }

  #cancelDebounce() {
    if (this.#debounceId !== null) {
      clearTimeout(this.#debounceId);
      this.#debounceId = null;
    }
  }

  /* ---- 内部: 保存実行 ---- */

  /**
   * 実際の保存処理（同時実行 1 本保証）
   * @param {'auto'|'immediate'|'pagehide'} reason
   * @returns {Promise<boolean>}
   */
  async #runSave(reason) {
    if (this.#saving) return false;

    const record = this.#buildRecord();
    if (!record) return false;  // ドキュメント未ロード

    this.#saving  = true;
    this.#pending = false;
    this.#immediate = false;

    Store.dispatch(Actions.ui.setSaving(true));
    log.debug(`save start (${reason}):`, record.docId);

    let ok = false;
    try {
      ok = await this.#writeLayers(record);
    } catch (e) {
      log.warn('save exception:', e.message);
      ok = false;
    }

    // dirty フラグを下げる（保存成功時のみ）
    if (ok) {
      Store.dispatch(Actions.document.setDirty(false));
      Store.dispatch(Actions.document.setBkDirty(false));
    } else {
      log.warn(`save failed (${reason}) — will retry`);
    }

    Store.dispatch(Actions.ui.setSaving(false));
    this.#saving = false;
    log.debug(`save end (${reason}): ok=${ok}`);

    // 保存中に新しい変更があった場合は再実行
    if (this.#pending || this.#immediate) {
      const nextReason = this.#immediate ? 'immediate' : 'auto';
      this.#pending   = false;
      this.#immediate = false;
      // 少し待ってから再実行（同フレームの再帰を避ける）
      setTimeout(() => this.#runSave(nextReason), 0);
    }

    return ok;
  }

  /**
   * L1 → L2 の 2 層に書き込む
   * L1（localStorage）は常に書く（同期）
   * L2（IDB）は書いた後に読み戻して検証
   * いずれかが成功すればデータは保全されている
   * @param {SaveRecord} record
   * @returns {Promise<boolean>}
   */
  async #writeLayers(record) {
    // --- L1: localStorage（同期） ---
    const l1ok = lsSave(record.docId, record);
    if (!l1ok) log.warn('L1 save failed');

    // --- L2: IndexedDB（oncomplete 保証） ---
    const l2ok = await idbPut(STORE.SESSIONS, record);
    if (!l2ok) {
      log.warn('L2 save failed — L1 only mode');
      return l1ok;   // L1 だけでも成功とみなす
    }

    // --- L2 読み戻し検証 ---
    if (VERIFY_WRITE) {
      const verified = await this.#verifyIdb(record);
      if (!verified) {
        log.warn('L2 verify failed — L1 only mode');
        return l1ok;
      }
    }

    return true;
  }

  /**
   * IDB に書いたレコードを読み戻して checksum を確認
   * @param {SaveRecord} record
   * @returns {Promise<boolean>}
   */
  async #verifyIdb(record) {
    const stored = await idbGet(STORE.SESSIONS, record.docId);
    if (!stored) return false;
    // checksum と savedAt が一致するか確認
    if (stored.savedAt !== record.savedAt) {
      log.warn('verify: savedAt mismatch', stored.savedAt, record.savedAt);
      return false;
    }
    if (stored.checksum !== record.checksum) {
      log.warn('verify: checksum mismatch');
      return false;
    }
    return true;
  }

  /* ---- 内部: バックアップ ---- */

  /**
   * バックアップレコードを IDB に保存（世代管理）
   * @param {SaveRecord} record
   * @returns {Promise<boolean>}
   */
  async #saveBackup(record) {
    const backup = { ...record, id: uid() };
    const ok     = await idbPut(STORE.BACKUPS, backup);
    if (!ok) { log.warn('backup idb failed'); return false; }

    // 世代数超過分を削除
    const all = await idbGetByIndex(STORE.BACKUPS, 'byDocId', record.docId);
    all.sort((a, b) => b.savedAt - a.savedAt);  // 新しい順
    for (const old of all.slice(MAX_BACKUPS)) {
      await idbDelete(STORE.BACKUPS, old.id);
      log.debug('old backup removed:', old.id);
    }
    log.info(`backup saved: ${record.docName} (${all.length} total)`);
    return true;
  }

  /* ---- 内部: 復元 ---- */

  /**
   * docId 指定で復元
   * @param {string} docId
   */
  async #restoreForDoc(docId) {
    const idbRec = await idbGet(STORE.SESSIONS, docId);
    const lsRec  = lsLoad(docId);

    const rec = _pickNewerRecord(idbRec, lsRec);
    if (!rec) return { restored: false };

    const ok = await this.#applyRecord(rec);
    return { restored: ok, docId, record: rec };
  }

  /**
   * 前回セッション自動検索（起動時）
   * localStorage の全キーを走査して最新を返す
   */
  async #restoreLastSession() {
    // localStorage から最新セッションを探す
    const { lsListDocIds } = await import('./local.js');
    const ids  = lsListDocIds();
    let   best = null;
    for (const id of ids) {
      const rec = lsLoad(id);
      if (rec && (!best || rec.savedAt > best.savedAt)) best = rec;
    }
    if (!best) return { restored: false };
    // IDB と比較して新しい方を使う
    const idbRec = await idbGet(STORE.SESSIONS, best.docId);
    const rec    = _pickNewerRecord(idbRec, best);
    if (!rec) return { restored: false };
    const ok = await this.#applyRecord(rec);
    return { restored: ok, docId: rec.docId, record: rec };
  }

  /**
   * レコードを Store に反映する
   * @param {SaveRecord} record
   * @returns {Promise<boolean>}
   */
  async #applyRecord(record) {
    try {
      Store.dispatch(Actions.document.load({
        id:        record.docId,
        name:      record.docName,
        pageCount: record.pageCount,
        fileSize:  record.fileSize ?? 0,
      }));
      Store.dispatch(Actions.annotation.load({ data: record.pages ?? {} }));
      Store.dispatch(Actions.document.setDirty(false));
      Store.dispatch(Actions.document.setBkDirty(false));
      log.info(`restored: ${record.docName}, savedAt=${_fmtTs(record.savedAt)}`);
      return true;
    } catch (e) {
      log.warn('applyRecord error:', e.message);
      return false;
    }
  }

  /* ---- 内部: pagehide（Safari 終了対策） ---- */

  /**
   * pagehide / visibilitychange:hidden 時に L1 を同期書き込み
   * IDB は非同期なので pagehide では呼ばない
   */
  #onPageHide() {
    const record = this.#buildRecord();
    if (!record) return;
    const ok = lsSave(record.docId, record);
    log.info(`pagehide L1 save: ok=${ok}`);
  }

  /* ---- 内部: SaveRecord 生成 ---- */

  /**
   * 現在の Store 状態から SaveRecord を生成
   * - 消しゴムストローク（type==='eraser'）を除去
   * - checksum を計算
   * @returns {SaveRecord | null}  ドキュメント未ロード時は null
   */
  #buildRecord() {
    const docId   = Store.get('document.id');
    const docName = Store.get('document.name');
    if (!docId || !docName) return null;

    const rawPages = snapshotPages(Store.state.annotation);

    // 消しゴムストロークを除去（IDB には不要データ）
    const pages = {};
    for (const [page, strokes] of Object.entries(rawPages)) {
      const cleaned = strokes.filter(s => s.type !== 'eraser');
      if (cleaned.length > 0) pages[page] = cleaned;
    }

    const savedAt = Date.now();
    const record  = {
      docId,
      docName,
      pageCount: Store.get('document.pageCount') ?? 0,
      fileSize:  Store.get('document.fileSize')  ?? 0,
      pages,
      savedAt,
      version:  APP_VERSION,
      checksum: _checksum(pages, savedAt),
    };
    return record;
  }
}

/* ============================================================
   ユーティリティ（モジュール内プライベート）
   ============================================================ */

/**
 * 簡易チェックサム: ページ数 × ストローク総数 × savedAt 下5桁
 * @param {object} pages
 * @param {number} savedAt
 * @returns {number}
 */
function _checksum(pages, savedAt) {
  const totalStrokes = Object.values(pages).reduce((s, a) => s + a.length, 0);
  const pageCount    = Object.keys(pages).length;
  return (pageCount * 1000 + totalStrokes) ^ (savedAt % 100000);
}

/**
 * 2つのレコードのうち savedAt が新しい方を返す
 * @param {object|null} a
 * @param {object|null} b
 * @returns {object|null}
 */
function _pickNewerRecord(a, b) {
  if (!a && !b) return null;
  if (!a) return b;
  if (!b) return a;
  return a.savedAt >= b.savedA

/* ---- modules/core/storage/index.js ---- */
/**
 * modules/core/storage/index.js — 保存システム 公開エントリポイント
 * M_Viewer 再設計 Phase 7
 *
 * 外部モジュールはここだけを import する。
 * idb.js / local.js / DocumentSaveManager.js を直接 import しないこと。
 */



/**
 * アプリ全体で唯一の保存責任者
 * app.js が init() を呼ぶことで起動する
 */
const SaveManager = new DocumentSaveManager();


/* ---- modules/pdf/viewport.js ---- */
/**
 * modules/pdf/viewport.js — ズーム・パン・フィット演算（純粋関数）
 * M_Viewer 再設計 Phase 4
 *
 * DOM・Canvas・PDF.js への依存なし。
 * すべて純粋関数（副作用なし）。
 */


/* ============================================================
   フィット計算
   ============================================================ */

/**
 * ページ全体が収まるズーム倍率を返す
 * @param {number} pdfW   PDF ページ幅  (pt)
 * @param {number} pdfH   PDF ページ高さ (pt)
 * @param {number} vpW    ビューポート幅  (CSS px)
 * @param {number} vpH    ビューポート高さ (CSS px)
 * @returns {number} zoom
 */
function calcFitZoom(pdfW, pdfH, vpW, vpH) {
  if (!pdfW || !pdfH || !vpW || !vpH) return 1.0;
  return clamp(
    Math.min(vpW / pdfW, vpH / pdfH),
    LIMITS.ZOOM_MIN,
    LIMITS.ZOOM_MAX
  );
}

/**
 * ページが中央に来るパンオフセットを返す
 * @param {number} pdfW
 * @param {number} pdfH
 * @param {number} vpW
 * @param {number} vpH
 * @param {number} zoom
 * @returns {{ panX:number, panY:number }}
 */
function calcCenterPan(pdfW, pdfH, vpW, vpH, zoom) {
  return {
    panX: (vpW - pdfW * zoom) / 2,
    panY: (vpH - pdfH * zoom) / 2,
  };
}

/* ============================================================
   パン制限（ページが完全に画面外に出ないようにする）
   ============================================================ */

/**
 * パンオフセットを有効範囲にクランプ
 * @param {number} panX
 * @param {number} panY
 * @param {number} pdfW
 * @param {number} pdfH
 * @param {number} vpW
 * @param {number} vpH
 * @param {number} zoom
 * @returns {{ panX:number, panY:number }}
 */
function clampPan(panX, panY, pdfW, pdfH, vpW, vpH, zoom) {
  const scaledW = pdfW * zoom;
  const scaledH = pdfH * zoom;
  const margin  = 60;  // 画面端からはみ出す最小余白 (CSS px)

  const minX = -(scaledW - margin);
  const maxX =   vpW     - margin;
  const minY = -(scaledH - margin);
  const maxY =   vpH     - margin;

  return {
    panX: clamp(panX, minX, maxX),
    panY: clamp(panY, minY, maxY),
  };
}

/* ============================================================
   ピンチズーム計算
   ============================================================ */

/**
 * ピンチ中心を固定してズームを適用したパンオフセットを返す
 * @param {number} prevZoom
 * @param {number} nextZoom
 * @param {number} panX
 * @param {number} panY
 * @param {number} pivotX  CSS px（キャンバスコンテナ基準）
 * @param {number} pivotY
 * @returns {{ zoom:number, panX:number, panY:number }}
 */
function applyZoomAtPivot(prevZoom, nextZoom, panX, panY, pivotX, pivotY) {
  const z = clamp(nextZoom, LIMITS.ZOOM_MIN, LIMITS.ZOOM_MAX);
  const ratio = z / prevZoom;
  return {
    zoom: z,
    panX: pivotX - (pivotX - panX) * ratio,
    panY: pivotY - (pivotY - panY) * ratio,
  };
}

/* ============================================================
   キャンバスサイズ計算
   ============================================================ */

/**
 * Canvas の物理ピクセルサイズ（DPR 考慮・上限キャップ）を返す
 * @param {number} cssW
 * @param {number} cssH
 * @param {number} dpr
 * @returns {{ physW:number, physH:number, dpr:number }}
 */
function calcCanvasSize(cssW, cssH, dpr) {
  const d      = clamp(dpr, 1, LIMITS.MAX_DPR);
  const physW  = Math.min(Math.round(cssW * d), LIMITS.MAX_CANVAS_PX);
  const physH  = Math.min(Math.round(cssH * d), LIMITS.MAX_CANVAS_PX);
  return { physW, physH, dpr: d };
}

/**
 * PDF ページを指定ズームでレンダリングするときのスケールを返す
 * pdf.js の viewport scale = zoom × DPR
 * 大型図面（A0等）はキャンバス上限を超えないよう補正する
 * @param {number} pdfW   PDF ページ幅 (pt)
 * @param {number} pdfH   PDF ページ高さ (pt)
 * @param {number} zoom
 * @param {number} dpr
 * @returns {number} scale（pdf.js に渡す値）
 */
function calcRenderScale(pdfW, pdfH, zoom, dpr) {
  const d = clamp(dpr, 1, LIMITS.MAX_DPR);
  let scale = zoom * d;
  // キャンバス上限チェック
  const maxDim = Math.max(pdfW, pdfH) * scale;
  if (maxDim > LIMITS.MAX_CANVAS_PX) {
    scale = LIMITS.MAX_CANVAS_PX / Math.max(pdfW, pdfH);
  }
  return scale;
}


/* ---- modules/pdf/loader.js ---- */
/**
 * modules/pdf/loader.js — PDF.js ラッパー & メモリ管理
 * M_Viewer 再設計 Phase 4
 *
 * 責務:
 *   - PDF ファイル（File オブジェクト）を PDF.js で読み込む
 *   - PDFPage オブジェクトのキャッシュと解放
 *   - メモリリーク防止（page.cleanup() / destroy()）
 *
 * 制約:
 *   - IndexedDB 利用禁止（Phase 5）
 *   - 保存処理禁止
 *   - 描画処理禁止（renderer.js が担当）
 */


const log = createLogger('PdfLoader');

/** pdf.js worker 設定（CDN から読み込まれる想定） */
function _initWorker() {
  if (typeof pdfjsLib === 'undefined') return;
  if (!pdfjsLib.GlobalWorkerOptions.workerSrc) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
}

/* ============================================================
   PdfLoader クラス
   ============================================================ */
class PdfLoader {
  /** @type {import('pdfjs-dist').PDFDocumentProxy | null} */
  #doc       = null;
  /** @type {Map<number, import('pdfjs-dist').PDFPageProxy>} キャッシュ（最大3ページ）*/
  #pageCache = new Map();
  /** @type {string | null} 現在開いているファイル名 */
  #fileName  = null;

  /** キャッシュ保持ページ数（前後1ページ + 現在ページ） */
  static #CACHE_SIZE = 3;

  /* ---- 読み込み ---- */

  /**
   * PDF ファイルを読み込む
   * @param {File} file
   * @returns {Promise<{ pageCount:number, fileName:string }>}
   */
  async load(file) {
    _initWorker();
    if (typeof pdfjsLib === 'undefined') {
      throw new PdfError('pdf.js が読み込まれていません');
    }

    // 既存ドキュメントを解放
    await this.destroy();

    log.info('loading:', file.name, `(${(file.size / 1024).toFixed(0)} KB)`);

    const arrayBuffer = await file.arrayBuffer();

    try {
      this.#doc      = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      this.#fileName = file.name;
      const pageCount = this.#doc.numPages;
      log.info(`loaded: ${pageCount} pages`);
      return { pageCount, fileName: file.name };
    } catch (e) {
      throw new PdfError(`PDF 読み込み失敗: ${e.message}`, e);
    }
  }

  /* ---- ページ取得 ---- */

  /**
   * 指定ページの PDFPage を返す（キャッシュ優先）
   * @param {number} pageNum 1-based
   * @returns {Promise<import('pdfjs-dist').PDFPageProxy>}
   */
  async getPage(pageNum) {
    if (!this.#doc) throw new PdfError('PDF が読み込まれていません');

    if (this.#pageCache.has(pageNum)) {
      return this.#pageCache.get(pageNum);
    }

    const page = await this.#doc.getPage(pageNum);
    this.#pageCache.set(pageNum, page);
    log.debug(`page ${pageNum} fetched and cached`);
    return page;
  }

  /**
   * 現在ページに合わせてキャッシュを整理（遠いページを解放）
   * @param {number} currentPage 1-based
   */
  trimCache(currentPage) {
    if (this.#pageCache.size <= PdfLoader.#CACHE_SIZE) return;

    // 保持するページ番号セット（前後1ページ）
    const keep = new Set([
      currentPage - 1,
      currentPage,
      currentPage + 1,
    ]);

    for (const [num, page] of this.#pageCache) {
      if (!keep.has(num)) {
        try { page.cleanup(); } catch (_) {}
        this.#pageCache.delete(num);
        log.debug(`page ${num} released from cache`);
      }
    }
  }

  /* ---- メモリ解放 ---- */

  /**
   * 全ページキャッシュと PDFDocument を解放
   */
  async destroy() {
    for (const page of this.#pageCache.values()) {
      try { page.cleanup(); } catch (_) {}
    }
    this.#pageCache.clear();

    if (this.#doc) {
      try { await this.#doc.destroy(); } catch (_) {}
      this.#doc = null;
      log.info('document destroyed');
    }
    this.#fileName = null;
  }

  /* ---- ゲッター ---- */

  get isLoaded()  { return this.#doc !== null; }
  get pageCount() { return this.#doc?.numPages ?? 0; }
  get fileName()  { return this.#fileName; }
}

/** シングルトン */
const Loader = new PdfLoader();


/* ---- modules/pdf/renderer.js ---- */
/**
 * modules/pdf/renderer.js — PDF キャンバス描画エンジン
 * M_Viewer 再設計 Phase 4
 *
 * 責務:
 *   - pdf-canvas へのレンダリング
 *   - dirty フラグによる再描画制御（不要レンダリング禁止）
 *   - rAF ループへの組み込み（Renderer.schedule）
 *   - DPR キャップ・キャンバスサイズ管理
 *   - レンダリング中止（前回タスクをキャンセル）
 *
 * 禁止:
 *   - 注釈描画（ann-canvas は触らない）
 *   - 保存処理
 */


const log = createLogger('PdfRenderer');

/* ============================================================
   PdfRenderer クラス
   ============================================================ */
class PdfRenderer {
  /** @type {HTMLCanvasElement | null} */
  #canvas    = null;
  /** @type {CanvasRenderingContext2D | null} */
  #ctx       = null;

  #dirty     = false;         // 再描画が必要か
  #rendering = false;         // 描画中フラグ（二重描画防止）
  #cancelCb  = null;          // 進行中描画のキャンセルコールバック

  #currentPage = 0;
  #zoom        = 1.0;
  #panX        = 0;
  #panY        = 0;
  #dpr         = 1;

  /** rAF ジョブ名 */
  static #JOB = 'pdf-render';

  /* ---- 初期化 ---- */

  /**
   * @param {HTMLCanvasElement} canvas  #pdf-canvas
   */
  init(canvas) {
    this.#canvas = canvas;
    this.#ctx    = canvas.getContext('2d', { alpha: false });
    this.#dpr    = clamp(window.devicePixelRatio || 1, 1, LIMITS.MAX_DPR);

    // rAF ループに登録
    Renderer.schedule(PdfRenderer.#JOB, () => this.#tick());
    log.info('initialized, DPR=', this.#dpr);
  }

  /* ---- 外部から呼ぶ状態更新（dirty フラグを立てるだけ） ---- */

  setPage(page) {
    if (this.#currentPage === page) return;
    this.#currentPage = page;
    this._markDirty();
  }

  setView(zoom, panX, panY) {
    if (this.#zoom === zoom && this.#panX === panX && this.#panY === panY) return;
    this.#zoom = zoom;
    this.#panX = panX;
    this.#panY = panY;
    this._markDirty();
  }

  /** ビューポートリサイズ時（CSS px） */
  resize(cssW, cssH) {
    if (!this.#canvas) return;
    const { physW, physH } = calcCanvasSize(cssW, cssH, this.#dpr);
    if (this.#canvas.width === physW && this.#canvas.height === physH) return;

    // 3層キャンバス全てをリサイズ
    ['pdf-canvas', 'ann-canvas', 'ovl-canvas'].forEach(id => {
      const c = document.getElementById(id);
      if (!c) return;
      c.width  = physW;
      c.height = physH;
      c.style.width  = `${cssW}px`;
      c.style.height = `${cssH}px`;
    });

    log.debug(`resized: ${physW}×${physH} (CSS ${cssW}×${cssH})`);
    this._markDirty();
  }

  _markDirty() { this.#dirty = true; }

  /* ---- rAF ループから毎フレーム呼ばれる ---- */

  #tick() {
    if (!this.#dirty || this.#rendering) return;
    if (!Loader.isLoaded || this.#currentPage < 1) return;
    this.#dirty = false;
    this.#drawPage(this.#currentPage);
  }

  /* ---- 実描画 ---- */

  async #drawPage(pageNum) {
    this.#rendering = true;

    // 前回の描画タスクをキャンセル
    if (this.#cancelCb) {
      this.#cancelCb();
      this.#cancelCb = null;
    }

    let cancelled = false;
    this.#cancelCb = () => { cancelled = true; };

    try {
      const page = await Loader.getPage(pageNum);
      if (cancelled) return;

      const scale    = calcRenderScale(
        page.view[2], page.view[3],
        this.#zoom, this.#dpr
      );
      const viewport = page.getViewport({ scale });

      // キャンバスサイズ更新（ページサイズに合わせる）
      const canvas = this.#canvas;
      const ctx    = this.#ctx;
      if (!canvas || !ctx) return;

      canvas.width  = Math.min(Math.ceil(viewport.width),  LIMITS.MAX_CANVAS_PX);
      canvas.height = Math.min(Math.ceil(viewport.height), LIMITS.MAX_CANVAS_PX);

      // 背景をクリア（白で塗りつぶし）
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const renderTask = page.render({
        canvasContext: ctx,
        viewport,
        intent: 'display',
      });

      // キャンセル可能にする
      this.#cancelCb = () => {
        cancelled = true;
        renderTask.cancel?.();
      };

      await renderTask.promise;
      if (cancelled) return;

      log.debug(`page ${pageNum} rendered (scale=${scale.toFixed(3)})`);

      // キャッシュ整理（メモリ解放）
      Loader.trimCache(pageNum);

    } catch (e) {
      if (!cancelled) log.error(`render error page ${pageNum}:`, e);
    } finally {
      if (!cancelled) this.#rendering = false;
    }
  }

  /* ---- クリーンアップ ---- */

  destroy() {
    Renderer.unschedule(PdfRenderer.#JOB);
    if (this.#cancelCb) this.#cancelCb();
    this.#canvas    = null;
    this.#ctx       = null;
    this.#rendering = false;
    this.#dirty     = false;
    log.info('destroyed');
  }
}

const PdfRendererInstance = new PdfRenderer();


/* ---- modules/input/PalmRejector.js ---- */
/**
 * modules/input/PalmRejector.js — Palm Rejection（手のひら除去）
 * M_Viewer 再設計 Phase 5
 *
 * 判定基準:
 *   - pointerType === 'pen'  → 常に通過（Apple Pencil は除外しない）
 *   - radiusX または radiusY が PALM_RADIUS_PX を超える → 手のひら
 *   - radius 情報がない場合は通過（判定不能 → 誤除去を避ける）
 *
 * Safari 差異:
 *   - iOS Safari では radiusX/Y の代わりに width/height が入る場合がある
 *   - Touch API の touchType === 'stylus' も Pencil として扱う
 *
 * 他モジュール依存なし（純粋関数のみ）。
 */

/** Palm と判定する接触半径閾値 (CSS px) */
const PALM_RADIUS_PX = 25;

/**
 * PointerEvent が手のひら（Palm）かどうかを判定する
 * @param {PointerEvent} e
 * @returns {boolean}  true = 手のひら → 無視すべき
 */
function isPalm(e) {
  // Apple Pencil は常に通過
  if (e.pointerType === 'pen') return false;

  // Touch API の stylus 判定（古い Safari 向け）
  if (e.touchType === 'stylus') return false;

  // 接触面積で判定（radiusX/Y または width/height）
  const rx = e.radiusX ?? (e.width  != null ? e.width  / 2 : 0);
  const ry = e.radiusY ?? (e.height != null ? e.height / 2 : 0);

  // 面積情報がない場合は判定不能 → 通過させる
  if (!rx && !ry) return false;

  return rx > PALM_RADIUS_PX || ry > PALM_RADIUS_PX;
}

/**
 * 接触半径を返す（デバッグ・閾値調整用）
 * @param {PointerEvent} e
 * @returns {{ rx:number, ry:number }}
 */
function getContactRadius(e) {
  return {
    rx: e.radiusX ?? (e.width  != null ? e.width  / 2 : 0),
    ry: e.radiusY ?? (e.height != null ? e.height / 2 : 0),
  };
}


/* ---- modules/input/PencilDetector.js ---- */
/**
 * modules/input/PencilDetector.js — Apple Pencil 判定・データ抽出
 * M_Viewer 再設計 Phase 5
 *
 * 責務:
 *   - Apple Pencil / スタイラス の識別
 *   - 筆圧（pressure）正規化
 *   - 傾き（tiltX / tiltY）取得（Phase 7 の傾き感知ペン向け）
 *   - PDF 座標系への変換
 *
 * Safari 差異:
 *   - iOS Safari では coalescedEvents が未実装の場合がある
 *   - pressure は Apple Pencil 2 で 0–1、マウスは常に 0.5
 *   - altitudeAngle / azimuthAngle は Safari 独自（tiltX/Y の代替）
 *
 * 他モジュール依存なし（純粋関数のみ）。
 */

/**
 * PointerEvent が Apple Pencil（またはスタイラス）かどうかを判定
 * @param {PointerEvent} e
 * @returns {boolean}
 */
function isPencil(e) {
  if (e.pointerType === 'pen') return true;
  // Touch API の stylus 判定（古い Safari 向け）
  if (e.touchType === 'stylus') return true;
  return false;
}

/**
 * PointerEvent から Pencil 入力データを抽出する
 * @param {PointerEvent} e
 * @param {DOMRect}  canvasRect  canvas.getBoundingClientRect()
 * @param {number}   zoom
 * @param {number}   panX        CSS px
 * @param {number}   panY        CSS px
 * @returns {PencilPoint}
 */
function extractPencilPoint(e, canvasRect, zoom, panX, panY) {
  // キャンバス CSS 座標（0,0 = canvas 左上）
  const cx = e.clientX - canvasRect.left;
  const cy = e.clientY - canvasRect.top;

  // PDF 論理座標（zoom/pan を逆算）
  const x = (cx - panX) / zoom;
  const y = (cy - panY) / zoom;

  // 筆圧正規化（Safari では 0.5 固定の場合あり）
  const pressure = normalizePressure(e.pressure);

  // 傾き（対応機種のみ）
  const tiltX = e.tiltX ?? 0;
  const tiltY = e.tiltY ?? 0;

  return { cx, cy, x, y, pressure, tiltX, tiltY, pointerId: e.pointerId };
}

/**
 * `getCoalescedEvents` が使える場合は中間点も抽出する（高精度描画用）
 * Safari では未実装の場合があるため安全に fallback する
 * @param {PointerEvent} e
 * @param {DOMRect}  canvasRect
 * @param {number}   zoom
 * @param {number}   panX
 * @param {number}   panY
 * @returns {PencilPoint[]}
 */
function extractCoalescedPoints(e, canvasRect, zoom, panX, panY) {
  const events = e.getCoalescedEvents?.() ?? [e];
  return events.map(ce => extractPencilPoint(ce, canvasRect, zoom, panX, panY));
}

/**
 * 筆圧を 0–1 に正規化する
 * @param {number} raw  PointerEvent.pressure
 * @returns {number}
 */
function normalizePressure(raw) {
  if (raw == null || raw < 0) return 0.5;
  // Apple Pencil: 0.0–1.0 をそのまま使用
  // マウス/タッチ: 0 or 0.5 が入る（使わない）
  return Math.min(Math.max(raw, 0), 1);
}

/**
 * @typedef {Object} PencilPoint
 * @property {number} cx         Canvas CSS X
 * @property {number} cy         Canvas CSS Y
 * @property {number} x          PDF 論理座標 X
 * @property {number} y          PDF 論理座標 Y
 * @property {number} pressure   筆圧 0–1
 * @property {number} tiltX      傾き X °
 * @property {number} tiltY      傾き Y °
 * @property {number} pointerId
 */


/* ---- modules/input/EventQueue.js ---- */
/**
 * modules/input/EventQueue.js — フレームアライン イベントキュー
 * M_Viewer 再設計 Phase 5
 *
 * 目的:
 *   - 高頻度の pointermove を rAF フレームに合わせてバッチ処理
 *   - 同一フレーム内の重複イベントを最後の1件に集約（イベント重複防止）
 *   - touchmove 内の重処理を回避（キューに積むだけ）
 *
 * 設計:
 *   - enqueue(type, data): キューに追加
 *   - flush(handlers): 呼び出し元（PointerRouter の rAF ジョブ）から毎フレーム呼ぶ
 *   - 同一 type + pointerId の連続イベントは最新のみ保持（dedup）
 *
 * 他モジュール依存なし。
 */

class EventQueue {
  /**
   * キー: `${type}:${pointerId}` → 最新データ
   * @type {Map<string, { type:string, data:* }>}
   */
  #map = new Map();

  /**
   * イベントをキューに積む（同一キーは上書き）
   * @param {string} type       イベント種別（例: 'pencil:move'）
   * @param {*}      data
   * @param {number} [pointerId=0]
   */
  enqueue(type, data, pointerId = 0) {
    const key = `${type}:${pointerId}`;
    this.#map.set(key, { type, data });
  }

  /**
   * キューを flush して全ハンドラーに配信する
   * rAF ジョブから毎フレーム呼ぶこと。
   * @param {Map<string, Set<Function>>} handlers  type → Set<handler>
   */
  flush(handlers) {
    if (this.#map.size === 0) return;

    const entries = [...this.#map.values()];
    this.#map.clear();   // flush 前にクリア（再入防止）

    for (const { type, data } of entries) {
      const set = handlers.get(type);
      if (!set) continue;
      for (const fn of set) {
        try { fn(data); }
        catch (e) { console.error(`[EventQueue] handler "${type}":`, e); }
      }
    }
  }

  /** キューを即座に破棄（ページ切替・destroy 時） */
  clear() { this.#map.clear(); }

  get size() { return this.#map.size; }
}


/* ---- modules/input/GestureRecognizer.js ---- */
/**
 * modules/input/GestureRecognizer.js — パン/ピンチ 状態機械
 * M_Viewer 再設計 Phase 5
 *
 * 状態:
 *   IDLE  → 指なし
 *   PAN   → 1本指（パン操作）
 *   PINCH → 2本以上（ピンチズーム）
 *
 * 遷移ルール:
 *   IDLE  + 1本指 down → PAN
 *   PAN   + 2本目 down → PINCH（PANをキャンセル）
 *   PINCH + 1本離す    → IDLE（ジェスチャー終了）
 *   ANY   + 全指離す   → IDLE
 *
 * 責務:
 *   - ポインター座標の追跡
 *   - pan:start / pan:move / pan:end イベント生成
 *   - pinch:update / pinch:end イベント生成
 *   - Store への dispatch は行わない（PointerRouter の責務）
 *
 * 他モジュール依存なし。
 */

const STATE = Object.freeze({ IDLE: 'IDLE', PAN: 'PAN', PINCH: 'PINCH' });

/**
 * @typedef {{ cx:number, cy:number }} Point2D
 *
 * @typedef {Object} PanEvent
 * @property {number} dx   前フレームからの X 移動量
 * @property {number} dy   前フレームからの Y 移動量
 * @property {number} cx   現在の CSS X（ピボット計算用）
 * @property {number} cy   現在の CSS Y
 *
 * @typedef {Object} PinchEvent
 * @property {number} scale    前フレームからのスケール比
 * @property {number} midX    ピンチ中心 CSS X
 * @property {number} midY    ピンチ中心 CSS Y
 */

class GestureRecognizer {
  #state   = STATE.IDLE;
  /** @type {Map<number, Point2D>} pointerId → 最新座標 */
  #ptrs    = new Map();
  /** ピンチ計算用: 前フレームの指間距離・中心 */
  #pinchPrev = null;
  /** パン計算用: 前フレームの座標 */
  #panPrev   = null;

  /** @type {(type:string, data:*) => void} */
  #emit;

  /**
   * @param {(type:string, data:*) => void} emitFn  イベント発火関数
   */
  constructor(emitFn) {
    this.#emit = emitFn;
  }

  /* ---- 外部 API ---- */

  /**
   * pointer down を通知する
   * @param {number} pointerId
   * @param {number} cx  CSS X
   * @param {number} cy  CSS Y
   */
  down(pointerId, cx, cy) {
    this.#ptrs.set(pointerId, { cx, cy });

    if (this.#ptrs.size === 1) {
      // 1本目 → PAN 開始
      this.#state    = STATE.PAN;
      this.#panPrev  = { cx, cy };
      this.#emit('pan:start', { cx, cy });

    } else if (this.#ptrs.size === 2) {
      // 2本目 → PINCH に遷移（PAN を中断）
      if (this.#state === STATE.PAN) {
        this.#emit('pan:cancel', {});
      }
      this.#state     = STATE.PINCH;
      this.#pinchPrev = this.#calcPinch();
    }
  }

  /**
   * pointer move を通知する
   * @param {number} pointerId
   * @param {number} cx
   * @param {number} cy
   */
  move(pointerId, cx, cy) {
    if (!this.#ptrs.has(pointerId)) return;
    this.#ptrs.set(pointerId, { cx, cy });

    if (this.#state === STATE.PAN && this.#ptrs.size === 1) {
      const prev = this.#panPrev ?? { cx, cy };
      /** @type {PanEvent} */
      const ev = { dx: cx - prev.cx, dy: cy - prev.cy, cx, cy };
      this.#panPrev = { cx, cy };
      this.#emit('pan:move', ev);

    } else if (this.#state === STATE.PINCH && this.#ptrs.size >= 2) {
      const cur  = this.#calcPinch();
      const prev = this.#pinchPrev ?? cur;
      /** @type {PinchEvent} */
      const ev = {
        scale: prev.dist > 0 ? cur.dist / prev.dist : 1,
        midX: cur.midX,
        midY: cur.midY,
      };
      this.#pinchPrev = cur;
      this.#emit('pinch:update', ev);
    }
  }

  /**
   * pointer up / cancel を通知する
   * @param {number} pointerId
   * @param {number} cx
   * @param {number} cy
   */
  up(pointerId, cx, cy) {
    this.#ptrs.delete(pointerId);

    if (this.#ptrs.size === 0) {
      if (this.#state === STATE.PAN)   this.#emit('pan:end',   { cx, cy });
      if (this.#state === STATE.PINCH) this.#emit('pinch:end', {});
      this.#reset();

    } else if (this.#state === STATE.PINCH && this.#ptrs.size === 1) {
      // 2本→1本: ピンチ終了、PAN には戻らない（誤操作防止）
      this.#emit('pinch:end', {});
      this.#reset();
    }
  }

  /** 全ポインターをクリア（pointercancel・フォーカス喪失時） */
  cancelAll() {
    if (this.#state === STATE.PAN)   this.#emit('pan:cancel', {});
    if (this.#state === STATE.PINCH) this.#emit('pinch:end',  {});
    this.#ptrs.clear();
    this.#reset();
  }

  get state() { return this.#state; }

  /* ---- 内部 ---- */

  #reset() {
    this.#state     = STATE.IDLE;
    this.#panPrev   = null;
    this.#pinchPrev = null;
  }

  /** 現在の2本指から距離・中心を計算 */
  #calcPinch() {
    const [a, b] = [...this.#ptrs.values()];
    const dist = Math.hypot(b.cx - a.cx, b.cy - a.cy);
    return {
      dist,
      midX: (a.cx + b.cx) / 2,
      midY: (a.cy + b.cy) / 2,
    };
  }
}


/* ---- modules/input/PointerRouter.js ---- */
/**
 * modules/input/PointerRouter.js — 中央ポインターイベントルーター
 * M_Viewer 再設計 Phase 5
 *
 * 責務:
 *   - canvas 要素に対して addEventListener を1セットだけ登録（多重登録禁止）
 *   - Raw PointerEvent を分類してサブスクライバーに配信
 *   - PalmRejector → PencilDetector → GestureRecognizer の順に処理
 *   - move 系イベントは EventQueue 経由でフレームにバッチ処理
 *   - ホイール（マウス/トラックパッド）ズームも統一管理
 *
 * イベント種別（on/off で購読できるもの）:
 *   pencil:down   pencil:move   pencil:up   pencil:cancel
 *   pan:start     pan:move      pan:end     pan:cancel
 *   pinch:update  pinch:end
 *   wheel
 *
 * 禁止:
 *   - 描画処理（Store.dispatch のみ）
 *   - addEventListener の二重呼び出し
 */


const log = createLogger('PointerRouter');

/** ホイールズーム感度 */
const WHEEL_SENSITIVITY = 0.0008;

class PointerRouter {
  /** @type {HTMLElement | null} */
  #el         = null;
  #attached   = false;
  #paused     = false;

  /** @type {Map<string, Set<Function>>} type → handlers */
  #handlers   = new Map();

  #queue      = new EventQueue();
  #gesture    = new GestureRecognizer((type, data) => {
    // GestureRecognizer からのイベントは即時配信（start/end）か
    // move 系はキューへ積む
    if (type === 'pan:move' || type === 'pinch:update') {
      this.#queue.enqueue(type, data, 0);
    } else {
      this.#fire(type, data);
    }
  });

  /** rAF ジョブ名（インスタンスごとにユニーク） */
  #rafJob;

  constructor(id = 'default') {
    this.#rafJob = `pointer-router:${id}`;
  }

  /* ---- ライフサイクル ---- */

  /**
   * canvas 要素にアタッチ（1要素1回のみ）
   * @param {HTMLElement} el
   */
  attach(el) {
    if (this.#attached) {
      log.warn('already attached — call detach() first');
      return;
    }
    this.#el = el;

    // touch-action: none で iOS のデフォルトスクロールを無効化
    el.style.touchAction = 'none';
    // -webkit-user-select 禁止（長押しメニュー抑止）
    el.style.webkitUserSelect = 'none';
    el.style.userSelect = 'none';

    el.addEventListener('pointerdown',   this.#onDown,  { passive: false });
    el.addEventListener('pointermove',   this.#onMove,  { passive: false });
    el.addEventListener('pointerup',     this.#onUp,    { passive: true  });
    el.addEventListener('pointercancel', this.#onCancel,{ passive: true  });
    el.addEventListener('wheel',         this.#onWheel, { passive: false });

    this.#attached = true;

    // rAF ループに flush ジョブを登録
    Renderer.schedule(this.#rafJob, () => {
      this.#queue.flush(this.#handlers);
    });

    log.info(`attached to <${el.tagName.toLowerCase()}>`);
  }

  detach() {
    if (!this.#attached || !this.#el) return;
    const el = this.#el;
    el.removeEventListener('pointerdown',   this.#onDown);
    el.removeEventListener('pointermove',   this.#onMove);
    el.removeEventListener('pointerup',     this.#onUp);
    el.removeEventListener('pointercancel', this.#onCancel);
    el.removeEventListener('wheel',         this.#onWheel);

    Renderer.unschedule(this.#rafJob);
    this.#queue.clear();
    this.#gesture.cancelAll();

    this.#el       = null;
    this.#attached = false;
    log.info('detached');
  }

  /** 一時停止（ダイアログ表示中など） */
  pause()  { this.#paused = true;  this.#gesture.cancelAll(); }
  resume() { this.#paused = false; }

  /* ---- サブスクリプション ---- */

  /**
   * @param {string}   type
   * @param {Function} handler
   * @returns {Function} unsubscribe
   */
  on(type, handler) {
    if (!this.#handlers.has(type)) this.#handlers.set(type, new Set());
    this.#handlers.get(type).add(handler);
    return () => this.#handlers.get(type)?.delete(handler);
  }

  off(type, handler) {
    this.#handlers.get(type)?.delete(handler);
  }

  /* ---- 内部ハンドラー ---- */

  #onDown = (e) => {
    if (this.#paused) return;
    e.preventDefault();

    // ポインターキャプチャ（Safari で throw することがあるため try/catch）
    try { this.#el.setPointerCapture(e.pointerId); } catch (_) {}

    if (isPencil(e)) {
      // ── Apple Pencil ──
      const pts = this.#getPencilPoints(e);
      this.#fire('pencil:down', pts[pts.length - 1]);
      return;
    }

    if (isPalm(e)) return;  // Palm → 無視

    // ── 指 → GestureRecognizer へ ──
    this.#gesture.down(e.pointerId, e.clientX, e.clientY);
  };

  #onMove = (e) => {
    if (this.#paused) return;
    // passive:false でリスナー登録しているが、Safari では cancelable=false の場合あり
    if (e.cancelable) e.preventDefault();

    if (isPencil(e)) {
      // Pencil move は coalesced 点をキューへ（pointerId でデデュップ）
      const pts = this.#getPencilPoints(e);
      // 最後の点だけキューに積む（中間点は直接配信）
      for (let i = 0; i < pts.length - 1; i++) {
        this.#fire('pencil:move', pts[i]);   // 中間点は即時配信（高精度）
      }
      this.#queue.enqueue('pencil:move', pts[pts.length - 1], e.pointerId);
      return;
    }

    if (isPalm(e)) return;

    this.#gesture.move(e.pointerId, e.clientX, e.clientY);
  };

  #onUp = (e) => {
    if (isPencil(e)) {
      this.#queue.clear();    // 残留 pencil:move を破棄
      const pts = this.#getPencilPoints(e);
      this.#fire('pencil:up', pts[pts.length - 1]);
      return;
    }
    if (isPalm(e)) return;
    this.#gesture.up(e.pointerId, e.clientX, e.clientY);
  };

  #onCancel = (e) => {
    if (isPencil(e)) {
      this.#fire('pencil:cancel', { pointerId: e.pointerId });
    } else {
      this.#gesture.cancelAll();
    }
    this.#queue.clear();
  };

  #onWheel = (e) => {
    if (this.#paused) return;
    e.preventDefault();
    const rect   = this.#el.getBoundingClientRect();
    const pivotX = e.clientX - rect.left;
    const pivotY = e.clientY - rect.top;
    // ctrlKey=true はピンチジェスチャーによるホイール（iOS トラックパッド）
    const delta  = e.ctrlKey ? e.deltaY * 3 : e.deltaY;
    const scale  = 1 - delta * WHEEL_SENSITIVITY;
    this.#fire('wheel', { scale, pivotX, pivotY, raw: e });
  };

  /* ---- ユーティリティ ---- */

  /** Pencil イベントを canvas 座標・PDF 座標に変換 */
  #getPencilPoints(e) {
    if (!this.#el) return [];
    const rect = this.#el.getBoundingClientRect();
    const v    = this.#getView();
    return extractCoalescedPoints(e, rect, v.zoom, v.panX, v.panY);
  }

  /**
   * 現在のビュー状態を Store から取得
   * Store への依存は最小限（zoom/panX/panY のみ）
   */
  #getView() {
    // window.MV.Store は app.js で設定される
    const view = window.MV?.Store?.state?.view;
    return { zoom: view?.zoom ?? 1, panX: view?.panX ?? 0, panY: view?.panY ?? 0 };
  }

  #fire(type, data) {
    const set = this.#handlers.get(type);
    if (!set) return;
    for (const fn of set) {
      try { fn(data); }
      catch (err) { log.error(`handler "${type}":`, err); }
    }
  }

  get isAttached() { return this.#attached; }
  get isPaused()   { return this.#paused;   }
}


/* ---- modules/input/index.js ---- */
/**
 * modules/input/index.js — 入力システム 公開エントリポイント
 * M_Viewer 再設計 Phase 5
 *
 * 利用側はここだけを import する:
 *   import { router, isPencil, isPalm } from './modules/input/index.js';
 *
 * シングルトン router は ovl-canvas にアタッチして使う。
 */


/**
 * アプリ共通シングルトン router
 * app.js で router.attach($('ovl-canvas')) して初期化する
 */
const router = new PointerRouter('main');


/* ---- modules/pdf/gesture.js ---- */
/**
 * modules/pdf/gesture.js — PDF ビューア ジェスチャー配線
 * M_Viewer 再設計 Phase 5
 *
 * Phase 4 の直接実装を廃止し、modules/input/PointerRouter に委譲する。
 * このモジュールの責務:
 *   - router のイベントを受けて Store.dispatch でビュー状態を更新する
 *   - PDF ページサイズの管理（clampPan 計算に使用）
 *   - PointerRouter 自体の初期化は app.js が行う
 *
 * 禁止:
 *   - addEventListener を自前で登録しない
 *   - 描画処理を直接呼ばない
 */


const log = createLogger('PdfGesture');

/* ---- PDF ページサイズ（clampPan 計算用） ---- */
let _pdfW = 0, _pdfH = 0;

/**
 * ページサイズを設定（ページ読み込み後に呼ぶ）
 * @param {number} w  PDF ページ幅 (pt)
 * @param {number} h  PDF ページ高さ (pt)
 */
function setPdfPageSize(w, h) {
  _pdfW = w;
  _pdfH = h;
  log.debug(`pageSize: ${w}×${h}`);
}

/* ---- ジェスチャーハンドラー登録 ---- */
let _unsubs = [];

/**
 * router にジェスチャーハンドラーを登録する
 * app.js の _initCanvases() から1回だけ呼ぶ
 */
function initPdfGesture() {
  // 二重登録防止
  if (_unsubs.length > 0) return;

  _unsubs = [
    router.on('pan:move',     _onPanMove),
    router.on('pan:cancel',   _onPanCancel),
    router.on('pinch:update', _onPinchUpdate),
    router.on('wheel',        _onWheel),
  ];
  log.info('gesture handlers registered');
}

/**
 * ハンドラーを解除する（ドキュメントを閉じるとき）
 */
function destroyPdfGesture() {
  _unsubs.forEach(fn => fn());
  _unsubs = [];
}

/* ---- ハンドラー実装 ---- */

function _onPanMove({ dx, dy }) {
  const v = Store.state.view;
  const { panX, panY } = clampPan(
    v.panX + dx, v.panY + dy,
    _pdfW, _pdfH,
    v.viewportWidth, v.viewportHeight,
    v.zoom
  );
  Store.dispatch(Actions.view.setPan(panX, panY));
}

function _onPanCancel() {
  // パンキャンセル時は現在位置を維持（何もしない）
}

function _onPinchUpdate({ scale, midX, midY }) {
  const v    = Store.state.view;
  const next = applyZoomAtPivot(
    v.zoom,
    clamp(v.zoom * scale, LIMITS.ZOOM_MIN, LIMITS.ZOOM_MAX),
    v.panX, v.panY, midX, midY
  );
  const { panX, panY } = clampPan(
    next.panX, next.panY,
    _pdfW, _pdfH,
    v.viewportWidth, v.viewportHeight,
    next.zoom
  );
  Store.dispatch(Actions.view.setZoom(next.zoom));
  Store.dispatch(Actions.view.setPan(panX, panY));
}

function _onWheel({ scale, pivotX, pivotY }) {
  const v    = Store.state.view;
  const next = applyZoomAtPivot(
    v.zoom,
    clamp(v.zoom * scale, LIMITS.ZOOM_MIN, LIMITS.ZOOM_MAX),
    v.panX, v.panY, pivotX, pivotY
  );
  const { panX, panY } = clampPan(
    next.panX, next.panY,
    _pdfW, _pdfH,
    v.viewportWidth, v.viewportHeight,
    next.zoom
  );
  Store.dispatch(Actions.view.setZoom(next.zoom));

/**
 * modules/annotation/Stroke.js — ストローク データ型・ファクトリ
 * M_Viewer 再設計 Phase 6
 *
 * 責務:
 *   - ストロークの生成・点追加・確定（immutable snapshot）
 *   - バウンディングボックス管理（部分再描画の判定に使用）
 *   - 他モジュール依存なし（純粋関数のみ）
 *
 * 座標系: PDF ポイント座標（pt）
 *   - zoom/pan は描画時に適用する（データには含めない）
 *   - これにより zoom 変更後も正確に再描画できる
 *
 * @typedef {Object} StrokePoint
 * @property {number} x  PDF X 座標 (pt)
 * @property {number} y  PDF Y 座標 (pt)
 * @property {number} p  筆圧 0–1
 *
 * @typedef {Object} Stroke
 * @property {string}         id
 * @property {string}         type    pen|hl|arrow|rect|circle|line|text|eraser
 * @property {string}         color
 * @property {number}         size    基準線幅 (pt)
 * @property {number}         opacity 0–1
 * @property {StrokePoint[]}  points
 * @property {number}         x1      bbox 左上 X
 * @property {number}         y1      bbox 左上 Y
 * @property {number}         x2      bbox 右下 X
 * @property {number}         y2      bbox 右下 Y
 * @property {string}         [text]  テキスト注釈のみ
 * @property {number}         page    1-based
 * @property {number}         ts      Date.now()
 */


/** 有効な bbox が確定しているか（点が1個以上あるか） */
const INF = 1e9;

/**
 * 新規ストロークを生成（mutable — addPoint で育てる）
 * @param {{ type, color, size, page }} opts
 * @returns {Stroke}
 */
function createStroke({ type, color, size, page }) {
  return {
    id:      uid(),
    type,
    color,
    size,
    opacity: TOOL_OPACITY[type] ?? 0.9,
    points:  [],
    x1: INF, y1: INF, x2: -INF, y2: -INF,
    text: undefined,
    page,
    ts:  Date.now(),
  };
}

/**
 * ストロークに点を追加（in-place 変更）
 * @param {Stroke}      stroke
 * @param {number}      x
 * @param {number}      y
 * @param {number}      [p=0.5]  筆圧
 */
function addPoint(stroke, x, y, p = 0.5) {
  stroke.points.push({ x, y, p });
  // bbox 更新
  if (x < stroke.x1) stroke.x1 = x;
  if (y < stroke.y1) stroke.y1 = y;
  if (x > stroke.x2) stroke.x2 = x;
  if (y > stroke.y2) stroke.y2 = y;
}

/**
 * 図形ストローク用: 開始点・終端点のみ設定する
 * @param {Stroke} stroke
 * @param {number} x1
 * @param {number} y1
 * @param {number} x2
 * @param {number} y2
 */
function setShapePoints(stroke, x1, y1, x2, y2) {
  stroke.points = [
    { x: x1, y: y1, p: 1 },
    { x: x2, y: y2, p: 1 },
  ];
  stroke.x1 = Math.min(x1, x2);
  stroke.y1 = Math.min(y1, y2);
  stroke.x2 = Math.max(x1, x2);
  stroke.y2 = Math.max(y1, y2);
}

/**
 * ストロークを確定（frozen copy を返す）
 * @param {Stroke} stroke
 * @param {number} [margin=4]  bbox に追加するマージン (pt)
 * @returns {Stroke}
 */
function finalizeStroke(stroke, margin = 4) {
  const half = stroke.size / 2 + margin;
  return Object.freeze({
    ...stroke,
    points: Object.freeze(stroke.points.map(p => Object.freeze({ ...p }))),
    x1: stroke.x1 - half,
    y1: stroke.y1 - half,
    x2: stroke.x2 + half,
    y2: stroke.y2 + half,
  });
}

/**
 * 2つの bbox が重なるかどうかを判定（消しゴム・選択ツール用）
 * @param {Stroke} a
 * @param {Stroke} b
 * @returns {boolean}
 */
function bboxOverlaps(a, b) {
  return a.x1 < b.x2 && a.x2 > b.x1 &&
         a.y1 < b.y2 && a.y2 > b.y1;
}

/**
 * 点が bbox 内にあるかどうかを判定
 * @param {Stroke} stroke
 * @param {number} x
 * @param {number} y
 * @returns {boolean}
 */
function containsPoint(stroke, x, y) {
  return x >= stroke.x1 && x <= stroke.x2 &&
         y >= stroke.y1 && y <= stroke.y2;
}

/**
 * modules/annotation/StrokeRenderer.js — ストローク描画ロジック
 * M_Viewer 再設計 Phase 6
 *
 * 責務:
 *   - Canvas 2D Context へのストローク描画（PDF 座標系で受け取り）
 *   - ctx.setTransform は呼び出し元（AnnCanvas）が設定済みとする
 *   - ペン: 筆圧感知・二次ベジェ曲線スムージング
 *   - 蛍光ペン: multiply 合成・固定太さ
 *   - 図形（矢印/矩形/円/直線）
 *   - テキスト
 *   - 消しゴム: destination-out 合成
 *
 * 禁止:
 *   - ctx.clearRect の全面クリア（部分描画のみ）
 *   - Store への依存
 */

/** 矢印ヘッドのサイズ（pt 単位） */
const ARROW_HEAD_LEN   = 12;
const ARROW_HEAD_ANGLE = Math.PI / 6;

/* ============================================================
   公開関数
   ============================================================ */

/**
 * ストローク1本を ctx に描画する
 * 前提: ctx には適切な transform が設定されていること
 * @param {CanvasRenderingContext2D} ctx
 * @param {import('./Stroke.js').Stroke} stroke
 */
function renderStroke(ctx, stroke) {
  if (!stroke.points || stroke.points.length === 0) return;

  ctx.save();
  _applyStyle(ctx, stroke);

  switch (stroke.type) {
    case 'pen':    _renderPen(ctx, stroke);    break;
    case 'hl':     _renderHighlighter(ctx, stroke); break;
    case 'arrow':  _renderArrow(ctx, stroke);  break;
    case 'rect':   _renderRect(ctx, stroke);   break;
    case 'circle': _renderCircle(ctx, stroke); break;
    case 'line':   _renderLine(ctx, stroke);   break;
    case 'text':   _renderText(ctx, stroke);   break;
    case 'eraser': _renderEraser(ctx, stroke); break;
  }

  ctx.restore();
}

/**
 * ペン描画の末尾セグメントのみを描画（ライブ描画の低遅延用）
 * 前提: ctx には適切な transform が設定されていること
 * @param {CanvasRenderingContext2D} ctx
 * @param {import('./Stroke.js').Stroke} stroke  points が2点以上あること
 */
function renderLastSegment(ctx, stroke) {
  const pts = stroke.points;
  if (pts.length < 2) {
    // 1点目: 点として描画
    if (pts.length === 1) _renderDot(ctx, stroke, pts[0]);
    return;
  }

  ctx.save();
  _applyStyle(ctx, stroke);

  const n    = pts.length;
  const prev = pts[n - 2];
  const cur  = pts[n - 1];

  if (stroke.type === 'hl') {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = stroke.opacity;
    ctx.lineWidth   = stroke.size;
    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(cur.x,  cur.y);
    ctx.stroke();
  } else {
    // ペン: 筆圧で太さを変える
    const w = _pressureWidth(stroke.size, cur.p);
    ctx.lineWidth = w;
    ctx.beginPath();
    if (n >= 3) {
      const mid = { x: (prev.x + cur.x) / 2, y: (prev.y + cur.y) / 2 };
      ctx.moveTo(pts[n - 3].x, pts[n - 3].y);
      ctx.quadraticCurveTo(prev.x, prev.y, mid.x, mid.y);
    } else {
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(cur.x,  cur.y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

/* ============================================================
   内部描画関数
   ============================================================ */

function _applyStyle(ctx, stroke) {
  ctx.strokeStyle = stroke.color;
  ctx.fillStyle   = stroke.color;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.globalAlpha = stroke.opacity;
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- ペン ---- */
function _renderPen(ctx, stroke) {
  const pts = stroke.points;
  if (pts.length === 1) { _renderDot(ctx, stroke, pts[0]); return; }

  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);

  for (let i = 1; i < pts.length - 1; i++) {
    const mid = {
      x: (pts[i].x + pts[i + 1].x) / 2,
      y: (pts[i].y + pts[i + 1].y) / 2,
    };
    ctx.lineWidth = _pressureWidth(stroke.size, pts[i].p);
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mid.x, mid.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mid.x, mid.y);
  }
  // 最終点
  const last = pts[pts.length - 1];
  ctx.lineWidth = _pressureWidth(stroke.size, last.p);
  ctx.lineTo(last.x, last.y);
  ctx.stroke();
}

/* ---- 蛍光ペン ---- */
function _renderHighlighter(ctx, stroke) {
  ctx.globalCompositeOperation = 'multiply';
  ctx.lineWidth = stroke.size;
  const pts = stroke.points;
  if (pts.length === 1) { _renderDot(ctx, stroke, pts[0]); return; }

  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.stroke();
}

/* ---- 矢印 ---- */
function _renderArrow(ctx, stroke) {
  if (stroke.points.length < 2) return;
  const s = stroke.points[0];
  const e = stroke.points[stroke.points.length - 1];
  ctx.lineWidth = stroke.size;

  // 軸
  ctx.beginPath();
  ctx.moveTo(s.x, s.y);
  ctx.lineTo(e.x, e.y);
  ctx.stroke();

  // ヘッド
  const angle = Math.atan2(e.y - s.y, e.x - s.x);
  ctx.beginPath();
  ctx.moveTo(e.x, e.y);
  ctx.lineTo(
    e.x - ARROW_HEAD_LEN * Math.cos(angle - ARROW_HEAD_ANGLE),
    e.y - ARROW_HEAD_LEN * Math.sin(angle - ARROW_HEAD_ANGLE),
  );
  ctx.moveTo(e.x, e.y);
  ctx.lineTo(
    e.x - ARROW_HEAD_LEN * Math.cos(angle + ARROW_HEAD_ANGLE),
    e.y - ARROW_HEAD_LEN * Math.sin(angle + ARROW_HEAD_ANGLE),
  );
  ctx.stroke();
}

/* ---- 矩形 ---- */
function _renderRect(ctx, stroke) {
  if (stroke.points.length < 2) return;
  const s = stroke.points[0];
  const e = stroke.points[stroke.points.length - 1];
  ctx.lineWidth = stroke.size;
  ctx.strokeRect(s.x, s.y, e.x - s.x, e.y - s.y);
}

/* ---- 円 ---- */
function _renderCircle(ctx, stroke) {
  if (stroke.points.length < 2) return;
  const s  = stroke.points[0];
  const e  = stroke.points[stroke.points.length - 1];
  const rx = Math.abs(e.x - s.x) / 2;
  const ry = Math.abs(e.y - s.y) / 2;
  const cx = (s.x + e.x) / 2;
  const cy = (s.y + e.y) / 2;
  ctx.lineWidth = stroke.size;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx || 1, ry || 1, 0, 0, Math.PI * 2);
  ctx.stroke();
}

/* ---- 直線 ---- */
function _renderLine(ctx, stroke) {
  if (stroke.points.length < 2) return;
  const s = stroke.points[0];
  const e = stroke.points[stroke.points.length - 1];
  ctx.lineWidth = stroke.size;
  ctx.beginPath();
  ctx.moveTo(s.x, s.y);
  ctx.lineTo(e.x, e.y);
  ctx.stroke();
}

/* ---- テキスト ---- */
function _renderText(ctx, stroke) {
  if (!stroke.text || !stroke.points[0]) return;
  ctx.font = `${stroke.size}pt sans-serif`;
  ctx.globalAlpha = stroke.opacity;
  ctx.fillText(stroke.text, stroke.points[0].x, stroke.points[0].y);
}

/* ---- 消しゴム（ストローク除去型: destination-out でマスク） ---- */
function _renderEraser(ctx, stroke) {
  ctx.globalCompositeOperation = 'destination-out';
  ctx.globalAlpha = 1;
  ctx.lineWidth   = stroke.size;
  const pts = stroke.points;
  if (pts.length === 1) {
    ctx.beginPath();
    ctx.arc(pts[0].x, pts[0].y, stroke.size / 2, 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}

/* ---- 単点 ---- */
function _renderDot(ctx, stroke, pt) {
  const r = _pressureWidth(stroke.size, pt.p) / 2;
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, Math.max(r, 0.5), 0, Math.PI * 2);
  ctx.fill();
}

/* ---- 筆圧 → 線幅変換 ---- */
function _pressureWidth(baseSize, pressure) {
  // 筆圧 0.0–1.0 → 0.3–1.5 倍に変換（自然な書き味）
  const factor = 0.3 + pressure * 1.2;
  return Math.max(baseSize * factor, 0.5);
}


/* ---- modules/annotation/UndoStack.js ---- */
/**
 * modules/annotation/UndoStack.js — Undo/Redo スタック
 * M_Viewer 再設計 Phase 6
 *
 * 設計方針:
 *   - スナップショット方式: 操作前の strokes 配列を丸ごと保存
 *   - シンプルで確実（差分方式は Phase 8 以降で検討）
 *   - 最大 MAX_STEPS ステップ保持（古いものは自動破棄）
 *   - Store への dispatch は行わない（呼び出し元が行う）
 *   - 他モジュール依存なし
 *
 * 使い方:
 *   undoStack.push(currentStrokes)     // 変更前にスナップショット
 *   undoStack.undo() → Stroke[] | null // null = これ以上戻れない
 *   undoStack.redo() → Stroke[] | null
 */

const MAX_STEPS = 50;

class UndoStack {
  /** @type {Array<Stroke[]>} */
  #undo = [];
  /** @type {Array<Stroke[]>} */
  #redo = [];

  /**
   * 現在の strokes 配列をスナップショットとして積む
   * （操作を確定する直前に呼ぶ）
   * @param {readonly Stroke[]} strokes
   */
  push(strokes) {
    this.#undo.push([...strokes]);
    if (this.#undo.length > MAX_STEPS) this.#undo.shift();
    // 新しい操作で Redo 履歴は無効化
    this.#redo = [];
  }

  /**
   * 1ステップ戻す
   * @returns {Stroke[] | null}  復元すべき strokes、これ以上戻れなければ null
   */
  undo() {
    if (this.#undo.length === 0) return null;
    const snapshot = this.#undo.pop();
    this.#redo.push(snapshot);
    // undo の「結果」は 1つ前の状態
    // スタックに残っている最後の要素が「戻り先」
    // undo スタックが空なら「初期状態 = 空配列」
    return this.#undo.length > 0
      ? [...this.#undo[this.#undo.length - 1]]
      : [];
  }

  /**
   * 1ステップ進める
   * @returns {Stroke[] | null}  復元すべき strokes、なければ null
   */
  redo() {
    if (this.#redo.length === 0) return null;
    const snapshot = this.#redo.pop();
    this.#undo.push(snapshot);
    return [...snapshot];
  }

  /** スタックをクリア（ページ変更・ドキュメントクローズ時） */
  clear() {
    this.#undo = [];
    this.#redo = [];
  }

  get canUndo() { return this.#undo.length > 0; }
  get canRedo() { return this.#redo.length > 0; }
  get undoCount() { return this.#undo.length; }
}


/* ---- modules/annotation/AnnCanvas.js ---- */
/**
 * modules/annotation/AnnCanvas.js — 注釈 Canvas 管理・部分再描画
 * M_Viewer 再設計 Phase 6
 *
 * 責務:
 *   - ann-canvas: 確定済みストローク（全画面再描画を最小化）
 *   - ovl-canvas: ライブ描画中の1本（毎フレームクリア）
 *   - zoom/pan 変更時のみ全画面再描画
 *   - 新規ストローク追加は ann-canvas に差分描画（クリアしない）
 *
 * 重要事項:
 *   - 全画面再描画禁止（新規ストロークは差分のみ）
 *   - ctx には desynchronized:true で低遅延を確保
 *   - transform: ctx.setTransform(dpr*zoom, 0, 0, dpr*zoom, panX*dpr, panY*dpr)
 */


const log = createLogger('AnnCanvas');

class AnnCanvas {
  #annCanvas = null;
  #ovlCanvas = null;
  #annCtx    = null;
  #ovlCtx    = null;

  /** 現在の表示状態 */
  #zoom  = 1;
  #panX  = 0;
  #panY  = 0;
  #dpr   = 1;

  /* ---- 初期化 ---- */

  /**
   * @param {HTMLCanvasElement} annCanvas  #ann-canvas
   * @param {HTMLCanvasElement} ovlCanvas  #ovl-canvas
   */
  init(annCanvas, ovlCanvas) {
    this.#annCanvas = annCanvas;
    this.#ovlCanvas = ovlCanvas;

    // desynchronized: true → iOS Safari で低遅延レンダリング
    this.#annCtx = annCanvas.getContext('2d', { alpha: true,  desynchronized: true });
    this.#ovlCtx = ovlCanvas.getContext('2d', { alpha: true,  desynchronized: true });

    this.#dpr = clamp(window.devicePixelRatio || 1, 1, LIMITS.MAX_DPR);
    log.info(`initialized, DPR=${this.#dpr}`);
  }

  /* ---- ビュー状態の更新 ---- */

  /**
   * zoom/pan が変わったら呼ぶ → 全ストロークを再描画
   * @param {number} zoom
   * @param {number} panX
   * @param {number} panY
   * @param {import('./Stroke.js').Stroke[]} strokes  現在ページの全ストローク
   */
  onViewChange(zoom, panX, panY, strokes) {
    this.#zoom = zoom;
    this.#panX = panX;
    this.#panY = panY;
    this.fullRedraw(strokes);
  }

  /* ---- ann-canvas 操作 ---- */

  /**
   * 全ストロークを再描画（ページ切替・zoom/pan 変更・undo 時）
   * @param {import('./Stroke.js').Stroke[]} strokes
   */
  fullRedraw(strokes) {
    const ctx = this.#annCtx;
    if (!ctx) return;
    ctx.clearRect(0, 0, this.#annCanvas.width, this.#annCanvas.height);
    this.#setTransform(ctx);
    for (const s of strokes) renderStroke(ctx, s);
    ctx.setTransform(1, 0, 0, 1, 0, 0);  // reset
    log.debug(`fullRedraw: ${strokes.length} strokes`);
  }

  /**
   * 確定ストロークを差分描画（全画面クリアなし → 高速）
   * @param {import('./Stroke.js').Stroke} stroke
   */
  appendStroke(stroke) {
    const ctx = this.#annCtx;
    if (!ctx) return;
    this.#setTransform(ctx);
    renderStroke(ctx, stroke);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  /** ann-canvas をクリア（ページ切替時） */
  clearAnn() {
    const ctx = this.#annCtx;
    if (ctx) ctx.clearRect(0, 0, this.#annCanvas.width, this.#annCanvas.height);
  }

  /* ---- ovl-canvas 操作（ライブ描画） ---- */

  /**
   * ライブ描画の末尾セグメントを ovl-canvas に描画
   * ★ 毎 pencil:move で呼ばれる（低遅延が最優先）
   * @param {import('./Stroke.js').Stroke} activeStroke  確定前のストローク
   */
  drawLiveSegment(activeStroke) {
    const ctx = this.#ovlCtx;
    if (!ctx) return;
    this.#setTransform(ctx);
    renderLastSegment(ctx, activeStroke);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  /**
   * 図形ツール用: ovl-canvas をクリアしてプレビューを描画
   * @param {import('./Stroke.js').Stroke} previewStroke
   */
  drawPreview(previewStroke) {
    const ctx = this.#ovlCtx;
    if (!ctx) return;
    ctx.clearRect(0, 0, this.#ovlCanvas.width, this.#ovlCanvas.height);
    this.#setTransform(ctx);
    renderStroke(ctx, previewStroke);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  /** ovl-canvas をクリア（ストローク確定後・キャンセル時） */
  clearOvl() {
    const ctx = this.#ovlCtx;
    if (ctx) ctx.clearRect(0, 0, this.#ovlCanvas.width, this.#ovlCanvas.height);
  }

  /* ---- クリーンアップ ---- */

  destroy() {
    this.clearAnn();
    this.clearOvl();
    this.#annCanvas = null;
    this.#ovlCanvas = null;
    this.#annCtx    = null;
    this.#ovlCtx    = null;
  }

  /* ---- 内部 ---- */

  /** PDF 座標 → Canvas 物理ピクセル変換行列を設定 */
  #setTransform(ctx) {
    const d = this.#dpr;
    ctx.setTransform(d * this.#zoom, 0, 0, d * this.#zoom,
                     this.#panX * d, this.#panY * d);
  }
}


/* ---- modules/annotation/ToolHandler.js ---- */
/**
 * modules/annotation/ToolHandler.js — pencil イベント → ストローク変換
 * M_Viewer 再設計 Phase 6
 *
 * 責務:
 *   - router.on('pencil:*') を購読してアクティブストロークを管理
 *   - ツール種別（pen/hl/shape/eraser）に応じた処理を委譲
 *   - ストローク確定時に Store.dispatch + UndoStack に記録
 *   - AnnCanvas への描画指示（描画自体は AnnCanvas が行う）
 *
 * 禁止:
 *   - Store 以外への状態保持（ツール設定は Store.state.tool から読む）
 *   - 保存処理
 *   - addEventListener の直接登録
 */


const log = createLogger('ToolHandler');

class ToolHandler {
  /** @type {AnnCanvas} */
  #ann;
  /** @type {UndoStack} */
  #undo;

  /** 描画中のストローク（null = 未描画） */
  #active = null;
  /** 登録解除関数 */
  #unsubs = [];

  /**
   * @param {AnnCanvas} annCanvas
   * @param {UndoStack} undoStack
   */
  constructor(annCanvas, undoStack) {
    this.#ann  = annCanvas;
    this.#undo = undoStack;
  }

  /* ---- 初期化 ---- */

  init() {
    this.#unsubs = [
      router.on('pencil:down',   e => this.#onDown(e)),
      router.on('pencil:move',   e => this.#onMove(e)),
      router.on('pencil:up',     e => this.#onUp(e)),
      router.on('pencil:cancel', () => this.#onCancel()),
    ];
    log.info('initialized');
  }

  destroy() {
    this.#unsubs.forEach(fn => fn());
    this.#unsubs = [];
    this.#active = null;
  }

  /* ---- イベントハンドラー ---- */

  #onDown({ x, y, pressure }) {
    const tool = Store.state.tool;
    const page = Store.state.view.currentPage;
    if (page < 1) return;

    this.#active = createStroke({
      type:  this.#resolveType(tool),
      color: this.#resolveColor(tool),
      size:  tool.sizes[tool.currentTool] ?? 3,
      page,
    });
    addPoint(this.#active, x, y, pressure);
    log.debug(`stroke start: ${this.#active.type}`);
  }

  #onMove({ x, y, pressure }) {
    if (!this.#active) return;

    const type = this.#active.type;

    if (type === 'arrow' || type === 'rect' ||
        type === 'circle' || type === 'line') {
      // 図形: 開始点と現在点のみで preview
      setShapePoints(
        this.#active,
        this.#active.points[0].x, this.#active.points[0].y,
        x, y
      );
      this.#ann.drawPreview(this.#active);
    } else {
      // ペン・蛍光ペン・消しゴム: 逐次追加
      addPoint(this.#active, x, y, pressure);
      this.#ann.drawLiveSegment(this.#active);
    }
  }

  #onUp({ x, y, pressure }) {
    if (!this.#active) return;

    const type = this.#active.type;

    if (type === 'arrow' || type === 'rect' ||
        type === 'circle' || type === 'line') {
      setShapePoints(
        this.#active,
        this.#active.points[0].x, this.#active.points[0].y,
        x, y
      );
    } else {
      addPoint(this.#active, x, y, pressure);
    }

    // 移動なし（点が1個のみ = タップ）は破棄
    // ※ #onDown で必ず1点追加されるため length < 2 で「移動なし」を判定
    if (this.#active.points.length < 2) {
      this.#active = null;
      this.#ann.clearOvl();
      return;
    }

    const stroke = finalizeStroke(this.#active);
    this.#active = null;
    this.#ann.clearOvl();

    // 消しゴム: 重なるストロークを削除
    if (stroke.type === 'eraser') {
      this.#applyEraser(stroke);
    } else {
      this.#commitStroke(stroke);
    }
  }

  #onCancel() {
    this.#active = null;
    this.#ann.clearOvl();
  }

  /* ---- ストローク確定 ---- */

  #commitStroke(stroke) {
    const page    = stroke.page;
    const current = selectStrokes(Store.state.annotation, page);

    // Undo スナップショット（変更前）
    this.#undo.push(current);

    // Store に追加
    Store.dispatch(Actions.annotation.addStroke(page, stroke));
    Store.dispatch(Actions.document.setDirty(true));
    Store.dispatch(Actions.document.setBkDirty(true));

    // ann-canvas に差分描画（全画面再描画なし）
    this.#ann.appendStroke(stroke);
    log.debug(`stroke committed: ${stroke.type}, pts=${stroke.points.length}`);
  }

  /* ---- 消しゴム適用 ---- */

  #applyEraser(eraserStroke) {
    const page    = eraserStroke.page;
    const current = selectStrokes(Store.state.annotation, page);
    const toDelete = current
      .filter(s => bboxOverlaps(s, eraserStroke))
      .map(s => s.id);

    if (toDelete.length === 0) return;

    // Undo スナップショット
    this.#undo.push(current);

    Store.dispatch(Actions.annotation.deleteStrokes(page, toDelete));
    Store.dispatch(Actions.document.setDirty(true));
    Store.dispatch(Actions.document.setBkDirty(true));

    // 消去後の全ストロークを再描画
    const next = selectStrokes(Store.state.annotation, page);
    this.#ann.fullRedraw(next);
    log.debug(`erased ${toDelete.length} strokes`);
  }

  /* ---- Undo/Redo（外部から呼ぶ） ---- */

  undo() {
    const page   = Store.state.view.currentPage;
    const result = this.#undo.undo();
    if (result === null) return;
    Store.dispatch(Actions.annotation.load({ [page]: result }));
    this.#ann.fullRedraw(result);
    log.debug(`undo: restored ${result.length} strokes`);
  }

  redo() {
    const page   = Store.state.view.currentPage;
    const result = this.#undo.redo();
    if (result === null) return;
    Store.dispatch(Actions.annotation.load({ [page]: result }));
    this.#ann.fullRedraw(result);
    log.debug(`redo: restored ${result.length} strokes`);
  }

  /* ---- ユーティリティ ---- */

  #resolveType(tool) {
    if (tool.currentTool === TOOL.SHAPE) return tool.currentShape;
    return tool.currentTool;
  }

  #resolveColor(tool) {
    if (tool.currentTool === TOOL.HL) return HL_COL

/* ---- modules/annotation/index.js ---- */
/**
 * modules/annotation/index.js — 注釈描画システム 公開エントリポイント
 * M_Viewer 再設計 Phase 6
 *
 * エクスポート:
 *   - クラス・純粋関数: Stroke.js / UndoStack / StrokeRenderer / AnnCanvas / ToolHandler
 *   - シングルトン: annCanvas, undoStack, toolHandler
 *     → app.js が init() 後に使う
 */



/** 注釈 Canvas 管理（ann-canvas / ovl-canvas） */

/** Undo/Redo スタック */
