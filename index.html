<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鉄骨図面ビューア</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#1a1c1e;--panel:#23262a;--panel2:#2c3036;--border:#3a3f47;
  --accent:#f07800;--text:#e8eaed;--text2:#9aa0aa;--danger:#d03030;--blue:#3a8fd0;
  --tb:56px;--st:54px;--ph:46px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;height:100dvh;}

/* ===== TOP TOOLBAR ===== */
#toolbar{height:var(--tb);background:var(--panel);border-bottom:2px solid var(--border);
  display:flex;align-items:center;gap:6px;padding:0 12px;flex-shrink:0;z-index:100;}
.logo{font-size:14px;font-weight:800;color:var(--accent);letter-spacing:.06em;
  padding-right:12px;border-right:1px solid var(--border);white-space:nowrap;flex-shrink:0;}
.spacer{flex:1;}
.tb-btn{height:40px;padding:0 14px;background:var(--panel2);border:1px solid var(--border);
  color:var(--text);border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;
  white-space:nowrap;display:flex;align-items:center;gap:5px;flex-shrink:0;
  -webkit-user-select:none;transition:background .12s;}
.tb-btn:active{background:var(--border);}
.tb-btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.tb-btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.tb-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}

/* ===== SUB TOOLBAR ===== */
#subtoolbar{height:var(--st);background:var(--panel);border-bottom:2px solid var(--accent);
  display:flex;align-items:center;gap:4px;padding:0 10px;flex-shrink:0;overflow-x:auto;}
#subtoolbar::-webkit-scrollbar{display:none;}
.t-btn{height:40px;min-width:52px;padding:0 10px;background:transparent;border:2px solid transparent;
  color:var(--text2);border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;
  -webkit-user-select:none;display:flex;align-items:center;justify-content:center;gap:4px;
  transition:all .12s;white-space:nowrap;}
.t-btn.active{background:var(--panel2);border-color:var(--accent);color:var(--accent);}
.t-btn:active{background:var(--panel2);}
.t-sep{width:1px;height:28px;background:var(--border);flex-shrink:0;margin:0 2px;}
.cswatch{width:26px;height:26px;border-radius:50%;border:3px solid transparent;
  cursor:pointer;flex-shrink:0;transition:transform .12s,border-color .12s;}
.cswatch.active{border-color:#fff;transform:scale(1.3);}
.sz-group{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.sz-label{font-size:12px;color:var(--text2);}
#stroke-range{-webkit-appearance:none;width:72px;height:4px;background:var(--border);border-radius:2px;cursor:pointer;}
#stroke-range::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;}
#stroke-num{font-size:14px;font-weight:700;color:var(--accent);width:24px;text-align:center;}

/* ===== SHAPE PICKER ===== */
#shape-picker{display:none;position:fixed;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:8px;z-index:300;box-shadow:0 4px 24px #000a;gap:6px;
  flex-direction:column;}
#shape-picker.show{display:flex;}
.sp-btn{height:44px;padding:0 14px;background:var(--panel2);border:1px solid var(--border);
  color:var(--text);border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:8px;white-space:nowrap;-webkit-user-select:none;}
.sp-btn:active,.sp-btn.sp-active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ===== PANE CONTAINER ===== */
#pane-container{flex:1;display:flex;overflow:hidden;min-height:0;}
.pane{display:flex;flex-direction:column;flex:1;overflow:hidden;min-width:0;}
#split-divider{display:none;width:6px;background:var(--accent);flex-shrink:0;cursor:col-resize;}
#pane-container.split #split-divider{display:block;}
#pane-container.split #pane1{display:flex!important;}

/* ===== PANE HEADER ===== */
.pane-header{height:var(--ph);background:var(--panel2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:5px;padding:0 8px;flex-shrink:0;overflow-x:auto;}
.pane-header::-webkit-scrollbar{display:none;}
.ph-fn{font-size:11px;color:var(--text2);max-width:110px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.ph-btn{height:34px;padding:0 10px;background:var(--panel);border:1px solid var(--border);
  color:var(--text);border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;flex-shrink:0;display:flex;align-items:center;-webkit-user-select:none;}
.ph-btn:active{background:var(--border);}
.ph-pnum{background:var(--panel);border:1px solid var(--border);color:var(--text);
  width:38px;text-align:center;padding:4px 2px;border-radius:6px;font-size:13px;flex-shrink:0;}
.ph-pnum:focus{outline:none;border-color:var(--accent);}
.ph-tot{font-size:12px;color:var(--text2);white-space:nowrap;flex-shrink:0;}
.ph-zoom{font-size:13px;font-weight:700;color:var(--accent);min-width:42px;text-align:center;flex-shrink:0;}

/* ===== CANVAS AREA ===== */
.canvas-area{flex:1;overflow:auto;background:#111;position:relative;min-height:0;
  -webkit-overflow-scrolling:touch;}
.canvas-area::-webkit-scrollbar{width:4px;height:4px;}
.canvas-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.canvas-scroll-content{position:relative;}
.canvas-wrapper{position:absolute;top:16px;left:16px;
  will-change:transform;box-shadow:0 2px 20px #0008;}
.pdf-canvas{display:block;}
.draw-canvas{position:absolute;top:0;left:0;touch-action:none;}

/* DROP ZONE */
.drop-zone{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:10;}
.dz-icon{font-size:48px;opacity:.3;}
.dz-msg{font-size:17px;color:var(--text2);font-weight:700;}
.dz-sub{font-size:12px;color:var(--text2);opacity:.5;}
.dz-btn{background:var(--accent);color:#fff;border:none;padding:14px 32px;
  border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;-webkit-user-select:none;}

/* ===== CALCULATOR ===== */
#calc-panel{display:none;position:fixed;bottom:20px;right:16px;z-index:400;
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  width:300px;box-shadow:0 8px 40px #0009;}
#calc-panel.show{display:block;}
#calc-titlebar{padding:10px 14px 6px;display:flex;align-items:center;justify-content:space-between;
  cursor:grab;border-bottom:1px solid var(--border);}
#calc-titlebar span{font-size:14px;font-weight:700;color:var(--text2);}
#calc-close{background:transparent;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:6px;}
#calc-close:active{background:var(--border);}
/* history */
#calc-history{max-height:100px;overflow-y:auto;padding:4px 12px;border-bottom:1px solid var(--border);}
#calc-history::-webkit-scrollbar{width:3px;}
#calc-history::-webkit-scrollbar-thumb{background:var(--border);}
.ch-item{font-size:12px;color:var(--text2);text-align:right;padding:2px 0;border-bottom:1px solid #2a2d32;}
.ch-item:last-child{border-bottom:none;}
/* display */
#calc-display{padding:8px 14px;text-align:right;border-bottom:1px solid var(--border);}
#calc-expr{font-size:13px;color:var(--text2);min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#calc-val{font-size:30px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* buttons */
#calc-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;}
.cb{padding:0;height:56px;border-radius:10px;border:none;font-size:19px;font-weight:700;
  cursor:pointer;transition:opacity .1s;-webkit-user-select:none;}
.cb:active{opacity:.7;}
.cb-num{background:var(--panel2);color:var(--text);}
.cb-op{background:#3a4050;color:#ffa040;}
.cb-eq{background:var(--accent);color:#fff;}
.cb-fn{background:#252830;color:var(--text2);font-size:16px;}
.cb-wide{grid-column:span 2;}

/* ===== TEXT INPUT ===== */
#text-overlay{display:none;position:fixed;inset:0;z-index:500;background:#000a;
  align-items:center;justify-content:center;}
#text-overlay.show{display:flex;}
#text-popup{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:18px;width:320px;display:flex;flex-direction:column;gap:10px;}
#text-popup h3{font-size:14px;color:var(--text2);}
#text-field{background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:16px;padding:10px 12px;resize:vertical;min-height:65px;font-family:inherit;}
#text-field:focus{outline:none;border-color:var(--accent);}
.pop-btns{display:flex;gap:8px;justify-content:flex-end;}
.pop-btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:700;}
#txt-cancel{background:var(--panel2);color:var(--text2);}
#txt-ok{background:var(--accent);color:#fff;}

/* LOADING / TOAST */
#loading{display:none;position:fixed;inset:0;z-index:600;background:#0008;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;}
#loading.show{display:flex;}
.spin{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:9px 18px;font-size:14px;color:var(--text);opacity:0;pointer-events:none;
  transition:opacity .3s;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;}
</style>
</head>
<body>

<!-- ===== TOP TOOLBAR ===== -->
<div id="toolbar">
  <span class="logo">⚙ 鉄骨図面</span>
  <div class="spacer"></div>
  <button class="tb-btn" onclick="getAP().undo()">↩ 元に戻す</button>
  <button class="tb-btn danger" onclick="getAP().clear()">消去</button>
  <button class="tb-btn accent" onclick="getAP().saveImage()">💾 保存</button>
  <button class="tb-btn" id="calc-btn" onclick="toggleCalc()">🧮 計算機</button>
  <button class="tb-btn" id="split-btn" onclick="toggleSplit()">⊟ 2分割</button>
</div>

<!-- ===== SUB TOOLBAR ===== -->
<div id="subtoolbar">
  <button class="t-btn" id="tool-move"      onclick="setTool('move')">🖐 移動</button>
  <div class="t-sep"></div>
  <button class="t-btn active" id="tool-pen" onclick="setTool('pen')">✏️ ペン</button>
  <button class="t-btn" id="tool-highlight" onclick="setTool('highlight')">蛍光ペン</button>
  <button class="t-btn" id="tool-shape"     onclick="toggleShapePicker(event)">図形 ▾</button>
  <button class="t-btn" id="tool-text"      onclick="setTool('text')">文字</button>
  <button class="t-btn" id="tool-eraser"    onclick="setTool('eraser')">消しゴム</button>
  <div class="t-sep"></div>
  <!-- colors -->
  <div class="cswatch active" style="background:#f07800" data-color="#f07800" onclick="setColor(this)"></div>
  <div class="cswatch" style="background:#e03030" data-color="#e03030" onclick="setColor(this)"></div>
  <div class="cswatch" style="background:#2090d0" data-color="#2090d0" onclick="setColor(this)"></div>
  <div class="cswatch" style="background:#20a050" data-color="#20a050" onclick="setColor(this)"></div>
  <div class="cswatch" style="background:#d0c000" data-color="#d0c000" onclick="setColor(this)"></div>
  <div class="cswatch" style="background:#fff"    data-color="#ffffff" onclick="setColor(this)"></div>
  <div class="cswatch" style="background:#000;border:2px solid #666" data-color="#000000" onclick="setColor(this)"></div>
  <div class="t-sep"></div>
  <div class="sz-group">
    <span class="sz-label">太さ</span>
    <input type="range" id="stroke-range" min="1" max="20" value="3"
      oninput="strokeSize=+this.value;document.getElementById('stroke-num').textContent=this.value">
    <span id="stroke-num">3</span>
  </div>
</div>

<!-- ===== SHAPE PICKER (popup) ===== -->
<div id="shape-picker">
  <button class="sp-btn" onclick="pickShape('arrow')">→ 矢印</button>
  <button class="sp-btn" onclick="pickShape('rect')">□ 四角形</button>
  <button class="sp-btn" onclick="pickShape('circle')">○ 円</button>
  <button class="sp-btn" onclick="pickShape('line')">/ 直線</button>
</div>

<!-- ===== PANE CONTAINER ===== -->
<div id="pane-container">
  <!-- PANE 0 -->
  <div class="pane active-pane" id="pane0">
    <div class="pane-header">
      <input type="file" id="fi0" accept="application/pdf" style="display:none">
      <span class="ph-fn" id="fn0">ファイル未選択</span>
      <button class="ph-btn" onclick="document.getElementById('fi0').click()">📂 開く</button>
      <button class="ph-btn" onclick="panes[0].changePage(-1)">◀</button>
      <input class="ph-pnum" id="pn0" type="number" min="1" value="1" onchange="panes[0].jumpPage(+this.value)">
      <span class="ph-tot">/ <span id="tp0">0</span></span>
      <button class="ph-btn" onclick="panes[0].changePage(1)">▶</button>
      <span class="ph-zoom" id="zl0">--</span>
      <button class="ph-btn" onclick="panes[0].fitPage()">全体</button>
      <button class="ph-btn" onclick="panes[0].zoomBy(1.3)">＋</button>
      <button class="ph-btn" onclick="panes[0].zoomBy(0.77)">－</button>
    </div>
    <div class="canvas-area" id="ca0">
      <div class="canvas-scroll-content" id="sc0">
        <div class="canvas-wrapper" id="cw0" style="display:none">
          <canvas id="pc0"></canvas>
          <canvas id="dc0"></canvas>
        </div>
      </div>
      <div class="drop-zone" id="dz0">
        <div class="dz-icon">📄</div>
        <div class="dz-msg">PDFを開いてください</div>
        <div class="dz-sub">タップして選択・ドラッグ＆ドロップ</div>
        <button class="dz-btn" onclick="document.getElementById('fi0').click()">📂 PDFを開く</button>
      </div>
    </div>
  </div>

  <div id="split-divider"></div>

  <!-- PANE 1 -->
  <div class="pane" id="pane1" style="display:none">
    <div class="pane-header">
      <span class="ph-fn" id="fn1">同期中</span>
      <button class="ph-btn" onclick="panes[1].changePage(-1)">◀</button>
      <input class="ph-pnum" id="pn1" type="number" min="1" value="1" onchange="panes[1].jumpPage(+this.value)">
      <span class="ph-tot">/ <span id="tp1">0</span></span>
      <button class="ph-btn" onclick="panes[1].changePage(1)">▶</button>
      <span class="ph-zoom" id="zl1">--</span>
      <button class="ph-btn" onclick="panes[1].fitPage()">全体</button>
      <button class="ph-btn" onclick="panes[1].zoomBy(1.3)">＋</button>
      <button class="ph-btn" onclick="panes[1].zoomBy(0.77)">－</button>
    </div>
    <div class="canvas-area" id="ca1">
      <div class="canvas-scroll-content" id="sc1">
        <div class="canvas-wrapper" id="cw1" style="display:none">
          <canvas id="pc1"></canvas>
          <canvas id="dc1"></canvas>
        </div>
      </div>
      <div class="drop-zone" id="dz1" style="display:none"></div>
    </div>
  </div>
</div>

<!-- ===== CALCULATOR ===== -->
<div id="calc-panel">
  <div id="calc-titlebar">
    <span>🧮 計算機</span>
    <button id="calc-close" onclick="toggleCalc()">✕</button>
  </div>
  <div id="calc-history"></div>
  <div id="calc-display">
    <div id="calc-expr"></div>
    <div id="calc-val">0</div>
  </div>
  <div id="calc-btns">
    <button class="cb cb-fn" onclick="cFn('C')">C</button>
    <button class="cb cb-fn" onclick="cFn('±')">±</button>
    <button class="cb cb-fn" onclick="cFn('%')">%</button>
    <button class="cb cb-op" onclick="cOp('/')">÷</button>
    <button class="cb cb-num" onclick="cNum('7')">7</button>
    <button class="cb cb-num" onclick="cNum('8')">8</button>
    <button class="cb cb-num" onclick="cNum('9')">9</button>
    <button class="cb cb-op" onclick="cOp('*')">×</button>
    <button class="cb cb-num" onclick="cNum('4')">4</button>
    <button class="cb cb-num" onclick="cNum('5')">5</button>
    <button class="cb cb-num" onclick="cNum('6')">6</button>
    <button class="cb cb-op" onclick="cOp('-')">−</button>
    <button class="cb cb-num" onclick="cNum('1')">1</button>
    <button class="cb cb-num" onclick="cNum('2')">2</button>
    <button class="cb cb-num" onclick="cNum('3')">3</button>
    <button class="cb cb-op" onclick="cOp('+')">＋</button>
    <button class="cb cb-num cb-wide" onclick="cNum('0')">0</button>
    <button class="cb cb-num" onclick="cNum('.')">.</button>
    <button class="cb cb-eq" onclick="cEq()">=</button>
  </div>
</div>

<!-- TEXT INPUT -->
<div id="text-overlay">
  <div id="text-popup">
    <h3>テキスト入力</h3>
    <textarea id="text-field" placeholder="テキストを入力…"></textarea>
    <div class="pop-btns">
      <button class="pop-btn" id="txt-cancel" onclick="cancelText()">キャンセル</button>
      <button class="pop-btn" id="txt-ok" onclick="confirmText()">確定</button>
    </div>
  </div>
</div>

<div id="loading"><div class="spin"></div><span style="font-size:14px">読み込み中…</span></div>
<div id="toast"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ============================================================
   GLOBAL STATE
   ============================================================ */
let currentTool  = 'pen';
let currentShape = 'arrow'; // active shape subtype
let strokeColor  = '#f07800';
let strokeSize   = 3;
let activePaneId = 0;
let splitMode    = false;
let textPendingPane = null, textPendingX = 0, textPendingY = 0;

/* ============================================================
   PANE CLASS
   ============================================================ */
class Pane {
  constructor(id) {
    this.id = id;
    this.pdfDoc      = null;
    this.currentPage = 1;
    this.totalPages  = 0;
    this.scale       = 1.0;
    this.strokes     = {};   // { page: [{...}] } — shared by both panes in split mode
    this.currentStroke = null;
    this.isDrawing   = false;
    this.lastX = 0; this.lastY = 0;
    this.pinch       = null;
    this.panState    = null;
    this._renderVer  = 0;    // render version counter (cancel stale renders)

    this.area    = document.getElementById('ca' + id);
    this.sc      = document.getElementById('sc' + id);  // scroll content
    this.wrapper = document.getElementById('cw' + id);
    this.pdfCvs  = document.getElementById('pc' + id);
    this.drawCvs = document.getElementById('dc' + id);
    this.pdfCtx  = this.pdfCvs.getContext('2d');
    this.drawCtx = this.drawCvs.getContext('2d');
    this.pnInput = document.getElementById('pn' + id);
    this.tpSpan  = document.getElementById('tp' + id);
    this.zlSpan  = document.getElementById('zl' + id);
    this.fnSpan  = document.getElementById('fn' + id);
    this.dropZone= document.getElementById('dz' + id);

    this._setup();
  }

  _setup() {
    document.getElementById('fi' + this.id)?.addEventListener('change', e => {
      const f = e.target.files[0]; if (f) this.loadPDF(f); e.target.value = '';
    });
    this.area.addEventListener('dragover', e => e.preventDefault());
    this.area.addEventListener('drop', e => {
      e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) this.loadPDF(f);
    });
    this.drawCvs.addEventListener('touchstart', e => this._ts(e), { passive: false });
    this.drawCvs.addEventListener('touchmove',  e => this._tm(e), { passive: false });
    this.drawCvs.addEventListener('touchend',   e => this._te(e));
    this.drawCvs.addEventListener('mousedown',  e => { setAP(this.id); this._sd(e); });
    this.drawCvs.addEventListener('mousemove',  e => { if (this.isDrawing) this._md(e); });
    this.drawCvs.addEventListener('mouseup',    e => this._ed(e));
    this.area.addEventListener('pointerdown', () => setAP(this.id), { capture: true });
  }

  /* ---- TOUCH DISPATCHER ---- */
  _ts(e) {
    if (!this.pdfDoc) return;
    setAP(this.id); e.preventDefault();
    if (e.touches.length >= 2) {
      this.isDrawing = false; this.currentStroke = null;
      this._startPinch(e.touches); return;
    }
    if (currentTool === 'move') { this._startPan(e.touches[0]); return; }
    this._sd(e);
  }
  _tm(e) {
    e.preventDefault();
    if (e.touches.length >= 2 && this.pinch) { this._movePinch(e.touches); return; }
    if (this.panState && e.touches.length === 1) { this._movePan(e.touches[0]); return; }
    if (this.isDrawing) this._md(e);
  }
  _te(e) {
    if (this.pinch && e.touches.length < 2) { this._endPinch(); return; }
    if (this.panState && e.touches.length === 0) { this.panState = null; return; }
    if (this.isDrawing) this._ed(e);
  }

  /* ---- PINCH ZOOM (ピンチ中心固定・フラッシュなし) ---- */
  _getDist(t) { const dx=t[1].clientX-t[0].clientX,dy=t[1].clientY-t[0].clientY; return Math.sqrt(dx*dx+dy*dy); }
  _getMid(t)  { return { x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 }; }

  _startPinch(touches) {
    const mid   = this._getMid(touches);
    const aRect = this.area.getBoundingClientRect();
    const wRect = this.wrapper.getBoundingClientRect();
    this.pinch = {
      dist0: this._getDist(touches),
      scale0: this.scale,
      // ピンチ中心: ラッパー座標系
      cpx: mid.x - wRect.left,
      cpy: mid.y - wRect.top,
      // ピンチ中心: エリアビューポート座標系
      vpx: mid.x - aRect.left,
      vpy: mid.y - aRect.top,
      mid0: mid,
      sl0: this.area.scrollLeft,
      st0: this.area.scrollTop,
      target: this.scale,
    };
  }

  _movePinch(touches) {
    const p = this.pinch;
    const ratio = this._getDist(touches) / p.dist0;
    p.target = Math.max(0.2, Math.min(6, p.scale0 * ratio));

    // CSS transformでリアルタイムプレビュー（再レンダリングなし→フラッシュなし）
    this.wrapper.style.transformOrigin = `${p.cpx}px ${p.cpy}px`;
    this.wrapper.style.transform = `scale(${ratio})`;

    // 2本指の平行移動をスクロールに反映
    const mid = this._getMid(touches);
    this.area.scrollLeft = p.sl0 - (mid.x - p.mid0.x);
    this.area.scrollTop  = p.st0 - (mid.y - p.mid0.y);
    this.zlSpan.textContent = Math.round(p.target * 100) + '%';
  }

  _endPinch() {
    if (!this.pinch) return;
    const p = this.pinch;
    this.pinch = null;
    const oldScale = this.scale;
    this.scale = p.target;

    // 高品質レンダリング（CSSトランスフォームを維持しながら裏で描画→完了後に切り替え）
    this._renderPage(this.currentPage, { pinch: p, oldScale }).then(() => {
      // レンダリング完了後にスクロール位置を補正
      const ratio = this.scale / oldScale;
      const wL = parseInt(this.wrapper.style.left) || 16;
      const wT = parseInt(this.wrapper.style.top)  || 16;
      this.area.scrollLeft = Math.max(0, wL + p.cpx * ratio - p.vpx);
      this.area.scrollTop  = Math.max(0, wT + p.cpy * ratio - p.vpy);
    });
  }

  /* ---- PAN (移動ツール) ---- */
  _startPan(t) {
    this.panState = { x0: t.clientX, y0: t.clientY, sl0: this.area.scrollLeft, st0: this.area.scrollTop };
  }
  _movePan(t) {
    if (!this.panState) return;
    this.area.scrollLeft = this.panState.sl0 - (t.clientX - this.panState.x0);
    this.area.scrollTop  = this.panState.st0 - (t.clientY - this.panState.y0);
  }

  /* ---- DRAWING ---- */
  // 座標はPDF単位で記録（スケール非依存）
  _pos(e, idx=0) {
    const rect = this.drawCvs.getBoundingClientRect();
    const sx = this.drawCvs.width / rect.width, sy = this.drawCvs.height / rect.height;
    const src = e.touches ? e.touches[idx] : e;
    return {
      x: (src.clientX - rect.left) * sx / this.scale,
      y: (src.clientY - rect.top)  * sy / this.scale,
    };
  }

  _sd(e) {
    if (!this.pdfDoc) return;
    const pos = this._pos(e);
    if (currentTool === 'text') {
      textPendingPane = this; textPendingX = pos.x; textPendingY = pos.y;
      document.getElementById('text-field').value = '';
      document.getElementById('text-overlay').classList.add('show'); return;
    }
    if (currentTool === 'move') return;
    this.isDrawing = true; this.lastX = pos.x; this.lastY = pos.y;
    const tool = currentTool === 'shape' ? currentShape : currentTool;
    if (['pen','highlight','eraser'].includes(tool)) {
      this.currentStroke = { type: tool, points: [[pos.x, pos.y]], color: strokeColor, size: strokeSize };
    } else {
      this.currentStroke = { type: tool, x1:pos.x, y1:pos.y, x2:pos.x, y2:pos.y, color: strokeColor, size: strokeSize };
    }
  }

  _md(e) {
    if (!this.currentStroke) return;
    const pos = this._pos(e); const s = this.currentStroke;
    const sc = this.scale;
    if (['pen','highlight','eraser'].includes(s.type)) {
      s.points.push([pos.x, pos.y]);
      const ctx = this.drawCtx; ctx.save();
      if (s.type === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = s.size * 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = s.type === 'highlight' ? 0.38 : 1.0;
        ctx.strokeStyle = s.color;
        ctx.lineWidth   = s.type === 'highlight' ? Math.max(s.size*4, 16) : s.size;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      }
      ctx.beginPath(); ctx.moveTo(this.lastX*sc, this.lastY*sc); ctx.lineTo(pos.x*sc, pos.y*sc); ctx.stroke();
      ctx.restore();
      this.lastX = pos.x; this.lastY = pos.y;
    } else {
      s.x2 = pos.x; s.y2 = pos.y;
      this._redraw(); this._drawOne(s, this.drawCtx, sc);
    }
  }

  _ed(e) {
    if (!this.isDrawing || !this.currentStroke) { this.isDrawing = false; return; }
    this.isDrawing = false;
    const pg = this.currentPage;
    if (!this.strokes[pg]) this.strokes[pg] = [];
    const s = this.currentStroke;
    this.strokes[pg].push({ ...s, points: s.points ? [...s.points] : undefined });
    this.currentStroke = null;
    this._redraw();
    // 分割モード: 相手ペインも再描画
    if (splitMode) { const other = panes[1-this.id]; other._redraw(); }
  }

  /* ---- DRAW STROKE (PDF単位→キャンバスpx変換) ---- */
  _drawOne(s, ctx, sc) {
    ctx.save();
    if (s.type === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = s.size * 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      s.points.forEach((p,i) => i===0 ? ctx.moveTo(p[0]*sc,p[1]*sc) : ctx.lineTo(p[0]*sc,p[1]*sc));
      ctx.stroke();
    } else if (['pen','highlight'].includes(s.type)) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = s.type === 'highlight' ? 0.38 : 1.0;
      ctx.strokeStyle = s.color;
      ctx.lineWidth   = s.type === 'highlight' ? Math.max(s.size*4, 16) : s.size;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      s.points.forEach((p,i) => i===0 ? ctx.moveTo(p[0]*sc,p[1]*sc) : ctx.lineTo(p[0]*sc,p[1]*sc));
      ctx.stroke();
    } else if (s.type === 'text') {
      ctx.fillStyle = s.color;
      ctx.font = `bold ${s.size * 6}px 'Helvetica Neue',Arial,sans-serif`;
      s.text.split('\n').forEach((l,i) => ctx.fillText(l, s.x*sc, s.y*sc + i*s.size*7));
    } else {
      ctx.strokeStyle = s.color; ctx.lineWidth = s.size; ctx.lineCap = 'round';
      const x1=s.x1*sc,y1=s.y1*sc,x2=s.x2*sc,y2=s.y2*sc;
      if (s.type === 'rect') ctx.strokeRect(x1,y1,x2-x1,y2-y1);
      else if (s.type === 'circle') {
        const rx=(x2-x1)/2,ry=(y2-y1)/2;
        ctx.beginPath(); ctx.ellipse(x1+rx,y1+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2); ctx.stroke();
      } else if (s.type === 'line') {
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      } else if (s.type === 'arrow') {
        const hl=Math.max(s.size*4,14), ang=Math.atan2(y2-y1,x2-x1);
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x2,y2); ctx.lineTo(x2-hl*Math.cos(ang-Math.PI/6),y2-hl*Math.sin(ang-Math.PI/6));
        ctx.moveTo(x2,y2); ctx.lineTo(x2-hl*Math.cos(ang+Math.PI/6),y2-hl*Math.sin(ang+Math.PI/6));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  _redraw() {
    const sc = this.scale;
    this.drawCtx.clearRect(0, 0, this.drawCvs.width, this.drawCvs.height);
    (this.strokes[this.currentPage] || []).forEach(s => this._drawOne(s, this.drawCtx, sc));
  }

  /* ---- PDF RENDER (オフスクリーンで描画→フラッシュなし) ---- */
  async loadPDF(file) {
    showLoading(true);
    try {
      this.pdfDoc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      this.totalPages = this.pdfDoc.numPages;
      this.tpSpan.textContent = this.totalPages;
      this.fnSpan.textContent = file.name;
      this.currentPage = 1; this.strokes = {};
      this.dropZone.style.display = 'none';
      this.wrapper.style.display = 'block';
      await this._renderPage(1);
      await this.fitPage();
      // 分割モード: pane1に同期
      if (splitMode && this.id === 0) syncToPane1();
    } catch(e) { showToast('読み込みに失敗しました'); console.error(e); }
    showLoading(false);
  }

  async _renderPage(num, opts = {}) {
    if (!this.pdfDoc) return;
    const ver = ++this._renderVer;
    const page  = await this.pdfDoc.getPage(num);
    const vp    = page.getViewport({ scale: this.scale });

    // ① オフスクリーンキャンバスに描画（CSS transformは維持されたまま）
    const off = document.createElement('canvas');
    off.width = vp.width; off.height = vp.height;
    await page.render({ canvasContext: off.getContext('2d'), viewport: vp }).promise;

    // キャンセルチェック（別の描画が開始されていた場合は破棄）
    if (ver !== this._renderVer) return;

    // ② CSS transformを解除してから、原子的に表示を更新
    this.wrapper.style.transform = '';
    this.wrapper.style.transformOrigin = '';

    this.pdfCvs.width  = vp.width; this.pdfCvs.height = vp.height;
    this.pdfCtx.drawImage(off, 0, 0);   // オフスクリーンから即コピー（空白なし）
    this.drawCvs.width = vp.width; this.drawCvs.height = vp.height;
    this._redraw();

    // ③ ラッパー位置・スクロールコンテンツサイズを更新
    const aW = this.area.clientWidth, aH = this.area.clientHeight;
    const wL = Math.max(16, (aW - vp.width)  / 2);
    const wT = Math.max(16, (aH - vp.height) / 2);
    this.wrapper.style.left = wL + 'px';
    this.wrapper.style.top  = wT + 'px';
    this.sc.style.width  = Math.max(vp.width  + wL + 16, aW) + 'px';
    this.sc.style.height = Math.max(vp.height + wT + 16, aH) + 'px';

    this.pnInput.value = num;
    this.zlSpan.textContent = Math.round(this.scale * 100) + '%';
  }

  async changePage(d) {
    if (!this.pdfDoc) return;
    const n = this.currentPage + d;
    if (n < 1 || n > this.totalPages) return;
    this.currentPage = n; await this._renderPage(n);
    if (splitMode && this.id === 0) syncToPane1();
  }
  async jumpPage(v) {
    if (!this.pdfDoc) return;
    this.currentPage = Math.max(1, Math.min(this.totalPages, v||1));
    await this._renderPage(this.currentPage);
    if (splitMode && this.id === 0) syncToPane1();
  }
  async setZoom(z) {
    this.scale = Math.max(0.2, Math.min(6, z));
    if (this.pdfDoc) await this._renderPage(this.currentPage);
  }
  async zoomBy(r) { await this.setZoom(this.scale * r); }
  async fitPage() {
    if (!this.pdfDoc) return;
    const page = await this.pdfDoc.getPage(this.currentPage);
    const vp = page.getViewport({ scale: 1 });
    const s = Math.min((this.area.clientWidth-32)/vp.width, (this.area.clientHeight-32)/vp.height);
    await this.setZoom(Math.max(0.2, s));
  }

  undo() {
    const arr = this.strokes[this.currentPage];
    if (!arr||!arr.length) { showToast('元に戻す操作がありません'); return; }
    arr.pop(); this._redraw();
    if (splitMode) panes[1-this.id]._redraw();
  }
  clear() {
    if (!confirm('このページの書き込みを全て消去しますか？')) return;
    this.strokes[this.currentPage] = []; this._redraw();
    if (splitMode) panes[1-this.id]._redraw();
  }
  saveImage() {
    if (!this.pdfDoc) { showToast('PDFが開かれていません'); return; }
    const m = document.createElement('canvas');
    m.width = this.pdfCvs.width; m.height = this.pdfCvs.height;
    const c = m.getContext('2d');
    c.drawImage(this.pdfCvs, 0, 0); c.drawImage(this.drawCvs, 0, 0);
    const a = document.createElement('a');
    a.download = `図面_p${this.currentPage}_${new Date().toISOString().slice(0,10)}.png`;
    a.href = m.toDataURL('image/png'); a.click();
    showToast('PNG保存しました');
  }
}

/* ============================================================
   INIT
   ============================================================ */
const panes = [new Pane(0), new Pane(1)];

/* ============================================================
   SPLIT MODE — 同じPDFを共有
   ============================================================ */
function syncToPane1() {
  const p0 = panes[0], p1 = panes[1];
  if (!p0.pdfDoc) return;
  p1.pdfDoc = p0.pdfDoc;
  p1.strokes = p0.strokes;        // 同じオブジェクトを参照
  p1.currentPage = p0.currentPage;
  p1.totalPages  = p0.totalPages;
  p1.tpSpan.textContent = p0.totalPages;
  p1.fnSpan.textContent = p0.fnSpan.textContent + ' (同期)';
  p1.dropZone.style.display = 'none';
  p1.wrapper.style.display  = 'block';
  p1._renderPage(p1.currentPage);
  p1.fitPage();
}

function toggleSplit() {
  splitMode = !splitMode;
  const container = document.getElementById('pane-container');
  container.classList.toggle('split', splitMode);
  document.getElementById('split-btn').classList.toggle('on', splitMode);
  document.getElementById('split-btn').textContent = splitMode ? '⊠ 分割中' : '⊟ 2分割';
  if (splitMode) {
    syncToPane1();
    setTimeout(() => { panes.forEach(p => { if (p.pdfDoc) p.fitPage(); }); }, 50);
  }
}

/* ============================================================
   ACTIVE PANE
   ============================================================ */
function getAP()    { return panes[activePaneId]; }
function setAP(id)  {
  if (activePaneId === id) return;
  activePaneId = id;
  panes.forEach((p,i) => p.area.closest('.pane').classList.toggle('active-pane', i===id));
}

/* ============================================================
   TOOL / COLOR
   ============================================================ */
function setTool(t) {
  // 図形ツール選択時は形状ピッカーが担当
  if (t === 'shape') { toggleShapePicker(null); return; }
  currentTool = t;
  document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tool-' + t)?.classList.add('active');
  hideShapePicker();
}
function setColor(el) {
  document.querySelectorAll('.cswatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active'); strokeColor = el.dataset.color;
}

/* shape picker */
let shapePickerRef = null;
function toggleShapePicker(e) {
  const picker = document.getElementById('shape-picker');
  if (picker.classList.contains('show')) { hideShapePicker(); return; }
  // ボタンの位置に合わせて表示
  const btn = document.getElementById('tool-shape');
  const r = btn.getBoundingClientRect();
  picker.style.top  = (r.bottom + 6) + 'px';
  picker.style.left = r.left + 'px';
  picker.classList.add('show');
}
function hideShapePicker() {
  document.getElementById('shape-picker').classList.remove('show');
}
function pickShape(s) {
  currentShape = s; currentTool = 'shape';
  const labels = { arrow:'矢印', rect:'四角', circle:'円', line:'直線' };
  document.getElementById('tool-shape').textContent = labels[s] + ' ▾';
  document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tool-shape').classList.add('active');
  // sp-btn ハイライト
  document.querySelectorAll('.sp-btn').forEach(b => b.classList.remove('sp-active'));
  event?.currentTarget?.classList.add('sp-active');
  hideShapePicker();
}
// ピッカー外タップで閉じる
document.addEventListener('click', e => {
  if (!e.target.closest('#shape-picker') && !e.target.closest('#tool-shape')) hideShapePicker();
});

/* ============================================================
   TEXT INPUT
   ============================================================ */
function cancelText() { document.getElementById('text-overlay').classList.remove('show'); }
function confirmText() {
  const txt = document.getElementById('text-field').value.trim();
  if (txt && textPendingPane) {
    const p = textPendingPane;
    if (!p.strokes[p.currentPage]) p.strokes[p.currentPage] = [];
    p.strokes[p.currentPage].push({ type:'text', text:txt, x:textPendingX, y:textPendingY, color:strokeColor, size:Math.max(strokeSize,2) });
    p._redraw();
    if (splitMode) panes[1-p.id]._redraw();
  }
  cancelText();
}
document.getElementById('text-field').addEventListener('keydown', e => {
  if (e.key==='Enter'&&e.ctrlKey) confirmText();
  if (e.key==='Escape') cancelText();
});

/* ============================================================
   CALCULATOR
   ============================================================ */
let cExpr='', cOper='', cVal='', cJustEq=false;
const calcHistory = [];

function calcDisp() {
  document.getElementById('calc-expr').textContent = cExpr;
  document.getElementById('calc-val').textContent  = cVal || '0';
}
function cNum(n) {
  if (cJustEq) { cVal=''; cExpr=''; cJustEq=false; }
  if (n==='.'&&cVal.includes('.')) return;
  cVal += n; calcDisp();
}
function cOp(op) {
  cJustEq=false;
  if (cVal!==''&&cOper!=='') {
    const a=parseFloat(cExpr.split(/[ +\-*/]/)[0]), b=parseFloat(cVal);
    let r=a;
    if(cOper==='+')r=a+b; else if(cOper==='-')r=a-b; else if(cOper==='*')r=a*b; else if(cOper==='/')r=b?a/b:0;
    cVal=String(+r.toFixed(10));
  }
  const opLabel={'+':'＋','-':'−','*':'×','/':'÷'}[op];
  cExpr=(cVal||'0')+' '+opLabel+' '; cOper=op; cVal=''; calcDisp();
}
function cEq() {
  if (!cOper||cVal==='') return;
  const a=parseFloat(cExpr.trim().split(' ')[0]), b=parseFloat(cVal);
  let r=a;
  if(cOper==='+')r=a+b; else if(cOper==='-')r=a-b; else if(cOper==='*')r=a*b; else if(cOper==='/')r=b?a/b:0;
  const rs=String(+r.toFixed(10));
  const histLine = cExpr+cVal+' = '+rs;
  calcHistory.unshift(histLine);
  if (calcHistory.length>20) calcHistory.pop();
  // 履歴更新
  const hEl = document.getElementById('calc-history');
  hEl.innerHTML = calcHistory.map(h=>`<div class="ch-item">${h}</div>`).join('');
  cExpr=cExpr+cVal+' ='; cVal=rs; cOper=''; cJustEq=true; calcDisp();
}
function cFn(fn) {
  if(fn==='C'){cExpr='';cVal='';cOper='';cJustEq=false;}
  else if(fn==='±'){if(cVal)cVal=String(-parseFloat(cVal));}
  else if(fn==='%'){if(cVal)cVal=String(parseFloat(cVal)/100);}
  calcDisp();
}
function toggleCalc() {
  const el = document.getElementById('calc-panel');
  el.classList.toggle('show');
  document.getElementById('calc-btn').classList.toggle('on', el.classList.contains('show'));
}
// 計算機ドラッグ
(function(){
  const el=document.getElementById('calc-panel');
  let drag=false,ox=0,oy=0,ex=0,ey=0;
  document.getElementById('calc-titlebar').addEventListener('touchstart',e=>{
    e.preventDefault(); drag=true;
    const t=e.touches[0]; ox=t.clientX; oy=t.clientY;
    const r=el.getBoundingClientRect(); ex=r.left; ey=r.top;
  },{passive:false});
  document.addEventListener('touchmove',e=>{
    if(!drag)return;
    const t=e.touches[0],dx=t.clientX-ox,dy=t.clientY-oy;
    el.style.left=(ex+dx)+'px'; el.style.top=(ey+dy)+'px';
    el.style.bottom='auto'; el.style.right='auto';
  },{passive:true});
  document.addEventListener('touchend',()=>drag=false);
  document.getElementById('calc-titlebar').addEventListener('mousedown',e=>{
    drag=true; ox=e.clientX; oy=e.clientY;
    const r=el.getBoundingClientRect(); ex=r.left; ey=r.top;
  });
  document.addEventListener('mousemove',e=>{
    if(!drag)return;
    el.style.left=(ex+e.clientX-ox)+'px'; el.style.top=(ey+e.clientY-oy)+'px';
    el.style.bottom='auto'; el.style.right='auto';
  });
  document.addEventListener('mouseup',()=>drag=false);
})();

/* ============================================================
   HELPERS
   ============================================================ */
let toastTmr;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTmr); toastTmr=setTimeout(()=>t.classList.remove('show'),2500);
}
function showLoading(v) { document.getElementById('loading').classList.toggle('show',v); }
