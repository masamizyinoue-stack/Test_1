/* ---- modules/subwin/SubWindow.js ---- */
/**
 * modules/subwin/SubWindow.js — サブ窓1枚の描画・DOM 管理
 * M_Viewer 再設計 Phase 8
 *
 * 責務:
 *   - サブ窓 DOM 要素の生成・破棄
 *   - 独立した page / zoom / panX / panY の保持
 *   - PDF 描画（pdf-canvas / Loader 経由）
 *   - 注釈描画（ann-canvas / renderStroke 経由）
 *   - dirty フラグによる差分再描画
 *
 * 禁止:
 *   - addEventListener の永続的登録（ドラッグ一時除く）
 *   - Store への dispatch（SubWindowManager が行う）
 *   - requestAnimationFrame の直接使用
 */


const log = createLogger('SubWindow');

const DPR     = clamp(window.devicePixelRatio || 1, 1, LIMITS.MAX_DPR);
const MIN_W   = 200;
const MIN_H   = 150;

class SubWindow {
  /** @type {string} */
  #id;
  /** @type {HTMLElement} */
  #el;
  /** @type {HTMLCanvasElement} */
  #pdfCvs;
  /** @type {HTMLCanvasElement} */
  #annCvs;
  /** @type {CanvasRenderingContext2D} */
  #pdfCtx;
  /** @type {CanvasRenderingContext2D} */
  #annCtx;
  /** @type {HTMLSelectElement} */
  #pageSelect;

  #page   = 1;
  #zoom   = 1.0;
  #panX   = 0;
  #panY   = 0;

  #pdfDirty = true;
  #annDirty = true;
  #rendering = false;
  #cancelFn  = null;

  /** @param {string} id @param {{ page,x,y,w,h,zoom,pageCount:number }} opts */
  constructor(id, { page, x, y, w, h, zoom, pageCount }) {
    this.#id   = id;
    this.#page = page;
    this.#zoom = zoom;

    this.#el = this.#buildDom(id, x, y, w, h, pageCount);
    const cvs = this.#el.querySelectorAll('canvas');
    this.#pdfCvs = cvs[0];
    this.#annCvs = cvs[1];
    this.#pdfCtx = this.#pdfCvs.getContext('2d', { alpha: false });
    this.#annCtx = this.#annCvs.getContext('2d', { alpha: true, desynchronized: true });

    this.#pageSelect = this.#el.querySelector('.sw-psel');
    this.#syncPageSelect();
  }

  /* ---- ゲッター ---- */
  get id()  { return this.#id; }
  get el()  { return this.#el; }
  get page(){ return this.#page; }
  get zoom(){ return this.#zoom; }
  get panX(){ return this.#panX; }
  get panY(){ return this.#panY; }

  /* ---- 状態更新（dirty フラグを立てるのみ） ---- */

  setPage(page) {
    if (this.#page === page) return;
    this.#page = page;
    this.#pdfDirty = true;
    this.#annDirty = true;
    this.#syncPageSelect();
  }

  setView(zoom, panX, panY) {
    this.#zoom = zoom;
    this.#panX = panX;
    this.#panY = panY;
    this.#pdfDirty = true;
    this.#annDirty = true;
  }

  markAnnDirty() { this.#annDirty = true; }
  markPdfDirty() { this.#pdfDirty = true; this.#annDirty = true; }

  /** DOM 位置を更新（ドラッグ中にリアルタイムで呼ぶ） */
  setPosition(x, y) {
    this.#el.style.left = `${x}px`;
    this.#el.style.top  = `${y}px`;
  }

  /** DOM サイズを更新（リサイズ中にリアルタイムで呼ぶ） */
  setSize(w, h) {
    w = Math.max(w, MIN_W);
    h = Math.max(h, MIN_H);
    this.#el.style.width  = `${w}px`;
    this.#el.style.height = `${h}px`;
    // canvas サイズも更新
    const body  = this.#el.querySelector('.sw-body');
    const bRect = body.getBoundingClientRect();
    this.#resizeCvs(bRect.width || w, bRect.height || (h - 36));
    this.#pdfDirty = true;
    this.#annDirty = true;
  }

  /** ページ数変更時にセレクトを再構築 */
  updatePageCount(pageCount) {
    const sel = this.#pageSelect;
    if (!sel) return;
    const cur = this.#page;
    sel.innerHTML = '';
    for (let i = 1; i <= pageCount; i++) {
      const opt = document.createElement('option');
      opt.value       = i;
      opt.textContent = `P${i}`;
      if (i === cur) opt.selected = true;
      sel.appendChild(opt);
    }
  }

  /** z-index 更新 */
  setZIndex(z) { this.#el.style.zIndex = z; }

  /* ---- rAF tick から呼ばれる描画処理 ---- */

  /**
   * @param {object} annState  Store.state.annotation
   */
  tick(annState) {
    if (this.#pdfDirty && !this.#rendering) {
      this.#pdfDirty = false;
      this.#drawPdf();        // 非同期（内部でキャンセル制御）
    }
    if (this.#annDirty) {
      this.#annDirty = false;
      this.#drawAnn(annState);
    }
  }

  /* ---- 破棄 ---- */

  destroy() {
    if (this.#cancelFn) { this.#cancelFn(); this.#cancelFn = null; }
    this.#el.remove();
    this.#pdfCtx = null;
    this.#annCtx = null;
    log.debug(`destroyed: ${this.#id}`);
  }

  /* ---- 内部: PDF 描画 ---- */

  async #drawPdf() {
    if (!Loader.isLoaded) return;
    if (this.#rendering) return;
    this.#rendering = true;

    // 前回キャンセル
    if (this.#cancelFn) { this.#cancelFn(); this.#cancelFn = null; }
    let cancelled = false;
    this.#cancelFn = () => { cancelled = true; };

    try {
      const page = await Loader.getPage(this.#page);
      if (cancelled || !this.#pdfCtx) return;

      const pdfW = page.view[2], pdfH = page.view[3];
      const scale    = calcRenderScale(pdfW, pdfH, this.#zoom, DPR);
      const viewport = page.getViewport({ scale });

      // canvas を viewport サイズに合わせる
      const cvs = this.#pdfCvs;
      if (cvs.width  !== Math.round(viewport.width)  ||
          cvs.height !== Math.round(viewport.height)) {
        cvs.width  = Math.round(viewport.width);
        cvs.height = Math.round(viewport.height);
        this.#annCvs.width  = cvs.width;
        this.#annCvs.height = cvs.height;
      }

      const renderTask = page.render({
        canvasContext: this.#pdfCtx,
        viewport,
        intent: 'display',
      });
      this.#cancelFn = () => { cancelled = true; renderTask.cancel(); };
      await renderTask.promise;

      if (cancelled) return;
      // PDF 描画後に注釈も再描画
      this.#annDirty = true;
    } catch (e) {
      if (!cancelled) log.warn(`pdf render error (${this.#id}):`, e.message);
    } finally {
      this.#rendering = false;
      this.#cancelFn  = null;
    }
  }

  /* ---- 内部: 注釈描画 ---- */

  #drawAnn(annState) {
    const ctx = this.#annCtx;
    if (!ctx) return;
    ctx.clearRect(0, 0, this.#annCvs.width, this.#annCvs.height);

    const strokes = selectStrokes(annState, this.#page);
    if (strokes.length === 0) return;

    // PDF描画と同じ transform: PDF座標 → canvas 物理ピクセル
    ctx.setTransform(DPR * this.#zoom, 0, 0, DPR * this.#zoom,
                     this.#panX * DPR, this.#panY * DPR);
    for (const s of strokes) renderStroke(ctx, s);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  /* ---- 内部: canvas サイズ同期 ---- */

  #resizeCvs(cssW, cssH) {
    const pw = Math.round(cssW * DPR);
    const ph = Math.round(cssH * DPR);
    if (this.#pdfCvs.width !== pw || this.#pdfCvs.height !== ph) {
      this.#pdfCvs.width  = pw; this.#pdfCvs.height = ph;
      this.#annCvs.width  = pw; this.#annCvs.height = ph;
    }
  }

  /* ---- 内部: ページセレクト同期 ---- */

  #syncPageSelect() {
    if (this.#pageSelect) this.#pageSelect.value = this.#page;
  }

  /* ---- 内部: DOM 生成 ---- */

  #buildDom(id, x, y, w, h, pageCount) {
    const el = document.createElement('div');
    el.className = 'sw-frame';
    el.dataset.swId = id;
    el.style.cssText = [
      `left:${x}px`, `top:${y}px`,
      `width:${w}px`, `height:${h}px`,
      'position:absolute',
    ].join(';');

    // ページセレクト オプション
    let opts = '';
    for (let i = 1; i <= (pageCount || 1); i++) {
      opts += `<option value="${i}"${i === this.#page ? ' selected' : ''}>P${i}</option>`;
    }

    el.innerHTML = `
      <div class="sw-hdr" data-sw-drag="${id}">
        <span class="sw-title">サブ窓</span>
        <select class="sw-psel" title="ページ">${opts}</select>
        <button class="sw-close" data-sw-close="${id}" title="閉じる">✕</button>
      </div>
      <div class="sw-body">
        <canvas class="sw-pdf"></canvas>
        <canvas class="sw-ann"></canvas>
      </div>
      <div class="sw-rsz" data-sw-r

/* ---- modules/subwin/SubWindowManager.js ---- */
/**
 * modules/subwin/SubWindowManager.js — サブ窓一元管理・イベント委譲
 * M_Viewer 再設計 Phase 8
 *
 * 責務:
 *   - サブ窓の生成・破棄・最大数管理
 *   - 全サブ窓への単一 rAF ティック（Renderer.schedule 1本）
 *   - イベント委譲（#ca への addEventListener 1セットのみ）
 *     drag / resize / wheel-zoom / page-select / close
 *   - 注釈変更を Store 購読して全サブ窓に一括通知
 *   - ページ数変更を全サブ窓のセレクトに同期
 *
 * 禁止:
 *   - サブ窓ごとへの永続的 addEventListener
 *   - requestAnimationFrame の直接使用（Renderer 経由のみ）
 *   - Store 以外への状態保持（確定座標のみ）
 */


const log = createLogger('SubWinMgr');

/** rAF ジョブ名（Renderer に1本だけ登録） */
const JOB_NAME = 'subwin-tick';

/** サブ窓の初期サイズ */
const DEFAULT_W = 360;
const DEFAULT_H = 280;

/** ズーム倍率の増減ステップ（ホイール） */
const ZOOM_STEP  = 0.0008;
const ZOOM_MIN   = 0.1;
const ZOOM_MAX   = 4.0;

class SubWindowManager {
  /** @type {HTMLElement | null} */
  #container = null;

  /** @type {Map<string, SubWindow>} */
  #windows = new Map();

  /** Store 購読解除関数 */
  #unsubs = [];

  /* ドラッグ/リサイズ状態 */
  #dragState = null;
  // { type:'move'|'resize', win:SubWindow, pointerId:number,
  //   startX, startY, origX, origY, origW, origH }

  /* ドキュメントレベルの一時ハンドラー（ドラッグ中のみ有効） */
  #docMoveFn = null;
  #docUpFn   = null;

  /* container 委譲ハンドラー参照（destroy 時に除去するため保持） */
  #cnDownFn  = null;
  #cnWheelFn = null;
  #cnChgFn   = null;

  /* ---- 初期化 / 破棄 ---- */

  /**
   * @param {HTMLElement} container  #ca 要素（サブ窓を子要素として追加）
   */
  init(container) {
    this.#container = container;

    // イベント委譲: container への 1 セットのみ（参照を保存して destroy で除去）
    this.#cnDownFn  = e => this.#onDown(e);
    this.#cnWheelFn = e => this.#onWheel(e);
    this.#cnChgFn   = e => this.#onChange(e);
    container.addEventListener('pointerdown', this.#cnDownFn,  { passive: false });
    container.addEventListener('wheel',       this.#cnWheelFn, { passive: false });
    container.addEventListener('change',      this.#cnChgFn);

    // rAF ティック（全サブ窓を 1 本でレンダリング）
    Renderer.schedule(JOB_NAME, () => this.#tick());

    // Store 購読: 注釈変更 → 全サブ窓に annDirty
    this.#unsubs = [
      Store.on('annotation', () => this.#markAllAnnDirty()),
      Store.on('document.pageCount', ({ next }) => this.#syncPageCount(next)),
      // サブ窓状態変化 → zIndex 同期
      Store.on('subwin', ({ next }) => this.#syncZIndex(next)),
    ];

    log.info('initialized');
  }

  destroy() {
    Renderer.unschedule(JOB_NAME);
    this.#unsubs.forEach(fn => fn());
    this.#unsubs = [];
    this.#removeDocHandlers();
    this.#dragState = null;
    // container 委譲リスナーを除去（多重登録防止・メモリリーク防止）
    if (this.#container && this.#cnDownFn) {
      this.#container.removeEventListener('pointerdown', this.#cnDownFn);
      this.#container.removeEventListener('wheel',       this.#cnWheelFn);
      this.#container.removeEventListener('change',      this.#cnChgFn);
    }
    this.#cnDownFn = this.#cnWheelFn = this.#cnChgFn = null;
    this.removeAll();
    this.#container = null;
    log.info('destroyed');
  }

  /* ---- 公開: サブ窓操作 ---- */

  /**
   * 新規サブ窓を追加する
   * @returns {string | null}  作成した id。上限超過時は null
   */
  add() {
    if (this.#windows.size >= LIMITS.MAX_SUBWIN) {
      log.warn('max subwin reached');
      return null;
    }
    const id        = uid();
    const pageCount = Store.get('document.pageCount') ?? 1;
    const page      = Store.get('view.currentPage')   ?? 1;

    // 既存サブ窓と被らないようにオフセット
    const offset = this.#windows.size * 24;
    const x = 20 + offset;
    const y = 20 + offset;

    const win = new SubWindow(id, {
      page, x, y,
      w: DEFAULT_W,
      h: DEFAULT_H,
      zoom: 0.5,
      pageCount,
    });

    this.#container.appendChild(win.el);
    this.#windows.set(id, win);

    // Store に登録
    Store.dispatch(Actions.subwin.add({
      id, docId: Store.get('document.id'),
      page, x, y,
      w: DEFAULT_W, h: DEFAULT_H,
      zoom: 0.5,
    }));
    Store.dispatch(Actions.subwin.focus(id));

    log.info(`added: ${id}`);
    return id;
  }

  /**
   * 指定 id のサブ窓を削除
   * @param {string} id
   */
  remove(id) {
    const win = this.#windows.get(id);
    if (!win) return;
    win.destroy();
    this.#windows.delete(id);
    Store.dispatch(Actions.subwin.remove(id));
    log.info(`removed: ${id}`);
  }

  /** 全サブ窓を削除 */
  removeAll() {
    for (const win of this.#windows.values()) win.destroy();
    this.#windows.clear();
    Store.dispatch(Actions.subwin.removeAll());
    log.info('removeAll');
  }

  /* ---- 内部: rAF ティック ---- */

  #tick() {
    if (this.#windows.size === 0) return;
    const annState = Store.state.annotation;
    for (const win of this.#windows.values()) {
      win.tick(annState);
    }
  }

  /* ---- 内部: 一括通知 ---- */

  #markAllAnnDirty() {
    for (const win of this.#windows.values()) win.markAnnDirty();
  }

  #syncPageCount(pageCount) {
    for (const win of this.#windows.values()) win.updatePageCount(pageCount);
  }

  #syncZIndex(subwinState) {
    for (const sw of subwinState.windows) {
      const win = this.#windows.get(sw.id);
      if (win) win.setZIndex(sw.zIndex);
    }
  }

  /* ---- 内部: イベント委譲 ---- */

  /**
   * #container pointerdown → ドラッグ / リサイズ / フォーカス を判定
   */
  #onDown(e) {
    // [data-sw-close] ボタン
    const closeTarget = e.target.closest('[data-sw-close]');
    if (closeTarget) {
      e.stopPropagation();
      this.remove(closeTarget.dataset.swClose);
      return;
    }

    // sw-frame 内のイベントかチェック
    const frame = e.target.closest('.sw-frame');
    if (!frame) return;   // メインビューのイベントは通過させる

    const id  = frame.dataset.swId;
    const win = this.#windows.get(id);
    if (!win) return;

    // フォーカス（最前面）
    Store.dispatch(Actions.subwin.focus(id));

    // リサイズハンドル
    if (e.target.closest('[data-sw-resize]')) {
      e.preventDefault();
      e.stopPropagation();
      const rect = frame.getBoundingClientRect();
      this.#startDrag(e, 'resize', win, rect.left, rect.top, rect.width, rect.height);
      return;
    }

    // ヘッダー（移動）
    if (e.target.closest('[data-sw-drag]')) {
      e.preventDefault();
      e.stopPropagation();
      const rect = frame.getBoundingClientRect();
      const ca   = this.#container.getBoundingClientRect();
      this.#startDrag(e, 'move', win,
        rect.left - ca.left, rect.top - ca.top,
        rect.width, rect.height);
      return;
    }

    // sw-body — スクロール(パン)の開始
    if (e.target.closest('.sw-body')) {
      e.preventDefault();
      e.stopPropagation();   // メインビューへのバブリングを止める
      // win.panX/panY は SubWindow の public getter（プライベートフィールド直接参照を排除）
      this.#startDrag(e, 'pan', win, win.panX, win.panY, 0, 0);
    }
  }

  /** ドラッグ開始: 一時的なドキュメントレベルハンドラーを追加 */
  #startDrag(e, type, win, origX, origY, origW, origH) {
    this.#dragState = {
      type, win,
      pointerId: e.pointerId,
      startClientX: e.clientX,
      startClientY: e.clientY,
      origX, origY, origW, origH,
    };

    // ドラッグ中の追跡をドキュメントで行う（frame 外に出ても追跡）
    this.#docMoveFn = ev => this.#onMove(ev);
    this.#docUpFn   = ev => this.#onUp(ev);
    document.addEventListener('pointermove', this.#docMoveFn, { passive: false });
    document.addEventListener('pointerup',   this.#docUpFn,   { passive: true  });
    document.addEventListener('pointercancel', this.#docUpFn, { passive: true  });
  }

  #onMove(e) {
    const ds = this.#dragState;
    if (!ds) return;

    const dx = e.clientX - ds.startClientX;
    const dy = e.clientY - ds.startClientY;

    if (ds.type === 'move') {
      ds.win.setPosition(ds.origX + dx, ds.origY + dy);

    } else if (ds.type === 'resize') {
      ds.win.setSize(ds.origW + dx, ds.origH + dy);

    } else if (ds.type === 'pan') {
      // サブ窓内パン
      const z = ds.win.zoom;
      ds.win.setView(z, ds.origX + dx / z, ds.origY + dy / z);
    }
  }

  #onUp(e) {
    const ds = this.#dragState;
    if (!ds) return;

    // 確定座標を Store に反映
    if (ds.type === 'move' || ds.type === 'resize') {
      const rect = ds.win.el.getBoundingClientRect();
      const ca   = this.#container.getBoundingClientRect();
      Store.dispatch(Actions.subwin.update(ds.win.id, {
        x: rect.left - ca.left,
        y: rect.top  - ca.top,
        w: rect.width,
        h: rect.height,
      }));
    }

    this.#dragState = null;
    this.#removeDocHandlers();
  }

  /** ホイール → サブ窓独立ズーム */
  #onWheel(e) {
    const frame = e.target.closest('.sw-frame');
    if (!frame) return;

    const id  = frame.dataset.swId;
    const win = this.#windows.get(id);
    if (!win) return;

    e.preventDefault();
    e.stopPropagation();

    // deltaY > 0 = ズームアウト、< 0 = ズームイン（delta * 100 は除去済み）
    const newZoom = clamp(win.zoom * (1 - e.deltaY * ZOOM_STEP), ZOOM_MIN, ZOOM_MAX);
    win.setView(newZoom, 0, 0);

    Store.dispatch(Actions.subwin.update(id, { zoom: newZoom }));
  }

  /** ページセレク

  });

  Store.on('ui.loadingMsg', ({ next }) => {
    const span = $('loading')?.querySelector('.loading-msg');
    if (span) span.textContent = next || '処理中…';
  });

  Store.on('document.list', () => _renderDocList());

  Store.on('ui.isSaving', ({ next }) => {
    $('btn-save')?.classList.toggle('saving', next);
  });

  /* DocumentStore フィールドは isDirty（dirty ではない） */
  Store.on('document.isDirty', ({ next }) => {
    const lbl  = $('fnlbl');
    const name = Store.get('document.name') ?? '';
    if (lbl) lbl.textContent = name ? (next ? `* ${name}` : name) : 'ファイル未選択';
  });
  Store.on('document.name', ({ next }) => {
    const lbl   = $('fnlbl');
    const dirty = Store.get('document.isDirty');
    if (lbl) lbl.textContent = next ? (dirty ? `* ${next}` : next) : 'ファイル未選択';
  });

  Store.on('view.currentPage', ({ next }) => {
    const pgn = $('pgn');
    if (pgn) pgn.value = next;
  });
  Store.on('document.pageCount', ({ next }) => {
    const tpn = $('tpn');
    if (tpn) tpn.textContent = next;
  });
}

/* ============================================================ ツール有効/無効 */
function _setViewerToolsEnabled(enabled) {
  ['btn-undo','btn-save','btn-backup','t-pen','t-hl','t-shape','t-text',
   't-eraser','t-select','t-sub','btn-prev','btn-next','pgn','btn-fit','sz-v',
  ].forEach(id => { const el = $(id); if (el) el.disabled = !enabled; });
}

/* ============================================================ ドキュメント一覧 */
function _renderDocList() {
  const list      = Store.get('document.list') ?? [];
  const container = $('home-list');
  const empty     = $('home-empty');
  if (!container) return;
  container.innerHTML = '';
  if (!list.length) { empty?.classList.add('visible'); return; }
  empty?.classList.remove('visible');
  for (const doc of list) {
    const card = document.createElement('div');
    card.className     = 'home-card';
    card.dataset.docId = doc.id;
    card.innerHTML = `
      <div class="home-card-icon">📄</div>
      <div class="home-card-name">${_esc(doc.name)}</div>
      <div class="home-card-date">${_fmtDate(doc.updatedAt)}</div>
      <button class="home-card-del" data-id="${_esc(doc.id)}" title="削除">✕</button>`;
    card.addEventListener('pointerup', e => {
      if (e.target.classList.contains('home-card-del')) return;
      showToast('PDFファイルを再度開いてください');
    });
    card.querySelector('.home-card-del')?.addEventListener('pointerup', e => {
      e.stopPropagation();
      Store.dispatch(Actions.document.listRemove(doc.id));
      showToast('削除しました');
    });
    container.appendChild(card);
  }
}

/* ============================================================ グローバル配線 */
function _wireGlobal() {
  const fileInput = $('fileInput');
  fileInput?.addEventListener('change', e => {
    const f = e.target.files?.[0];
    if (f) _handleFileSelect(f);
    fileInput.value = '';
  });
  const ca = $('ca');
  ca?.addEventListener('dragover', e => e.preventDefault());
  ca?.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer?.files?.[0];
    if (f?.type === 'application/pdf') _handleFileSelect(f);
  });
  document.body.addEventListener('dragover', e => e.preventDefault());
  document.body.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer?.files?.[0];
    if (f?.type === 'application/pdf') _handleFileSelect(f);
  });
}

/* ============================================================ ホーム配線 */
function _wireHome() {
  $('btn-home')?.addEventListener('pointerup', () => {
    Store.dispatch(Actions.ui.setScreen(SCREEN.HOME));
  });

  $('btn-close')?.addEventListener('pointerup', async () => {
    if (Store.get('document.isDirty')) await SaveManager.saveNow();
    _closeDoc();
  });

  ['home-open', 'dz-open'].forEach(id => {
    $(id)?.addEventListener('pointerup', () => $('fileInput')?.click());
  });

  const restoreInput = $('restoreInput');
  $('btn-restore')?.addEventListener('pointerup', () => restoreInput?.click());
  restoreInput?.addEventListener('change', async e => {
    const f = e.target.files?.[0];
    restoreInput.value = '';
    if (!f) return;
    try {
      const text   = await f.text();
      const record = JSON.parse(text);
      if (!record.docId || !record.pages) { showToast('復元ファイルが不正です'); return; }
      showLoading('復元中…');
      Store.dispatch(Actions.document.load({
        id: record.docId, name: record.docName ?? record.docId,
        pageCount: record.pageCount ?? 0, fileSize: record.fileSize ?? 0,
      }));
      /* annotation.load(data) は data を直接受け取る */
      Store.dispatch(Actions.annotation.load(record.pages));
      hideLoading();
      showToast(`「${record.docName ?? record.docId}」を復元しました`);
    } catch (err) {
      hideLoading();
      showToast('復元失敗: ' + err.message);
    }
  });

  $('btn-backup')?.addEventListener('pointerup', () => {
    const ok = SaveManager.downloadBackup();
    if (!ok) showToast('バックアップ対象のドキュメントがありません');
  });

  $('btn-save')?.addEventListener('pointerup', async () => {
    if (!Store.get('document.id')) { showToast('ドキュメントが開かれていません'); return; }
    showToast('保存中…');
    const ok = await SaveManager.saveNow();
    showToast(ok ? '保存しました' : '保存に失敗しました');
  });
}

/* ============================================================ 計算機配線 */
function _wireCalc() {
  const calcEl = $('calc');
  if (!calcEl) return;
  $('calcbtn')?.addEventListener('pointerup', () => calcEl.classList.toggle('on'));
  $('calc-close')?.addEventListener('pointerup', () => calcEl.classList.remove('on'));
  const tb = $('calc-tb');
  if (tb) _makeDraggable(calcEl, tb);

  let _expr = '', _val = '0';
  const _updDisp = () => {
    const e = $('calc-expr'), v = $('calc-val');
    if (e) e.textContent = _expr;
    if (v) v.textContent = _val;
  };
  const _dec = () => parseInt($('calc-dec')?.value ?? '1', 10);

  calcEl.querySelector('#calc-btns')?.addEventListener('pointerup', ev => {
    const btn = ev.target.closest('button');
    if (!btn) return;
    const num = btn.dataset.cnum, op = btn.dataset.cop, fn = btn.dataset.cfn;
    if (num !== undefined) {
      _val = (_val === '0' && num !== '.') ? num : _val + num;
    } else if (op) {
      _expr = (_expr ? _expr + ' ' + _val : _val) + ' ' + op; _val = '0';
    } else if (fn === 'C')  { _expr = ''; _val = '0'; }
    else if (fn === 'bs')   { _val = _val.length > 1 ? _val.slice(0, -1) : '0'; }
    else if (fn === 'pm')   { _val = _val.startsWith('-') ? _val.slice(1) : '-' + _val; }
    else if (fn === 'pct')  { _val = String(parseFloat(_val) / 100); }
    else if (fn === 'sqrt') { _val = String(+Math.sqrt(parseFloat(_val)).toFixed(_dec())); }
    else if (fn === 'sq')   { _val = String(+(parseFloat(_val) ** 2).toFixed(_dec())); }
    else if (fn === 'eq') {
      try {
        // eslint-disable-next-line no-new-func
        const res     = new Function('return ' + _expr + ' ' + _val)();
        const rounded = +parseFloat(res).toFixed(_dec());
        const hist = $('calc-hist');
        if (hist) {
          const row = document.createElement('div');
          row.className   = 'calc-hist-row';
          row.textContent = `${_expr} ${_val} = ${rounded}`;
          hist.prepend(row);
          if (hist.children.length > 20) hist.lastChild?.remove();
        }
        _val = String(rounded); _expr = '';
      } catch { _val = 'Error'; _expr = ''; }
    }
    _updDisp();
  });
}

/* ============================================================ ファイル処理 */
async function _handleFileSelect(file) {
  if (!file || file.type !== 'application/pdf') {
    showToast('PDFファイルを選択してください'); return;
  }
  showLoading('PDF を読み込み中…');
  try {
    const { pageCount, fileName } = await Loader.load(file);
    Store.dispatch(Actions.document.load({ id: fileName, name: fileName, pageCount, fileSize: file.size }));
    const page1 = await Loader.getPage(1);
    const vp1   = page1.getViewport({ scale: 1 });
    setPdfPageSize(vp1.width, vp1.height);
    const { viewportWidth: vpW, viewportHeight: vpH } = Store.state.view;
    const fitZoom = calcFitZoom(vp1.width, vp1.height, vpW, vpH);
    const { panX, panY } = calcCenterPan(vp1.width, vp1.height, vpW, vpH, fitZoom);
    Store.dispatch(Actions.view.setPage(1));
    Store.dispatch(Actions.view.setZoom(fitZoom));
    Store.dispatch(Actions.view.setPan(panX, panY));
    Store.dispatch(Actions.document.listAdd({ id: fileName, name: fileName, updatedAt: Date.now() }));
    hideLoading();
    showToast(`${fileName} を開きました（${pageCount}ページ）`);
    SaveManager.saveNow().catch(() => {});
  } catch (e) {
    hideLoading();
    showToast(`読み込み失敗: ${e.message}`);
    console.error('[App] PDF load error:', e);
  }
}

/* ============================================================ ドキュメントクローズ */
function _closeDoc() {
  Store.dispatch(Actions.document.close());
  Store.dispatch(Actions.annotation.clearAll());
  Store.dispatch(Actions.subwin.removeAll());
  Loader.destroy().catch(() => {});
  PdfRdr.destroy();
  destroyPdfGesture();
  annCanvas.clearAnn();
  annCanvas.clearOvl();
  undoStack.clear();
  subWinMgr.removeAll();
  _canvasReady = false;   // 次回ドキュメント開時に再初期化
}

/* ============================================================ Canvas 初期化 */
let _canvasReady = false;
function _initCanvases() {
  if (_canvasReady) return;
  _canvasReady = true;
  const pdfCanvas = $('pdf-canvas');
  const annCvs    = $('ann-canvas');
  const ovlCanvas = $('ovl-canvas');
  if (!pdfCanvas || !annCvs || !ovlCanvas) return;
  PdfRdr.init(pdfCanvas);
  router.attach(ovlCanvas);
  initPdfGesture();
  annCanvas.init(annCvs, ovlCanvas);
  toolHandler.init();
  subWinMgr.init($('ca'));
  const ca = $('ca');
  if (ca) {
    const { width, height } = ca.getBoundingClientRect();
    PdfRdr.resize(width, height);
    Store.dispatch(Actions.view.setViewport(width, height));
  }
}

/* ============================================================ Store → PdfRenderer */
function _bindPdfToStore() {
  Store.on('view.currentPage', async ({ next }) => {
    if (!Loader.isLoaded) return;
    PdfRdr.setPage(next);
    const strokes = selectStrokes(Store.state.annotation, next);
    annCanvas.fullRedraw(strokes);
    undoStack.clear();
    try {
      const page = await Loader.getPage(next);
      const vp   = page.getViewport({ scale: 1 });
      setPdfPageSize(vp.width, vp.height);
    } catch (_) {}
  });

  /* Phase 9: ページが変わっていない場合のみ onViewChange（二重 fullRedraw 防止） */
  Store.on('view', ({ next, prev }) => {
    PdfRdr.setView(next.zoom, next.panX, next.panY);
    if (!prev || next.currentPage === prev.currentPage) {
      const strokes = selectStrokes(Store.state.annotation, next.currentPage);
      annCanvas.onViewChange(next.zoom, next.panX, next.panY, strokes);
    }
  });
}

/* ============================================================ ページナビ */
function _wirePageNav() {
  $('btn-prev')?.addEventListener('pointerup', () => {
    const { currentPage } = Store.state.view;
    if (currentPage > 1) Store.dispatch(Actions.view.setPage(currentPage - 1));
  });
  $('btn-next')?.addEventListener('pointerup', () => {
    const { currentPage } = Store.state.view;
    const total = Store.get('document.pageCount');
    if (currentPage < total) Store.dispatch(Actions.view.setPage(currentPage + 1));
  });
  $('pgn')?.addEventListener('change', e => {
    const total = Store.get('document.pageCount');
    const p = clamp(parseInt(e.target.value, 10) || 1, 1, total || 1);
    Store.dispatch(Actions.view.setPage(p));
    e.target.value = p;
  });
}

/* ============================================================ ズーム操作 */
function _wireZoomControls() {
  $('btn-fit')?.addEventListener('pointerup', async () => {
    if (!Loader.isLoaded) return;
    try {
      const page = await Loader.getPage(Store.get('view.currentPage') || 1);
      const pv   = page.getViewport({ scale: 1 });
      const { viewportWidth: vpW, viewportHeight: vpH } = Store.state.view;
      const fitZoom = calcFitZoom(pv.width, pv.height, vpW, vpH);
      const { panX, panY } = calcCenterPan(pv.width, pv.height, vpW, vpH, fitZoom);
      Store.dispatch(Actions.view.setZoom(fitZoom));
      Store.dispatch(Actions.view.setPan(panX, panY));
    } catch (_) {}
  });

  Store.on('view.zoom', ({ next }) => {
    const el = $('zlbl');
    if (el) el.textContent = `${Math.round(next * 100)}%`;
  });
}

/* ============================================================ 注釈ツール配線 */
function _wireAnnotationTools() {
  /* Undo */
  $('btn-undo')?.addEventListener('pointerup', () => toolHandler.undo());

  /* サブ窓 */
  $('t-sub')?.addEventListener('pointerup', () => {
    if (!Store.get('document.id')) return;
    const id = subWinMgr.add();
    if (!id) showToast(`サブ窓は最大 ${LIMITS.MAX_SUBWIN} 枚まで`);
  });

  /* ツール選択ボタン */
  const TOOL_BTN_MAP = [
    { id: 't-pen',    tool: TOOL.PEN    },
    { id: 't-hl',     tool: TOOL.HL     },
    { id: 't-shape',  tool: TOOL.SHAPE  },
    { id: 't-text',   tool: TOOL.TEXT   },
    { id: 't-eraser', tool: TOOL.ERASER },
    { id: 't-select', tool: TOOL.SELECT },
  ];
  TOOL_BTN_MAP.forEach(({ id, tool }) => {
    $(id)?.addEventListener('pointerup', () => Store.dispatch(Actions.tool.select(tool)));
  });
  Store.on('tool.currentTool', ({ next }) => {
    TOOL_BTN_MAP.forEach(({ id, tool }) => $(id)?.classList.toggle('on', tool === next));
    _updateSzDisplay(next);
  });

  /* 図形種別 */
  $('shapepop')?.querySelectorAll('[data-shape]').forEach(btn => {
    btn.addEventListener('pointerup', () => {
      Store.dispatch(Actions.tool.setShape(btn.dataset.shape));
      Store.dispatch(Actions.tool.select(TOOL.SHAPE));
      $('shapepop')?.classList.remove('open');
    });
  });
  $('t-shape')?.addEventListener('pointerup', () => $('shapepop')?.classList.toggle('open'));
  Store.on('tool.currentShape', ({ next }) => {
    $('shapepop')?.querySelectorAll('[data-shape]').forEach(btn => {
      btn.classList.toggle('on', btn.dataset.shape === next);
    });
  });

  /* 選択モード */
  $('selpop')?.querySelectorAll('[data-selmode]').forEach(btn => {
    btn.addEventListener('pointerup', () => {
      Store.dispatch(Actions.tool.setSelMode(btn.dataset.selmode));
      $('selpop')?.classList.remove('open');
    });
  });
  $('t-select')?.addEventListener('pointerup', () => $('selpop')?.classList.toggle('open'));

  /* カラースウォッチ — Actions.tool.setPenColor / setHlColor（Idx は不要） */
  for (let i = 0; i < 4; i++) {
    $(`sw${i}`)?.addEventListener('pointerup', () => {
      const tool = Store.state.tool.currentTool;
      Store.dispatch(tool === TOOL.HL
        ? Actions.tool.setHlColor(i)
        : Actions.tool.setPenColor(i));
    });
  }
  Store.on('tool.penColorIdx', ({ next }) => {
    if (Store.state.tool.currentTool !== TOOL.HL) _updateSwatchActive(next);
  });
  Store.on('tool.hlColorIdx', ({ next }) => {
    if (Store.state.tool.currentTool === TOOL.HL) _updateSwatchActive(next);
  });
  Store.on('tool.currentTool', ({ next }) => {
    const idx = next === TOOL.HL ? Store.state.tool.hlColorIdx : Store.state.tool.penColorIdx;
    _updateSwatchActive(idx);
  });

  /* 太さパネル */
  $('sz-v')?.addEventListener('pointerup', () => {
    const szp = $('szp');
    if (!szp) return;
    const isOpen = szp.classList.toggle('on');
    if (isOpen) {
      const tool    = Store.state.tool.currentTool;
      const toolKey = _sizeKey(tool);
      const cur     = Store.state.tool.sizes?.[toolKey] ?? TOOL_DEFAULT_SIZES[toolKey] ?? 3;
      _setSzPanel(toolKey, cur);
    }
  });
  $('szp-cancel')?.addEventListener('pointerup', () => $('szp')?.classList.remove('on'));
  $('szp-ok')?.addEventListener('pointerup', () => {
    const tool    = Store.state.tool.currentTool;
    const toolKey = _sizeKey(tool);
    const val     = clamp(parseInt($('sz-n')?.value ?? '3', 10), 1, 40);
    Store.dispatch(Actions.tool.setSize(toolKey, val));
    $('szp')?.classList.remove('on');
  });
  $('sz-rng')?.addEventListener('input', e => {
    const v = parseInt(e.target.value, 10);
    const n = $('sz-n'); if (n) n.value = v;
    _drawSzPreview(v);
  });
  $('sz-n')?.addEventListener('input', e => {
    const v = clamp(parseInt(e.target.value, 10) || 1, 1, 40);
    const r = $('sz-rng'); if (r) r.value = v;
    _drawSzPreview(v);
  });
  Store.on('tool.sizes', () => _updateSzDisplay(Store.state.tool.currentTool));
}

/* ============================================================ ResizeObserver */
function _initResizeObserver() {
  const ca = $('ca');
  if (!ca || !('ResizeObserver' in window)) return;
  let _roTid = null;
  const ro = new ResizeObserver(entries => {
    for (const entry of entries) {
      const { width, height } = entry.contentRect;
      if (width <= 0 || height <= 0) continue;
      PdfRdr.resize(width, height);
      Store.dispatch(Actions.view.setViewport(width, height));
      const dpr = Math.min(window.devicePixelRatio || 1, LIMITS.MAX_DPR);
      const pw = Math.round(width * dpr), ph = Math.round(height * dpr);
      const annCvs = $('ann-canvas'), ovlCvs = $('ovl-canvas');
      if (annCvs) { annCvs.width = pw; annCvs.height = ph; }
      if (ovlCvs) { ovlCvs.width = pw; ovlCvs.height = ph; }
      clearTimeout(_roTid);
      _roTid = setTimeout(() => {
        if (!_canvasReady) return;
        const page    = Store.state.view.currentPage;
        const strokes = selectStrokes(Store.state.annotation, page);
        if (strokes.length > 0) annCanvas.fullRedraw(strokes);
      }, 150);
    }
  });
  ro.observe(ca);
}

/* ============================================================ ユーティリティ */
function _sizeKey(tool) {
  return tool === TOOL.SHAPE ? Store.state.tool.currentShape : tool;
}
function _updateSzDisplay(tool) {
  const toolKey = _sizeKey(tool);
  const sz = Store.state.tool.sizes?.[toolKey] ?? TOOL_DEFAULT_SIZES[toolKey] ?? 3;
  const el = $('sz-v'); if (el) el.textContent = sz;
}
function _updateSwatchActive(idx) {
  for (let i = 0; i < 4; i++) $(`sw${i}`)?.classList.toggle('on', i === idx);
}
function _setSzPanel(toolKey, val) {
  const r = $('sz-rng'), n = $('sz-n'), title = $('szp-title');
  const labels = { pen:'ペンの太さ', hl:'蛍光ペンの太さ', eraser:'消しゴムの太さ',
                   arrow:'矢印の太さ', rect:'四角の太さ', circle:'円の太さ',
                   line:'直線の太さ', text:'文字サイズ' };
  if (title) title.textContent = labels[toolKey] ?? '太さ';
  if (r) r.value = val; if (n) n.value = val;
  _drawSzPreview(val);
}
function _drawSzPreview(size) {
  const cvs = $('szp-cvs'); if (!cvs) return;
  const ctx = cvs.getContext('2d');
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  const tool  = Store.state.tool.currentTool;
  const color = tool === TOOL.HL
    ? (HL_COLORS[Store.state.tool.hlColorIdx]   ?? HL_COLORS[0])
    : (PEN_COLORS[Store.state.tool.penColorIdx] ?? PEN_COLORS[0]);
  ctx.strokeStyle = color; ctx.lineWidth = size;
  ctx.lineCap = 'round'; ctx.globalAlpha = tool === TOOL.HL ? 0.5 : 0.9;
  ctx.beginPath();
  ctx.moveTo(20, cvs.height / 2); ctx.lineTo(cvs.width - 20, cvs.height / 2);
  ctx.stroke();
}
function _makeDraggable(el, handle) {
  let startX = 0, startY = 0, ox = 0, oy = 0;
  const onMove = e => {
    if (e.cancelable) e.preventDefault();
    const dx = e.clientX - startX, dy = e.clientY - startY;
    el.style.left = `${ox + dx}px`; el.style.top = `${oy + dy}px`;
    el.style.bottom = 'auto'; el.style.right = 'auto';
  };
  const onEnd = () => {
    document.removeEventListener('pointermove',   onMove);
    document.removeEventListener('pointerup',     onEnd);
    document.removeEventListener('pointercancel', onEnd);
  };
  handle.addEventListener('pointerdown', e => {
    startX = e.clientX; startY = e.clientY;
    const r = el.getBoundingClientRect(); ox = r.left; oy = r.top;
    document.addEventListener('pointermove',   onMove, { passive: false });
    document.addEventListener('pointerup',     onEnd,  { passive: true  });
    document.addEventListener('pointercancel', onEnd,  { passive: true  });
  });
}
function _esc(s) {
  return String(s).replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function _fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/* ============================================================ エントリポイント */
document.addEventListener('DOMContentLoaded', () => {
  init().catch(e => console.error('[App] init error:', e));
});
