<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PDF図面注釈 v1</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;
  --accent:#e94560;--accent2:#533483;
  --text:#eaeaea;--text2:#a0a0b0;
  --tool-h:56px;--tab-h:36px;--sidebar-w:220px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;width:100%;height:100%;position:relative}
#toolbar{display:flex;align-items:center;gap:4px;height:var(--tool-h);background:var(--surface);padding:0 8px;border-bottom:1px solid #333;flex-shrink:0;z-index:100;overflow-x:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.tb-group{display:flex;align-items:center;gap:2px;flex-shrink:0}
.tb-sep{width:1px;height:32px;background:#333;margin:0 4px;flex-shrink:0}
.tb-btn{display:flex;align-items:center;justify-content:center;min-width:40px;height:40px;border-radius:8px;border:none;background:transparent;color:var(--text);font-size:18px;cursor:pointer;transition:background .15s;flex-shrink:0;padding:0 6px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tb-btn:active{background:var(--surface2)}
.tb-btn.active{background:var(--accent);color:#fff}
.tb-btn.disabled{opacity:.35;pointer-events:none}
#color-dot{width:24px;height:24px;border-radius:50%;border:2px solid #555;cursor:pointer;flex-shrink:0}
#color-input{position:absolute;opacity:0;width:0;height:0}
#size-slider{width:70px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
#opacity-slider{width:60px;accent-color:var(--accent2);cursor:pointer;flex-shrink:0}
#tab-bar{display:flex;align-items:center;height:var(--tab-h);background:var(--bg);border-bottom:1px solid #222;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#tab-bar::-webkit-scrollbar{display:none}
#tab-list{display:flex;height:100%}
.tab-item{display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;border-right:1px solid #222;font-size:12px;white-space:nowrap;cursor:pointer;min-width:120px;max-width:200px;flex-shrink:0;transition:background .15s}
.tab-item.active{background:var(--surface);color:var(--text)}
.tab-item:not(.active){color:var(--text2)}
.tab-name{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab-close{font-size:14px;color:var(--text2);padding:2px;border-radius:3px}
#tab-add{padding:0 14px;color:var(--text2);font-size:20px;cursor:pointer;flex-shrink:0;line-height:var(--tab-h)}
#workspace{display:flex;flex:1;overflow:hidden;position:relative}
#main-pane{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
#canvas-scroll{flex:1;overflow:auto;position:relative;background:#2a2a2a;scrollbar-width:thin;scrollbar-color:#444 transparent}
#canvas-scroll::-webkit-scrollbar{width:8px;height:8px}
#canvas-scroll::-webkit-scrollbar-thumb{background:#444;border-radius:4px}
#canvas-wrap{position:relative;display:inline-block;min-width:100%;min-height:100%}
#canvas-wrap canvas{position:absolute;top:0;left:0}
#pdf-canvas{z-index:1}
#annot-canvas{z-index:2}
#draw-canvas{z-index:3}
#ui-canvas{z-index:4;touch-action:none}
#page-nav{display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--surface);border-top:1px solid #222;font-size:12px;flex-shrink:0}
#page-info{color:var(--text2)}
#zoom-info{color:var(--text2);min-width:50px;text-align:center}
#sidebar{width:var(--sidebar-w);background:var(--surface);border-left:1px solid #222;display:flex;flex-direction:column;overflow:hidden;transition:width .2s;flex-shrink:0}
#sidebar.hidden{width:0;border:none}
#sidebar-tabs{display:flex;border-bottom:1px solid #222;flex-shrink:0}
.stab{flex:1;text-align:center;padding:8px 0;font-size:12px;cursor:pointer;color:var(--text2)}
.stab.active{color:var(--accent);border-bottom:2px solid var(--accent)}
#sidebar-content{flex:1;overflow-y:auto;padding:8px;scrollbar-width:thin}
.thumb-item{width:100%;aspect-ratio:1/1.414;background:#333;border-radius:4px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden;border:2px solid transparent;transition:border-color .15s}
.thumb-item.active{border-color:var(--accent)}
.thumb-item canvas{width:100%;height:100%;object-fit:contain;display:block}
.thumb-num{position:absolute;bottom:2px;right:4px;font-size:10px;color:#fff;background:rgba(0,0,0,.6);padding:1px 4px;border-radius:3px}
.recent-item{padding:8px;border-radius:6px;cursor:pointer;margin-bottom:4px;border:1px solid #333;font-size:12px;transition:background .15s}
.recent-item:active{background:var(--surface2)}
.recent-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.recent-date{font-size:10px;color:var(--text2);margin-top:2px}
#sub-pane{width:0;border-left:2px solid var(--accent2);overflow:hidden;transition:width .2s;display:flex;flex-direction:column;background:var(--bg);flex-shrink:0}
#sub-pane.visible{width:45%;min-width:280px}
#sub-header{display:flex;align-items:center;padding:4px 8px;background:var(--surface);border-bottom:1px solid #222;gap:6px;flex-shrink:0}
#sub-title{flex:1;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sub-scroll{flex:1;overflow:auto;background:#2a2a2a}
#sub-wrap{position:relative;display:inline-block}
#sub-wrap canvas{position:absolute;top:0;left:0}
#sub-pdf-canvas{z-index:1}
#sub-annot-canvas{z-index:2}
#sub-page-info{font-size:11px;color:var(--text2);white-space:nowrap}
#drop-overlay{position:fixed;inset:0;background:rgba(233,69,96,.15);border:3px dashed var(--accent);z-index:9999;display:none;align-items:center;justify-content:center;font-size:24px;color:var(--accent);pointer-events:none}
#drop-overlay.show{display:flex}
#loading{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#loading.show{display:flex}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{color:var(--text);font-size:14px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,20,40,.95);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;z-index:9997;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;border:1px solid #333}
#toast.show{opacity:1}
#color-popup{position:fixed;background:var(--surface);border:1px solid #333;border-radius:10px;padding:10px;z-index:500;display:none;grid-template-columns:repeat(6,30px);gap:6px;box-shadow:0 4px 20px rgba(0,0,0,.6)}
#color-popup.show{display:grid}
.cp-color{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.cp-color.selected{border-color:#fff;transform:scale(1.2)}
#text-overlay{position:fixed;z-index:600;display:none;background:rgba(0,0,0,.85);padding:4px 6px;border-radius:6px;border:1px solid var(--accent)}
#text-overlay.show{display:block}
#text-input{background:transparent;border:none;color:var(--text);font-size:16px;outline:none;resize:none;min-width:150px;min-height:32px;line-height:1.4}
#ver-badge{font-size:10px;color:var(--text2);opacity:.4;flex-shrink:0;padding:0 6px;margin-left:auto}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="tb-group">
      <button class="tb-btn" id="btn-open" title="PDF開く">📂</button>
      <button class="tb-btn" id="btn-save-pdf" title="注釈付きPDF出力">📄</button>
      <button class="tb-btn" id="btn-backup" title="バックアップZIP">💾</button>
      <button class="tb-btn" id="btn-restore" title="ZIPから復元">♻️</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tb-btn disabled" id="btn-undo" title="Undo (取消)">↩️</button>
      <button class="tb-btn disabled" id="btn-redo" title="Redo (やり直し)">↪️</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tb-btn active" id="tool-pen" title="ペン">✏️</button>
      <button class="tb-btn" id="tool-highlight" title="蛍光ペン">🖊️</button>
      <button class="tb-btn" id="tool-eraser" title="消しゴム">🧹</button>
      <button class="tb-btn" id="tool-line" title="直線">╱</button>
      <button class="tb-btn" id="tool-rect" title="矩形">▭</button>
      <button class="tb-btn" id="tool-circle" title="円">○</button>
      <button class="tb-btn" id="tool-text" title="テキスト">T</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <div id="color-dot" title="色選択"></div>
      <input type="color" id="color-input" value="#e94560">
      <input type="range" id="size-slider" min="1" max="40" value="3" title="サイズ">
      <input type="range" id="opacity-slider" min="10" max="100" value="100" title="不透明度">
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tb-btn" id="btn-sidebar" title="サイドバー">📋</button>
      <button class="tb-btn" id="btn-subwin" title="サブ窓 Split View">⊟</button>
    </div>
    <span id="ver-badge">v1</span>
    <input type="file" id="file-input" accept=".pdf" style="display:none">
    <input type="file" id="restore-input" accept=".zip" style="display:none">
  </div>

  <div id="tab-bar">
    <div id="tab-list"></div>
    <div id="tab-add" title="新しいPDFを開く">＋</div>
  </div>

  <div id="workspace">
    <div id="main-pane">
      <div id="canvas-scroll">
        <div id="canvas-wrap">
          <canvas id="pdf-canvas"></canvas>
          <canvas id="annot-canvas"></canvas>
          <canvas id="draw-canvas"></canvas>
          <canvas id="ui-canvas"></canvas>
        </div>
      </div>
      <div id="page-nav">
        <button class="tb-btn" id="btn-prev" style="min-width:36px;height:36px;font-size:14px">◀</button>
        <span id="page-info">- / -</span>
        <button class="tb-btn" id="btn-next" style="min-width:36px;height:36px;font-size:14px">▶</button>
        <div style="flex:1"></div>
        <button class="tb-btn" id="btn-zoom-out" style="font-size:14px">🔍−</button>
        <span id="zoom-info">100%</span>
        <button class="tb-btn" id="btn-zoom-in" style="font-size:14px">🔍+</button>
        <button class="tb-btn" id="btn-zoom-fit" title="フィット">⊡</button>
      </div>
    </div>

    <div id="sub-pane">
      <div id="sub-header">
        <span id="sub-title">サブ窓</span>
        <button class="tb-btn" id="sub-btn-prev" style="min-width:28px;height:28px;font-size:13px">◀</button>
        <span id="sub-page-info">-/-</span>
        <button class="tb-btn" id="sub-btn-next" style="min-width:28px;height:28px;font-size:13px">▶</button>
        <button class="tb-btn" id="sub-btn-close" style="min-width:28px;height:28px;font-size:13px">✕</button>
      </div>
      <div id="sub-scroll">
        <div id="sub-wrap">
          <canvas id="sub-pdf-canvas"></canvas>
          <canvas id="sub-annot-canvas"></canvas>
        </div>
      </div>
    </div>

    <div id="sidebar">
      <div id="sidebar-tabs">
        <div class="stab active" data-tab="thumbs">サムネ</div>
        <div class="stab" data-tab="recent">履歴</div>
      </div>
      <div id="sidebar-content"></div>
    </div>
  </div>
</div>

<div id="drop-overlay">📄 PDFをここにドロップ</div>
<div id="loading"><div class="spinner"></div><div id="loading-msg">読み込み中...</div></div>
<div id="toast"></div>
<div id="color-popup"></div>
<div id="text-overlay"><textarea id="text-input" rows="2" placeholder="テキストを入力… (Escで閉じる)"></textarea></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';
// ================================================================
// APP NAMESPACE
// ================================================================
const APP = Object.create(null);

// ================================================================
// EVENTBUS
// ================================================================
APP.EventBus = (()=>{
  const _m=new Map();
  return {
    on(ev,fn){if(!_m.has(ev))_m.set(ev,[]);_m.get(ev).push(fn)},
    off(ev,fn){if(_m.has(ev))_m.set(ev,_m.get(ev).filter(f=>f!==fn))},
    emit(ev,d){if(!_m.has(ev))return;for(const f of _m.get(ev)){try{f(d)}catch(e){console.error('[EB]',ev,e)}}},
    once(ev,fn){const w=(d)=>{fn(d);this.off(ev,w)};this.on(ev,w)}
  };
})();

// ================================================================
// UTILS
// ================================================================
APP.Utils = (()=>{
  let _tt=null;
  return {
    uid:()=>`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
    clone:(o)=>JSON.parse(JSON.stringify(o)),
    dateStr:(d=new Date())=>`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,
    toast(msg,dur=2500){
      const el=document.getElementById('toast');
      el.textContent=msg;el.classList.add('show');
      clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),dur);
    },
    loading(show,msg='処理中...'){
      document.getElementById('loading-msg').textContent=msg;
      document.getElementById('loading').classList.toggle('show',show);
    },
    debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}},
    rafThrottle(fn){let p=false;return(...a)=>{if(p)return;p=true;requestAnimationFrame(()=>{fn(...a);p=false})}},
    hexToRgba(hex,a=1){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}
  };
})();

// ================================================================
// STATE
// ================================================================
APP.State = (()=>{
  let _s={
    tool:'pen',color:'#e94560',size:3,opacity:1.0,
    activeTabId:null,tabs:[],
    sidebarOpen:true,sidebarTab:'thumbs',
    subWinOpen:false,
    recentFiles:[]
  };
  const notify=(keys)=>APP.EventBus.emit('state:changed',{keys,state:get()});
  function get(){return Object.freeze(APP.Utils.clone(_s))}
  function set(patch){
    const ch=[];
    for(const[k,v]of Object.entries(patch)){
      if(JSON.stringify(_s[k])!==JSON.stringify(v)){_s[k]=v;ch.push(k)}
    }
    if(ch.length)notify(ch);
  }
  function addTab(data){
    const t={id:APP.Utils.uid(),name:'untitled',pdfId:null,pageIndex:0,zoom:1.0,...data};
    _s.tabs=[..._s.tabs,t];_s.activeTabId=t.id;
    notify(['tabs','activeTabId']);return t.id;
  }
  function removeTab(id){
    _s.tabs=_s.tabs.filter(t=>t.id!==id);
    if(_s.activeTabId===id)_s.activeTabId=_s.tabs.length?_s.tabs[_s.tabs.length-1].id:null;
    notify(['tabs','activeTabId']);
  }
  function updateTab(id,patch){
    _s.tabs=_s.tabs.map(t=>t.id===id?{...t,...patch}:t);notify(['tabs']);
  }
  function getTab(id){return _s.tabs.find(t=>t.id===(id||_s.activeTabId))||null}
  function getActive(){return getTab(_s.activeTabId)}
  function addRecent(info){
    _s.recentFiles=[{...info,date:new Date().toISOString()},..._s.recentFiles.filter(r=>r.id!==info.id)].slice(0,20);
    notify(['recentFiles']);
  }
  return{get,set,addTab,removeTab,updateTab,getTab,getActive,addRecent};
})();

// ================================================================
// STORAGE (IndexedDB + Journal)
// ================================================================
APP.Storage = (()=>{
  const DB='FABAnnot_v1',VER=1;
  const ST={pdfs:'pdfs',annots:'annots',journal:'journal',meta:'meta'};
  let _db=null;
  let _pending=new Map(),_saving=false;

  const txDone=(tx)=>new Promise((ok,ng)=>{tx.oncomplete=ok;tx.onerror=()=>ng(tx.error);tx.onabort=()=>ng(new Error('aborted'))});
  const iGet=(store,key)=>new Promise((ok,ng)=>{const r=_db.transaction(store,'readonly').objectStore(store).get(key);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ng(r.error)});
  const iGetAll=(store)=>new Promise((ok,ng)=>{const r=_db.transaction(store,'readonly').objectStore(store).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ng(r.error)});
  const iPut=(store,obj)=>{const tx=_db.transaction(store,'readwrite');tx.objectStore(store).put(obj);return txDone(tx)};

  async function init(){
    return new Promise((ok,ng)=>{
      const req=indexedDB.open(DB,VER);
      req.onupgradeneeded=(e)=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains(ST.pdfs))db.createObjectStore(ST.pdfs,{keyPath:'id'});
        if(!db.objectStoreNames.contains(ST.annots))db.createObjectStore(ST.annots,{keyPath:'key'});
        if(!db.objectStoreNames.contains(ST.journal))db.createObjectStore(ST.journal,{keyPath:'id',autoIncrement:true});
        if(!db.objectStoreNames.contains(ST.meta))db.createObjectStore(ST.meta,{keyPath:'key'});
      };
      req.onsuccess=(e)=>{_db=e.target.result;ok()};
      req.onerror=(e)=>ng(e.target.error);
    });
  }

  async function savePDF(id,name,buffer,pageCount){
    await iPut(ST.pdfs,{id,name,buffer,pageCount,savedAt:Date.now()});
    const meta=await iGet(ST.meta,'recent')||{key:'recent',list:[]};
    meta.list=[{id,name,pageCount,date:new Date().toISOString()},...meta.list.filter(r=>r.id!==id)].slice(0,20);
    await iPut(ST.meta,meta);
  }
  async function loadPDF(id){return iGet(ST.pdfs,id)}
  async function listPDFs(){const m=await iGet(ST.meta,'recent');return m?m.list:[]}

  function queueSave(pdfId,page,strokes){
    const k=`${pdfId}_${page}`;
    _pending.set(k,{pdfId,page,strokes:APP.Utils.clone(strokes)});
    _flush();
  }

  async function _flush(){
    if(_saving||!_pending.size)return;
    _saving=true;
    while(_pending.size){
      const entries=[..._pending.entries()];_pending.clear();
      for(const[key,{pdfId,page,strokes}]of entries){
        try{
          const jid=await _jWrite('save',{key});
          await iPut(ST.annots,{key,pdfId,pageIndex:page,strokes,savedAt:Date.now()});
          await _jDone(jid);
          APP.EventBus.emit('storage:saved',{pdfId,page});
        }catch(e){console.error('[Storage]',e);APP.EventBus.emit('storage:error',e)}
      }
    }
    _saving=false;
  }

  async function _jWrite(op,data){
    return new Promise((ok,ng)=>{
      const tx=_db.transaction(ST.journal,'readwrite');
      const req=tx.objectStore(ST.journal).add({op,data,t:Date.now(),done:false});
      req.onsuccess=()=>ok(req.result);req.onerror=()=>ng(req.error);
    });
  }
  async function _jDone(id){
    const tx=_db.transaction(ST.journal,'readwrite');
    const st=tx.objectStore(ST.journal);
    await new Promise(ok=>{const r=st.get(id);r.onsuccess=()=>{if(r.result){r.result.done=true;r.result.doneAt=Date.now();st.put(r.result)}ok()}});
    await txDone(tx);
  }

  async function loadAnnots(pdfId,page){
    const r=await iGet(ST.annots,`${pdfId}_${page}`);return r?r.strokes:[];
  }
  async function loadAllAnnots(pdfId){
    const all=await iGetAll(ST.annots);
    const res={};
    for(const r of all)if(r.pdfId===pdfId)res[r.pageIndex]=r.strokes;
    return res;
  }

  async function backup(){
    const zip=new JSZip();
    const pdfs=await iGetAll(ST.pdfs);
    const annots=await iGetAll(ST.annots);
    for(const p of pdfs)zip.file(`pdfs/${p.id}.pdf`,p.buffer);
    zip.file('annots.json',JSON.stringify(annots));
    zip.file('meta.json',JSON.stringify({pdfs:pdfs.map(p=>({id:p.id,name:p.name,pageCount:p.pageCount,savedAt:p.savedAt})),at:new Date().toISOString()}));
    return zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
  }

  async function restore(buf){
    const zip=await JSZip.loadAsync(buf);
    const mf=zip.file('meta.json');if(!mf)throw new Error('meta.json missing');
    const meta=JSON.parse(await mf.async('string'));
    const af=zip.file('annots.json');
    const annots=af?JSON.parse(await af.async('string')):[];
    for(const info of meta.pdfs){
      const pf=zip.file(`pdfs/${info.id}.pdf`);
      if(pf)await iPut(ST.pdfs,{...info,buffer:await pf.async('arraybuffer')});
    }
    for(const a of annots)await iPut(ST.annots,a);
    await iPut(ST.meta,{key:'recent',list:meta.pdfs.map(p=>({...p,date:new Date(p.savedAt).toISOString()}))});
  }

  async function checkJournal(){
    const all=await iGetAll(ST.journal);
    const incomplete=all.filter(j=>!j.done);
    if(incomplete.length)APP.EventBus.emit('storage:journal-incomplete',{count:incomplete.length});
    if(all.length>40){
      const tx=_db.transaction(ST.journal,'readwrite');
      const st=tx.objectStore(ST.journal);
      const done=all.filter(j=>j.done).slice(0,-20);
      for(const j of done)st.delete(j.id);
      await txDone(tx);
    }
  }

  return{init,savePDF,loadPDF,listPDFs,loadAnnots,loadAllAnnots,queueSave,backup,restore,checkJournal};
})();

APP.History = (()=>{
  const _s=new Map();const MAX=50;
  const key=(a,b)=>`${a}_${b}`;
  const ensure=(a,b)=>{const k=key(a,b);if(!_s.has(k))_s.set(k,{u:[],r:[]});return _s.get(k)};
  function push(pid,pg,strokes){const s=ensure(pid,pg);s.u.push(APP.Utils.clone(strokes));if(s.u.length>MAX)s.u.shift();s.r=[];APP.EventBus.emit('history:changed',{pid,pg})}
  function undo(pid,pg,cur){const s=ensure(pid,pg);if(!s.u.length)return null;s.r.push(APP.Utils.clone(cur));const p=s.u.pop();APP.EventBus.emit('history:changed',{pid,pg});return p}
  function redo(pid,pg,cur){const s=ensure(pid,pg);if(!s.r.length)return null;s.u.push(APP.Utils.clone(cur));const n=s.r.pop();APP.EventBus.emit('history:changed',{pid,pg});return n}
  function canU(pid,pg){return((_s.get(key(pid,pg))||{u:[]}).u.length>0)}
  function canR(pid,pg){return((_s.get(key(pid,pg))||{r:[]}).r.length>0)}
  return{push,undo,redo,canUndo:canU,canRedo:canR};
})();

// ================================================================
// PDF ENGINE
// ================================================================
APP.PDF = (()=>{
  const _docs=new Map(),_tasks=new Map();
  if(typeof pdfjsLib!=='undefined'){
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  async function load(id,buf){
    if(_docs.has(id))return _docs.get(id);
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)),enableXfa:false}).promise;
    _docs.set(id,doc);return doc;
  }
  function getDoc(id){return _docs.get(id)||null}
  function count(id){const d=_docs.get(id);return d?d.numPages:0}
  async function getPage(id,pg){const d=_docs.get(id);if(!d)throw new Error('not loaded');return d.getPage(pg+1)}
  async function render(id,pg,canvas,scale=1.5){
    const tk=`${id}_${pg}`;
    if(_tasks.has(tk)){try{_tasks.get(tk).cancel()}catch(e){}; _tasks.delete(tk)}
    const page=await getPage(id,pg);
    const vp=page.getViewport({scale});
    canvas.width=Math.floor(vp.width);canvas.height=Math.floor(vp.height);
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    const task=page.render({canvasContext:ctx,viewport:vp});
    _tasks.set(tk,task);
    try{await task.promise;_tasks.delete(tk)}
    catch(e){if(e.name!=='RenderingCancelledException')throw e}
    return{w:canvas.width,h:canvas.height};
  }
  async function getSize(id,pg){const p=await getPage(id,pg);const v=p.getViewport({scale:1});return{w:v.width,h:v.height}}
  async function renderThumb(id,pg,canvas,tw=180){
    const sz=await getSize(id,pg);
    return render(id,pg,canvas,tw/sz.w);
  }
  function unload(id){const d=_docs.get(id);if(d){d.destroy();_docs.delete(id)}}
  return{load,getDoc,count,render,getSize,renderThumb,unload};
})();

// ================================================================
// RENDER ENGINE
// ================================================================
APP.Render = (()=>{
  let _L={pdf:null,annot:null,draw:null,ui:null};
  let _strokes=[],_active=null,_dirty=true,_scheduled=false;

  function init(layers){Object.assign(_L,layers)}

  function setStrokes(s){_strokes=s||[];_dirty=true;_sched()}
  function setActive(s){_active=s;_sched()}
  function clearActive(){_active=null;_sched()}

  function _sched(){if(_scheduled)return;_scheduled=true;requestAnimationFrame(_frame)}
  function _frame(){
    _scheduled=false;
    if(_dirty){_drawAnnot();_dirty=false}
    _drawDraw();
  }

  function _drawAnnot(){
    const c=_L.annot;if(!c||!c.width)return;
    const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
    for(const s of _strokes)drawStroke(ctx,s);
  }
  function _drawDraw(){
    const c=_L.draw;if(!c||!c.width)return;
    const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
    if(_active)drawStroke(ctx,_active);
  }

  function drawStroke(ctx,s){
    if(!s)return;
    ctx.save();
    ctx.globalAlpha=s.opacity??1;
    ctx.strokeStyle=s.color||'#e94560';
    ctx.fillStyle=s.color||'#e94560';
    ctx.lineWidth=s.size||2;
    ctx.lineCap='round';ctx.lineJoin='round';
    if(s.type==='pen'||s.type==='highlight'){
      if(s.type==='highlight'){ctx.globalCompositeOperation='multiply';ctx.lineWidth=Math.max(s.size||12,8);ctx.globalAlpha=0.38}
      const p=s.points||[];
      if(p.length===0){ctx.restore();return}
      if(p.length===1){ctx.beginPath();ctx.arc(p[0][0],p[0][1],(s.size||2)/2,0,Math.PI*2);ctx.fill();ctx.restore();return}
      ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);
      for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0],p[i][1],mx,my)}
      ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);ctx.stroke();
    }else if(s.type==='line'){
      const[x1,y1,x2,y2]=s.coords||[0,0,0,0];
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }else if(s.type==='rect'){
      const[x,y,w,h]=s.coords||[0,0,0,0];
      ctx.strokeRect(x,y,w,h);
    }else if(s.type==='circle'){
      const[cx,cy,rx,ry]=s.coords||[0,0,0,0];
      ctx.beginPath();ctx.ellipse(cx,cy,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);ctx.stroke();
    }else if(s.type==='text'){
      ctx.font=`${s.size||16}px -apple-system,sans-serif`;
      ctx.fillStyle=s.color;ctx.globalAlpha=s.opacity??1;
      (s.text||'').split('\n').forEach((ln,i)=>ctx.fillText(ln,s.x||0,(s.y||0)+i*(s.size||16)*1.4));
    }
    ctx.restore();
  }

  function resize(w,h){
    for(const c of Object.values(_L))if(c){c.width=w;c.height=h}
    _dirty=true;_sched();
  }

  function clearUI(){const c=_L.ui;if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
  function drawCursor(x,y,sz,col){
    const c=_L.ui;if(!c)return;
    const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
    ctx.beginPath();ctx.arc(x,y,Math.max(sz/2,4),0,Math.PI*2);
    ctx.strokeStyle=col||'#fff';ctx.lineWidth=1.5;ctx.stroke();
  }

  return{init,setStrokes,setActive,clearActive,resize,clearUI,drawCursor,drawStroke};
})();

// ================================================================
// TOOLS
// ================================================================
APP.Tools = (()=>{
  let _drawing=false,_cur=null,_start=null;
  let _pid=null,_pg=0,_strokes=[],_rscale=1.5;

  function coords(e,c){
    const r=c.getBoundingClientRect();
    return[(e.clientX-r.left)*(c.width/r.width),(e.clientY-r.top)*(c.height/r.height)];
  }

  function setCtx(pid,pg,strokes,rscale){
    _pid=pid;_pg=pg;_strokes=strokes||[];_rscale=rscale||1.5;
    APP.Render.setStrokes(_strokes);
  }
  function getStrokes(){return _strokes}

  function onDown(e,c){
    const st=APP.State.get();
    if(st.tool==='select')return;
    e.preventDefault();
    try{c.setPointerCapture(e.pointerId)}catch(ex){}
    _drawing=true;
    const[x,y]=coords(e,c);_start=[x,y];
    const base={id:APP.Utils.uid(),type:st.tool,color:st.color,size:st.size,opacity:st.opacity};
    if(st.tool==='pen'||st.tool==='highlight'){_cur={...base,points:[[x,y]]}}
    else if(['line','rect','circle'].includes(st.tool)){_cur={...base,coords:[x,y,x,y]}}
    else if(st.tool==='eraser'){_drawing=true;_cur={...base};_erase(x,y);return}
    else if(st.tool==='text'){_drawing=false;APP.EventBus.emit('tools:text',{x,y,canvas:c});return}
    APP.Render.setActive(_cur);
  }

  function onMove(e,c){
    if(!_drawing||!_cur)return;
    e.preventDefault();
    const[x,y]=coords(e,c);
    const st=APP.State.get();
    if(st.tool==='pen'||st.tool==='highlight'){_cur.points.push([x,y])}
    else if(['line','rect','circle'].includes(st.tool)){_cur.coords=[_start[0],_start[1],x,y]}
    else if(st.tool==='eraser'){_erase(x,y);APP.Render.setStrokes(_strokes);return}
    APP.Render.setActive(_cur);
    APP.Render.drawCursor(x,y,st.size,st.color);
  }

  function onUp(e,c){
    if(!_drawing)return;_drawing=false;
    if(!_cur)return;
    const st=APP.State.get();
    if(st.tool!=='eraser'&&_valid(_cur)){
      APP.History.push(_pid,_pg,_strokes);
      _strokes=[..._strokes,_cur];
      APP.Render.setStrokes(_strokes);
      APP.Storage.queueSave(_pid,_pg,_strokes);
    }
    _cur=null;APP.Render.clearActive();APP.Render.clearUI();
  }

  function _valid(s){
    if(!s)return false;
    if(s.type==='pen'||s.type==='highlight')return s.points&&s.points.length>=1;
    if(s.type==='line'){const[x1,y1,x2,y2]=s.coords;return Math.hypot(x2-x1,y2-y1)>2}
    if(s.type==='rect'){const[x1,y1,x2,y2]=s.coords;return Math.abs(x2-x1)>2&&Math.abs(y2-y1)>2}
    if(s.type==='circle'){const[cx,cy,rx,ry]=s.coords;return Math.abs(rx)>2||Math.abs(ry)>2}
    return true;
  }

  function _erase(x,y){
    const R=APP.State.get().size*3;
    const before=_strokes.length;
    _strokes=_strokes.filter(s=>{
      if(s.type==='pen'||s.type==='highlight')return!s.points.some(([px,py])=>Math.hypot(px-x,py-y)<R);
      return true;
    });
    if(_strokes.length!==before){APP.Render.setStrokes(_strokes);APP.Storage.queueSave(_pid,_pg,_strokes)}
  }

  function addText(x,y,text){
    if(!text.trim())return;
    const st=APP.State.get();
    APP.History.push(_pid,_pg,_strokes);
    const s={id:APP.Utils.uid(),type:'text',color:st.color,size:Math.max(st.size*3,14),opacity:st.opacity,x,y,text};
    _strokes=[..._strokes,s];
    APP.Render.setStrokes(_strokes);
    APP.Storage.queueSave(_pid,_pg,_strokes);
  }

  function undo(){
    const p=APP.History.undo(_pid,_pg,_strokes);
    if(p!==null){_strokes=p;APP.Render.setStrokes(_strokes);APP.Storage.queueSave(_pid,_pg,_strokes)}
    return p!==null;
  }
  function redo(){
    const n=APP.History.redo(_pid,_pg,_strokes);
    if(n!==null){_strokes=n;APP.Render.setStrokes(_strokes);APP.Storage.queueSave(_pid,_pg,_strokes)}
    return n!==null;
  }

  return{setCtx,getStrokes,onDown,onMove,onUp,addText,undo,redo};
})();

// ================================================================

APP.PDFOutput = (()=>{
  async function exportZip(pid){
    APP.Utils.loading(true,'注釈付き画像を生成中...');
    try{
      const rec=await APP.Storage.loadPDF(pid);
      if(!rec)throw new Error('PDF not found');
      const n=APP.PDF.count(pid);
      const allAnnots=await APP.Storage.loadAllAnnots(pid);
      const zip=new JSZip();
      const offPdf=document.createElement('canvas');
      for(let i=0;i<n;i++){
        const dims=await APP.PDF.render(pid,i,offPdf,2.0);
        const offA=document.createElement('canvas');
        offA.width=dims.w;offA.height=dims.h;
        const ctx=offA.getContext('2d');
        for(const s of(allAnnots[i]||[]))APP.Render.drawStroke(ctx,s);
        const merged=document.createElement('canvas');
        merged.width=dims.w;merged.height=dims.h;
        const mc=merged.getContext('2d');
        mc.drawImage(offPdf,0,0);mc.drawImage(offA,0,0);
        const b64=merged.toDataURL('image/jpeg',0.92).split(',')[1];
        zip.file(`page_${String(i+1).padStart(3,'0')}.jpg`,b64,{base64:true});
      }
      const blob=await zip.generateAsync({type:'blob'});
      _dl(blob,`${rec.name}_注釈付き.zip`);
      APP.Utils.toast('ZIPを保存しました');
    }catch(e){APP.Utils.toast('出力エラー: '+e.message);console.error(e)}
    finally{APP.Utils.loading(false)}
  }
  function _dl(blob,name){
    const u=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);
  }
  return{exportZip};
})();

APP.Sub = (()=>{
  let _pid=null,_pg=0,_vis=false;
  const pane=()=>document.getElementById('sub-pane');
  const pdfC=()=>document.getElementById('sub-pdf-canvas');
  const annotC=()=>document.getElementById('sub-annot-canvas');
  const wrap=()=>document.getElementById('sub-wrap');
  const info=()=>document.getElementById('sub-page-info');
  const title=()=>document.getElementById('sub-title');

  function show(pid,pg){_pid=pid;_pg=pg;_vis=true;pane().classList.add('visible');_render()}
  function hide(){_vis=false;pane().classList.remove('visible')}
  function isVis(){return _vis}
  function go(d){if(!_pid)return;_pg=Math.max(0,Math.min(APP.PDF.count(_pid)-1,_pg+d));_render()}

  async function _render(){
    if(!_vis||!_pid)return;
    try{
      const scroll=document.getElementById('sub-scroll');
      const pw=scroll.clientWidth||300;
      const sz=await APP.PDF.getSize(_pid,_pg);
      const sc=pw/sz.w;
      const dims=await APP.PDF.render(_pid,_pg,pdfC(),sc);
      annotC().width=dims.w;annotC().height=dims.h;
      wrap().style.width=dims.w+'px';wrap().style.height=dims.h+'px';
      const strokes=await APP.Storage.loadAnnots(_pid,_pg);
      const ctx=annotC().getContext('2d');
      ctx.clearRect(0,0,dims.w,dims.h);
      for(const s of strokes)APP.Render.drawStroke(ctx,s);
      const rec=await APP.Storage.loadPDF(_pid);
      title().textContent=rec?rec.name:'PDF';
      info().textContent=`${_pg+1}/${APP.PDF.count(_pid)}`;
    }catch(e){console.error('[Sub]',e)}
  }

  APP.EventBus.on('storage:saved',({pdfId,page})=>{if(_vis&&_pid===pdfId&&_pg===page)_render()});

  return{show,hide,isVis,go};
})();

APP.UI = (()=>{
  let _pid=null,_pg=0,_zoom=1.0,_rscale=1.5;
  let _pinchDist=0;

  const PALETTE=['#e94560','#ff6b35','#f7c59f','#ffe66d','#4ecdc4','#1a535c',
                 '#a8e6cf','#c9f0ff','#ff6b6b','#fff','#888','#000'];

  function init(){
    _bindFile();_bindTools();_bindNav();_bindColor();_bindSidebar();_bindSub();
    _bindDrop();_bindPointer();_bindText();_buildPalette();
    APP.EventBus.on('state:changed',_onState);
    APP.EventBus.on('history:changed',_updateHist);
    APP.EventBus.on('storage:journal-incomplete',({count})=>{
      APP.Utils.toast(`⚠ 未完了の保存 ${count}件。復元を確認してください。`,5000);
    });
    // initial color dot
    document.getElementById('color-dot').style.background=APP.State.get().color;
  }

  // ── File ──
  function _bindFile(){
    document.getElementById('btn-open').addEventListener('click',()=>document.getElementById('file-input').click());
    document.getElementById('file-input').addEventListener('change',async(e)=>{
      const f=e.target.files[0];if(f)await _open(f);e.target.value='';
    });
    document.getElementById('btn-save-pdf').addEventListener('click',async()=>{
      if(!_pid){APP.Utils.toast('PDFを開いてください');return}
      await APP.PDFOutput.exportZip(_pid);
    });
    document.getElementById('btn-backup').addEventListener('click',async()=>{
      APP.Utils.loading(true,'バックアップ中...');
      try{
        const blob=await APP.Storage.backup();
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=`FAB_${new Date().toISOString().slice(0,10)}.zip`;a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),5000);
        APP.Utils.toast('バックアップ完了');
      }catch(e){APP.Utils.toast('バックアップ失敗: '+e.message)}
      finally{APP.Utils.loading(false)}
    });
    document.getElementById('btn-restore').addEventListener('click',()=>document.getElementById('restore-input').click());
    document.getElementById('restore-input').addEventListener('change',async(e)=>{
      const f=e.target.files[0];if(!f)return;
      if(!confirm('データを上書き復元しますか？'))return;
      APP.Utils.loading(true,'復元中...');
      try{
        await APP.Storage.restore(await f.arrayBuffer());
        APP.Utils.toast('復元完了。ページを再読み込みしてください。',4000);
      }catch(e){APP.Utils.toast('復元失敗: '+e.message)}
      finally{APP.Utils.loading(false);e.target.value=''}
    });
  }

  async function _open(file){
    APP.Utils.loading(true,'PDF読込中...');
    try{
      const buf=await file.arrayBuffer();
      const pid=APP.Utils.uid();
      const name=file.name.replace(/\.pdf$/i,'');
      const doc=await APP.PDF.load(pid,buf);
      await APP.Storage.savePDF(pid,name,buf,doc.numPages);
      const tid=APP.State.addTab({name,pdfId:pid,pageIndex:0,zoom:1.0});
      APP.State.addRecent({id:pid,name,pageCount:doc.numPages});
      await _switch(tid);
      APP.Utils.toast(`${name} を開きました（${doc.numPages}P）`);
    }catch(e){APP.Utils.toast('読込エラー: '+e.message);console.error(e)}
    finally{APP.Utils.loading(false)}
  }

  // ── Tabs ──
  async function _switch(tid){
    APP.State.set({activeTabId:tid});
    const tab=APP.State.getTab(tid);if(!tab)return;
    _pid=tab.pdfId;_pg=tab.pageIndex;_zoom=tab.zoom||1.0;
    await _renderPage();_renderTabs();_renderSidebar();
  }

  function _renderTabs(){
    const st=APP.State.get();
    const list=document.getElementById('tab-list');list.innerHTML='';
    for(const t of st.tabs){
      const el=document.createElement('div');
      el.className='tab-item'+(t.id===st.activeTabId?' active':'');
      el.innerHTML=`<span class="tab-name">${t.name}</span><span class="tab-close">✕</span>`;
      el.addEventListener('click',async(e)=>{
        if(e.target.classList.contains('tab-close')){
          APP.State.removeTab(t.id);_renderTabs();
          const nid=APP.State.get().activeTabId;
          if(nid)await _switch(nid);else _clear();
        }else await _switch(t.id);
      });
      list.appendChild(el);
    }
  }
  document.getElementById('tab-add').addEventListener('click',()=>document.getElementById('btn-open').click());

  // ── Page render ──
  async function _renderPage(){
    if(!_pid)return;
    const scroll=document.getElementById('canvas-scroll');
    const pdfC=document.getElementById('pdf-canvas');
    const annotC=document.getElementById('annot-canvas');
    const drawC=document.getElementById('draw-canvas');
    const uiC=document.getElementById('ui-canvas');
    const wrap=document.getElementById('canvas-wrap');
    APP.Utils.loading(true,'描画中...');
    try{
      const sz=await APP.PDF.getSize(_pid,_pg);
      const dpr=window.devicePixelRatio||2;
      const fitW=(scroll.clientWidth-20)/sz.w;
      _rscale=fitW*_zoom*dpr;
      const dims=await APP.PDF.render(_pid,_pg,pdfC,_rscale);
      const cssW=dims.w/dpr;const cssH=dims.h/dpr;
      [annotC,drawC,uiC].forEach(c=>{c.width=dims.w;c.height=dims.h});
      wrap.style.width=cssW+'px';wrap.style.height=cssH+'px';
      [pdfC,annotC,drawC,uiC].forEach(c=>{c.style.width=cssW+'px';c.style.height=cssH+'px'});
      APP.Render.init({pdf:pdfC,annot:annotC,draw:drawC,ui:uiC});
      const strokes=await APP.Storage.loadAnnots(_pid,_pg);
      APP.Tools.setCtx(_pid,_pg,strokes,_rscale);
      const n=APP.PDF.count(_pid);
      document.getElementById('page-info').textContent=`${_pg+1} / ${n}`;
      document.getElementById('zoom-info').textContent=Math.round(_zoom*100)+'%';
      APP.State.updateTab(APP.State.get().activeTabId,{pageIndex:_pg,zoom:_zoom});
      _updateHist();
      // サムネ更新
      document.querySelectorAll('.thumb-item').forEach(el=>{
        el.classList.toggle('active',parseInt(el.dataset.page)===_pg);
      });
    }finally{APP.Utils.loading(false)}
  }

  function _clear(){
    ['pdf-canvas','annot-canvas','draw-canvas','ui-canvas'].forEach(id=>{
      const c=document.getElementById(id);if(c){c.width=1;c.height=1}
    });
    document.getElementById('page-info').textContent='- / -';
    document.getElementById('zoom-info').textContent='-';
  }

  // ── Pointer events ──
  function _bindPointer(){
    const c=document.getElementById('ui-canvas');
    c.addEventListener('pointerdown',(e)=>{APP.Tools.onDown(e,c)},{passive:false});
    c.addEventListener('pointermove',APP.Utils.rafThrottle((e)=>{APP.Tools.onMove(e,c)}),{passive:false});
    c.addEventListener('pointerup',(e)=>APP.Tools.onUp(e,c));
    c.addEventListener('pointercancel',(e)=>APP.Tools.onUp(e,c));

    // Pinch zoom
    let t1=null,t2=null;
    c.addEventListener('touchstart',(e)=>{
      if(e.touches.length===2){
        t1=e.touches[0];t2=e.touches[1];
        _pinchDist=Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
      }
    },{passive:true});
    c.addEventListener('touchmove',APP.Utils.rafThrottle((e)=>{
      if(e.touches.length===2){
        const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        if(_pinchDist>0){_zoom=Math.max(0.2,Math.min(10,_zoom*(d/_pinchDist)));document.getElementById('zoom-info').textContent=Math.round(_zoom*100)+'%'}
        _pinchDist=d;
      }
    }),{passive:true});
    c.addEventListener('touchend',async(e)=>{
      if(e.touches.length<2&&_pinchDist>0){_pinchDist=0;await _renderPage()}
    },{passive:true});
  }

  // ── Tools ──
  const TOOL_IDS=['tool-pen','tool-highlight','tool-eraser','tool-line','tool-rect','tool-circle','tool-text'];
  const TOOL_MAP={'tool-pen':'pen','tool-highlight':'highlight','tool-eraser':'eraser','tool-line':'line','tool-rect':'rect','tool-circle':'circle','tool-text':'text'};

  function _bindTools(){
    for(const id of TOOL_IDS){
      document.getElementById(id).addEventListener('click',()=>{
        APP.State.set({tool:TOOL_MAP[id]});_updateToolBtns();
      });
    }
    document.getElementById('btn-undo').addEventListener('click',()=>{APP.Tools.undo();_updateHist()});
    document.getElementById('btn-redo').addEventListener('click',()=>{APP.Tools.redo();_updateHist()});
  }
  function _updateToolBtns(){
    const t=APP.State.get().tool;
    for(const id of TOOL_IDS)document.getElementById(id).classList.toggle('active',TOOL_MAP[id]===t);
  }
  function _updateHist(){
    document.getElementById('btn-undo').classList.toggle('disabled',!_pid||!APP.History.canUndo(_pid,_pg));
    document.getElementById('btn-redo').classList.toggle('disabled',!_pid||!APP.History.canRedo(_pid,_pg));
  }

  // ── Navigation ──
  function _bindNav(){
    document.getElementById('btn-prev').addEventListener('click',async()=>{if(_pg>0){_pg--;await _renderPage()}});
    document.getElementById('btn-next').addEventListener('click',async()=>{const n=_pid?APP.PDF.count(_pid):0;if(_pg<n-1){_pg++;await _renderPage()}});
    document.getElementById('btn-zoom-in').addEventListener('click',async()=>{_zoom=Math.min(10,_zoom*1.25);await _renderPage()});
    document.getElementById('btn-zoom-out').addEventListener('click',async()=>{_zoom=Math.max(0.2,_zoom/1.25);await _renderPage()});
    document.getElementById('btn-zoom-fit').addEventListener('click',async()=>{_zoom=1.0;await _renderPage()});
  }

  // ── Color ──
  function _bindColor(){
    const dot=document.getElementById('color-dot');
    const inp=document.getElementById('color-input');
    inp.value=APP.State.get().color;
    dot.addEventListener('click',_showPalette);
    inp.addEventListener('input',(e)=>{APP.State.set({color:e.target.value});dot.style.background=e.target.value});
    document.getElementById('size-slider').addEventListener('input',(e)=>{APP.State.set({size:parseFloat(e.target.value)})});
    document.getElementById('opacity-slider').addEventListener('input',(e)=>{APP.State.set({opacity:parseFloat(e.target.value)/100})});
  }
  function _buildPalette(){
    const pop=document.getElementById('color-popup');
    for(const hex of PALETTE){
      const d=document.createElement('div');d.className='cp-color';d.style.background=hex;
      d.addEventListener('click',()=>{
        APP.State.set({color:hex});
        document.getElementById('color-dot').style.background=hex;
        document.getElementById('color-input').value=hex;
        pop.classList.remove('show');
        pop.querySelectorAll('.cp-color').forEach(x=>x.classList.remove('selected'));
        d.classList.add('selected');
      });
      pop.appendChild(d);
    }
    document.addEventListener('pointerdown',(e)=>{
      if(!document.getElementById('color-popup').contains(e.target)&&e.target.id!=='color-dot')
        document.getElementById('color-popup').classList.remove('show');
    });
  }
  function _showPalette(){
    const pop=document.getElementById('color-popup');
    const r=document.getElementById('color-dot').getBoundingClientRect();
    pop.style.left=r.left+'px';pop.style.top=(r.bottom+6)+'px';
    pop.classList.toggle('show');
  }

  // ── Text ──
  function _bindText(){
    APP.EventBus.on('tools:text',({x,y,canvas})=>{
      const r=canvas.getBoundingClientRect();
      const sx=x*(r.width/canvas.width)+r.left;
      const sy=y*(r.height/canvas.height)+r.top;
      const ov=document.getElementById('text-overlay');
      const inp=document.getElementById('text-input');
      ov.style.left=Math.min(sx,window.innerWidth-200)+'px';
      ov.style.top=Math.min(sy,window.innerHeight-80)+'px';
      ov.classList.add('show');inp.value='';inp.focus();
      const done=()=>{
        const txt=inp.value;
        ov.classList.remove('show');
        if(txt.trim())APP.Tools.addText(x,y,txt);
        inp.removeEventListener('blur',done);
        inp.removeEventListener('keydown',onKey);
      };
      const onKey=(e)=>{if(e.key==='Escape'){inp.value='';done()}};
      inp.addEventListener('blur',done);inp.addEventListener('keydown',onKey);
    });
  }

  // ── Sidebar ──
  function _bindSidebar(){
    document.getElementById('btn-sidebar').addEventListener('click',()=>{
      document.getElementById('sidebar').classList.toggle('hidden');
    });
    document.querySelectorAll('.stab').forEach(t=>{
      t.addEventListener('click',()=>{
        document.querySelectorAll('.stab').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        APP.State.set({sidebarTab:t.dataset.tab});
        _renderSidebar();
      });
    });
  }

  async function _renderSidebar(){
    const st=APP.State.get();
    if(st.sidebarTab==='thumbs')await _renderThumbs();
    else await _renderRecent();
  }

  const _thumbObs=new IntersectionObserver(async(entries)=>{
    for(const en of entries){
      if(!en.isIntersecting)continue;
      const el=en.target;const c=el.querySelector('canvas');
      const pg=parseInt(el.dataset.page);
      const pid=document.getElementById('sidebar-content').dataset.pid;
      if(pid&&!el.dataset.rendered){
        el.dataset.rendered='1';
        try{await APP.PDF.renderThumb(pid,pg,c,180)}catch(e){}
        _thumbObs.unobserve(el);
      }
    }
  },{threshold:0.1});

  async function _renderThumbs(){
    const content=document.getElementById('sidebar-content');
    if(!_pid){content.innerHTML='<div style="padding:12px;color:var(--text2);font-size:12px">PDFを開いてください</div>';return}
    if(content.dataset.pid===_pid){
      content.querySelectorAll('.thumb-item').forEach(el=>{
        el.classList.toggle('active',parseInt(el.dataset.page)===_pg);
      });return;
    }
    content.innerHTML='';content.dataset.pid=_pid;
    const n=APP.PDF.count(_pid);
    for(let i=0;i<n;i++){
      const item=document.createElement('div');
      item.className='thumb-item'+(i===_pg?' active':'');
      item.dataset.page=i;
      const tc=document.createElement('canvas');
      item.appendChild(tc);
      const num=document.createElement('div');num.className='thumb-num';num.textContent=i+1;
      item.appendChild(num);
      item.addEventListener('click',async()=>{_pg=i;await _renderPage()});
      content.appendChild(item);
      _thumbObs.observe(item);
    }
  }

  async function _renderRecent(){
    const content=document.getElementById('sidebar-content');
    content.innerHTML='';content.dataset.pid='';
    const list=await APP.Storage.listPDFs();
    if(!list.length){content.innerHTML='<div style="padding:12px;color:var(--text2);font-size:12px">履歴なし</div>';return}
    for(const rec of list){
      const item=document.createElement('div');item.className='recent-item';
      item.innerHTML=`<div class="recent-name">${rec.name}</div><div class="recent-date">${APP.Utils.dateStr(new Date(rec.date))} | ${rec.pageCount||'?'}P</div>`;
      item.addEventListener('click',async()=>{
        APP.Utils.loading(true,'PDF読込中...');
        try{
          const pdfRec=await APP.Storage.loadPDF(rec.id);
          if(!pdfRec){APP.Utils.toast('データが見つかりません');return}
          if(!APP.PDF.getDoc(rec.id))await APP.PDF.load(rec.id,pdfRec.buffer);
          const tid=APP.State.addTab({name:rec.name,pdfId:rec.id,pageIndex:0});
          await _switch(tid);
        }catch(e){APP.Utils.toast('開けませんでした: '+e.message)}
        finally{APP.Utils.loading(false)}
      });
      content.appendChild(item);
    }
  }

  // ── Sub window ──
  function _bindSub(){
    document.getElementById('btn-subwin').addEventListener('click',()=>{
      if(APP.Sub.isVis()){APP.Sub.hide()}
      else{if(!_pid){APP.Utils.toast('PDFを開いてください');return}APP.Sub.show(_pid,_pg)}
    });
    document.getElementById('sub-btn-close').addEventListener('click',()=>APP.Sub.hide());
    document.getElementById('sub-btn-prev').addEventListener('click',()=>APP.Sub.go(-1));
    document.getElementById('sub-btn-next').addEventListener('click',()=>APP.Sub.go(1));
  }

  // ── Drag & Drop ──
  function _bindDrop(){
    const ov=document.getElementById('drop-overlay');
    document.body.addEventListener('dragover',(e)=>{e.preventDefault();ov.classList.add('show')});
    document.body.addEventListener('dragleave',(e)=>{if(!e.relatedTarget)ov.classList.remove('show')});
    document.body.addEventListener('drop',async(e)=>{
      e.preventDefault();ov.classList.remove('show');
      const f=e.dataTransfer.files[0];
      if(f&&f.type==='application/pdf')await _open(f);
      else APP.Utils.toast('PDFファイルをドロップしてください');
    });
  }

  // ── State ──
  function _onState({keys,state}){
    if(keys.includes('tool'))_updateToolBtns();
    if(keys.includes('color'))document.getElementById('color-dot').style.background=state.color;
    if(keys.includes('tabs')||keys.includes('activeTabId'))_renderTabs();
  }

  return{init};
})();

// ================================================================
// BOOT
// ================================================================
APP.Boot=(()=>{
  async function start(){
    try{
      APP.Utils.loading(true,'起動中...');
      await APP.Storage.init();
      await APP.Storage.checkJournal();
      APP.UI.init();
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible')APP.EventBus.emit('app:foreground');
      });
      window.addEventListener('pagehide',()=>APP.EventBus.emit('app:unload'));
      APP.Utils.loading(false);
      APP.Utils.toast('PDF図面注釈アプリ v1 起動完了',2000);
    }catch(e){
      APP.Utils.loading(false);
      console.error('[Boot]',e);
      document.body.insertAdjacentHTML('beforeend',
        `<div style="position:fixed;inset:0;background:#100;color:#e94560;display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px;font-size:16px;text-align:center">起動エラー: ${e.message}</div>`);
    }
  }
  return{start};
})();

window.addEventListener('DOMContentLoaded',()=>APP.Boot.start());
</script>
</body>
