<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>M_Viewer</title>
<style>
/* styles/base.css */
/* ============================================================
   base.css — CSS変数 / リセット / タイポグラフィ
   M_Viewer 再設計 Phase 1
   ============================================================ */

/* ---- CSS変数 ---- */
:root {
  --bg:      #1e2228;
  --pan:     #262c34;
  --pan2:    #2e363f;
  --brd:     #4a5a6a;
  --acc:     #f07800;
  --acc-dk:  #c06000;
  --tx:      #ffffff;
  --tx2:     #c8d8e4;
  --red:     #c02020;
  --red-dk:  #901818;
  --green:   #108030;

  /* ボタン寸法 (desktop基準) */
  --btn-h:   32px;
  --btn-px:  9px;
  --btn-fs:  12px;
  --toolbar-h: 38px;

  /* アニメーション */
  --trans-fast: 0.1s ease;
  --trans-norm: 0.2s ease;

  /* z-index 階層 */
  --z-canvas:   0;
  --z-subwin:   200;
  --z-panel:    300;
  --z-calc:     400;
  --z-overlay:  500;
  --z-loading:  600;
  --z-toast:    999;
}

/* ---- リセット ---- */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  background:  var(--bg);
  color:       var(--tx);
  font-family: 'Helvetica Neue', Arial, sans-serif;
  font-size:   14px;
  line-height: 1.4;
  /* iOS: dynamic viewport（Split View対応） */
  height: 100vh;
  height: 100dvh;
  display:        flex;
  flex-direction: column;
  user-select:        none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}

/* スクロールバー非表示 */
::-webkit-scrollbar { display: none; }

/* テキスト入力要素では user-select を戻す */
input, textarea {
  user-select:        text;
  -webkit-user-select: text;
}

/* styles/layout.css */
/* ============================================================
   layout.css — アプリ全体レイアウト骨格
   M_Viewer 再設計 Phase 1
   ============================================================ */

/* ---- ヘッダー ---- */
#hdr {
  flex-shrink: 0;
  background:    var(--pan);
  border-bottom: 2px solid var(--acc);
  overflow:      hidden;          /* ヘッダー外へのスクロール防止 */
}

/* ツールバー行 */
.toolbar-row {
  height:    var(--toolbar-h);
  display:   flex;
  align-items: center;
  gap:       5px;
  padding:   0 7px;
  overflow-x: auto;
  overflow-y: hidden;             /* 縦スクロール完全禁止 */
  -webkit-overflow-scrolling: touch;
}
.toolbar-row:first-child {
  border-bottom: 1px solid var(--brd);
}

/* ---- タブバー ---- */
#tabbar {
  flex-shrink: 0;
  display:   flex;
  align-items: stretch;
  min-height: 30px;
  background:    var(--pan2);
  border-bottom: 1.5px solid var(--brd);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* ---- キャンバスエリア ---- */
#ca {
  flex:     1;
  overflow: hidden;
  position: relative;
  min-height: 0;
  touch-action: none;
  background: #444;
  overscroll-behavior: none;
}

/* ---- セパレーター / スペーサー ---- */
.vs {
  width:      2px;
  height:     24px;
  background: var(--brd);
  flex-shrink: 0;
  margin:     0 3px;
}
.sp { flex: 1; }

/* styles/toolbar.css */
/* ============================================================
   toolbar.css — ツールバー部品（ボタン・スウォッチ・パネル）
   M_Viewer 再設計 Phase 1
   ============================================================ */

/* ---- ロゴ ---- */
.logo {
  font-size:    12px;
  font-weight:  800;
  color:        var(--acc);
  padding-right: 6px;
  border-right: 2px solid var(--brd);
  white-space:  nowrap;
  flex-shrink:  0;
}

/* ---- 汎用ボタン ---- */
.btn {
  height:        var(--btn-h);
  padding:       0 var(--btn-px);
  border:        1.5px solid var(--brd);
  background:    var(--pan2);
  color:         var(--tx);
  border-radius: 8px;
  font-size:     var(--btn-fs);
  font-weight:   700;
  cursor:        pointer;
  white-space:   nowrap;
  flex-shrink:   0;
  display:       flex;
  align-items:   center;
  gap:           4px;
  -webkit-user-select: none;
  transition:    background var(--trans-fast);
}
.btn:active    { background: var(--brd); }
.btn.on        { background: var(--acc);  border-color: var(--acc);  color: #fff; }
.btn.rd        { background: var(--red);  border-color: var(--red);  color: #fff; }
.btn:disabled  { opacity: 0.4; cursor: default; pointer-events: none; }

/* ---- ページ入力 ---- */
.pgni {
  width:         36px;
  height:        var(--btn-h);
  text-align:    center;
  background:    var(--pan2);
  border:        1.5px solid var(--brd);
  color:         var(--tx);
  border-radius: 5px;
  font-size:     12px;
  padding:       2px 0;
  flex-shrink:   0;
}
.pgni:focus { outline: none; border-color: var(--acc); }

/* ページ合計 */
.pgtot {
  font-size:  11px;
  color:      var(--tx2);
  white-space: nowrap;
  flex-shrink: 0;
}

/* ズーム % */
.zlbl {
  font-size:   12px;
  font-weight: 700;
  color:       var(--acc);
  min-width:   42px;
  text-align:  center;
  flex-shrink: 0;
}

/* ファイル名 */
#fnlbl {
  font-size:     11px;
  color:         #fff;
  font-weight:   600;
  max-width:     160px;
  overflow:      hidden;
  text-overflow: ellipsis;
  white-space:   nowrap;
  flex-shrink:   0;
}

/* ---- カラースウォッチ ---- */
.csw {
  width:         26px;
  height:        26px;
  border-radius: 50%;
  border:        3px solid transparent;
  cursor:        pointer;
  flex-shrink:   0;
  transition:    transform var(--trans-fast);
}
.csw.on {
  border-color: #fff;
  transform:    scale(1.25);
}

/* ---- 太さ表示 ---- */
.szlbl {
  font-size:  11px;
  color:      var(--tx2);
  flex-shrink: 0;
}
.sz-val {
  font-size:     13px;
  font-weight:   700;
  color:         var(--acc);
  min-width:     22px;
  text-align:    center;
  flex-shrink:   0;
  cursor:        pointer;
  padding:       2px 6px;
  border:        1.5px solid var(--brd);
  border-radius: 5px;
  background:    var(--pan2);
}

/* ---- ドロップダウンコンテナ ---- */
.pkw { position: relative; flex-shrink: 0; }

.pkp {
  position:      fixed;
  background:    var(--pan);
  border:        1.5px solid var(--brd);
  border-radius: 9px;
  padding:       5px;
  z-index:       var(--z-panel);
  box-shadow:    0 4px 20px #0008;
  display:       none;
  flex-direction: column;
  gap:           3px;
  min-width:     120px;
}
.pkp.on { display: flex; }
.pkp button {
  height:        40px;
  padding:       0 12px;
  background:    var(--pan2);
  border:        1.5px solid var(--brd);
  color:         var(--tx);
  border-radius: 7px;
  font-size:     12px;
  font-weight:   700;
  cursor:        pointer;
  text-align:    left;
}
.pkp button:active,
.pkp button.on { background: var(--acc); border-color: var(--acc); color: #fff; }

/* ---- 太さパネル ---- */
#szp {
  display:       none;
  position:      fixed;
  z-index:       var(--z-panel);
  background:    var(--pan);
  border:        1.5px solid var(--brd);
  border-radius: 11px;
  padding:       12px 14px;
  box-shadow:    0 4px 20px #0008;
  width:         260px;
}
#szp.on { display: block; }

#szp-title {
  font-size:   12px;
  color:       var(--tx2);
  font-weight: 700;
  margin-bottom: 9px;
  display:     block;
}
.szp-row {
  display:     flex;
  align-items: center;
  gap:         7px;
  margin-bottom: 9px;
}
#sz-rng {
  -webkit-appearance: none;
  flex:          1;
  height:        8px;
  background:    var(--brd);
  border-radius: 4px;
  cursor:        pointer;
}
#sz-rng::-webkit-slider-thumb {
  -webkit-appearance: none;
  width:         24px;
  height:        24px;
  border-radius: 50%;
  background:    var(--acc);
  cursor:        pointer;
  border:        2px solid #fff;
}
#sz-n {
  width:         42px;
  text-align:    center;
  background:    var(--pan2);
  border:        1.5px solid var(--brd);
  color:         var(--tx);
  border-radius: 5px;
  font-size:     13px;
  font-weight:   700;
  padding:       4px;
}
#sz-n:focus { outline: none; border-color: var(--acc); }

#szp-prev {
  height:        42px;
  background:    var(--pan2);
  border-radius: 7px;
  margin-bottom: 9px;
  display:       flex;
  align-items:   center;
  justify-content: center;
}
.szp-btns { display: flex; gap: 7px; }
.szp-ok {
  flex:          1;
  height:        38px;
  background:    var(--acc);
  color:         #fff;
  border:        none;
  border-radius: 7px;
  font-size:     13px;
  font-weight:   700;
  cursor:        pointer;
}
.szp-cancel {
  height:        38px;
  padding:       0 12px;
  background:    var(--pan2);
  color:         var(--tx2);
  border:        1.5px solid var(--brd);
  border-radius: 7px;
  font-size:     13px;
  font-weight:   700;
  cursor:        pointer;
}

/* ---- タブバー部品 ---- */
.shtab {
  display:     flex;
  align-items: center;
  gap:         4px;
  padding:     0 6px 0 10px;
  min-width:   72px;
  max-width:   152px;
  background:  var(--pan2);
  color:       var(--tx2);
  border-right: 1px solid var(--brd);
  font-size:   11px;
  font-weight: 600;
  cursor:      pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition:  background var(--trans-fast);
  -webkit-user-select: none;
}
.shtab:hover  { background: var(--brd); color: var(--tx); }
.shtab.active { background: var(--bg);  color: var(--tx); box-shadow: inset 0 -2px 0 var(--acc); }
.shtab-nm {
  overflow:      hidden;
  text-overflow: ellipsis;
  white-space:   nowrap;
  flex:          1;
}
.shtab-x {
  flex-shrink:   0;
  background:    none;
  border:        none;
  color:         var(--tx2);
  cursor:        pointer;
  font-size:     12px;
  padding:       1px 3px;
  border-radius: 3px;
  line-height:   1;
}
.shtab-x:hover { background: var(--red); color: #fff; }
.shtab-add {
  padding:     0 13px;
  background:  none;
  border:      none;
  color:       var(--tx2);
  font-size:   20px;
  cursor:      pointer;
  flex-shrink: 0;
  align-self:  center;
  margin-left: auto;
}
.shtab-add:hover { color: var(--acc); }

/* styles/viewer.css */
/* ============================================================
   viewer.css — キャンバスエリア / ドロップゾーン / Canvas層
   M_Viewer 再設計 Phase 1
   ============================================================ */

/* ---- Canvas ラッパー ---- */
#cw {
  position:         absolute;
  top:              0;
  left:             0;
  transform-origin: 0 0;
  background:       #fff;
  /* display は JS で制御 */
}

/* ---- Canvas 層 ---- */
#pdf-canvas {
  display: block;
}

#ann-canvas {
  position: absolute;
  top:      0;
  left:     0;
}

#ovl-canvas {
  position:       absolute;
  top:            0;
  left:           0;
  pointer-events: none; /* 最前面だがイベント透過 */
}

/* ---- ドロップゾーン ---- */
#dz {
  position:        absolute;
  inset:           0;
  display:         flex;
  flex-direction:  column;
  align-items:     center;
  justify-content: center;
  gap:             14px;
  z-index:         10;
  background:      var(--bg);
}

.dz-icon { font-size: 48px; opacity: 0.4; }
.dz-title {
  font-size:   16px;
  color:       var(--tx);
  font-weight: 700;
}
.dz-sub {
  font-size:   11px;
  color:       var(--tx2);
  text-align:  center;
  padding:     0 18px;
  line-height: 1.8;
}
.dz-btn {
  background:    var(--acc);
  color:         #fff;
  border:        none;
  padding:       13px 28px;
  border-radius: 11px;
  font-size:     15px;
  font-weight:   700;
  cursor:        pointer;
}
.dz-btn:active { opacity: 0.85; }

/* ---- 選択削除ボタン ---- */
#selbtn {
  display:       none;
  position:      fixed;
  z-index:       var(--z-panel);
  background:    var(--red);
  color:         #fff;
  border:        none;
  border-radius: 8px;
  padding:       8px 14px;
  font-size:     13px;
  font-weight:   700;
  cursor:        pointer;
  box-shadow:    0 2px 10px #0005;
}

/* styles/dialogs.css */
/* ============================================================
   dialogs.css — モーダル・オーバーレイ・トースト・ローディング
   M_Viewer 再設計 Phase 1
   ============================================================ */

/* ---- トースト ---- */
#toast {
  position:      fixed;
  bottom:        24px;
  left:          50%;
  transform:     translateX(-50%);
  background:    var(--pan);
  border:        1.5px solid var(--brd);
  border-radius: 9px;
  padding:       8px 18px;
  font-size:     13px;
  color:         var(--tx);
  opacity:       0;
  pointer-events: none;
  transition:    opacity 0.3s;
  z-index:       var(--z-toast);
  white-space:   nowrap;
  max-width:     90vw;
}
#toast.on { opacity: 1; }

/* ---- ローディング ---- */
#loading {
  display:         none;
  position:        fixed;
  inset:           0;
  z-index:         var(--z-loading);
  background:      rgba(0,0,0,0.65);
  align-items:     center;
  justify-content: center;
  flex-direction:  column;
  gap:             12px;
}
#loading.on { display: flex; }

.spin {
  width:         36px;
  height:        36px;
  border:        3px solid var(--brd);
  border-top-color: var(--acc);
  border-radius: 50%;
  animation:     spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-msg {
  font-size: 14px;
  color:     var(--tx);
}

/* ---- 共通オーバーレイ背景 ---- */
.overlay-bg {
  display:         none;
  position:        fixed;
  inset:           0;
  z-index:         var(--z-overlay);
  background:      rgba(0,0,0,0.72);
  align-items:     center;
  justify-content: center;
}
.overlay-bg.on { display: flex; }

/* ---- 共通ポップアップボックス ---- */
.popup-box {
  background:    var(--pan);
  border:        1.5px solid var(--brd);
  border-radius: 14px;
  padding:       18px 20px;
  width:         min(340px, 92vw);
  box-shadow:    0 8px 32px rgba(0,0,0,0.6);
}

/* ---- テキスト入力ダイアログ ---- */
#txov { }
#txpop h3 { font-size: 13px; color: var(--tx2); margin-bottom: 10px; }
#txfld {
  width:         100%;
  background:    var(--bg);
  border:        1.5px solid var(--brd);
  border-radius: 7px;
  color:         var(--tx);
  font-size:     16px;
  padding:       9px;
  resize:        vertical;
  min-height:    64px;
  font-family:   inherit;
  display:       block;
  margin-bottom: 10px;
}
#txfld:focus { outline: none; border-color: var(--acc); }

/* ---- PDF出力ページ指定ダイアログ ---- */
#pgrov { }
#pgrpop h3 { font-size: 13px; color: var(--tx2); margin-bottom: 10px; }
#pgrfld {
  width:         100%;
  background:    var(--bg);
  border:        1.5px solid var(--brd);
  border-radius: 7px;
  color:         var(--tx);
  font-size:     15px;
  padding:       8px;
  display:       block;
  margin-bottom: 10px;
}
#pgrfld:focus { outline: none; border-color: var(--acc); }
.pgr-qrow { display: flex; gap: 6px; margin-bottom: 8px; }
.pgr-q {
  flex:          1;
  height:        34px;
  border-radius: 6px;
  border:        1.5px solid var(--brd);
  background:    var(--pan2);
  color:         var(--tx2);
  font-size:     11px;
  cursor:        pointer;
  font-weight:   600;
}
.pgr-q:active { background: var(--brd); }

/* ---- バックアップ確認ダイアログ ---- */
#bk-confirm-overlay { }
#bk-confirm-box { text-align: center; }
#bk-confirm-box .bk-icon  { font-size: 28px; margin-bottom: 8px; }
#bk-confirm-box .bk-title { font-size: 14px; font-weight: 800; color: var(--tx); margin-bottom: 6px; }
#bk-confirm-box .bk-warn  { color: #ffaa44; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
#bk-confirm-box .bk-sub   { font-size: 12px; color: var(--tx2); margin-bottom: 18px; line-height: 1.5; }
#bk-confirm-box .bk-btns  { display: flex; flex-direction: column; gap: 8px; }
#bk-confirm-box .bk-btns button {
  width:         100%;
  height:        40px;
  border-radius: 8px;
  font-size:     13px;
  font-weight:   700;
  cursor:        pointer;
  border:        1.5px solid var(--brd);
  background:    var(--pan2);
  color:         var(--tx);
}
#bk-confirm-box .bk-do-backup { background: var(--acc); border-color: var(--acc); color: #fff; }
#bk-confirm-box .bk-cancel    { color: var(--tx2); }

/* ---- ダイアログ内ボタン共通 ---- */
.dlg-btns {
  display:         flex;
  gap:             8px;
  justify-content: flex-end;
}
.dlg-btn {
  padding:       9px 18px;
  border-radius: 7px;
  border:        none;
  cursor:        pointer;
  font-size:     14px;
  font-weight:   700;
}
.dlg-btn-cancel { background: var(--pan2); color: var(--tx2); border: 1.5px solid var(--brd); }
.dlg-btn-ok     { background: var(--acc);  color: #fff; }

/* ---- 計算機 ---- */
#calc {
  display:       none;
  position:      fixed;
  z-index:       var(--z-calc);
  background:    var(--pan);
  border:        1.5px solid var(--brd);
  border-radius: 13px;
  width:         290px;
  box-shadow:    0 8px 36px rgba(0,0,0,0.65);
  bottom:        20px;
  right:         16px;
}
#calc.on { display: block; }

#calc-tb {
  padding:         6px 12px 4px;
  display:         flex;
  align-items:     center;
  justify-content: space-between;
  cursor:          grab;
  border-bottom:   1px solid var(--brd);
}
#calc-tb span { font-size: 13px; font-weight: 700; color: var(--tx2); }
#calc-close {
  background:    var(--pan2);
  border:        1.5px solid var(--brd);
  color:         var(--tx);
  font-size:     12px;
  cursor:        pointer;
  padding:       3px 10px;
  border-radius: 5px;
  font-weight:   700;
}
#calc-close:active { background: var(--acc); color: #fff; }

#calc-hist { max-height: 66px; overflow-y: auto; padding: 2px 10px; border-bottom: 1px solid var(--brd); }
.calc-hist-item { font-size: 11px; color: var(--tx2); text-align: right; padding: 2px 0; }

#calc-disp { padding: 5px 12px; text-align: right; border-bottom: 1px solid var(--brd); }
#calc-expr { font-size: 11px; color: var(--tx2); min-height: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#calc-val  { font-size: 26px; font-weight: 700; color: var(--tx); }

#calc-dec-row {
  display:     flex;
  align-items: center;
  gap:         5px;
  padding:     3px 10px;
  border-bottom: 1px solid var(--brd);
}
#calc-dec-row label { font-size: 11px; color: var(--tx2); }
#calc-dec {
  width:         34px;
  text-align:    center;
  background:    var(--pan2);
  border:        1px solid var(--brd);
  color:         var(--tx);
  border-radius: 4px;
  font-size:     12px;
  padding:       2px;
}

#calc-btns {
  display:               grid;
  grid-template-columns: repeat(4, 1fr);
  gap:                   6px;
  padding:               8px;
}
.cb {
  height:        50px;
  border-radius: 9px;
  font-size:     22px;
  font-weight:   700;
  cursor:        pointer;
  -webkit-user-select: none;
  transition:    opacity 0.1s;
  border:        2px solid;
}
.cb:active      { opacity: 0.6; }
.cbn  { background: var(--pan2);  color: var(--tx);   border-color: #4a5a6a; }
.cbo  { background: #243040;      color: #ffa040;     border-color: #3a5070; }
.cbeq { background: var(--acc);   color: #fff;        border-color: var(--acc-dk); }
.cbf  { background: #1e2530;      color: var(--tx2);  font-size: 16px; border-color: #3a4a58; }
.cbw  { grid-column: span 2; }
.cbrs { grid-row:    span 2; }

/* styles/home.css */
/* ============================================================
   home.css — ホーム画面（最近開いた図面 / ドキュメント一覧）
   M_Viewer 再設計 Phase 1
   ============================================================ */

#home {
  position:        absolute;
  inset:           0;
  z-index:         10;
  background:      var(--bg);
  display:         none;
  flex-direction:  column;
  overflow-y:      auto;
  -webkit-overflow-scrolling: touch;
}
#home.visible { display: flex; }

/* ---- ヘッダー行 ---- */
.home-hdr {
  display:         flex;
  align-items:     center;
  justify-content: space-between;
  padding:         20px 18px 12px;
  flex-shrink:     0;
  border-bottom:   1px solid var(--brd);
}
.home-title {
  font-size:   18px;
  font-weight: 700;
  color:       var(--tx);
}
.home-open-btn {
  background:    var(--acc);
  color:         #fff;
  border:        none;
  padding:       10px 22px;
  border-radius: 10px;
  font-size:     14px;
  font-weight:   700;
  cursor:        pointer;
  touch-action:  manipulation;
}
.home-open-btn:active { opacity: 0.8; }

/* ---- セクション見出し ---- */
.home-section {
  font-size:      11px;
  font-weight:    700;
  color:          var(--tx2);
  padding:        14px 18px 6px;
  flex-shrink:    0;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ---- ドキュメントカード一覧 ---- */
#home-list {
  display:        grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap:            10px;
  padding:        6px 18px 20px;
  align-content:  start;
}

.home-card {
  background:    var(--pan);
  border:        1.5px solid var(--brd);
  border-radius: 10px;
  padding:       12px 10px 8px;
  cursor:        pointer;
  position:      relative;
  display:       flex;
  flex-direction: column;
  gap:           4px;
  -webkit-user-select: none;
  touch-action:  manipulation;
}
.home-card:active { border-color: var(--acc); background: var(--pan2); }

.home-card-icon { font-size: 26px; line-height: 1; margin-bottom: 2px; }
.home-card-name {
  font-size:   11px;
  font-weight: 700;
  color:       var(--tx);
  word-break:  break-all;
  overflow:    hidden;
  text-overflow: ellipsis;
  display:     -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-height: 1.3;
}
.home-card-date {
  font-size:  10px;
  color:      var(--tx2);
  margin-top: auto;
  padding-top: 4px;
}
.home-card-del {
  position:        absolute;
  top:             5px;
  right:           5px;
  background:      transparent;
  border:          none;
  color:           var(--tx2);
  font-size:       14px;
  cursor:          pointer;
  width:           24px;
  height:          24px;
  display:         flex;
  align-items:     center;
  justify-content: center;
  border-radius:   50%;
}
.home-card-del:active { background: var(--red); color: #fff; }

/* ---- 空状態 ---- */
#home-empty {
  display:         none;
  flex-direction:  column;
  align-items:     center;
  justify-content: center;
  flex:            1;
  gap:             14px;
  padding:         60px 20px;
}
#home-empty.visible { display: flex; }

.home-empty-icon { font-size: 52px; opacity: 0.25; }
.home-empty-msg  { font-size: 13px; color: var(--tx2); text-align: center; line-height: 1.8; }

/* ---- ドロップヒント ---- */
.home-drop-hint {
  font-size:     11px;
  color:         var(--tx2);
  text-align:    center;
  padding:       10px 18px;
  border:        1.5px dashed var(--brd);
  border-radius: 10px;
  margin:        0 18px 18px;
  flex-shrink:   0;
}

/* styles/subwindow.css */
/* ============================================================
   subwindow.css — フローティングサブウィンドウ
   M_Viewer 再設計 Phase 8
   ============================================================ */

/* ---- フレーム ---- */
.sw-frame {
  position:       absolute;
  z-index:        var(--z-subwin);
  background:     var(--pan);
  border:         2px solid var(--acc);
  border-radius:  10px;
  box-shadow:     0 6px 28px rgba(0,0,0,.7);
  display:        flex;
  flex-direction: column;
  min-width:      200px;
  min-height:     150px;
  overflow:       hidden;
  touch-action:   none;
  animation:      sw-appear .14s ease-out both;
}

@keyframes sw-appear {
  from { opacity: 0; transform: scale(.92); }
  to   { opacity: 1; transform: scale(1);   }
}

/* ---- ヘッダー（ドラッグハンドル） ---- */
.sw-hdr {
  height:          32px;
  background:      var(--pan2);
  border-bottom:   1.5px solid var(--brd);
  display:         flex;
  align-items:     center;
  gap:             6px;
  padding:         0 6px;
  cursor:          grab;
  flex-shrink:     0;
  user-select:     none;
  -webkit-user-select: none;
}
.sw-hdr:active { cursor: grabbing; }

.sw-title {
  font-size:   11px;
  font-weight: 700;
  color:       var(--acc);
  flex:        1;
  white-space: nowrap;
  overflow:    hidden;
}

/* ページセレクト */
.sw-psel {
  height:        22px;
  font-size:     11px;
  background:    var(--pan);
  color:         var(--tx);
  border:        1px solid var(--brd);
  border-radius: 4px;
  padding:       0 2px;
  cursor:        pointer;
  flex-shrink:   0;
  max-width:     56px;
}

/* 閉じるボタン */
.sw-close {
  background:    transparent;
  border:        none;
  color:         var(--tx2);
  font-size:     15px;
  line-height:   1;
  cursor:        pointer;
  padding:       2px 4px;
  border-radius: 4px;
  flex-shrink:   0;
  transition:    background var(--trans-fast);
}
.sw-close:hover  { background: var(--red); color: #fff; }
.sw-close:active { background: var(--red-dk); }

/* ---- ボディ（キャンバスエリア） ---- */
.sw-body {
  flex:       1;
  overflow:   hidden;
  position:   relative;
  background: #fff;
  cursor:     grab;
}
.sw-body:active { cursor: grabbing; }

/* PDF / ann canvas をボディ左上に絶対配置 */
.sw-pdf,
.sw-ann {
  position:         absolute;
  top:              0;
  left:             0;
  transform-origin: 0 0;
}

/* ---- リサイズハンドル（右下三角） ---- */
.sw-rsz {
  position:      absolute;
  bottom:        0;
  right:         0;
  width:         20px;
  height:        20px;
  cursor:        se-resize;
  background:    linear-gradient(135deg, transparent 50%, var(--acc) 50%);
  border-radius: 0 0 8px 0;
  z-index:       1;
  touch-action:  none;
}

/* ---- ローディングストライプ ---- */
@keyframes sw-stripe {
  to { background-position: 22px 22px; }
}
.sw-frame.sw-loading .sw-body::after {
  content:        '';
  position:       absolute;
  inset:          0;
  pointer-events: none;
  background: repeating-linear-gradient(
    -45deg, transparent 0 8px, rgba(255,255,255,.06) 8px 16px
  );
  background-size: 22px 22px;
  animation:       sw-stripe .7s linear infinite;
}

/* styles/responsive.css */
/* ============================================================
   responsive.css — iPad / タッチデバイス 対応
   M_Viewer 再設計 Phase 1
   ============================================================ */

/* ============================================================
   タッチデバイス全般 (pointer: coarse)
   ============================================================ */
@media (pointer: coarse) {
  :root {
    --btn-h:       38px;
    --btn-px:      11px;
    --btn-fs:      12px;
    --toolbar-h:   46px;
  }

  .toolbar-row {
    gap:          6px;
    padding:      0 9px;
    /* safe area 対応 */
    padding-left:  max(9px, env(safe-area-inset-left));
    padding-right: max(9px, env(safe-area-inset-right));
    overflow-y:   hidden;
  }

  .btn { border-radius: 9px; gap: 4px; }

  .csw { width: 32px; height: 32px; border-width: 3px; }
  .vs  { height: 28px; margin: 0 4px; }

  .pgni { width: 38px; font-size: 13px; height: 32px; padding: 3px 0; }
  .pgtot  { font-size: 12px; }
  .zlbl   { font-size: 13px; min-width: 44px; }
  #fnlbl  { font-size: 12px; max-width: 180px; }

  .pkp button { height: 44px; font-size: 12px; }
  .logo       { font-size: 12px; padding-right: 7px; }

  /* safe area: ヘッダー下端 */
  #hdr { padding-bottom: env(safe-area-inset-bottom, 0px); }
}

/* ============================================================
   iPad 横向き (portrait 排除 + タッチ)
   ============================================================ */
@media (pointer: coarse) and (orientation: landscape) {
  :root {
    --btn-h:     35px;
    --toolbar-h: 42px;
  }

  .toolbar-row {
    gap:          5px;
    padding:      0 8px;
    padding-left:  max(8px, env(safe-area-inset-left));
    padding-right: max(8px, env(safe-area-inset-right));
  }

  .btn { padding: 0 10px; font-size: 12px; border-radius: 8px; }
  .csw { width: 30px; height: 30px; }
  .vs  { height: 26px; margin: 0 3px; }
  .pgni { height: 30px; font-size: 12px; }
}

/* ============================================================
   iPad Split View / Slide Over ≤ 600px
   ============================================================ */
@media (pointer: coarse) and (max-width: 600px) {
  :root {
    --btn-h:     34px;
    --toolbar-h: 40px;
  }

  .toolbar-row {
    gap:          4px;
    padding:      0 6px;
    padding-left:  max(6px, env(safe-area-inset-left));
    padding-right: max(6px, env(safe-area-inset-right));
  }

  .btn  { padding: 0 8px; font-size: 11px; border-radius: 8px; gap: 3px; }
  .csw  { width: 28px; height: 28px; }
  .vs   { height: 22px; margin: 0 2px; }
  .logo { font-size: 11px; padding-right: 4px; }
  #fnlbl { max-width: 80px; font-size: 10px; }
  .pgni  { width: 32px; height: 28px; font-size: 12px; }
}

/* ============================================================
   iPad Slide Over 最小幅 ≤ 430px
   ============================================================ */
@media (pointer: coarse) and (max-width: 430px) {
  :root {
    --btn-h:     28px;
    --toolbar-h: 36px;
  }

  .toolbar-row { gap: 3px; }
  .btn  { padding: 0 5px; font-size: 10px; border-radius: 7px; }
  .csw  { width: 22px; height: 22px; }
  .logo { display: none; }
  #fnlbl { max-width: 60px; }
}

/* ============================================================
   safe area: ホーム画面下端
   ============================================================ */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  #home { padding-bottom: env(safe-area-inset-bottom, 0px); }
}

</style>

/* ---- modules/core/logger.js ---- */
/**
 * modules/core/logger.js — ロガーファクトリ
 * M_Viewer 再設計 Phase 3
 *
 * 設計方針:
 *   - createLogger(prefix) でモジュールごとのロガーを生成
 *   - グローバルログレベルで一括制御
 *   - 本番ビルドで容易に無効化できる構造
 *   - 他モジュールへの依存なし
 */

/** @type {'debug'|'info'|'warn'|'error'|'none'} */
let _level = 'info';

const LEVELS = { debug: 0, info: 1, warn: 2, error: 3, none: 99 };

/**
 * グローバルログレベルを設定
 * @param {'debug'|'info'|'warn'|'error'|'none'} level
 */
function setLogLevel(level) {
  if (level in LEVELS) _level = level;
}

/** 現在のログレベルを取得 */
function getLogLevel() { return _level; }

/**
 * モジュール専用ロガーを生成
 * @param {string} prefix - 例: 'AppStore', 'ToolStore'
 * @returns {{ debug, info, warn, error, group, groupEnd }}
 */
function createLogger(prefix) {
  const tag = `[${prefix}]`;

  const _log = (lvl, consoleFn, args) => {
    if (LEVELS[lvl] < LEVELS[_level]) return;
    consoleFn(tag, ...args);
  };

  return Object.freeze({
    debug: (...args) => _log('debug', console.debug, args),
    info:  (...args) => _log('info',  console.log,   args),
    warn:  (...args) => _log('warn',  console.warn,  args),
    error: (...args) => _log('error', console.error, args),
    /** グループ折り畳み（デバッグ用） */
    group:    (label) => { if (LEVELS['debug'] >= LEVELS[_level]) console.group(`${tag} ${label}`); },
    groupEnd: ()      => { if (LEVELS['debug'] >= LEVELS[_level]) console.groupEnd(); },
  });
}


/* ---- modules/core/errors.js ---- */
/**
 * modules/core/errors.js — アプリ例外クラス定義
 * M_Viewer 再設計 Phase 3
 *
 * 設計方針:
 *   - すべてのアプリ固有エラーは AppError を基底クラスとする
 *   - エラー種別を code プロパティで判定できるようにする
 *   - スタックトレース保持
 *   - 他モジュールへの依存なし
 */

/**
 * アプリ基底エラー
 */
class AppError extends Error {
  /**
   * @param {string} message
   * @param {string} [code='APP_ERROR']
   * @param {*}      [detail]
   */
  constructor(message, code = 'APP_ERROR', detail = null) {
    super(message);
    this.name   = this.constructor.name;
    this.code   = code;
    this.detail = detail;
    // V8 スタックトレース保持
    if (Error.captureStackTrace) {
      Error.captureStackTrace(this, this.constructor);
    }
  }
}

/**
 * 状態管理エラー（不正なアクション・状態不整合など）
 */
class StateError extends AppError {
  constructor(message, detail = null) {
    super(message, 'STATE_ERROR', detail);
  }
}

/**
 * アクションエラー（不明なアクション種別・必須パラメータ欠落など）
 */
class ActionError extends AppError {
  /**
   * @param {string} message
   * @param {string} [actionType]
   */
  constructor(message, actionType = null) {
    super(message, 'ACTION_ERROR', { actionType });
  }
}

/**
 * ストレージエラー（IDB・localStorage の読み書き失敗）
 */
class StorageError extends AppError {
  constructor(message, detail = null) {
    super(message, 'STORAGE_ERROR', detail);
  }
}

/**
 * PDF 処理エラー（読み込み・レンダリング・エクスポート失敗）
 */

/* ---- modules/core/utils.js ---- */
/**
 * modules/core/utils.js — 汎用ユーティリティ
 * M_Viewer 再設計 Phase 3
 *
 * 設計方針:
 *   - 副作用なしの純粋関数のみ
 *   - DOM 操作・描画・保存処理は含まない
 *   - 他モジュールへの依存なし
 */

/* ============================================================
   オブジェクト操作
   ============================================================ */

/**
 * オブジェクトを再帰的に凍結する（deepFreeze）
 * @template T
 * @param {T} obj
 * @returns {T}
 */
function deepFreeze(obj) {
  if (obj === null || typeof obj !== 'object') return obj;
  Object.getOwnPropertyNames(obj).forEach(name => {
    deepFreeze(obj[name]);
  });
  return Object.freeze(obj);
}

/**
 * 浅い等値比較（プリミティブ値・1段オブジェクト）
 * @param {*} a
 * @param {*} b
 * @returns {boolean}
 */
function shallowEqual(a, b) {
  if (a === b) return true;
  if (a === null || b === null) return false;
  if (typeof a !== 'object' || typeof b !== 'object') return false;
  const ka = Object.keys(a);
  const kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => a[k] === b[k]);
}

/**
 * ネストしたオブジェクトから指定パスの値を取得
 * @param {object} obj
 * @param {string} path - ドット区切り例: 'tool.currentTool'
 * @returns {*}
 */
function getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o != null ? o[k] : undefined), obj);
}

/* ============================================================
   数値操作
   ============================================================ */

/**
 * 値を [min, max] にクランプ
 * @param {number} v
 * @param {number} min
 * @param {number} max
 * @returns {number}
 */
function clamp(v, min, max) {
  return Math.min(Math.max(v, min), max);
}

/**
 * 小数点以下 n 桁に丸める
 * @param {number} v
 * @param {number} [n=4]
 * @returns {number}
 */
function round(v, n = 4) {
  const f = 10 ** n;
  return Math.round(v * f) / f;
}

/* ============================================================
   ID 生成
   ============================================================ */

/**
 * ユニーク ID 生成（crypto.randomUUID 優先、フォールバックあり）
 * @returns {string}
 */
function uid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) {
    return crypto.randomUUID();
  }
  // フォールバック（crypto.randomUUID 非対応環境）
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/**
 * タイムスタンプ付き短縮 ID（ログ・ファイル名用）
 * @returns {string} 例: '20260525_1030_a3f2'
 */
function shortId() {
  const now = new Date();
  const d = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  const t = `${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const r = Math.random().toString(36).slice(2, 6);
  return `${d}_${t}_${r}`;
}

/* ============================================================
   文字列操作
   ============================================================ */

/**
 * HTML 特殊文字エスケープ
 * @param {string} s
 * @returns {string}
 */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;',
  }[m]));
}

/**
 * IDB / localStorage キー用文字列サニタイズ
 * 英数字・ハイフン・アンダースコア以外を除去
 * @param {string} s
 * @returns {string}
 */
function sanitizeKey(s) {
  return String(s).replace(/[^a-zA-Z0-9\-_]/g, '_').slice(0, 64);
}

/* ============================================================
   日時フォーマット
   ============================================================ */

/**
 * タイムスタンプを表示用文字列に変換
 * @param {number} ts - Date.now()
 * @param {'short'|'long'} [style='short']
 * @returns {string}
 */
function formatDate(ts, style = 'short') {
  if (!ts) return '';
  const d = new Date(ts);
  const M = d.getMonth() + 1;
  const D = d.getDate();
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  if (style === 'long') {
    return `${d.getFullYear()}/${M}/${D} ${h}:${m}`;
  }
  return `${M}/${D} ${h}:${m}`;
}

/**
 * アーカイブファイル名用 日時文字列
 * @param {number} [ts=Date.now()]
 * @returns {string} 例: '2026-05-25_1030'
 */
function formatDateForFilename(ts = Date.now()) {
  const d = new Date(ts);
  const Y = d.getFullYear();
  const M = String(d.getMonth()+1).padStart(2,'0');
  const D = String(d.getDate()).padStart(2,'0');
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  return `${Y}-${M}-${D}_${h}${m}`;
}

/* ---- modules/core/events-bus.js ---- */
/**
 * modules/core/events-bus.js — アプリレベル Pub/Sub バス
 * M_Viewer 再設計 Phase 4
 *
 * Store（状態管理）とは別の、モジュール間イベント通信用バス。
 * 主な用途:
 *   - pencil:down / pencil:move / pencil:up（gesture → 注釈ツール）
 *   - resize（Viewer → 各モジュール）
 * 他モジュールへの依存なし。
 */

class EventBus {
  /** @type {Map<string, Set<Function>>} */
  #h = new Map();

  /**
   * @param {string}   event
   * @param {Function} handler
   * @returns {Function} unsubscribe
   */
  on(event, handler) {
    if (!this.#h.has(event)) this.#h.set(event, new Set());
    this.#h.get(event).add(handler);
    return () => this.#h.get(event)?.delete(handler);
  }

  off(event, handler) {
    this.#h.get(event)?.delete(handler);
  }

  emit(event, data) {
    for (const fn of this.#h.get(event) ?? []) {
      try { fn(data); }
      catch (e) { console.error(`[Bus] "${event}":`, e); }
    }
  }
}

const Bus = new EventBus();


/* ---- modules/core/state/EventEmitter.js ---- */
/**
 * modules/core/state/EventEmitter.js — パスベース イベントエミッター
 * M_Viewer 再設計 Phase 3
 *
 * 設計方針:
 *   - 購読はドット区切りパスで行う: 'tool.currentTool', 'document', '*'
 *   - 親パスにも伝播する: 'view.zoom' が変わると 'view' と '*' にも通知
 *   - unsubscribe 関数を返す（メモリリーク防止）
 *   - 他モジュールへの依存なし
 */

class EventEmitter {
  /** @type {Map<string, Set<Function>>} */
  #handlers = new Map();

  /**
   * 指定パスのイベントを購読
   * @param {string}   path    - 例: 'tool.currentTool' | 'document' | '*'
   * @param {Function} handler - (detail: { path, prev, next, action }) => void
   * @returns {Function} unsubscribe
   */
  on(path, handler) {
    if (typeof handler !== 'function') {
      throw new TypeError(`EventEmitter.on: handler must be a function (path="${path}")`);
    }
    if (!this.#handlers.has(path)) this.#handlers.set(path, new Set());
    this.#handlers.get(path).add(handler);
    return () => this.#handlers.get(path)?.delete(handler);
  }

  /**
   * 購読解除
   * @param {string}   path
   * @param {Function} handler
   */
  off(path, handler) {
    this.#handlers.get(path)?.delete(handler);
  }

  /**
   * 変更通知を発火（パス + すべての祖先パス + '*'）
   * @param {string} path    - 変更されたパス例: 'view.zoom'
   * @param {*}      prev    - 変更前の値
   * @param {*}      next    - 変更後の値
   * @param {object} action  - トリガーとなったアクション
   */
  emit(path, prev, next, action) {
    const detail = Object.freeze({ path, prev, next, action });

    // 変更パス自身
    this.#fire(path, detail);

    // 祖先パスに伝播: 'view.zoom' → 'view'
    const parts = path.split('.');
    for (let i = parts.length - 1; i > 0; i--) {
      this.#fire(parts.slice(0, i).join('.'), detail);
    }

    // ワイルドカード
    this.#fire('*', detail);
  }

  /**
   * 全ハンドラーを削除（クリーンアップ用）
   */
  clear() {
    this.#handlers.clear();
  }

  /** @private */
  #fire(path, detail) {
    const set = this.#handlers.get(path);
    if (!set || set.size === 0) return;
    for (const fn of set) {
      try {
        fn(detail);
      } catch (e) {
        console.error(`[EventEmitter] handler error (path="${path}"):`, e);
      }
    }
  }
}


/* ---- modules/core/state/StateLogger.js ---- */
/**
 * modules/core/state/StateLogger.js — 状態変更ログ記録
 * M_Viewer 再設計 Phase 3
 *
 * 設計方針:
 *   - アクション履歴をリングバッファで保持
 *   - デバッグ用コンソール出力（本番では自動抑制可能）
 *   - AppStore から呼び出される（外部依存なし）
 *   - IndexedDB / rAF / 描画処理一切なし
 */


const log = createLogger('StateLogger');

/** リングバッファ最大件数 */
const MAX_HISTORY = 100;

/**
 * アクション履歴エントリ
 * @typedef {Object} ActionRecord
 * @property {number} seq      シーケンス番号
 * @property {number} ts       タイムスタンプ (Date.now())
 * @property {string} type     アクション型
 * @property {*}      payload  ペイロード（参照コピー）
 * @property {string[]} changed 変更されたトップレベルキー
 * @property {number} duration  dispatch 処理時間 (ms)
 */

class StateLogger {
  /** @type {ActionRecord[]} */
  #buffer = [];
  #seq    = 0;
  #enabled = true;

  /** ログ記録を有効/無効にする */
  set enabled(v) { this.#enabled = !!v; }
  get enabled()  { return this.#enabled; }

  /**
   * アクション処理結果を記録
   * @param {object} action
   * @param {object} prevState
   * @param {object} nextState
   * @param {number} duration - dispatch 処理時間 ms
   */
  record(action, prevState, nextState, duration) {
    if (!this.#enabled) return;

    const changed = prevState === nextState
      ? []
      : Object.keys(nextState).filter(k => nextState[k] !== prevState[k]);

    const entry = Object.freeze({
      seq:      ++this.#seq,
      ts:       Date.now(),
      type:     action.type,
      payload:  action.payload,
      changed,
      duration,
    });

    // リングバッファ（古いものを削除）
    if (this.#buffer.length >= MAX_HISTORY) {
      this.#buffer.shift();
    }
    this.#buffer.push(entry);

    // コンソール出力
    if (changed.length > 0) {
      log.debug(`#${entry.seq} ${action.type} (${duration.toFixed(1)}ms) → [${changed.join(', ')}]`);
    } else {
      log.debug(`#${entry.seq} ${action.type} (no change)`);
    }
  }

  /**
   * 変更なしアクションを記録（警告レベル）
   * @param {object} action
   */
  recordNoChange(action) {
    if (!this.#enabled) return;
    log.debug(`#${this.#seq} ${action.type} → NOOP`);
  }

  /**
   * 履歴全件を返す
   * @returns {ActionRecord[]}
   */
  getHistory() {
    return [...this.#buffer];
  }

  /**
   * 最新 n 件を返す
   * @param {number} [n=20]
   * @returns {ActionRecord[]}
   */
  getRecent(n = 20) {
    return this.#buffer.slice(-n);
  }

  /**
   * コンソールに整形した履歴を出力（デバッグ用）
   */
  printHistory() {
    console.group('[StateLogger] Action History');
    for (const e of this.#buffer) {
      const changed = e.changed.length ? `→ [${e.changed.join(', ')}]` : '→ NOOP';
      console.log(`#${e.seq} ${new Date(e.ts).toISOString().slice(11,23)} ${e.type} ${changed} (${e.duration.toFixed(1)}ms)`);
    }
    console.groupEnd();
  }

  /** バッファをクリア */
  clear() {
    this.#buffer = [];
    this.#seq    = 0;
  }
}

/* ---- modules/core/state/DocumentStore.js ---- */
/**
 * modules/core/state/DocumentStore.js — ドキュメント状態リデューサー
 * M_Viewer 再設計 Phase 3
 *
 * 管理する状態:
 *   - 現在開いているドキュメント情報
 *   - 変更フラグ（isDirty / bkDirty）
 *   - ドキュメント一覧（ホーム画面用）
 *
 * ルール:
 *   - 純粋関数（引数を変更しない・副作用なし）
 *   - IndexedDB 操作禁止
 *   - 描画処理禁止
 */


/** @typedef {{ id:string, name:string, updatedAt:number }} DocMeta */

/**
 * ドキュメント状態の初期値
 * @type {DocumentState}
 */
const INITIAL_DOCUMENT = Object.freeze({
  /** 現在開いているドキュメントID（null = 未開）*/
  id:        null,
  /** ファイル名 */
  name:      null,
  /** 総ページ数 */
  pageCount: 0,
  /** ファイルサイズ（bytes）*/
  fileSize:  0,
  /** 注釈変更フラグ（PDF出力前に確認が必要かどうか）*/
  isDirty:   false,
  /** バックアップ要否フラグ（閉じる前に確認が必要かどうか）*/
  bkDirty:   false,
  /** ドキュメント一覧（ホーム画面用）*/
  list:      Object.freeze([]),
});

/**
 * ドキュメント状態リデューサー
 * @param {DocumentState} state
 * @param {{ type:string, payload:* }} action
 * @returns {DocumentState}
 */
function documentReducer(state = INITIAL_DOCUMENT, action) {
  switch (action.type) {

    case A.DOC.LOAD: {
      const { id, name, pageCount, fileSize } = action.payload;
      return Object.freeze({
        ...state,
        id,
        name,
        pageCount: pageCount ?? 0,
        fileSize:  fileSize  ?? 0,
        isDirty:   false,
        bkDirty:   false,
      });
    }

    case A.DOC.CLOSE:
      return Object.freeze({
        ...INITIAL_DOCUMENT,
        list: state.list,   // 一覧は保持する
      });

    case A.DOC.SET_DIRTY:
      if (state.isDirty === action.payload.dirty) return state;
      return Object.freeze({ ...state, isDirty: action.payload.dirty });

    case A.DOC.SET_BK_DIRTY:
      if (state.bkDirty === action.payload.dirty) return state;
      return Object.freeze({ ...state, bkDirty: action.payload.dirty });

    case A.DOC.LIST_SET:
      return Object.freeze({
        ...state,
        list: Object.freeze([...action.payload.list]),
      });

    case A.DOC.LIST_ADD: {
      const doc = action.payload.doc;
      // 同一 ID が既にあれば updatedAt を更新、なければ先頭に追加
      const exists = state.list.some(d => d.id === doc.id);
      const next = exists
        ? state.list.map(d => d.id === doc.id ? { ...d, ...doc } : d)
        : [doc, ...state.list];
      return Object.freeze({ ...state, list: Object.freeze(next) });
    }

    case A.DOC.LIST_REMOVE: {
      const next = state.list.filter(d => d.id !== action.payload.id);
      return Object.freeze({ ...state, list: Object.freeze(next) });
    }

    default:
      return state;
  }
}

/**
 * modules/core/state/ViewStore.js — ビュー状態リデューサー
 * M_Viewer 再設計 Phase 3
 *
 * 管理する状態:
 *   - 現在ページ番号（1-based）
 *   - ズーム倍率
 *   - パンオフセット（panX, panY）
 *   - ビューポートサイズ（キャンバスコンテナの CSS px）
 *
 * ルール:
 *   - 純粋関数（副作用なし）
 *   - clamp 計算のみ。描画・DOM 操作禁止
 */


/**
 * ビュー状態の初期値
 * @type {ViewState}
 */
const INITIAL_VIEW = Object.freeze({
  /** 現在表示ページ（1-based）*/
  currentPage:    1,
  /** ズーム倍率 */
  zoom:           1.0,
  /** X パンオフセット（CSS px）*/
  panX:           0,
  /** Y パンオフセット（CSS px）*/
  panY:           0,
  /** ビューポート幅（CSS px）*/
  viewportWidth:  0,
  /** ビューポート高さ（CSS px）*/
  viewportHeight: 0,
});

/**
 * ビュー状態リデューサー
 * @param {ViewState} state
 * @param {{ type:string, payload:* }} action
 * @returns {ViewState}
 */
function viewReducer(state = INITIAL_VIEW, action) {
  switch (action.type) {

    case A.VIEW.SET_PAGE: {
      const page = action.payload.page;
      if (state.currentPage === page) return state;
      return Object.freeze({ ...state, currentPage: page });
    }

    case A.VIEW.SET_ZOOM: {
      const zoom = clamp(action.payload.zoom, LIMITS.ZOOM_MIN, LIMITS.ZOOM_MAX);
      if (state.zoom === zoom) return state;
      return Object.freeze({ ...state, zoom });
    }

    case A.VIEW.SET_PAN: {
      const { panX, panY } = action.payload;
      if (state.panX === panX && state.panY === panY) return state;
      return Object.freeze({ ...state, panX, panY });
    }

    case A.VIEW.SET_VIEWPORT: {
      const { width, height } = action.payload;
      if (state.viewportWidth === width && state.viewportHeight === height) return state;
      return Object.freeze({ ...state, viewportWidth: width, viewportHeight: height });
    }

    case A.VIEW.RESET:
      return Object.freeze({
        ...state,
        zoom: 1.0,
        panX: 0,
        panY: 0,
      });

    // ドキュメントを閉じたらビューをリセット
    case A.DOC.CLOSE:
      return INITIAL_VIEW;

    default:
      return state;
  }
}

// documentReducer が DOC.CLOSE を処理するが viewReducer でも

/**
 * modules/core/state/ToolStore.js — ツール状態リデューサー
 * M_Viewer 再設計 Phase 3
 *
 * 管理する状態:
 *   - 現在アクティブなツール種別
 *   - 図形種別・選択モード
 *   - ペン/蛍光ペン カラーインデックス
 *   - ツールごとのサイズ設定
 *
 * ルール:
 *   - 純粋関数（副作用なし）
 *   - 描画処理・DOM 操作禁止
 */


/**
 * ツール状態の初期値
 * @type {ToolState}
 */
const INITIAL_TOOL = Object.freeze({
  /** 現在のツール */
  currentTool:   TOOL.PEN,
  /** 現在の図形種別（TOOL.SHAPE 選択時に有効）*/
  currentShape:  SHAPE.ARROW,
  /** 選択ツールのモード */
  selMode:       SEL_MODE.RECT,
  /** ペンカラーインデックス（0-3）*/
  penColorIdx:   0,
  /** 蛍光ペンカラーインデックス（0-3）*/
  hlColorIdx:    0,
  /** ツールごとのサイズ（TOOL_DEFAULT_SIZES のコピー）*/
  sizes: Object.freeze({ ...TOOL_DEFAULT_SIZES }),
});

/**
 * ツール状態リデューサー
 * @param {ToolState} state
 * @param {{ type:string, payload:* }} action
 * @returns {ToolState}
 */
function toolReducer(state = INITIAL_TOOL, action) {
  switch (action.type) {

    case A.TOOL.SELECT: {
      const { tool } = action.payload;
      if (!(tool in TOOL_VALUES)) return state;  // 不正値は無視
      if (state.currentTool === tool) return state;
      return Object.freeze({ ...state, currentTool: tool });
    }

    case A.TOOL.SET_SHAPE: {
      const { shape } = action.payload;
      if (!(shape in SHAPE_VALUES)) return state;
      if (state.currentShape === shape) return state;
      return Object.freeze({ ...state, currentShape: shape });
    }

    case A.TOOL.SET_SELMODE: {
      const { selMode } = action.payload;
      if (!(selMode in SELMODE_VALUES)) return state;
      if (state.selMode === selMode) return state;
      return Object.freeze({ ...state, selMode });
    }

    case A.TOOL.SET_PEN_COLOR_IDX: {
      const idx = action.payload.idx;
      if (idx < 0 || idx > 3) return state;
      if (state.penColorIdx === idx) return state;
      return Object.freeze({ ...state, penColorIdx: idx });
    }

    case A.TOOL.SET_HL_COLOR_IDX: {
      const idx = action.payload.idx;
      if (idx < 0 || idx > 3) return state;
      if (state.hlColorIdx === idx) return state;
      return Object.freeze({ ...state, hlColorIdx: idx });
    }

    case A.TOOL.SET_SIZE: {
      const { toolKey, size } = action.payload;
      if (!(toolKey in state.sizes)) return state;
      const s = Math.max(1, Math.min(100, size));
      if (state.sizes[toolKey] === s) return state;
      return Object.freeze({
        ...state,
        sizes: Object.freeze({ ...state.sizes, [toolKey]: s }),
      });
    }

    // ドキュメントを閉じてもツール設定は保持（次回起動時に引き継ぐ）

    default:
      return state;
  }
}

// 有効値セット（検証用）
const TOOL_VALUES   = Object.fromEntries(Object.values(TOOL).map(v   => [v, 1]));
const SHAPE_VALUES  = Object.fromEntries(Object.values(SHAPE).map(v  => [v, 1]));
const SELMODE_VALUES= Object.fromEntries(Object.values(SEL_MODE).map(v => [v, 1]));

/**
 * UI 状態の初期値
 * @type {UiState}
 */
const INITIAL_UI = Object.freeze({
  /** 現在の画面 */
  screen:        SCREEN.HOME,
  /** ローディング表示中か */
  isLoading:     false,
  /** ローディングメッセージ */
  loadingMsg:    '',
  /** 保存処理中か */
  isSaving:      false,
  /** 表示中ダイアログ名（null = 非表示）*/
  dialogName:    null,
  /** ダイアログに渡すデータ */
  dialogData:    null,
});

/**
 * UI 状態リデューサー
 * @param {UiState} state
 * @param {{ type:string, payload:* }} action
 * @returns {UiState}
 */
function uiReducer(state = INITIAL_UI, action) {
  switch (action.type) {

    case A.UI.SET_SCREEN: {
      const { screen } = action.payload;
      if (state.screen === screen) return state;
      return Object.freeze({ ...state, screen });
    }

    case A.UI.SET_LOADING: {
      const { loading, msg } = action.payload;
      if (state.isLoading === loading && state.loadingMsg === msg) return state;
      return Object.freeze({ ...state, isLoading: loading, loadingMsg: msg ?? '' });
    }

    case A.UI.SET_SAVING: {
      const { saving } = action.payload;
      if (state.isSaving === saving) return state;
      return Object.freeze({ ...state, isSaving: saving });
    }

    case A.UI.SHOW_DIALOG: {
      const { name, data } = action.payload;
      return Object.freeze({ ...state, dialogName: name, dialogData: data ?? null });
    }

    case A.UI.HIDE_DIALOG:
      if (state.dialogName === null) return state;
      return Object.freeze({ ...state, dialogName: null, dialogData: null });

    // ドキュメントを開いたらビューア画面に遷移
    case A.DOC.LOAD:
      return Object.freeze({ ...state, screen: SCREEN.VIEWER });

    // ドキュメントを閉じたらホームに戻りダイアログも閉じる
    case A.DOC.CLOSE:
      return Object.freeze({
        ...state,
        screen:     SCREEN.HOME,
        dialogName: null,
        dialogData: null,
        isSaving:   false,
      });

    default:

  }
}


/* ---- modules/core/state/SubWindowStore.js ---- */
/**
 * modules/core/state/SubWindowStore.js — サブ窓状態リデューサー
 * M_Viewer 再設計 Phase 3
 *
 * 管理する状態:
 *   - サブ窓配列（最大 LIMITS.MAX_SUBWIN 個）
 *   - 各サブ窓の位置・サイズ・ページ・ズーム・z-index
 *
 * ルール:
 *   - 純粋関数（副作用なし）
 *   - DOM 操作・描画処理禁止
 *   - ドラッグ/リサイズのリアルタイム移動は SubWindow UI モジュールが担当
 *     → 確定値のみ SUBWIN.UPDATE でディスパッチする
 */


/**
 * @typedef {Object} SubWinState
 * @property {string}  id       ユニーク ID
 * @property {string}  docId    紐付けるドキュメント ID
 * @property {number}  page     表示ページ（1-based）
 * @property {number}  x        左位置（CSS px）
 * @property {number}  y        上位置（CSS px）
 * @property {number}  w        幅（CSS px）
 * @property {number}  h        高さ（CSS px）
 * @property {number}  zoom     ズーム倍率
 * @property {number}  zIndex   重なり順
 */

/**
 * サブ窓状態の初期値
 * @type {{ windows: SubWinState[], nextZ: number }}
 */
const INITIAL_SUBWIN = Object.freeze({
  /** サブ窓配列 */
  windows: Object.freeze([]),
  /** 次に割り当てる z-index ベース値 */
  nextZ:   100,
});

/**
 * サブ窓状態リデューサー
 * @param {{ windows: SubWinState[], nextZ: number }} state
 * @param {{ type:string, payload:* }} action
 * @returns {{ windows: SubWinState[], nextZ: number }}
 */
function subwinReducer(state = INITIAL_SUBWIN, action) {
  switch (action.type) {

    case A.SUBWIN.ADD: {
      // 上限チェック
      if (state.windows.length >= LIMITS.MAX_SUBWIN) return state;
      const win = Object.freeze({
        ...action.payload.win,
        zIndex: state.nextZ,
      });
      return Object.freeze({
        ...state,
        windows: Object.freeze([...state.windows, win]),
        nextZ:   state.nextZ + 1,
      });
    }

    case A.SUBWIN.UPDATE: {
      const { id, patch } = action.payload;
      const idx = state.windows.findIndex(w => w.id === id);
      if (idx === -1) return state;
      const updated = Object.freeze({ ...state.windows[idx], ...patch });
      const next = [...state.windows];
      next[idx] = updated;
      return Object.freeze({ ...state, windows: Object.freeze(next) });
    }

    case A.SUBWIN.REMOVE: {
      const next = state.windows.filter(w => w.id !== action.payload.id);
      if (next.length === state.windows.length) return state;
      return Object.freeze({ ...state, windows: Object.freeze(next) });
    }

    case A.SUBWIN.REMOVE_ALL:
      if (state.windows.length === 0) return state;
      return Object.freeze({ ...state, windows: Object.freeze([]) });

    case A.SUBWIN.FOCUS: {
      const { id } = action.payload;
      const idx = state.windows.findIndex(w => w.id === id);
      if (idx === -1) return state;
      // 対象ウィンドウを最前面に
      const next = state.windows.map((w, i) =>
        i === idx ? Object.freeze({ ...w, zIndex: state.nextZ }) : w
      );
      return Object.freeze({
        ...state,
        windows: Object.freeze(next),
        nextZ:   state.nextZ + 1,
      });
    }

    // ドキュメントを閉じたらサブ窓も全削除
    case A.DOC.CLOSE:
      return Object.freeze({ ...INITIAL_SUBWIN });

    default:
      return state;
  }
}


/* ---- modules/core/state/AnnotationStore.js ---- */
/**
 * modules/core/state/AnnotationStore.js — 注釈状態リデューサー
 * M_Viewer 再設計 Phase 3
 *
 * 管理する状態:
 *   - ページごとのストローク配列 { [page:number]: Stroke[] }
 *
 * @typedef {Object} Stroke
 * @property {string}   id      ユニーク ID
 * @property {string}   type    ツール種別 (pen / hl / arrow / rect / circle / line / text / eraser)
 * @property {string}   color   描画色
 * @property {number}   size    線幅
 * @property {number}   opacity 不透明度
 * @property {Array<{x:number,y:number,p:number}>} points 座標列（PDF座標系）
 * @property {number}   x1      バウンディングボックス
 * @property {number}   y1
 * @property {number}   x2
 * @property {number}   y2
 * @property {string}   [text]  テキスト注釈の文字列
 * @property {number}   page    ページ番号（1-based）
 * @property {number}   ts      作成タイムスタンプ
 *
 * ルール:
 *   - 純粋関数（副作用なし）
 *   - IndexedDB 操作禁止
 *   - ストローク上限チェック（LIMITS.MAX_STROKES_PER_PAGE）
 *   - 消しゴムストロークは IDB 保存前に除去（AppStore 外の処理）
 */


/**
 * 注釈状態の初期値
 * @type {{ pages: Object.<number, Stroke[]> }}
 */
const INITIAL_ANNOTATION = Object.freeze({
  /**
   * ページ番号（1-based）→ ストローク配列
   * @type {Object.<number, Stroke[]>}
   */
  pages: Object.freeze({}),
});

/**
 * 注釈状態リデューサー
 * @param {{ pages: Object.<number, Stroke[]> }} state
 * @param {{ type:string, payload:*, meta:* }} action
 * @returns {{ pages: Object.<number, Stroke[]> }}
 */
function annotationReducer(state = INITIAL_ANNOTATION, action) {
  switch (action.type) {

    case A.ANN.ADD_STROKE: {
      const { page, stroke } = action.payload;
      const current = state.pages[page] ?? [];

      // ストローク上限チェック
      if (current.length >= LIMITS.MAX_STROKES_PER_PAGE) {
        console.warn(`[AnnotationStore] ページ${page}のストロークが上限(${LIMITS.MAX_STROKES_PER_PAGE})に達しました`);
        return state;
      }

      const next = Object.freeze([...current, Object.freeze(stroke)]);
      return Object.freeze({
        ...state,
        pages: Object.freeze({ ...state.pages, [page]: next }),
      });
    }

    case A.ANN.DELETE_STROKES: {
      const { page, ids } = action.payload;
      const current = state.pages[page];
      if (!current || current.length === 0) return state;

      const idSet = new Set(ids);
      const next  = current.filter(s => !idSet.has(s.id));
      if (next.length === current.length) return state;  // 変化なし

      return Object.freeze({
        ...state,
        pages: Object.freeze({ ...state.pages, [page]: Object.freeze(next) }),
      });
    }

    case A.ANN.LOAD: {
      // IDB / バックアップからの全ページ一括復元
      const { data } = action.payload;
      const pages = {};
      for (const [page, strokes] of Object.entries(data)) {
        pages[page] = Object.freeze(strokes.map(s => Object.freeze(s)));
      }
      return Object.freeze({ pages: Object.freeze(pages) });
    }

    case A.ANN.CLEAR_PAGE: {
      const { page } = action.payload;
      if (!state.pages[page]) return state;
      const next = { ...state.pages };
      delete next[page];
      return Object.freeze({ ...state, pages: Object.freeze(next) });
    }

    case A.ANN.CLEAR_ALL:
    case A.DOC.CLOSE:
      return INITIAL_ANNOTATION;

    default:
      return state;
  }
}

/* ============================================================
   セレクター（純粋関数・副作用なし）
   ============================================================ */

/**
 * 指定ページのストローク配列を返す
 * @param {{ pages: Object.<number, Stroke[]> }} annState
 * @param {number} page
 * @returns {Stroke[]}
 */
function selectStrokes(annState, page) {
  return annState.pages[page] ?? [];
}

/**
 * 全ページのストローク総数を返す
 * @param {{ pages: Object.<number, Stroke[]> }} annState
 * @returns {number}
 */
function selectTotalStrokeCount(annState) {
  return Object.values(annState.pages).reduce((sum, arr) => sum + arr.length, 0);
}

/**
 * 注釈スナップショット（Undo/Redo 用）
 * pages の深いコピーを返す（mutable な Map として返す）
 * @param {{ pages: Object.<number, Stroke[]> }} annState
 * @returns {Object.<number, Stroke[]>}
 */
function snapshotPages(annState) {
  const snap = {};
  for (const [page, strokes] of Object.entries(annState.pages)) {
    snap[page] = [...strokes];
  }
  return snap;
}


/* ---- modules/core/state/AppStore.js ---- */
/**
 * modules/core/state/AppStore.js — 中央状態ストア
 * M_Viewer 再設計 Phase 3
 *
 * 設計方針:
 *   - Redux ライクな Action → Reducer → State → Subscribers パターン
 *   - すべての状態変更は dispatch(action) 経由のみ
 *   - 再入防止: dispatch 中は #dispatching フラグを立て、
 *     イベント発火は dispatch 完了後に行う（ハンドラ内から dispatch 可能）
 *   - 細粒度サブスクリプション: Store.on('tool.currentTool', fn)
 *   - IndexedDB / rAF / 描画処理一切なし
 */


const log = createLogger('AppStore');

/**
 * アプリ状態の初期値（全スライス）
 * @type {AppState}
 */
const INITIAL_STATE = Object.freeze({
  document:   INITIAL_DOCUMENT,
  view:       INITIAL_VIEW,
  tool:       INITIAL_TOOL,
  ui:         INITIAL_UI,
  subwin:     INITIAL_SUBWIN,
  annotation: INITIAL_ANNOTATION,
});

/**
 * リデューサーマップ
 * @type {Object.<string, Function>}
 */
const REDUCERS = {
  document:   documentReducer,
  view:       viewReducer,
  tool:       toolReducer,
  ui:         uiReducer,
  subwin:     subwinReducer,
  annotation: annotationReducer,
};

/* ============================================================
   AppStore クラス
   ============================================================ */
class AppStoreClass {
  /** @type {AppState} */
  #state       = INITIAL_STATE;
  #emitter     = new EventEmitter();
  #logger      = new StateLogger();
  #dispatching = false;
  /** dispatch 中に積まれたアクションキュー（再入時用）*/
  #queue       = [];

  /* ---- 状態アクセス ---- */

  /**
   * 全状態スナップショットを返す（読み取り専用）
   * @returns {AppState}
   */
  get state() { return this.#state; }

  /**
   * 指定パスの値を返す
   * @param {string} path - 例: 'tool.currentTool' | 'document.isDirty'
   * @returns {*}
   */
  get(path) {
    return getPath(this.#state, path);
  }

  /* ---- ディスパッチ ---- */

  /**
   * アクションをディスパッチする
   * @param {{ type:string, payload:*, meta:* }} action
   */
  dispatch(action) {
    if (!action || typeof action.type !== 'string') {
      throw new ActionError('dispatch: action.type must be a string', action?.type);
    }

    // 再入時はキューに積む
    if (this.#dispatching) {
      this.#queue.push(action);
      return;
    }

    this.#dispatching = true;
    const t0 = performance.now();
    let prevState = this.#state;
    let nextState = prevState;

    try {
      nextState = this.#applyReducers(prevState, action);
      this.#state = nextState;
    } catch (e) {
      this.#dispatching = false;
      throw new StateError(`dispatch failed for "${action.type}": ${e.message}`, e);
    }

    const duration = performance.now() - t0;
    this.#logger.record(action, prevState, nextState, duration);
    this.#dispatching = false;

    // 変更があった場合だけ通知
    if (nextState !== prevState) {
      this.#notifyChanges(action, prevState, nextState);
    }

    // キューに溜まったアクションを処理
    while (this.#queue.length > 0) {
      const queued = this.#queue.shift();
      this.dispatch(queued);
    }
  }

  /* ---- サブスクリプション ---- */

  /**
   * 状態変更を購読する
   * @param {string}   path    - ドット区切りパス 例: 'tool.currentTool' | '*'
   * @param {Function} handler - ({ path, prev, next, action }) => void
   * @returns {Function} unsubscribe
   */
  on(path, handler) {
    return this.#emitter.on(path, handler);
  }

  /**
   * 指定パスの値が変化したとき handler を呼ぶ
   * 登録直後に現在値で1回呼ぶ（初期化処理を自然に書ける）
   * @param {string}   path
   * @param {Function} handler - (currentValue) => void
   * @returns {Function} unsubscribe
   */
  watch(path, handler) {
    const unsub = this.#emitter.on(path, ({ next }) => handler(next));
    // 即時実行（現在値を渡す）
    try {
      handler(this.get(path));
    } catch (e) {
      log.error(`watch immediate call error (path="${path}"):`, e);
    }
    return unsub;
  }

  /* ---- 注釈スナップショット（Undo/Redo 準備） ---- */

  /**
   * 現在の注釈状態のスナップショットを返す（Undo/Redo 拡張用）
   * @returns {Object.<number, Stroke[]>}
   */
  snapshotAnnotations() {
    return snapshotPages(this.#state.annotation);
  }

  /* ---- デバッグ ---- */

  /**
   * StateLogger のログ出力（開発用）
   */
  printHistory() {
    this.#logger.printHistory();
  }

  /**
   * StateLogger の参照（テスト・デバッグ用）
   * @returns {StateLogger}
   */
  get logger() { return this.#logger; }

  /* ---- 内部処理 ---- */

  /**
   * 全リデューサーにアクションを適用する
   * @param {AppState} prevState
   * @param {object}   action
   * @returns {AppState}
   */
  #applyReducers(prevState, action) {
    let changed = false;
    const next  = {};

    for (const [slice, reducer] of Object.entries(REDUCERS)) {
      const prevSlice = prevState[slice];
      const nextSlice = reducer(prevSlice, action);
      next[slice] = nextSlice;
      if (nextSlice !== prevSlice) changed = true;
    }

    if (!changed) return prevState;
    return Object.freeze(next);
  }

  /**
   * 変更されたスライスのパスを特定して EventEmitter に通知する
   * @param {object}   action
   * @param {AppState} prevState
   * @param {AppState} nextState
   */
  #notifyChanges(action, prevState, nextState) {
    for (const slice of Object.keys(REDUCERS)) {
      if (nextState[slice] === prevState[slice]) continue;

      // トップレベルスライス変更を通知
      this.#emitter.emit(slice, prevState[slice], nextState[slice], action);

      // スライス内の各キーを細粒度で通知
      const prev = prevState[slice];
      const next = nextState[slice];
      if (prev && next && typeof next === 'object') {
        for (const key of Object.keys(next)) {
          if (next[key] !== prev[key]) {
            this.#emitter.emit(`${slice}.${key}`, prev[key], next[key], action);
          }
        }
      }
    }
  }
}

/* ============================================================
   シングルトンエクスポート
   ============================================================ */
const Store = new AppStoreClass();


/* ---- modules/core/renderer.js ---- */
/**
 * modules/core/renderer.js — rAF スケジューラ（シングルトン）
 * M_Viewer 再設計 Phase 4
 *
 * 設計方針:
 *   - 全描画を1本の rAF ループに集約（多重 rAF 防止）
 *   - dirty フラグパターン: 変化がない限り再描画しない
 *   - schedule(name, fn) / unschedule(name) で継続ジョブ管理
 *   - once(fn) で次フレーム1回限り実行
 *   - pause / resume でダイアログ表示中の描画停止
 */

const log = createLogger('Renderer');

class RafScheduler {
  #jobs    = new Map();   // name → fn(ts)
  #once    = [];
  #rafId   = null;
  #running = false;
  #paused  = false;

  start() {
    if (this.#running) return;
    this.#running = true;
    this.#tick();
    log.info('started');
  }

  stop() {
    this.#running = false;
    if (this.#rafId !== null) {
      cancelAnimationFrame(this.#rafId);
      this.#rafId = null;
    }
  }

  pause()  { this.#paused = true;  }
  resume() { this.#paused = false; }

  get isRunning() { return this.#running; }
  get isPaused()  { return this.#paused;  }

  /**
   * 継続ジョブ登録（同名上書き）
   * @param {string}   name
   * @param {Function} fn  (timestamp: DOMHighResTimeStamp) => void
   */
  schedule(name, fn) {
    if (typeof fn !== 'function') throw new TypeError(`schedule: fn must be a function`);
    this.#jobs.set(name, fn);
    if (!this.#running) this.start();
  }

  unschedule(name) { this.#jobs.delete(name); }

  /**
   * 次フレームで1回だけ実行
   * @param {Function} fn
   */
  once(fn) {
    if (typeof fn !== 'function') throw new TypeError(`once: fn must be a function`);
    this.#once.push(fn);
    if (!this.#running) this.start();
  }

  clear() {
    this.#jobs.clear();
    this.#once = [];
  }

  get jobNames() { return [...this.#jobs.keys()]; }

  #tick = (ts = 0) => {
    if (!this.#running) return;
    this.#rafId = requestAnimationFrame(this.#tick);
    if (this.#paused) return;

    // 1回限りジョブ
    if (this.#once.length) {
      const q = this.#once.splice(0);
      for (const fn of q) {
        try { fn(ts); } catch (e) { log.error('once job error:', e); }
      }
    }

    // 継続ジョブ
    for (const [name, fn] of this.#jobs) {
      try {
        fn(ts);
      } catch (e) {
        log.error(`job "${name}" threw, removing:`, e);
        this.#jobs.delete(name);
      }
    }
  };
}

const Renderer = new RafScheduler();

/**
