<script>
window.showToast = function(msg, duration = 3000) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = 'toast-msg';
  toast.innerText = msg;
  container.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 50);
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, duration);
};

/* Logger & Utilities */
const DBG={info(m,...v){console.log(`[INFO] ${m}`,...v)},error(m,...v){console.error(`[ERR] ${m}`,...v)}};
const EventBus={
  _evs:{},
  on(e,f){(this._evs[e]=this._evs[e]||[]).push(f)},
  emit(e,...a){if(this._evs[e])this._evs[e].forEach(f=>f(...a))}
};
const Utils={
  safeKey(s){return s.replace(/[\.\#\$\/\[\]]/g,'_')},
  getVPScale(v,r=0){if(r%180===0)return{x:v.transform[0],y:v.transform[3]};return{x:v.transform[1],y:v.transform[2]}},
  distPtSeg(x,y,x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1;
    if(dx===0&&dy===0)return Math.hypot(x-x1,y-y1);
    const t=((x-x1)*dx+(y-y1)*dy)/(dx*dx+dy*dy);
    if(t<0)return Math.hypot(x-x1,y-y1);
    if(t>1)return Math.hypot(x-x2,y-y2);
    return Math.hypot(x-(x1+t*dx),y-(y1+t*dy));
  },
  isPalmContact(e){
    if(!e.targetTouches||e.targetTouches.length===0)return false;
    const t=e.targetTouches[0];
    if(typeof t.radiusX==='number'&&typeof t.radiusY==='number'){
      return t.radiusX>45&&t.radiusY>45;
    }
    return false;
  }
};

/* IndexedDB Store */
const IDBStore={
  _db:null,
  init(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open("MViewerStore",4);
      r.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv");
      };
      r.onsuccess=e=>{this._db=e.target.result;res()};
      r.onerror=e=>rej(e.target.error);
    });
  },
  get(k){
    return new Promise((res,rej)=>{
      if(!this._db)return res(null);
      const t=this._db.transaction("kv","readonly"),s=t.objectStoreNames.contains("kv")?t.objectStore("kv"):null;
      if(!s)return res(null);
      const r=s.get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
    });
  },
  set(k,v){
    return new Promise((res,rej)=>{
      if(!this._db)return res();
      const t=this._db.transaction("kv","readwrite"),s=t.objectStore("kv");
      const r=s.put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);
    });
  },
  del(k){
    return new Promise((res,rej)=>{
      if(!this._db)return res();
      const t=this._db.transaction("kv","readwrite"),s=t.objectStore("kv");
      const r=s.delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);
    });
  },
  async getAllKeys(){
    return new Promise((res)=>{
      if(!this._db)return res([]);
      const t=this._db.transaction("kv","readonly"),s=t.objectStore("kv"),r=s.getAllKeys();
      r.onsuccess=()=>res(r.result);r.onerror=()=>res([]);
    });
  }
};

/* Document & Storage Management */
const DocMgr={
  async saveDoc(name,bytes){
    const id=Utils.safeKey(name)+'_'+Date.now();
    const meta={id,name,ts:Date.now()};
    await IDBStore.set('doc:'+id,{meta,originalPdfBytes:bytes});
    let idx=await IDBStore.get('doc_index').catch(()=>[])||[];
    idx=idx.filter(i=>i.name!==name);idx.push(meta);
    await IDBStore.set('doc_index',idx);
    return id;
  },
  async getList(){return await IDBStore.get('doc_index').catch(()=>[])||[]},
  async findByName(name){
    const idx=await this.getList();const m=idx.find(i=>i.name===name);
    if(m)return await IDBStore.get('doc:'+m.id).catch(()=>null);return null;
  }
};

const AutoSave={
  _tid:null,_pending:false,
  trigger(){
    App.updateSaveStatus("● 未保存の変更");
    if(this._tid)clearTimeout(this._tid);
    this._tid=setTimeout(()=>this.saveNow(),1200);
  },
  async saveNow(){
    if(!App.currentFileName)return;
    if(this._tid)clearTimeout(this._tid);
    this._pending=true;
    try{
      const key='f:'+Utils.safeKey(App.currentFileName);
      const data={file:App.currentFileName,page:App.pageNum,strokes:App.strokes,ts:Date.now()};
      await IDBStore.set(key,data);
      App.updateSaveStatus("● 同期完了");
    }catch(e){
      App.updateSaveStatus("⚠️ 保存失敗");
    }finally{this._pending=false;}
  },
  emergencySave(){
    if(!App.currentFileName)return;
    const data={file:App.currentFileName,page:App.pageNum,strokes:App.strokes,ts:Date.now()};
    try{localStorage.setItem('mv_lsbk2',JSON.stringify(data));}catch(_){}
  }
};

/* Draw Utilities */
const DrawUtil={
  drawStroke(ctx,st,scaleX,scaleY,vp){
    if(!st.pts||st.pts.length===0)return;
    ctx.save();
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle=st.color||'#ff0000';
    ctx.lineWidth=(st.width||2)*Math.abs(scaleX);
    if(st.tool==='marker'){ctx.globalAlpha=0.4;ctx.lineWidth=(st.width||12)*Math.abs(scaleX);}
    ctx.beginPath();
    const p0=st.pts[0];ctx.moveTo(p0.x,p0.y);
    if(st.pts.length===1){ctx.lineTo(p0.x+0.1,p0.y);}
    else if(st.pts.length===2){ctx.lineTo(st.pts[1].x,st.pts[1].y);}
    else{
      let i;
      for(i=1;i<st.pts.length-2;i++){
        const xc=(st.pts[i].x+st.pts[i+1].x)/2;
        const yc=(st.pts[i].y+st.pts[i+1].y)/2;
        ctx.quadraticCurveTo(st.pts[i].x,st.pts[i].y,xc,yc);
      }
      ctx.quadraticCurveTo(st.pts[i].x,st.pts[i].y,st.pts[i+1].x,st.pts[i+1].y);
    }
    ctx.stroke();ctx.restore();
  },
  applyEraser(strokes,p1,p2,radius){
    let changed=false;
    for(let i=0;i<strokes.length;i++){
      const st=strokes[i];if(!st||!st.pts)continue;
      let hit=false;const newStrokes=[];let curPts=[];
      for(let j=0;j<st.pts.length;j++){
        const p=st.pts[j];let d=Infinity;
        if(j>0){const prev=st.pts[j-1];d=Utils.distPtSeg(p.x,p.y,prev.x,prev.y,p1.x,p1.y,p2.x,p2.y);}
        else{d=Math.hypot(p.x-p1.x,p.y-p1.y);}
        if(d<=radius){hit=true;changed=true;if(curPts.length>0){newStrokes.push({...st,pts:curPts});curPts=[];}}
        else{curPts.push(p);}
      }
      if(curPts.length>0)newStrokes.push({...st,pts:curPts});
      if(hit){strokes.splice(i,1,...newStrokes);i+=newStrokes.length-1;}
    }
    return changed;
  }
};

/* Sub Window Management */
class SubWin {
  constructor(id,title,page,opts={}){
    this.id=id;this.title=title;this.page=page;
    this.innerScale=opts.scale||0.8;this.offX=opts.offX||0;this.offY=opts.offY||0;
    this._cleanups=[];this.div=null;this.cvs=null;this.ctx=null;
    this.initDOM();this.initEvents();this.render();
  }
  initDOM(){
    const d=document.createElement('div');d.className='sub-win';
    d.style.left=(140+(this.id%4)*20)+'px';d.style.top=(80+(this.id%3)*20)+'px';
    d.innerHTML=`
      <div class="win-header">
        <div class="win-title">[P.${this.page}] ${this.title}</div>
        <div class="win-btn" id="sw-zout-${this.id}">➖</div>
        <div class="win-btn" id="sw-zin-${this.id}">➕</div>
        <div class="win-btn" id="sw-cls-${this.id}">✖</div>
      </div>
      <div class="win-body"><canvas id="sw-cvs-${this.id}" style="position:absolute;left:0;top:0"></canvas></div>
      <div class="win-resizer"></div>
    `;
    document.getElementById('main-container').appendChild(d);this.div=d;
    this.cvs=d.querySelector(`#sw-cvs-${this.id}`);this.ctx=this.cvs.getContext('2d');
  }
  initEvents(){
    const hd=this.div.querySelector('.win-header');
    let drag=false,sx,sy,sl,st;
    const startDrag=e=>{
      if(e.target.classList.contains('win-btn'))return;
      drag=true;const p=e.touches?e.touches[0]:e;
      sx=p.clientX;sy=p.clientY;sl=this.div.offsetLeft;st=this.div.offsetTop;
      if(e.pointerId)hd.setPointerCapture(e.pointerId);
    };
    const moveDrag=e=>{
      if(!drag)return;const p=e.touches?e.touches[0]:e;
      this.div.style.left=(sl+(p.clientX-sx))+'px';this.div.style.top=(st+(p.clientY-sy))+'px';
    };
    const endDrag=e=>{drag=false;if(e.pointerId)try{hd.releasePointerCapture(e.pointerId)}catch(_){}};
    hd.addEventListener('pointerdown',startDrag);hd.addEventListener('pointermove',moveDrag);
    hd.addEventListener('pointerup',endDrag);
    this._cleanups.push(()=>{
      hd.removeEventListener('pointerdown',startDrag);
      hd.removeEventListener('pointermove',moveDrag);
      hd.removeEventListener('pointerup',endDrag);
    });

    const rsz=this.div.querySelector('.win-resizer');
    let rszing=false,rw,rh;
    const startRsz=e=>{rszing=true;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;rw=this.div.offsetWidth;rh=this.div.offsetHeight;if(e.pointerId)rsz.setPointerCapture(e.pointerId);e.stopPropagation();};
    const moveRsz=e=>{if(!rszing)return;const p=e.touches?e.touches[0]:e;this.div.style.width=Math.max(160,rw+(p.clientX-sx))+'px';this.div.style.height=Math.max(120,rh+(p.clientY-sy))+'px';this.render();};
    const endRsz=e=>{rszing=false;if(e.pointerId)try{rsz.releasePointerCapture(e.pointerId)}catch(_){}};
    rsz.addEventListener('pointerdown',startRsz);rsz.addEventListener('pointermove',moveRsz);
    rsz.addEventListener('pointerup',endRsz);
    this._cleanups.push(()=>{
      rsz.removeEventListener('pointerdown',startRsz);
      rsz.removeEventListener('pointermove',moveRsz);
      rsz.removeEventListener('pointerup',endRsz);
    });

    const bdy=this.div.querySelector('.win-body');
    let pan=false,px,py;
    const startPan=e=>{
      if(App.currentTool==='pen'||App.currentTool==='marker'||App.currentTool==='eraser'){
        this._startDraw(e);return;
      }
      pan=true;const p=e.touches?e.touches[0]:e;px=p.clientX;py=p.clientY;
    };
    const movePan=e=>{
      if(this._drawing){this._moveDraw(e);return;}
      if(!pan)return;const p=e.touches?e.touches[0]:e;this.offX+=(p.clientX-px);this.offY+=(p.clientY-py);px=p.clientX;py=p.clientY;this.render();
    };
    const endPan=e=>{pan=false;this._endDraw(e);};
    bdy.addEventListener('pointerdown',startPan);bdy.addEventListener('pointermove',movePan);
    bdy.addEventListener('pointerup',endPan);bdy.addEventListener('pointerleave',endPan);
    this._cleanups.push(()=>{
      bdy.removeEventListener('pointerdown',startPan);bdy.removeEventListener('pointermove',movePan);
      bdy.removeEventListener('pointerup',endPan);bdy.removeEventListener('pointerleave',endPan);
    });

    this.div.querySelector(`#sw-zout-${this.id}`).onclick=()=>{this.innerScale=Math.max(0.2,this.innerScale-0.1);this.render();};
    this.div.querySelector(`#sw-zin-${this.id}`).onclick=()=>{this.innerScale=Math.min(5,this.innerScale+0.1);this.render();};
    this.div.querySelector(`#sw-cls-${this.id}`).onclick=()=>{this.close();};
  }
  async render(){
    if(!App.pdfDoc||!this.cvs)return;
    const bdy=this.div.querySelector('.win-body');
    const w=bdy.clientWidth,h=bdy.clientHeight;
    this.cvs.width=w;this.cvs.height=h;this.cvs.style.width=w+'px';this.cvs.style.height=h+'px';
    this.ctx.fillStyle='#14171c';this.ctx.fillRect(0,0,w,h);
    try{
      const pg=await App.pdfDoc.getPage(this.page);const vp=pg.getViewport({scale:this.innerScale});
      const sc=Utils.getVPScale(vp,vp.rotation);
      this.ctx.save();this.ctx.translate(this.offX,this.offY);
      this.ctx.save();
      if(vp.rotation===90){this.ctx.translate(vp.height,0);this.ctx.rotate(Math.PI/2);}
      else if(vp.rotation===180){this.ctx.translate(vp.width,vp.height);this.ctx.rotate(Math.PI);}
      else if(vp.rotation===270){this.ctx.translate(0,vp.width);this.ctx.rotate(-Math.PI/2);}
      await pg.render({canvasContext:this.ctx,viewport:vp}).promise.catch(()=>{});
      this.ctx.restore();
      const sts=App.strokes[this.page]||[];
      sts.forEach(st=>DrawUtil.drawStroke(this.ctx,st,sc.x,sc.y,vp));
      this.ctx.restore();
    }catch(_){}
  }
  _startDraw(e){
    if(e.pointerType==='touch'&&App.currentTool!=='eraser')return;
    this._drawing=true;const r=this.cvs.getBoundingClientRect();
    const px=e.clientX-r.left-this.offX,py=e.clientY-r.top-this.offY;
    this._lastPt={x:px,y:py};
    if(App.currentTool==='eraser'){
      const changed=DrawUtil.applyEraser(App.strokes[this.page]||[],this._lastPt,this._lastPt,16*this.innerScale);
      if(changed){this.render();EventBus.emit('stroke-updated',this.page);}
    }else{
      this._curStroke={tool:App.currentTool,color:App.currentTool==='marker'?'#ffff00':'#ff0000',width:App.currentTool==='marker'?12:2,pts:[this._lastPt]};
      App.strokes[this.page]=App.strokes[this.page]||[];
      if(App.strokes[this.page].length>=500){
        App.strokes[this.page].shift();
        if(!App._warned500){App._warned500=true;window.showToast('1ページあたりの上限(500本)に達したため古い線から削除されました');setTimeout(()=>{App._warned500=false;},10000);}
      }
      App.strokes[this.page].push(this._curStroke);
    }
  }
  _moveDraw(e){
    if(!this._drawing)return;const r=this.cvs.getBoundingClientRect();
    const px=e.clientX-r.left-this.offX,py=e.clientY-r.top-this.offY;
    const pt={x:px,y:py};
    if(App.currentTool==='eraser'){
      const changed=DrawUtil.applyEraser(App.strokes[this.page]||[],this._lastPt,pt,16*this.innerScale);
      if(changed){this.render();EventBus.emit('stroke-updated',this.page);}
    }else if(this._curStroke){
      this._curStroke.pts.push(pt);this.render();
    }
    this._lastPt=pt;
  }
  _endDraw(e){if(!this._drawing)return;this._drawing=false;this._curStroke=null;AutoSave.trigger();EventBus.emit('stroke-updated',this.page);}
  close(){
    if(this._cleanups && Array.isArray(this._cleanups)){
      this._cleanups.forEach(fn => { try { fn(); } catch(_) {} });
    }
    if(this.div&&this.div.parentNode)this.div.parentNode.removeChild(this.div);
    if(typeof this.onClose==='function')this.onClose(this.id);
  }
}

const SubWinManager={
  _wins:{},_idAcc:0,
  create(title,page){
    if(Object.keys(this._wins).length>=5){window.showToast("サブ窓は最大5つまでです");return;}
    const id=++this._idAcc;const w=new SubWin(id,title,page);
    w.onClose=id=>delete this._wins[id];this._wins[id]=w;
  },
  refreshAll(page){Object.values(this._wins).forEach(w=>{if(w.page===page)w.render();})},
  closeAll(){Object.values(this._wins).forEach(w=>w.close());this._wins={};}
};

/* Core Application Control */
const App={
  pdfDoc:null,currentFileName:'',pageNum:1,maxPages:1,scale:1.0,offX:0,offY:0,
  strokes:{},currentTool:'pan',calcValue:'0',oneFingerSens:5,
  _pCvs:null,_pCtx:null,_aCvs:null,_aCtx:null,_wrapper:null,
  _isDrawing:false,_isPanning:false,_lastPt:{x:0,y:0},_curStroke:null,
  _touchStartDist:0,_touchStartScale:1.0,_baseVPScale:{x:1,y:1},_vp:null,

  async init(){
    this._pCvs=document.getElementById('pdf-cvs');this._pCtx=this._pCvs.getContext('2d');
    this._aCvs=document.getElementById('ann-cvs');this._aCtx=this._aCvs.getContext('2d');
    this._wrapper=document.getElementById('cvs-wrapper');
    await IDBStore.init().catch(e=>DBG.error("IDB init error",e));
    this.initDOMEvents();this.initCanvasEvents();
    EventBus.on('stroke-updated',pg=>{if(pg===this.pageNum)this.renderAnnotations();SubWinManager.refreshAll(pg);});
    window.addEventListener('pagehide',()=>AutoSave.emergencySave());
    window.addEventListener('visibilitychange',()=>{if(document.hidden)AutoSave.emergencySave();});
    this.loadLastSession();
  },

  initDOMEvents(){
    document.getElementById('btn-fpanel').onclick=()=>this.togglePanel('p-file');
    
    // 【修正箇所】「感度（👆）」ボタンのクリックイベントを確実にバインドしてパネルをトグル表示
    document.getElementById('btn-spanel').onclick=(e)=>{
      e.stopPropagation();
      this.togglePanel('p-sens');
    };
    
    document.getElementById('btn-calc').onclick=()=>this.togglePanel('p-calc');
    document.getElementById('btn-subwin').onclick=()=>{if(this.pdfDoc)SubWinManager.create(this.currentFileName,this.pageNum);};
    document.getElementById('btn-fsel').onclick=()=>document.getElementById('fi-loader').click();
    document.getElementById('fi-loader').onchange=e=>this.handleFileSelect(e);
    document.getElementById('sbtn-prev').onclick=()=>this.changePage(-1);
    document.getElementById('sbtn-next').onclick=()=>this.changePage(1);
    document.getElementById('sbtn-clear').onclick=()=>this.clearCurrentPageStrokes();
    document.getElementById('btn-zip').onclick=()=>this.exportAllBackup();
    
    const rSens=document.getElementById('rng-sens');
    rSens.oninput=()=>{
      this.oneFingerSens=parseInt(rSens.value)||5;
      document.getElementById('lbl-sens').innerText=this.oneFingerSens+'px';
    };

    document.querySelectorAll('#sidebar .side-btn[data-tool]').forEach(b=>{
      b.onclick=()=>{
        document.querySelectorAll('#sidebar .side-btn[data-tool]').forEach(x=>x.classList.remove('active-tool'));
        b.classList.add('active-tool');this.currentTool=b.getAttribute('data-tool');
      };
    });
  },

  togglePanel(id){
    const p=document.getElementById(id);
    if(!p) return;
    const show=(p.style.display!=='block');
    // 他の全パネルを一応隠す
    document.querySelectorAll('.panel').forEach(x=>x.style.display='none');
    if(show) {
      p.style.display='block';
      // 前面に持ってくる
      p.style.zIndex = '250';
    }
  },

  updateSaveStatus(txt){document.getElementById('lbl-save-status').innerText=txt;},

  async handleFileSelect(e){
    const f=e.target.files[0];if(!f)return;
    const buf=await f.arrayBuffer();this.currentFileName=f.name;
    await DocMgr.saveDoc(f.name,buf);this.strokes={};this.pageNum=1;
    await this.loadPdfBytes(buf);this.refreshFilePanel();
  },

  async loadPdfBytes(buf){
    SubWinManager.closeAll();
    try{
      this.pdfDoc=await pdfjsLib.getDocument({data:buf}).promise;
      this.maxPages=this.pdfDoc.numPages;this.offX=0;this.offY=0;this.scale=1.0;
      document.getElementById('lbl-doc-info').innerText=`${this.currentFileName} (${this.maxPages}階/頁)`;
      const saved=await IDBStore.get('f:'+Utils.safeKey(this.currentFileName));
      if(saved&&saved.strokes){this.strokes=saved.strokes;this.pageNum=saved.page||1;}
      this.renderAll();
    }catch(e){window.showToast("PDFの読み込みに失敗しました");}
  },

  async changePage(dir){
    if(!this.pdfDoc)return;const n=this.pageNum+dir;
    if(n<1||n>this.maxPages)return;this.pageNum=n;AutoSave.saveNow();this.renderAll();
  },

  clearCurrentPageStrokes(){
    if(!this.pdfDoc)return;if(!confirm("現在のページの赤入れをすべて消去しますか？"))return;
    this.strokes[this.pageNum]=[];AutoSave.trigger();EventBus.emit('stroke-updated',this.pageNum);this.renderAnnotations();
  },

  async renderAll(){
    if(!this.pdfDoc)return;
    document.getElementById('page-num-disp').innerText=this.pageNum;
    try{
      const pg=await this.pdfDoc.getPage(this.pageNum);
      this._vp=pg.getViewport({scale:this.scale});
      this._baseVPScale=Utils.getVPScale(this._vp,this._vp.rotation);
      const w=this._vp.width,h=this._vp.height;
      
      this._pCvs.width=w;this._pCvs.height=h;this._pCvs.style.width=w+'px';this._pCvs.style.height=h+'px';
      this._aCvs.width=w;this._aCvs.height=h;this._aCvs.style.width=w+'px';this._aCvs.style.height=h+'px';
      
      this._pCtx.save();
      if(this._vp.rotation===90){this._pCtx.translate(this._vp.height,0);this._pCtx.rotate(Math.PI/2);}
      else if(this._vp.rotation===180){this._pCtx.translate(this._vp.width,this._vp.height);this._pCtx.rotate(Math.PI);}
      else if(this._vp.rotation===270){this._pCtx.translate(0,this._vp.width);this._pCtx.rotate(-Math.PI/2);}
      
      this._pCtx.fillStyle='#ffffff';this._pCtx.fillRect(0,0,w,h);
      await pg.render({canvasContext:this._pCtx,viewport:this._vp}).promise;
      this._pCtx.restore();
      
      this.applyTransform();this.renderAnnotations();
    }catch(e){DBG.error("Render error",e);}
  },

  applyTransform(){
    const t=`translate(${this.offX}px,${this.offY}px)`;
    this._pCvs.style.transform=t;this._aCvs.style.transform=t;
  },

  renderAnnotations(){
    this._aCtx.clearRect(0,0,this._aCvs.width,this._aCvs.height);
    const sts=this.strokes[this.pageNum]||[];
    sts.forEach(st=>DrawUtil.drawStroke(this._aCtx,st,this._baseVPScale.x,this._baseVPScale.y,this._vp));
  },

  initCanvasEvents(){
    const tw=this._wrapper;
    let isTouch=false,touchMoved=false,f1StartPt={x:0,y:0};
    
    const getPos=e=>{
      const p=e.touches?e.touches[0]:e;const r=tw.getBoundingClientRect();
      return{x:p.clientX-r.left-this.offX,y:p.clientY-r.top-this.offY};
    };

    tw.addEventListener('pointerdown',e=>{
      if(!this.pdfDoc)return;
      if(e.pointerType==='touch'){isTouch=true;touchMoved=false;f1StartPt={x:e.clientX,y:e.clientY};}
      if(this.currentTool==='pan'||(isTouch && e.pointerType==='touch' && this.currentTool!=='eraser')){
        this._isPanning=true;this._lastPt={x:e.clientX,y:e.clientY};
      }else{
        if(Utils.isPalmContact(e))return;
        this._isDrawing=true;const pos=getPos(e);this._lastPt=pos;
        if(this.currentTool==='eraser'){
          DrawUtil.applyEraser(this.strokes[this.pageNum]||[],pos,pos,18);
          EventBus.emit('stroke-updated',this.pageNum);
        }else{
          this._curStroke={tool:this.currentTool,color:this.currentTool=='marker'?'#ffff00':'#ff0000',width:this.currentTool==='marker'?12:2,pts:[pos]};
          this.strokes[this.pageNum]=this.strokes[this.pageNum]||[];
          if(this.strokes[this.pageNum].length>=500){
            this.strokes[this.pageNum].shift();
            if(!this._warned500){this._warned500=true;window.showToast('1ページあたりの上限(500本)に達したため古い線から削除されました');setTimeout(()=>{this._warned500=false;},10000);}
          }
          this.strokes[this.pageNum].push(this._curStroke);
        }
      }
    });

    tw.addEventListener('pointermove',e=>{
      if(isTouch && !touchMoved && f1StartPt){
        if(Math.hypot(e.clientX-f1StartPt.x,e.clientY-f1StartPt.y)>this.oneFingerSens)touchMoved=true;
      }
      if(this._isPanning){
        this.offX+=(e.clientX-this._lastPt.x);this.offY+=(e.clientY-this._lastPt.y);
        this._lastPt={x:e.clientX,y:e.clientY};this.applyTransform();
      }else if(this._isDrawing){
        if(isTouch && !touchMoved && this.currentTool!=='eraser')return;
        const pos=getPos(e);
        if(this.currentTool==='eraser'){
          DrawUtil.applyEraser(this.strokes[this.pageNum]||[],this._lastPt,pos,18);
          EventBus.emit('stroke-updated',this.pageNum);
        }else if(this._curStroke){
          this._curStroke.pts.push(pos);this.renderAnnotations();
        }
        this._lastPt=pos;
      }
    });

    const endAct=()=>{
      if(this._isDrawing)AutoSave.trigger();
      this._isPanning=false;this._isDrawing=false;this._curStroke=null;isTouch=false;
    };
    tw.addEventListener('pointerup',endAct);tw.addEventListener('pointerleave',endAct);

    /* 二本指ピンチズーム対応 */
    tw.addEventListener('touchstart',e=>{
      if(e.touches.length===2){
        this._isPanning=false;this._isDrawing=false;
        this._touchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        this._touchStartScale=this.scale;
      }
    },{passive:true});

    tw.addEventListener('touchmove',e=>{
      if(e.touches.length===2 && this._touchStartDist>0){
        const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        const factor=d/this._touchStartDist;this.scale=Math.max(0.3,Math.min(6.0,this._touchStartScale*factor));
        this.renderAll();
      }
    },{passive:true});
  },

  calcCmd(c){
    const v=document.getElementById('calc-val');
    if(c==='C'){this.calcValue='0';}
    else if(c==='='){try{this.calcValue=String(eval(this.calcValue.replace(/×/g,'*').replace(/÷/g,'/')))}catch(_){this.calcValue='Error'}}
    else if(c==='√'){this.calcValue=String(Math.sqrt(parseFloat(this.calcValue)||0));}
    else if(c==='sq'){this.calcValue=String(Math.pow(parseFloat(this.calcValue)||0,2));}
    else{if(this.calcValue==='0' && !isNaN(c)){this.calcValue=c;}else{this.calcValue+=c;}}
    v.innerText=this.calcValue;
  },

  async refreshFilePanel(){
    const c=document.getElementById('file-list-container');c.innerHTML='';
    const list=await DocMgr.getList();
    if(list.length===0){c.innerHTML='<div style="font-size:11px;color:var(--tx2)">履歴なし</div>';return;}
    list.forEach(m=>{
      const d=document.createElement('div');d.className='file-item';
      d.innerHTML=`<span>${m.name}</span><span style="color:var(--acc)">▶開く</span>`;
      d.onclick=async()=>{
        const doc=await IDBStore.get('doc:'+m.id);
        if(doc){this.currentFileName=m.name;this.strokes={};this.pageNum=1;await this.loadPdfBytes(doc.originalPdfBytes);this.togglePanel('p-file');}
      };
      c.appendChild(d);
    });
  },

  async loadLastSession(){
    this.refreshFilePanel();const idx=await DocMgr.getList();
    if(idx.length>0){
      const last=idx[idx.length-1];const doc=await IDBStore.get('doc:'+last.id);
      if(doc){this.currentFileName=last.name;await this.loadPdfBytes(doc.originalPdfBytes);}
    }
  },

  async exportAllBackup(){
    try{
      const zip=new JSZip();const ks=await IDBStore.getAllKeys();
      for(const k of ks){
        if(k.startsWith('f:')||k.startsWith('doc_index')||k.startsWith('doc:')){
          const v=await IDBStore.get(k);zip.file(k+'.json',JSON.stringify(v));
        }
      }
      const b=await zip.generateAsync({type:'blob'});const a=document.createElement('a');
      a.href=URL.createObjectURL(b);a.download=`MViewer_Backup_${Date.now()}.zip`;a.click();
    }catch(e){window.showToast("バックアップ作成に失敗しました");}
  }
};

window.onload=()=>App.init();
